<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Naptio — Demo (Screenshots)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <style>
    :root { color-scheme: dark; --headH: 56px; }

    html, body {
      height: 100%; margin: 0; background: #000; color: #fff;
      font-family: -apple-system, system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }

    /* ===== Header: same logo position, no "Home" text ===== */
    header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 14px 20px;
      gap: 12px;
      padding-left: max(20px, env(safe-area-inset-left));
      padding-right: max(20px, env(safe-area-inset-right));
      padding-top: max(14px, env(safe-area-inset-top));
      z-index: 2;
    }
    .nav-left  { justify-self: start; display: flex; align-items: center; gap: 18px; }
    .nav-center{ justify-self: center; }
    .nav-right { justify-self: end; }

    .home-link { display: inline-flex; align-items: center; line-height: 1; color: #fff; text-decoration: none; }
    .icon { width: 26px; height: 26px; display: block; }

    /* ===== Stage: gallery between header and bottom edge ===== */
    .stage {
      position: fixed; left: 0; right: 0; top: var(--headH); bottom: 0;
      background: #000; overflow: hidden; isolation: isolate; z-index: 1;
      touch-action: pan-y pinch-zoom;
    }
    /* Fullscreen (fallback class) */
    .stage.is-fullscreen {
      top: 0; bottom: 0; left: 0; right: 0;
      width: 100svw; height: 100svh; z-index: 9999;
    }

    .track { display: flex; height: 100%; will-change: transform; transition: transform 320ms ease; }
    @media (prefers-reduced-motion: reduce){ .track{ transition: none; } }

    .slide {
      flex: 0 0 100%; height: 100%;
      display: grid; place-items: center;
      padding: 0 max(env(safe-area-inset-right), 0px) max(env(safe-area-inset-bottom), 0px) max(env(safe-area-inset-left), 0px);
      background: #000;
    }

    /* ✅ Always show ENTIRE image (no crop) */
    .slide img {
      max-width: 100%;
      max-height: 100%;
      width: auto; height: auto;
      object-fit: contain; object-position: center;
      display: block; user-select: none; -webkit-user-drag: none; -webkit-touch-callout: none;
    }

    /* •••• Circular dots indicator */
    .dots {
      position: absolute; left: 0; right: 0;
      bottom: clamp(10px, 2vh, 18px);
      display: flex; justify-content: center; gap: 8px;
      pointer-events: auto;
    }
    .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: rgba(255,255,255,.35);
      border: 1px solid rgba(255,255,255,.25);
      cursor: pointer;
    }
    .dot.active { background: #fff; }

    /* Close button only visible in fullscreen */
    .fs-close {
      position: absolute; top: calc(env(safe-area-inset-top) + 10px); right: calc(env(safe-area-inset-right) + 10px);
      width: 36px; height: 36px; border-radius: 999px; border: 1px solid rgba(255,255,255,.25);
      display: none; align-items: center; justify-content: center;
      background: rgba(0,0,0,.5); color: #fff; font-size: 22px; line-height: 1;
    }
    .stage.is-fullscreen .fs-close { display: flex; }
  </style>
</head>
<body>
  <!-- Header (logo only) -->
  <header>
    <nav class="nav-left" aria-label="Primary">
      <a href="https://hungryfaceai.github.io/hungryface/home" class="home-link" aria-label="Home" title="Home">
        <svg class="icon" aria-hidden="true" focusable="false">
          <use href="/hungryface/assets/icons.svg#icon-cradle-ai" xlink:href="/hungryface/assets/icons.svg#icon-cradle-ai"></use>
        </svg>
      </a>
    </nav>
    <div class="nav-center" aria-hidden="true"></div>
    <div class="nav-right" aria-hidden="true"></div>
  </header>

  <!-- Screenshot stage -->
  <section class="stage" role="region" aria-label="Naptio demo screenshots" id="stage">
    <button class="fs-close" id="fsClose" aria-label="Close fullscreen">×</button>
    <div class="track" id="track" aria-live="polite"></div>
    <div class="dots" id="dots" role="tablist" aria-label="Slides"></div>
  </section>

  <script>
    // ---- Your screenshots ----
    const BASE = '/hungryface/home/snapshots/';
    const IMAGES = ['audio.jpg','dashboard.jpg','motion.jpg','prone.jpg','sender.jpg','training.jpg'];
    // --------------------------

    const stage  = document.getElementById('stage');
    const track  = document.getElementById('track');
    const dotsEl = document.getElementById('dots');
    const header = document.querySelector('header');
    const fsClose= document.getElementById('fsClose');

    let index = 0;
    let width = 0;
    let dragging = false, startX = 0, currentX = 0, deltaX = 0, startTransform = 0;

    function setCSSVar(name, px){ document.documentElement.style.setProperty(name, `${Math.max(0, px|0)}px`); }
    function measureStage(){
      setCSSVar('--headH', stage.classList.contains('is-fullscreen') ? 0 : (header?.offsetHeight ?? 0));
      width = stage.clientWidth;
      translateTo(index, false);
    }

    // Build slides + dots
    IMAGES.forEach((name, i) => {
      const slide = document.createElement('section');
      slide.className = 'slide';
      slide.setAttribute('role', 'tabpanel');
      slide.setAttribute('aria-label', `Slide ${i+1} of ${IMAGES.length}`);

      const img = document.createElement('img');
      img.src = BASE + name;
      img.alt = `App screenshot ${i+1}`;
      img.decoding = 'async';
      img.loading = i === 0 ? 'eager' : 'lazy';
      slide.appendChild(img);
      track.appendChild(slide);

      const dot = document.createElement('button');
      dot.className = 'dot' + (i === 0 ? ' active' : '');
      dot.setAttribute('role', 'tab');
      dot.setAttribute('aria-label', `Go to slide ${i+1}`);
      dot.addEventListener('click', () => goTo(i));
      dotsEl.appendChild(dot);

      // Tap/click image to enter fullscreen on mobile
      img.addEventListener('click', maybeEnterFullscreen, { passive: true });
    });

    function updateDots(){ [...dotsEl.children].forEach((d, i) => d.classList.toggle('active', i === index)); }
    function translateTo(i, withAnim = true){
      index = Math.max(0, Math.min(IMAGES.length - 1, i));
      const noMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      track.style.transition = withAnim && !noMotion ? 'transform 320ms ease' : 'none';
      track.style.transform  = `translateX(${-index * width}px)`;
      preload(index - 1); preload(index + 1);
      updateDots();
    }
    function preload(i){
      if (i < 0 || i >= IMAGES.length) return;
      const img = track.children[i]?.querySelector('img');
      if (img && img.loading === 'lazy') img.loading = 'eager';
    }
    function goTo(i){ translateTo(i, true); }
    function next(){ translateTo(index + 1, true); }
    function prev(){ translateTo(index - 1, true); }

    // Drag/swipe
    const startDrag = (x) => { dragging = true; startX = x; currentX = x; deltaX = 0; startTransform = -index * width; track.style.transition = 'none'; };
    const moveDrag  = (x) => {
      if (!dragging) return;
      currentX = x; deltaX = currentX - startX;
      const resistance = (index === 0 && deltaX > 0) || (index === IMAGES.length - 1 && deltaX < 0) ? 0.35 : 1;
      track.style.transform = `translateX(${startTransform + deltaX * resistance}px)`;
    };
    const endDrag   = () => {
      if (!dragging) return; dragging = false;
      const threshold = Math.min(140, width * 0.12);
      if (deltaX <= -threshold) next();
      else if (deltaX >= threshold) prev();
      else translateTo(index, true);
    };

    stage.addEventListener('mousedown', (e) => { if (e.button === 0) startDrag(e.clientX); });
    window.addEventListener('mousemove', (e) => moveDrag(e.clientX));
    window.addEventListener('mouseup', endDrag);

    stage.addEventListener('touchstart', (e) => startDrag(e.touches[0].clientX), { passive: true });
    stage.addEventListener('touchmove',  (e) => moveDrag(e.touches[0].clientX),  { passive: true });
    stage.addEventListener('touchend', endDrag);

    stage.addEventListener('pointerdown', (e) => { if (e.pointerType !== 'mouse') startDrag(e.clientX); });
    stage.addEventListener('pointermove', (e) => moveDrag(e.clientX));
    stage.addEventListener('pointerup', endDrag);
    stage.addEventListener('pointercancel', endDrag);

    // Keyboard (desktop)
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') next();
      else if (e.key === 'ArrowLeft')  prev();
      else if (e.key === 'Escape')     exitFullscreen();
    });

    // ===== Fullscreen logic (mobile-first) =====
    const isMobileLike = () => window.matchMedia('(pointer: coarse), (max-width: 780px)').matches;

    async function maybeEnterFullscreen() {
      if (!isMobileLike()) return;
      // Try the Fullscreen API first
      try {
        if (stage.requestFullscreen) {
          await stage.requestFullscreen();
          // class toggled in fullscreenchange
        } else {
          // Fallback: class-driven fullscreen
          stage.classList.add('is-fullscreen');
          measureStage();
        }
      } catch {
        stage.classList.add('is-fullscreen');
        measureStage();
      }
    }

    function exitFullscreen() {
      if (document.fullscreenElement) {
        document.exitFullscreen().catch(()=>{});
      }
      stage.classList.remove('is-fullscreen');
      measureStage();
    }

    document.addEventListener('fullscreenchange', () => {
      if (document.fullscreenElement === stage) {
        stage.classList.add('is-fullscreen');
      } else {
        stage.classList.remove('is-fullscreen');
      }
      measureStage();
    });

    fsClose.addEventListener('click', exitFullscreen);

    // Measure and keep centered on changes
    document.addEventListener('DOMContentLoaded', measureStage);
    window.addEventListener('resize', measureStage);
    window.addEventListener('orientationchange', measureStage);
    new ResizeObserver(measureStage).observe(header);
  </script>
</body>
</html>
