<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Naptio — Demo Screens</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <style>
    :root { color-scheme: dark; --chromeBg: rgba(0,0,0,.5); --chromeBgHover: rgba(255,255,255,.12); }

    /* Reset + fonts */
    html, body { margin: 0; height: 100%; background: #000; color: #fff;
      font-family: -apple-system, system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }

    /* Full-viewport stage that respects iOS URL bars */
    .stage {
      position: fixed; inset: 0;
      width: 100vw; height: 100vh;      /* fallback */
      width: 100svw; height: 100svh;    /* iOS small viewport */
      overflow: hidden; touch-action: pan-y pinch-zoom; /* allow vertical page swipe back + pinch */
      background: #000;
      isolation: isolate;
    }

    /* Track of slides (we drive with translateX) */
    .track {
      display: flex; height: 100%; will-change: transform;
      transition: transform 320ms ease;
    }
    @media (prefers-reduced-motion: reduce) {
      .track { transition: none; }
    }

    /* Each slide centers the image and never crops */
    .slide {
      flex: 0 0 100%; height: 100%;
      display: grid; place-items: center;
      padding-left: max(env(safe-area-inset-left), 0px);
      padding-right: max(env(safe-area-inset-right), 0px);
      padding-top: max(env(safe-area-inset-top), 0px);
      padding-bottom: max(env(safe-area-inset-bottom), 0px);
      background: #000;
    }
    .slide img {
      width: 100%; height: 100%;
      object-fit: contain; object-position: center;
      user-select: none; -webkit-user-drag: none; -webkit-touch-callout: none;
      image-rendering: auto;
      /* iPhone screenshots are tall; this keeps layout smooth while loading */
      aspect-ratio: 1290 / 2796; /* adjust if your screenshots differ */
    }

    /* Chrome: arrows + dots */
    .chrome { position: absolute; inset: 0; pointer-events: none; }
    .arrow {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 44px; height: 44px; border-radius: 999px;
      display: grid; place-items: center; font-size: 20px; line-height: 1;
      background: var(--chromeBg); border: 1px solid rgba(255,255,255,.15);
      pointer-events: auto; cursor: pointer; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .arrow:hover { background: var(--chromeBgHover); }
    .arrow:active { transform: translateY(-50%) scale(.98); }
    .arrow.left { left: max(12px, env(safe-area-inset-left)); }
    .arrow.right { right: max(12px, env(safe-area-inset-right)); }

    .dots {
      position: absolute; left: 0; right: 0;
      bottom: max(12px, env(safe-area-inset-bottom));
      display: flex; justify-content: center; gap: 8px;
      pointer-events: auto;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 999px;
      background: rgba(255,255,255,.35);
      border: 1px solid rgba(255,255,255,.25);
      cursor: pointer;
    }
    .dot.active { background: #fff; }

    /* Tap to toggle chrome on small screens */
    .stage.chrome-hidden .arrow, .stage.chrome-hidden .dots { opacity: 0; pointer-events: none; transition: opacity 150ms; }
    .arrow, .dots { transition: opacity 200ms; }

    /* Keyboard focus rings for accessibility */
    .arrow:focus-visible, .dot:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="stage" role="region" aria-label="Naptio demo screenshots">
    <div class="track" id="track" aria-live="polite"></div>

    <div class="chrome" aria-hidden="false">
      <button class="arrow left"  id="prev" aria-label="Previous screenshot">⟵</button>
      <button class="arrow right" id="next" aria-label="Next screenshot">⟶</button>
      <div class="dots" id="dots" role="tablist" aria-label="Slides"></div>
    </div>
  </main>

  <script>
    // ---- CONFIG: update these names to match /hungryface/home/snapshots/ ----
    const BASE = '/hungryface/home/snapshots/';
    const IMAGES = [
      // Replace with your actual filenames (keep the order you want to present)
      'sender.jpg',
      'prone.jpg',
      'motion.jpg',
      'audio.jpg',
      'training.jpg',
      'dashboard.jpg',
    ];
    // Optional captions (or leave as empty strings)
    const CAPTIONS = ['', '', '', '', '', ''];
    // -------------------------------------------------------------------------

    const stage = document.querySelector('.stage');
    const track = document.getElementById('track');
    const dotsEl = document.getElementById('dots');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');

    let index = 0;
    let width = stage.clientWidth;
    let dragging = false, startX = 0, currentX = 0, deltaX = 0, startTransform = 0;

    // Build slides + dots
    IMAGES.forEach((name, i) => {
      const slide = document.createElement('section');
      slide.className = 'slide';
      slide.setAttribute('role', 'tabpanel');
      slide.setAttribute('aria-label', `Slide ${i+1} of ${IMAGES.length}${CAPTIONS[i] ? (': ' + CAPTIONS[i]) : ''}`);

      const img = document.createElement('img');
      img.src = BASE + name;
      img.alt = CAPTIONS[i] || `App screenshot ${i+1}`;
      img.decoding = 'async';
      img.loading = i === 0 ? 'eager' : 'lazy';
      slide.appendChild(img);
      track.appendChild(slide);

      const dot = document.createElement('button');
      dot.className = 'dot' + (i === 0 ? ' active' : '');
      dot.setAttribute('role', 'tab');
      dot.setAttribute('aria-label', `Go to slide ${i+1}`);
      dot.addEventListener('click', () => goTo(i));
      dotsEl.appendChild(dot);
    });

    function updateChrome() {
      [...dotsEl.children].forEach((d, i) => d.classList.toggle('active', i === index));
      prevBtn.disabled = (index === 0);
      nextBtn.disabled = (index === IMAGES.length - 1);
    }

    function translateTo(i, withAnim = true) {
      index = Math.max(0, Math.min(IMAGES.length - 1, i));
      track.style.transition = (withAnim && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) ? 'transform 320ms ease' : 'none';
      track.style.transform = `translateX(${-index * width}px)`;
      // Preload neighbors
      preload(index - 1);
      preload(index + 1);
      updateChrome();
    }

    function preload(i) {
      if (i < 0 || i >= IMAGES.length) return;
      const slide = track.children[i];
      const img = slide.querySelector('img');
      if (img && img.loading === 'lazy') {
        img.loading = 'eager'; // hint to load soon
      }
    }

    function goTo(i) { translateTo(i, true); }
    function next()  { translateTo(index + 1, true); }
    function prev()  { translateTo(index - 1, true); }

    nextBtn.addEventListener('click', next);
    prevBtn.addEventListener('click', prev);

    // Keyboard (desktop)
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') next();
      else if (e.key === 'ArrowLeft') prev();
    });

    // Resize/orientation
    const onResize = () => {
      width = stage.clientWidth;
      translateTo(index, false);
    };
    window.addEventListener('resize', onResize);
    window.addEventListener('orientationchange', onResize);

    // Pointer swipe (mobile/desktop)
    const startDrag = (clientX) => {
      dragging = true; startX = clientX; currentX = clientX; deltaX = 0;
      startTransform = -index * width;
      track.style.transition = 'none';
    };
    const moveDrag = (clientX) => {
      if (!dragging) return;
      currentX = clientX; deltaX = currentX - startX;
      const resistance = (index === 0 && deltaX > 0) || (index === IMAGES.length - 1 && deltaX < 0) ? 0.35 : 1;
      track.style.transform = `translateX(${startTransform + deltaX * resistance}px)`;
    };
    const endDrag = () => {
      if (!dragging) return;
      dragging = false;
      const threshold = Math.min(140, width * 0.12); // swipe threshold
      if (deltaX <= -threshold) next();
      else if (deltaX >= threshold) prev();
      else translateTo(index, true);
    };

    // Mouse
    stage.addEventListener('mousedown', (e) => { if (e.button === 0) startDrag(e.clientX); });
    window.addEventListener('mousemove', (e) => moveDrag(e.clientX));
    window.addEventListener('mouseup', endDrag);

    // Touch/pointer
    stage.addEventListener('touchstart', (e) => startDrag(e.touches[0].clientX), { passive: true });
    stage.addEventListener('touchmove',  (e) => moveDrag(e.touches[0].clientX), { passive: true });
    stage.addEventListener('touchend', endDrag);
    stage.addEventListener('pointerdown', (e) => { if (e.pointerType !== 'mouse') startDrag(e.clientX); });
    stage.addEventListener('pointermove', (e) => moveDrag(e.clientX));
    stage.addEventListener('pointerup', endDrag);
    stage.addEventListener('pointercancel', endDrag);

    // Tap to toggle chrome on small screens
    let lastTap = 0;
    stage.addEventListener('click', (e) => {
      const now = Date.now();
      if (now - lastTap < 300) return; // ignore double taps
      lastTap = now;
      // Don’t toggle if a control was tapped
      if (e.target.closest('.arrow, .dot')) return;
      stage.classList.toggle('chrome-hidden');
    });

    // Deep-link support (#slide-3)
    const hashIndex = () => {
      const m = location.hash.match(/slide-(\d+)/);
      return m ? Math.max(1, Math.min(IMAGES.length, parseInt(m[1], 10))) - 1 : 0;
    };
    window.addEventListener('hashchange', () => translateTo(hashIndex(), false));

    // Init
    requestAnimationFrame(() => {
      onResize();
      translateTo(hashIndex(), false);
    });
  </script>
</body>
</html>
