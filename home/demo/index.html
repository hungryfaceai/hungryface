<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Naptio — Demo (video + screenshots)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Watch a quick Naptio demo and browse screenshots of Camera and Viewer features.">
  <style>
    :root { color-scheme: dark; }

    html, body { height: 100%; margin: 0; background: #000; color: #fff;
      font-family: -apple-system, system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
    a { color: #fff; text-decoration: none; opacity: 0.9; }
    a:hover, a:focus { text-decoration: underline; opacity: 1; }
    .no-underline, .no-underline:hover, .no-underline:focus,
    .btn-pill, .btn-pill:hover, .btn-pill:focus { text-decoration: none; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .is-hidden { display: none !important; }

    .page { min-height: 100%; display: flex; flex-direction: column; }

    /* Header (unchanged styling) */
    header {
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 14px 20px; gap: 12px;
      padding-left: max(20px, env(safe-area-inset-left));
      padding-right: max(20px, env(safe-area-inset-right));
    }
    .nav-left, .nav-center, .nav-right { display: flex; gap: 18px; align-items: center; font-size: 0.95rem; white-space: nowrap; }
    .nav-left{justify-self:start} .nav-center{justify-self:center; gap:12px; min-width:0} .nav-right{justify-self:end; gap:12px}
    .home-link{display:inline-flex; align-items:center; line-height:1}
    .icon{width:24px;height:24px;display:block}.icon-home{width:26px;height:26px}
    .nav-center a{ color:#000;background:#fff;border-radius:9999px;border:1px solid #fff;opacity:1;font-weight:600;line-height:1;display:inline-block;white-space:nowrap;
      font-size:clamp(.78rem,2.6vw,.95rem); padding:clamp(6px,1.6vw,8px) clamp(10px,3.2vw,14px) }
    .nav-center a:hover{background:#eaeaea} .nav-center a:hover,.nav-center a:focus{ text-decoration:none }
    .nav-center a:focus-visible{ outline:2px solid #fff; outline-offset:3px }
    .btn-pill{ color:#fff;background:#000;border:1px solid #fff;border-radius:9999px;font-weight:600;line-height:1;display:inline-block;opacity:1;white-space:nowrap;
      font-size:clamp(.78rem,2.6vw,.95rem);padding:clamp(6px,1.6vw,8px) clamp(10px,3.2vw,14px); transition:background-color .15s, box-shadow .15s }
    .btn-pill:hover,.btn-pill:focus{ background:#141414;border-color:#e6e6e6; box-shadow:inset 0 0 0 2px rgba(255,255,255,.16) }
    .btn-pill:focus-visible{ outline:2px solid #fff; outline-offset:3px }

    main { flex:1; display:grid; gap:22px; padding:24px; text-align:center; }

    /* Video */
    .player-wrap{ width:min(1100px,100%); margin:0 auto; border-radius:16px; overflow:hidden;
      background:#0f0f0f; border:1px solid #1b1b1b; padding:12px; }
    .player{ position:relative; width:100%; aspect-ratio:16/9; background:#000; border-radius:8px; overflow:hidden }
    .player iframe{ width:100%; height:100%; border:0; display:block }
    @media (max-width:560px){
      .player-wrap{ width:100svw; padding:0; border:0; border-radius:0 }
      .player{ width:100svw; height:100svh; aspect-ratio:auto; border-radius:0 }
    }

    /* Shots */
    .shots{ width:100%; display:grid; justify-items:center;
      padding-inline: max(16px, env(safe-area-inset-left)) max(16px, env(safe-area-inset-right)); }
    .shots-wrap{ width:100%; max-width:1100px; margin-inline:auto; }

    .shots-track{
      position:relative; display:flex; overflow-x:auto; overscroll-behavior-x:contain;
      scroll-snap-type:x mandatory; scroll-behavior:smooth; gap:16px; padding-bottom:10px;
      -webkit-overflow-scrolling:touch; cursor:grab;
      scroll-padding-inline: max(16px, env(safe-area-inset-left)) max(16px, env(safe-area-inset-right));
    }
    .shots-track.dragging{ scroll-snap-type:none; cursor:grabbing }

    /* Mobile: each slide fills viewport width (centered) */
    .slide{ flex:0 0 100%; display:grid; place-items:center; scroll-snap-align:center; padding:8px 0; }
    @media (min-width:700px){
      /* Desktop: slides size to their content (image/card width) — scroller fits image size */
      .slide{ flex:0 0 auto; }
    }

    .device-card{ display:grid; justify-items:center; gap:10px; background:#0c0c0c; border:1px solid #1b1b1b;
      border-radius:16px; padding:14px; box-shadow:0 8px 24px rgba(0,0,0,.35) }
    .device-card img{ width:clamp(280px, 54vw, 600px); height:auto; display:block; border-radius:10px;
      -webkit-user-drag:none; user-select:none; pointer-events:none }
    .caption{ font-size:.9rem; color:#d7d7d7; opacity:.9 }

    .shots-dots{ margin-top:10px; display:flex; gap:8px; justify-content:center; align-items:center }
    .shots-dots [role="tab"]{ width:9px; height:9px; border-radius:50%; background:#3a3a3a; border:0; padding:0; cursor:pointer; transition:transform .12s }
    .shots-dots [role="tab"][aria-selected="true"]{ background:#fff; transform:scale(1.15) }

    /* Desktop-only scrubber (fits image width) */
    .shots-scrubber{ display:none; margin-top:8px; justify-content:center }
    @media (min-width:700px){
      .shots-scrubber{ display:flex }
      .shots-scrubber input[type="range"]{ width: 600px; max-width: 100%; }
    }

    .shots-foot{ margin-top:8px; font-size:.78rem; color:#bbb; opacity:.95; text-align:center }
    .med-note{ margin-top:10px; font-size:.8rem; opacity:.8; text-align:center }

    footer{ display:flex; justify-content:space-between; align-items:center; padding:16px 20px; font-size:.9rem; opacity:.85;
      padding-left:max(16px, env(safe-area-inset-left)); padding-right:max(16px, env(safe-area-inset-right)) }
    .footer-note{ font-size:.75rem; color:#fff; opacity:.85; text-decoration:none }
    .footer-note:hover,.footer-note:focus{ text-decoration:none; opacity:.85 }

    /* Responsive header rows */
    @media (max-width:560px){
      header{ grid-template-columns:1fr 1fr; grid-auto-rows:minmax(0,auto); row-gap:10px }
      .nav-left{ grid-column:1; grid-row:1; justify-self:start }
      .nav-right{ grid-column:2; grid-row:1; justify-self:end; gap:10px }
      .nav-center{ grid-column:1/-1; grid-row:2; justify-content:center; gap:12px; width:100% }
      .nav-center a{ font-size:clamp(.92rem,3.8vw,1.12rem); padding:clamp(8px,2.2vw,12px) clamp(14px,4.5vw,18px) }
      .btn-pill{ font-size:clamp(.78rem,3vw,.92rem); padding:clamp(6px,1.8vw,8px) clamp(10px,3vw,14px) }
    }

    /* Invite modal (unchanged) */
    .invite-modal{ position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; z-index:1000 }
    .invite-modal.visible{ display:flex }
    .invite-card{ position:relative; width:min(92vw,480px); background:#0b0b0b; border:1px solid #141414; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,.4);
      padding:18px 18px 20px }
    .invite-header{ display:flex; align-items:center; justify-content:center; margin-bottom:8px }
    .invite-title{ font-size:1rem; font-weight:700; margin:0 }
    .invite-close{ position:absolute; top:10px; right:10px; width:36px; height:36px; border-radius:9999px; display:grid; place-items:center;
      background:#0d0d0d; border:1px solid #2a2a2a; color:#fff; font-size:22px; line-height:1; cursor:pointer }
    .invite-close:hover{ background:#111 } .invite-close:focus-visible{ outline:2px solid #fff; outline-offset:2px }
    .invite-body{ display:grid; gap:12px; justify-items:center }
    .invite-qr{ width:220px; height:220px; background:#111; border:1px solid #222; border-radius:12px; display:grid; place-items:center; overflow:hidden }
    .invite-url{ width:100%; background:#090909; border:1px solid #1a1a1a; color:#fff; border-radius:10px; padding:10px 12px; box-sizing:border-box; font-size:.9rem }
    .invite-actions{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center }
    .invite-actions .btn-pill{ border-color:#444 }
    .invite-toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(12px); background:#111; border:1px solid #222; color:#fff;
      padding:10px 14px; border-radius:9999px; opacity:0; transition:opacity .2s, transform .2s; z-index:1100; font-size:.9rem }
    .invite-toast.show{ opacity:1; transform:translateX(-50%) translateY(0) }
  </style>
</head>

  <!-- Fullscreen on video tap -->
  <script>
  (function(){
    const wrap = document.getElementById('playerWrap');
    function requestFS(el){
      try{
        if (document.fullscreenElement) return;
        if (el.requestFullscreen) el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      }catch{}
    }
    wrap?.addEventListener('click', () => requestFS(wrap), { passive: true });
  })();
  </script>

  <!-- Invite modal logic (unchanged, trimmed) -->
  <script>
  (() => {
    const trigger = document.getElementById('menu-invite');
    const modal = document.getElementById('invite-modal');
    const qrImg = document.getElementById('invite-qr');
    const urlInput = document.getElementById('invite-url');
    const btnCopy = document.getElementById('invite-copy');
    const btnOpen = document.getElementById('invite-open');
    const btnShare = document.getElementById('invite-share');
    const btnClose = modal?.querySelector('.invite-close');
    if (!trigger || !modal) return;

    const INVITE_URL = window.HF_INVITE_URL || location.href;
    const QR_ENDPOINT = 'https://api.qrserver.com/v1/create-qr-code/?size=220x220&format=svg&data=';

    function toast(msg) {
      const el = document.createElement('div');
      el.className = 'invite-toast';
      el.textContent = msg;
      document.body.appendChild(el);
      requestAnimationFrame(() => el.classList.add('show'));
      setTimeout(() => {
        el.classList.remove('show');
        el.addEventListener('transitionend', () => el.remove(), { once: true });
      }, 1400);
    }

    function openInvite() {
      const url = INVITE_URL;
      if (qrImg) { qrImg.src = QR_ENDPOINT + encodeURIComponent(url); qrImg.alt = 'QR code for ' + url; }
      if (urlInput) { urlInput.value = url; }
      btnOpen && (btnOpen.href = url);
      modal.classList.add('visible'); modal.setAttribute('aria-hidden', 'false');
      document.addEventListener('keydown', onEsc, { once: true });
    }
    function closeInvite() {
      modal.classList.remove('visible'); modal.setAttribute('aria-hidden', 'true');
    }
    function onEsc(e){ if (e.key === 'Escape') closeInvite(); }

    trigger.addEventListener('click', (e) => { e.preventDefault(); openInvite(); });
    modal.addEventListener('click', (e) => { if (e.target === modal) closeInvite(); });
    btnClose?.addEventListener('click', closeInvite);
    btnCopy?.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(urlInput.value); toast('Link copied'); }
      catch { urlInput?.select?.(); toast('Copy failed — select and copy'); }
    });
    if (!(typeof navigator !== 'undefined' && 'share' in navigator)) btnShare.style.display = 'none';
    btnShare?.addEventListener('click', async () => {
      const url = urlInput?.value || INVITE_URL;
      try {
        if (navigator.canShare && !navigator.canShare({ url })) throw new Error('URL sharing not supported');
        await navigator.share({ title:'Naptio', text:'Share Naptio with a friend:', url });
      } catch (err) {
        if (err && err.name === 'AbortError') return;
        try { await navigator.clipboard.writeText(url); toast('Link copied'); }
        catch { urlInput?.select?.(); toast('Share failed — link selected to copy'); }
      }
    });
  })();
  </script>

  <!-- Carousel: desktop-fit, multi-skip with scrubber, easy drag, infinite wrap -->
  <script>
  (function(){
    const track = document.getElementById('shotsTrack');
    const dotsWrap = document.getElementById('shotsDots');
    const scrub = document.getElementById('shotsScrubber');
    if (!track || !dotsWrap) return;

    // --- Build data model (originals)
    let originals = Array.from(track.querySelectorAll('.slide'));
    originals.forEach((s,i) => { s.dataset.index = String(i); });
    const TOTAL = originals.length;

    // --- Build clones for infinite wrap (ONE per side)
    const mkClone = (el) => {
      const c = el.cloneNode(true);
      c.dataset.clone = '1';
      c.dataset.index = el.dataset.index; // real index preserved
      return c;
    };
    const head = [ mkClone(originals[TOTAL - 1]) ]; // last -> head
    const tail = [ mkClone(originals[0]) ];         // first -> tail
    head.forEach(c => track.insertBefore(c, track.firstChild));
    tail.forEach(c => track.appendChild(c));

    // After cloning:
    let slides = Array.from(track.querySelectorAll('.slide'));
    const getOriginalByIndex = (i) => originals[i];

    // --- UI: dots
    for (let i=0;i<TOTAL;i++){
      const b = document.createElement('button');
      b.type='button'; b.setAttribute('role','tab'); b.setAttribute('aria-selected', i===0 ? 'true':'false');
      b.title = `Go to slide ${i+1}`;
      b.addEventListener('click', () => goTo(i));
      dotsWrap.appendChild(b);
    }
    const dots = Array.from(dotsWrap.querySelectorAll('[role="tab"]'));

    // --- Helpers
    function setActive(idx){
      dots.forEach((d,i)=>d.setAttribute('aria-selected', i===idx?'true':'false'));
      if (scrub) scrub.value = String(idx);
    }

    function centerOn(el, behavior='smooth'){
      const left = el.offsetLeft - (track.clientWidth - el.clientWidth)/2;
      track.scrollTo({ left, behavior });
    }

    function indexFromCenter(){
      const rectTrack = track.getBoundingClientRect();
      const centerX = rectTrack.left + rectTrack.width/2;
      let best = 0, bestDist = Infinity;
      slides.forEach((s, i) => {
        const r = s.getBoundingClientRect();
        const cx = r.left + r.width/2;
        const d = Math.abs(cx - centerX);
        if (d < bestDist) { bestDist = d; best = i; }
      });
      return best;
    }

    function normalizedIndex(slideEl){
      return Number(slideEl.dataset.index) % TOTAL;
    }

    function goTo(realIndex, opts={}){
      const target = getOriginalByIndex(((realIndex % TOTAL)+TOTAL)%TOTAL);
      if (!target) return;
      centerOn(target, opts.behavior || 'smooth');
      setActive(((realIndex % TOTAL)+TOTAL)%TOTAL);
    }

    // --- Initialize scrubber (desktop-only CSS shows it)
    if (scrub){
      scrub.min = '0'; scrub.max = String(TOTAL-1); scrub.step = '1'; scrub.value = '0';
      // Fit width to current image width
      const fitScrubber = () => {
        const img = track.querySelector('.slide:not([data-clone]) img');
        if (!img) return;
        const w = Math.round(img.getBoundingClientRect().width);
        scrub.style.width = w ? (w+'px') : '';
      };
      window.addEventListener('resize', fitScrubber, { passive:true });
      new ResizeObserver(fitScrubber).observe(track);
      fitScrubber();

      // Dragging the scrubber can skip multiple images at once
      scrub.addEventListener('input', (e) => {
        const i = parseInt(e.currentTarget.value, 10) || 0;
        goTo(i, { behavior: 'auto' });
      });
    }

    // --- Keep dots/scrub synced with scroll; handle wrap jumps
    let raf = null;
    track.addEventListener('scroll', () => {
      if (raf) return;
      raf = requestAnimationFrame(() => {
        const idxInAll = indexFromCenter();
        const el = slides[idxInAll];
        if (!el) { raf = null; return; }
        const real = normalizedIndex(el);
        setActive(real);

        // If centered on a CLONE at head/tail, teleport to matching ORIGINAL (seamless wrap)
        if (el.dataset.clone === '1'){
          const dest = getOriginalByIndex(real);
          if (dest) centerOn(dest, 'auto');
        }
        raf = null;
      });
    });

    // --- Keyboard navigation (wrap)
    track.addEventListener('keydown', (e) => {
      if (['ArrowLeft','ArrowRight','PageUp','PageDown'].includes(e.key)) e.preventDefault();
      if (e.key === 'ArrowRight' || e.key === 'PageDown') goTo((Number(scrub?.value||0) + 1) % TOTAL);
      if (e.key === 'ArrowLeft'  || e.key === 'PageUp')   goTo((Number(scrub?.value||0) - 1 + TOTAL) % TOTAL);
    });

    // --- Mouse wheel: allow free scroll (can skip multiple) — no handler needed.

    // --- Desktop drag with low threshold; snap to closest (may skip multiple)
    let dragging=false, startX=0, startScroll=0, pointerId=null;

    track.addEventListener('pointerdown', (e) => {
      if (e.pointerType !== 'mouse' || e.button !== 0) return;
      pointerId = e.pointerId;
      track.setPointerCapture(pointerId);
      dragging = true; startX = e.clientX; startScroll = track.scrollLeft;
      track.classList.add('dragging');
    });
    track.addEventListener('pointermove', (e) => {
      if (!dragging) return; e.preventDefault();
      const dx = e.clientX - startX;
      track.scrollLeft = startScroll - dx; // direct follow
    });
    function endDrag(){
      if (!dragging) return;
      dragging = false; track.classList.remove('dragging');
      pointerId && track.releasePointerCapture(pointerId); pointerId = null;
      // Snap to closest centered slide (can be multiple away)
      const idxInAll = indexFromCenter();
      const real = normalizedIndex(slides[idxInAll]);
      goTo(real, { behavior: 'smooth' });
    }
    track.addEventListener('pointerup', endDrag);
    track.addEventListener('pointercancel', endDrag);
    track.addEventListener('pointerleave', endDrag);

    // Prevent native image drag ghost
    track.querySelectorAll('img').forEach(img => img.addEventListener('dragstart', e => e.preventDefault()));

    // --- Initial position: first original
    window.addEventListener('load', () => {
