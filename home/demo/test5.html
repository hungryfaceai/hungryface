<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Naptio — Demo (Screenshots)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Turn two devices into a private baby monitor. Local connection, on-device AI for cry & motion alerts. No sign-up, no cloud video.">

  <style>
    :root { color-scheme: dark; }

    html, body {
      height: 100%;
      margin: 0; background: #000; color: #fff;
      font-family: -apple-system, system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }

    a { color: #fff; text-decoration: none; opacity: 0.9; }
    a:hover, a:focus { text-decoration: underline; opacity: 1; }

    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }
    .is-hidden { display: none !important; }

    .page { min-height: 100%; display: flex; flex-direction: column; }

    /* ===== Header (kept from your layout) ===== */
    header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 14px 20px;
      gap: 12px;
      padding-left: max(20px, env(safe-area-inset-left));
      padding-right: max(20px, env(safe-area-inset-right));
      z-index: 2; /* over stage */
    }
    .nav-left, .nav-center, .nav-right {
      display: flex; gap: 18px; align-items: center; font-size: .95rem; white-space: nowrap;
    }
    .nav-left  { justify-self: start; }
    .nav-center{ justify-self: center; gap: 12px; flex-wrap: nowrap; min-width: 0; }
    .nav-right { justify-self: end; display:flex; gap:12px; flex-wrap: nowrap; }
    .home-link { display: inline-flex; align-items: center; line-height: 1; }
    .icon { width: var(--icon-size, 24px); height: var(--icon-size, 24px); display: block; }
    .icon-home { --icon-size: 26px; }

    .nav-center a {
      color: #000; background: #fff; border-radius: 9999px; border: 1px solid #fff;
      opacity: 1; font-weight: 600; line-height: 1; display: inline-block; white-space: nowrap;
      font-size: clamp(0.78rem, 2.6vw, 0.95rem);
      padding: clamp(6px, 1.6vw, 8px) clamp(10px, 3.2vw, 14px);
      text-decoration: none;
    }
    .nav-center a:hover { background: #eaeaea; }

    .btn-pill {
      color: #fff; background: #000; border: 1px solid #fff; border-radius: 9999px;
      font-weight: 600; line-height: 1; display: inline-block; opacity: 1; white-space: nowrap;
      font-size: clamp(0.78rem, 2.6vw, 0.95rem);
      padding: clamp(6px, 1.6vw, 8px) clamp(10px, 3.2vw, 14px);
      transition: background-color .15s ease, box-shadow .15s ease;
      text-decoration: none;
    }
    .btn-pill:hover, .btn-pill:focus {
      background: #141414; border-color: #e6e6e6; box-shadow: inset 0 0 0 2px rgba(255,255,255,.16);
    }

    @media (max-width: 560px) {
      header { grid-template-columns: 1fr 1fr; grid-auto-rows: minmax(0, auto); row-gap: 10px; }
      .nav-left { grid-column: 1; grid-row: 1; justify-self: start; }
      .nav-right{ grid-column: 2; grid-row: 1; justify-self: end; gap: 10px; }
      .nav-center{ grid-column: 1 / -1; grid-row: 2; justify-content: center; gap: 12px; width: 100%; }
      .nav-center a { font-size: clamp(0.92rem, 3.8vw, 1.12rem); padding: clamp(8px, 2.2vw, 12px) clamp(14px, 4.5vw, 18px); }
      .btn-pill { font-size: clamp(0.78rem, 3.0vw, 0.92rem); padding: clamp(6px, 1.8vw, 8px) clamp(10px, 3.0vw, 14px); }
    }
    @media (max-width: 380px) {
      .nav-left a, .nav-right a { font-size: 0.82rem; }
      .nav-left, .nav-right { gap: 10px; }
      .nav-center { gap: 10px; }
      header { padding: 12px 14px; }
    }

    /* ===== Footer (kept) ===== */
    footer {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 20px;
      padding-left: max(16px, env(safe-area-inset-left));
      padding-right: max(16px, env(safe-area-inset-right));
      font-size: 0.9rem; opacity: 0.85;
      z-index: 2; /* over stage */
    }
    .footer-note { color: #fff; opacity: .85; text-decoration: none; }

    /* ===== Stage: between header & footer, with dots ===== */
    :root{ --headH: 64px; --footH: 56px; }
    .stage {
      position: fixed; left: 0; right: 0;
      top: var(--headH); bottom: var(--footH);
      background: #000; overflow: hidden; isolation: isolate; z-index: 1;
      touch-action: pan-y pinch-zoom;
    }
    .track { display: flex; height: 100%; will-change: transform; transition: transform 320ms ease; }
    @media (prefers-reduced-motion: reduce) { .track { transition: none; } }

    .slide {
      flex: 0 0 100%; height: 100%;
      display: grid; place-items: center;
      padding: max(0px, env(safe-area-inset-top)) max(0px, env(safe-area-inset-right)) max(0px, env(safe-area-inset-bottom)) max(0px, env(safe-area-inset-left));
      background: #000;
    }

    /* ✅ Full image visible (no desktop crop) */
    .slide img{
      max-width: 100%;
      max-height: 100%;
      width: auto; height: auto;
      object-fit: contain; object-position: center;
      user-select: none; -webkit-user-drag: none; -webkit-touch-callout: none;
      aspect-ratio: 1290 / 2796; /* iPhone 17-ish; fine if slightly off */
    }

    /* •••• Dots indicator (replaces hyphens) */
    .dots {
      position: absolute; left: 0; right: 0;
      bottom: clamp(10px, 2vh, 16px);
      display: flex; justify-content: center; gap: 8px;
      pointer-events: auto;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 999px;
      background: rgba(255,255,255,.35);
      border: 1px solid rgba(255,255,255,.25);
      cursor: pointer;
    }
    .dot.active { background: #fff; }

    .stage.chrome-hidden .dots { opacity: 0; pointer-events: none; transition: opacity 150ms; }
    .dots { transition: opacity 200ms; }
  </style>
</head>
<body>
  <div class="page">
    <!-- Header -->
    <header>
      <nav class="nav-left" aria-label="Primary">
        <a href="https://hungryfaceai.github.io/hungryface/home" class="home-link" aria-label="Home" title="Home">
          <svg class="icon icon-home" aria-hidden="true" focusable="false">
            <use href="/hungryface/assets/icons.svg#icon-cradle-ai" xlink:href="/hungryface/assets/icons.svg#icon-cradle-ai"></use>
          </svg>
          <span class="sr-only">Home</span>
        </a>
        <a class="no-underline" href="https://hungryfaceai.github.io/hungryface/about">About</a>
      </nav>

      <nav class="nav-center" aria-label="Modes">
        <a href="https://hungryfaceai.github.io/hungryface/webrtc/sender/secure/" aria-label="Camera (Baby) — sender">Camera (Baby)</a>
        <a href="https://hungryfaceai.github.io/hungryface/webrtc/receiver/shared/alerts/dashboard/" aria-label="Viewer (Parent) — receiver">Viewer (Parent)</a>
      </nav>

      <nav class="nav-right" aria-label="Quick actions">
        <a class="is-hidden" href="https://hungryfaceai.github.io/hungryface/login">Log in</a>
        <a class="is-hidden" href="https://hungryfaceai.github.io/hungryface/signup">Sign up</a>
        <a class="btn-pill header-pair is-sticky" href="https://hungryfaceai.github.io/hungryface/webrtc/pairpsk/" aria-label="Pair devices — quick pairing">Pair devices</a>
        <a id="menu-invite" class="btn-pill" href="#" aria-label="Share Naptio — show QR and share options" role="button">Share</a>
      </nav>
    </header>

    <!-- Stage -->
    <section class="stage" role="region" aria-label="Naptio demo screenshots">
      <div class="track" id="track" aria-live="polite"></div>
      <div class="dots" id="dots" role="tablist" aria-label="Slides"></div>
    </section>

    <!-- Footer -->
    <footer role="contentinfo">
      <span class="footer-left footer-note">© 2025 Naptio</span>
      <a class="footer-right footer-note" href="https://hungryfaceai.github.io/hungryface/legal">Legal</a>
    </footer>
  </div>

  <script>
    /* ---------- Your six screenshots ---------- */
    const BASE = '/hungryface/home/snapshots/';
    const IMAGES = [
      'audio.jpg',
      'dashboard.jpg',
      'motion.jpg',
      'prone.jpg',
      'sender.jpg',
      'training.jpg',
    ];
    const CAPTIONS = [
      'Audio (cry detect)',
      'Alerts dashboard',
      'Motion detection',
      'Prone detection',
      'Camera (sender)',
      'Audio training',
    ];
    /* ----------------------------------------- */

    const track  = document.getElementById('track');
    const dotsEl = document.getElementById('dots');
    const stage  = document.querySelector('.stage');
    const header = document.querySelector('header');
    const footer = document.querySelector('footer');

    let index = 0;
    let width = 0;
    let dragging = false, startX = 0, currentX = 0, deltaX = 0, startTransform = 0;

    // Build slides + dots
    IMAGES.forEach((name, i) => {
      const slide = document.createElement('section');
      slide.className = 'slide';
      slide.setAttribute('role', 'tabpanel');
      slide.setAttribute('aria-label', `Slide ${i+1} of ${IMAGES.length}${CAPTIONS[i] ? (': ' + CAPTIONS[i]) : ''}`);

      const img = document.createElement('img');
      img.src = BASE + name;
      img.alt = CAPTIONS[i] || `App screenshot ${i+1}`;
      img.decoding = 'async';
      img.loading = i === 0 ? 'eager' : 'lazy';
      slide.appendChild(img);
      track.appendChild(slide);

      const dot = document.createElement('button');
      dot.className = 'dot' + (i === 0 ? ' active' : '');
      dot.setAttribute('role', 'tab');
      dot.setAttribute('aria-label', `Go to slide ${i+1}`);
      dot.addEventListener('click', () => goTo(i));
      dotsEl.appendChild(dot);
    });

    function setCSSVar(name, px){ document.documentElement.style.setProperty(name, `${Math.max(0, px|0)}px`); }
    function measureChrome() {
      setCSSVar('--headH', (header?.offsetHeight ?? 0));
      setCSSVar('--footH', (footer?.offsetHeight ?? 0));
      width = stage.clientWidth;
      translateTo(index, false);
    }

    function updateDots(){ [...dotsEl.children].forEach((d, i) => d.classList.toggle('active', i === index)); }
    function translateTo(i, withAnim = true) {
      index = Math.max(0, Math.min(IMAGES.length - 1, i));
      track.style.transition = withAnim && !window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'transform 320ms ease' : 'none';
      track.style.transform = `translateX(${-index * width}px)`;
      preload(index - 1); preload(index + 1);
      updateDots();
    }
    function preload(i){
      if (i < 0 || i >= IMAGES.length) return;
      const img = track.children[i]?.querySelector('img');
      if (img && img.loading === 'lazy') img.loading = 'eager';
    }
    function goTo(i){ translateTo(i, true); }
    function next(){ translateTo(index + 1, true); }
    function prev(){ translateTo(index - 1, true); }

    // Drag/swipe
    const startDrag = (x) => { dragging = true; startX = x; currentX = x; deltaX = 0; startTransform = -index * width; track.style.transition = 'none'; };
    const moveDrag  = (x) => {
      if (!dragging) return;
      currentX = x; deltaX = currentX - startX;
      const resistance = (index === 0 && deltaX > 0) || (index === IMAGES.length - 1 && deltaX < 0) ? 0.35 : 1;
      track.style.transform = `translateX(${startTransform + deltaX * resistance}px)`;
    };
    const endDrag   = () => {
      if (!dragging) return; dragging = false;
      const threshold = Math.min(140, width * 0.12);
      if (deltaX <= -threshold) next();
      else if (deltaX >= threshold) prev();
      else translateTo(index, true);
    };

    stage.addEventListener('mousedown', (e) => { if (e.button === 0) startDrag(e.clientX); });
    window.addEventListener('mousemove', (e) => moveDrag(e.clientX));
    window.addEventListener('mouseup', endDrag);

    stage.addEventListener('touchstart', (e) => startDrag(e.touches[0].clientX), { passive: true });
    stage.addEventListener('touchmove',  (e) => moveDrag(e.touches[0].clientX), { passive: true });
    stage.addEventListener('touchend', endDrag);

    stage.addEventListener('pointerdown', (e) => { if (e.pointerType !== 'mouse') startDrag(e.clientX); });
    stage.addEventListener('pointermove', (e) => moveDrag(e.clientX));
    stage.addEventListener('pointerup', endDrag);
    stage.addEventListener('pointercancel', endDrag);

    // Keyboard (desktop)
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') next();
      else if (e.key === 'ArrowLeft') prev();
    });

    // Tap to hide/show dots (mobile)
    let lastTap = 0;
    stage.addEventListener('click', (e) => {
      const now = Date.now();
      if (now - lastTap < 300) return;
      lastTap = now;
      if (e.target.closest('.dot')) return;
      stage.classList.toggle('chrome-hidden');
    });

    // Resize/orientation
    const onResize = () => measureChrome();
    window.addEventListener('resize', onResize);
    window.addEventListener('orientationchange', onResize);

    // Init
    window.addEventListener('load', () => {
      measureChrome();
      translateTo(0, false);
    });
  </script>
</body>
</html>
