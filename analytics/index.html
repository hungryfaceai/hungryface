<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Analytics (retired)</title>
    <link rel="icon" href="/hungryface/pwa/icons/favicon-196.png" sizes="196x196" />
    <link rel="stylesheet" href="/hungryface/shared/tokens.css" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--nt-bg-soft, #0b0b0b);
        color: #eee;
        font-family: -apple-system, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      main {
        max-width: 34rem;
        padding: 2rem;
        line-height: 1.5;
      }
      a {
        color: var(--nt-accent, #7aa2ff);
      }
    </style>
    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="e5feef4a-8ebd-4094-b6ff-36bdc4512e2e"
      data-exclude-search="true"
      data-exclude-hash="true"
      data-domains="hungryfaceai.github.io"
    ></script>
  </head>
  <body>
    <main>
      <h1>This dashboard has been retired</h1>
      <p>
        The old self-hosted analytics stream has been switched off. Traffic is now measured with
        <a href="https://cloud.umami.is/" rel="noopener">Umami</a>, which doesn't use cookies and doesn't store
        visitors' IP addresses.
      </p>
    </main>
  </body>
</html>
