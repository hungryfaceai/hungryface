<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Quad View</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0; height: 100%;
      background: #000; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 6px;
      height: 100dvh; /* iOS dynamic viewport */
      padding: 6px;
      box-sizing: border-box;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #111;
      border-radius: 10px;
      overflow: hidden;
    }
    /* optional: click to toggle a pane full-screen */
    .grid:has(iframe.full) {
      grid-template-columns: 1fr; grid-template-rows: 1fr;
    }
    iframe.full { grid-column: 1 / -1; grid-row: 1 / -1; }
  </style>
</head>
<body>
  <div class="grid" id="grid">
    <!-- Replace src values with your pages -->
    <iframe id="p1" src="https://hungryfaceai.github.io/hungryface/webrtc/receiver/audio/test/"
            allow="camera; microphone; autoplay; clipboard-read; clipboard-write; fullscreen; display-capture"
            sandbox="allow-same-origin allow-scripts allow-forms allow-modals allow-pointer-lock allow-presentation"></iframe>

    <iframe id="p2" src="https://hungryfaceai.github.io/hungryface/webrtc/receiver/video/"
            allow="camera; microphone; autoplay; clipboard-read; clipboard-write; fullscreen; display-capture"
            sandbox="allow-same-origin allow-scripts allow-forms allow-modals allow-pointer-lock allow-presentation"></iframe>

    <iframe id="p3" src="https://hungryfaceai.github.io/hungryface/webrtc/receiver/pose/"
            allow="camera; microphone; autoplay; clipboard-read; clipboard-write; fullscreen; display-capture"
            sandbox="allow-same-origin allow-scripts allow-forms allow-modals allow-pointer-lock allow-presentation"></iframe>

    <iframe id="p4" src="https://hungryfaceai.github.io/hungryface/webrtc/receiver/face/"
            allow="camera; microphone; autoplay; clipboard-read; clipboard-write; fullscreen; display-capture"
            sandbox="allow-same-origin allow-scripts allow-forms allow-modals allow-pointer-lock allow-presentation"></iframe>
  </div>

  <script>
    // Optional: tap any pane to toggle full-screen layout for that frame
    const grid = document.getElementById('grid');
    grid.addEventListener('click', (e) => {
      const f = e.target.closest('iframe');
      if (!f) return;
      const wasFull = f.classList.contains('full');
      grid.querySelectorAll('iframe').forEach(x => x.classList.remove('full'));
      if (!wasFull) f.classList.add('full');
    });
  </script>
</body>
</html>
