<!doctype html>
<!--
  Naptio Viewer: Virtual fence (webrtc/receiver/fence/secure/index.html).
  Shows the Camera phone live video with an editable polygon "safe zone" drawn over it. If any visible body
  landmark leaves the zone, a Fence alert is raised until the baby is back inside. Pose landmarks come from the
  Camera over the "pose" data channel or from a local MediaPipe PoseLandmarker.
  Main pieces: video stage + canvas (polygon, handles, pose), Draw zone / Clear buttons, shared Alerts UI
  (banner + history drawer), alert sound.
  Dependencies: shared/receiver-core.js, psk/bootstrap.js, shared/alerts/*, shared/vision-task.js.
  The zone is kept in memory only (it resets to the full frame on reload).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fence</title>
    <link rel="icon" href="/hungryface/pwa/icons/favicon-196.png" sizes="196x196" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />

    <!-- ⬇️ Add shared sidebar stylesheet -->
    <link rel="stylesheet" href="/hungryface/webrtc/receiver/shared/sidebar.css" />

    <link rel="stylesheet" href="/hungryface/shared/tokens.css" />
    <style>
      /* Fence page styles: video stage, polygon canvas overlay, controls bar and zone alert badge. */
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--nt-bg, #000);
        color: var(--nt-text, #fff);
        font-family:
          -apple-system,
          system-ui,
          Segoe UI,
          Roboto,
          sans-serif;
        overflow: hidden;
      }
      /* Fullscreen wrapper so video+canvas scale together */
      #stage {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh; /* fallback */
        width: 100svw;
        height: 100svh; /* small viewport (iOS URL bar safe) */
        width: 100dvw;
        height: 100dvh; /* dynamic viewport */
        z-index: 1;
        background: var(--nt-bg, #000);
      }
      #stage > video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: var(--nt-bg, #000);
        z-index: 0;
        pointer-events: none;
      }
      #stage > canvas {
        position: absolute;
        z-index: 2;
        background: transparent;
        display: none;
        pointer-events: auto;
        touch-action: none;
      }
      /* Translucent red veil shown when any landmark is outside zone */
      #zoneAlert {
        position: absolute;
        inset: 0;
        background: rgba(255, 0, 0, 0.18);
        z-index: 3;
        pointer-events: none;
        display: none;
      }

      .btn {
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.6);
        background: transparent;
        color: var(--nt-text, #fff);
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: none;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      }
      .btn:active {
        transform: scale(0.99);
      }

      #controls {
        position: fixed;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 12px;
        z-index: 6;
        flex-wrap: wrap;
      }
      #enableAudioBtn,
      #disableAudioBtn {
        display: none;
      }

      .overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        z-index: 5;
      }
      .status {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: var(--nt-text-2, #ddd);
        font-size: 14px;
        padding: 10px 14px;
        border-radius: 12px;
        text-align: center;
        white-space: pre-line;
        max-width: 90vw;
      }
      .overlay.hidden {
        display: none;
      }
    </style>
    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="e5feef4a-8ebd-4094-b6ff-36bdc4512e2e"
      data-exclude-search="true"
      data-exclude-hash="true"
      data-domains="hungryfaceai.github.io"
    ></script>
  </head>
  <body>
    <!-- ⬇️ Inject shared sidebar markup and behavior (kept separate from your code) -->
    <script type="module" src="/hungryface/webrtc/receiver/shared/sidebar-loader.js"></script>

    <!-- ⬇️ PSK bootstrap (viewer); resolves UI room label, installs shim, and derives PSK-scoped room -->
    <script type="module">
      import { bootstrapSecureReceiver } from '/hungryface/webrtc/shared/psk/bootstrap.js';
      await bootstrapSecureReceiver({ label: 'receiver-fence' });
    </script>

    <div id="controls">
      <button id="enableAudioBtn" class="btn" type="button">Enable audio</button>
      <button id="disableAudioBtn" class="btn" type="button">Disable audio</button>
      <button id="fsBtn" class="btn" type="button">Fullscreen</button>
      <!-- 👇 Zone controls -->
      <button id="drawZoneBtn" class="btn" type="button">Draw zone</button>
      <button id="clearZoneBtn" class="btn" type="button">Clear</button>
    </div>

    <div id="stage">
      <video id="remote" autoplay playsinline></video>
      <div id="zoneAlert"></div>
      <canvas id="poseCanvas"></canvas>
    </div>

    <!-- Hosts for shared Alerts UI (banner + drawer) -->
    <div id="alertBannerHost"></div>
    <div id="alertsModalHost"></div>

    <div id="overlay" class="overlay">
      <div id="status" class="status">Idle</div>
    </div>

    <script type="module">
      // Fence viewer logic: polygon editing (touch/mouse), inside/outside test per frame, Fence alert episodes.
      import {
        DrawingUtils,
        PoseLandmarker,
        FilesetResolver,
      } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0';
      import { ReceiverCore } from '/hungryface/webrtc/receiver/shared/receiver-core.js';
      import {
        initAlertsUI,
        beginAlert,
        finishAlert,
        AlertTypes,
        showAlertBanner,
      } from '/hungryface/webrtc/receiver/shared/alerts/index.js';
      import { installAlertSound } from '/hungryface/webrtc/receiver/shared/alerts/notify-sound.js';

      /* ---------- Constants ---------- */
      import { WS_ENDPOINT } from '/hungryface/webrtc/shared/config.js';
      import { createVisionTask } from '/hungryface/webrtc/shared/vision-task.js';
      // UI room label vs PSK-scoped signaling room
      const uiRoom = window.__uiRoom || window.__pskRoom || 'Baby';
      const room = window.__scopedRoom || uiRoom;

      const TASKS_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0';
      const WASM_DIR = TASKS_URL + '/wasm';
      const POSE_MODEL_URL =
        'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task';

      const HAVE_CURRENT_DATA = 2;
      // Sound for Fence alerts (per-type toggle + cooldown; dashboard gate ignored)
      const alertSound = installAlertSound({
        type: 'fence', // explicit
        // debug: true    // optional while testing
      });

      /* ---------- DOM ---------- */
      const stage = document.getElementById('stage');
      const remoteVideo = document.getElementById('remote');
      const poseCanvas = document.getElementById('poseCanvas');
      const poseCtx = poseCanvas.getContext('2d', { alpha: true });
      const zoneAlert = document.getElementById('zoneAlert');

      const fsBtn = document.getElementById('fsBtn');
      const enableAudioBtn = document.getElementById('enableAudioBtn');
      const disableAudioBtn = document.getElementById('disableAudioBtn');
      const drawZoneBtn = document.getElementById('drawZoneBtn');
      const clearZoneBtn = document.getElementById('clearZoneBtn');
      const overlay = document.getElementById('overlay');
      const statusEl = document.getElementById('status');

      /* ---------- State ---------- */
      let hideStatusTimer = null;
      let poseDC = null;
      let poseEnabled = false;
      let poseWhere = 'sender'; // 'sender' | 'receiver'
      let poseTask = null;
      let poseLoopRunning = false;

      // ---------- Polygon / Zone state ----------
      // Vertices are in canvas pixel coordinates; polygonClosed is false while the user is still drawing.
      let polygonPoints = [];
      let polygonClosed = true;
      let drawingMode = false;
      let polygonInitialized = false;
      let activePointerId = null;
      let isDragging = false;
      let draggingPointIndex = -1;
      let hoveredPointIndex = -1;
      let lastTapTime = 0;
      let lastTapPos = null;
      const HANDLE_RADIUS_CSS = 10;

      // ---------- Shared Alerts (episode state) ----------
      const runAsync = (p) => Promise.resolve(p).catch(() => {});
      let fenceAlertOn = false;
      let fenceAlertId = null;
      let fenceAlertP = null; // pending beginAlert()
      let fenceStartMs = 0;
      let fenceFrames = 0;

      function beginViewportSetle() {
        beginViewportSettle();
      } // tiny typo guard used in logs

      /* ---------- Status overlay ---------- */
      const STATUS_HIDE_AFTER_CONNECTED_MS = 10000;
      const SIGNALING_CONNECTED_STATUS = 'Signaling: connected';
      // Special timers for "Signaling: connected"
      let signalingInitialTimer = null;
      let signalingFlashTimer = null;
      let signalingRepeatInterval = null;
      let signalingConnectedActive = false;

      function stopSignalingConnectedTimers() {
        signalingConnectedActive = false;
        if (signalingInitialTimer) {
          clearTimeout(signalingInitialTimer);
          signalingInitialTimer = null;
        }
        if (signalingFlashTimer) {
          clearTimeout(signalingFlashTimer);
          signalingFlashTimer = null;
        }
        if (signalingRepeatInterval) {
          clearInterval(signalingRepeatInterval);
          signalingRepeatInterval = null;
        }
      }
      function startSignalingConnectedTimers() {
        // reset any previous schedule
        stopSignalingConnectedTimers();
        signalingConnectedActive = true;
        statusEl.textContent = SIGNALING_CONNECTED_STATUS;
        overlay.classList.remove('hidden');
        signalingInitialTimer = setTimeout(() => {
          signalingInitialTimer = null;
          if (!signalingConnectedActive) return;
          // only hide if nothing else has replaced the status
          if (statusEl.textContent === SIGNALING_CONNECTED_STATUS) {
            overlay.classList.add('hidden');
          }
        }, STATUS_HIDE_AFTER_CONNECTED_MS);
        signalingRepeatInterval = setInterval(() => {
          if (!signalingConnectedActive) return;
          if (
            !overlay.classList.contains('hidden') &&
            statusEl.textContent &&
            statusEl.textContent !== SIGNALING_CONNECTED_STATUS
          ) {
            return;
          }
          statusEl.textContent = SIGNALING_CONNECTED_STATUS;
          overlay.classList.remove('hidden');
          if (signalingFlashTimer) clearTimeout(signalingFlashTimer);
          signalingFlashTimer = setTimeout(() => {
            signalingFlashTimer = null;
            if (!signalingConnectedActive) return;
            if (statusEl.textContent === SIGNALING_CONNECTED_STATUS) {
              overlay.classList.add('hidden');
            }
          }, 2_000);
        }, 60_000);
      }

      // Show a status message; "Signaling: connected" has special hide timers.
      function showStatus(msg) {
        // Special behaviour only for the exact "Signaling: connected" string
        if (msg === SIGNALING_CONNECTED_STATUS) {
          startSignalingConnectedTimers();
          return;
        }
        stopSignalingConnectedTimers();
        statusEl.textContent = msg;
        if (msg === 'Connected') {
          overlay.classList.remove('hidden');
          if (hideStatusTimer) clearTimeout(hideStatusTimer);
          hideStatusTimer = setTimeout(() => {
            overlay.classList.add('hidden');
          }, STATUS_HIDE_AFTER_CONNECTED_MS);
        } else {
          if (hideStatusTimer) {
            clearTimeout(hideStatusTimer);
            hideStatusTimer = null;
          }
          overlay.classList.remove('hidden');
        }
      }

      /* ---------- Audio UI ---------- */
      function updateAudioButtons() {
        if (remoteVideo.muted) {
          enableAudioBtn.style.display = 'block';
          disableAudioBtn.style.display = 'none';
        } else {
          enableAudioBtn.style.display = 'none';
          disableAudioBtn.style.display = 'block';
        }
      }
      enableAudioBtn.style.display = 'block';
      async function tryStartMuted() {
        try {
          remoteVideo.muted = true;
          remoteVideo.volume = 1.0;
          await remoteVideo.play();
        } catch {}
        updateAudioButtons();
      }
      enableAudioBtn.addEventListener('click', async (e) => {
        e?.preventDefault?.();
        try {
          remoteVideo.muted = false;
          remoteVideo.volume = 1.0;
          await remoteVideo.play();
        } catch {}
        updateAudioButtons();
      });
      disableAudioBtn.addEventListener('click', (e) => {
        e?.preventDefault?.();
        remoteVideo.muted = true;
        updateAudioButtons();
      });

      /* ---------- Fullscreen ---------- */
      fsBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        try {
          if (!document.fullscreenElement) {
            await (stage.requestFullscreen?.call(stage) || document.documentElement.requestFullscreen());
            fsBtn.textContent = 'Exit fullscreen';
          } else {
            await document.exitFullscreen();
            fsBtn.textContent = 'Fullscreen';
          }
        } catch {}
        beginViewportSettle();
      });
      document.addEventListener('fullscreenchange', () => {
        fsBtn.textContent = document.fullscreenElement ? 'Exit fullscreen' : 'Fullscreen';
        beginViewportSetle();
      });

      remoteVideo.addEventListener('loadedmetadata', () => {
        console.log('[MEDIA] remote meta', remoteVideo.videoWidth, 'x', remoteVideo.videoHeight);
        beginViewportSettle();
      });
      remoteVideo.addEventListener('playing', () => {
        updateAudioButtons();
        beginViewportSettle();
      });
      remoteVideo.addEventListener('resize', beginViewportSettle);

      /* ---------- Canvas alignment ---------- */
      // Rectangle of the video content when letterboxed ("contain") inside its container.
      function containRect(containerW, containerH, contentW, contentH) {
        const scale = Math.min(containerW / (contentW || 1), containerH / (contentH || 1));
        const w = Math.round(contentW * scale);
        const h = Math.round(contentH * scale);
        const x = Math.floor((containerW - w) / 2);
        const y = Math.floor((containerH - h) / 2);
        return { left: x, top: y, width: w, height: h };
      }
      // Size and position the canvas over the displayed video (accounting for device pixel ratio).
      function alignCanvasToVideo() {
        const stageBox = stage.getBoundingClientRect();
        const videoBox = remoteVideo.getBoundingClientRect();
        const containerW = Math.round(videoBox.width);
        const containerH = Math.round(videoBox.height);
        const vidW = remoteVideo.videoWidth || 1;
        const vidH = remoteVideo.videoHeight || 1;

        const fit = containRect(containerW, containerH, vidW, vidH);
        const leftCSS = Math.round(videoBox.left - stageBox.left + fit.left);
        const topCSS = Math.round(videoBox.top - stageBox.top + fit.top);

        poseCanvas.style.left = leftCSS + 'px';
        poseCanvas.style.top = topCSS + 'px';
        poseCanvas.style.width = fit.width + 'px';
        poseCanvas.style.height = fit.height + 'px';

        const dpr = window.devicePixelRatio || 1;
        const needW = Math.max(1, Math.round(fit.width * dpr));
        const needH = Math.max(1, Math.round(fit.height * dpr));

        if (poseCanvas.width !== needW || poseCanvas.height !== needH) {
          const prevW = poseCanvas.width || needW;
          const prevH = poseCanvas.height || needH;
          poseCanvas.width = needW;
          poseCanvas.height = needH;

          if (!polygonInitialized) {
            setDefaultPolygon();
            polygonInitialized = true;
          } else {
            const sx = needW / Math.max(1, prevW);
            const sy = needH / Math.max(1, prevH);
            for (const p of polygonPoints) {
              p.x *= sx;
              p.y *= sy;
            }
          }
          renderPolygonOnly();
        }

        poseCtx.setTransform(1, 0, 0, 1, 0, 0);
      }
      let settleRAF = 0,
        settleUntil = 0;
      function beginViewportSettle(durationMs = 1200) {
        settleUntil = performance.now() + durationMs;
        if (settleRAF) return;
        const tick = () => {
          alignCanvasToVideo();
          if (performance.now() < settleUntil) {
            settleRAF = requestAnimationFrame(tick);
          } else {
            cancelAnimationFrame(settleRAF);
            settleRAF = 0;
            alignCanvasToVideo();
          }
        };
        tick();
      }
      const vpAlign = () => beginViewportSettle();
      ['resize', 'orientationchange', 'scroll'].forEach((ev) =>
        window.addEventListener(ev, vpAlign, { passive: true })
      );
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', vpAlign, { passive: true });
        window.visualViewport.addEventListener('scroll', vpAlign, { passive: true });
      }
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) beginViewportSettle();
      });

      /* ---------- Overlay helpers ---------- */
      function setOverlayVisible(v) {
        const want = v || drawingMode || (polygonClosed && polygonPoints.length >= 3);
        poseCanvas.style.display = want ? 'block' : 'none';
        if (want) beginViewportSettle();
        else poseCtx.clearRect(0, 0, poseCanvas.width, poseCanvas.height);
      }
      function clearOverlayDrawing(keepAlert = false) {
        try {
          poseCtx.setTransform(1, 0, 0, 1, 0, 0);
          poseCtx.clearRect(0, 0, poseCanvas.width, poseCanvas.height);
          if (keepAlert === true) return; // brief video hiccup: don't end (and re-raise) the alert
          zoneAlert.style.display = 'none';
          // Ensure any open fence alert is finalized when video/overlay clears
          finalizeOpenFenceAlert('Video unavailable');
        } catch {}
      }

      /* ---------- Polygon helpers ---------- */
      // Default zone: the whole frame.
      function setDefaultPolygon() {
        polygonPoints = [
          { x: 0, y: 0 },
          { x: poseCanvas.width, y: 0 },
          { x: poseCanvas.width, y: poseCanvas.height },
          { x: 0, y: poseCanvas.height },
        ];
        polygonClosed = true;
        drawingMode = false;
        setOverlayVisible(true);
      }
      // Convert pointer client coordinates to canvas pixel coordinates.
      function getCanvasCoordsFromClientXY(clientX, clientY) {
        const rect = poseCanvas.getBoundingClientRect();
        const xVis = clientX - rect.left;
        const yVis = clientY - rect.top;
        const sx = poseCanvas.width / Math.max(1, rect.width);
        const sy = poseCanvas.height / Math.max(1, rect.height);
        return { x: xVis * sx, y: yVis * sy };
      }
      // Handle hit radius (HANDLE_RADIUS_CSS) converted to canvas pixels.
      function getHitRadiusCanvasPx() {
        const rect = poseCanvas.getBoundingClientRect();
        const sx = poseCanvas.width / Math.max(1, rect.width);
        const dpr = window.devicePixelRatio || 1;
        return HANDLE_RADIUS_CSS * Math.max(1, sx / dpr) * dpr;
      }
      function findHandleIndexAt(pos) {
        const r2 = getHitRadiusCanvasPx() ** 2;
        let best = -1,
          bestDist = Infinity;
        for (let i = 0; i < polygonPoints.length; i++) {
          const dx = polygonPoints[i].x - pos.x;
          const dy = polygonPoints[i].y - pos.y;
          const d2 = dx * dx + dy * dy;
          if (d2 <= r2 && d2 < bestDist) {
            best = i;
            bestDist = d2;
          }
        }
        return best;
      }
      function clampToCanvas(pt) {
        return {
          x: Math.max(0, Math.min(poseCanvas.width, pt.x)),
          y: Math.max(0, Math.min(poseCanvas.height, pt.y)),
        };
      }
      // Draw the zone outline, fill and vertex handles.
      function drawPolygonOverlay(ctx) {
        if (!polygonPoints.length) return;
        ctx.save();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#00BCD4';
        ctx.fillStyle = 'rgba(0, 188, 212, 0.10)';
        ctx.beginPath();
        ctx.moveTo(polygonPoints[0].x, polygonPoints[0].y);
        for (let i = 1; i < polygonPoints.length; i++) ctx.lineTo(polygonPoints[i].x, polygonPoints[i].y);
        if (polygonClosed) ctx.closePath();
        ctx.stroke();
        if (polygonClosed) ctx.fill();
        for (let i = 0; i < polygonPoints.length; i++) {
          const p = polygonPoints[i];
          ctx.beginPath();
          ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
          ctx.fillStyle = '#00BCD4';
          ctx.fill();
        }
        const idx = isDragging ? draggingPointIndex : hoveredPointIndex;
        if (idx >= 0) {
          const p = polygonPoints[idx];
          ctx.beginPath();
          ctx.arc(p.x, p.y, 7, 0, Math.PI * 2);
          ctx.strokeStyle = '#FF9800';
          ctx.lineWidth = 2;
          ctx.stroke();
        }
        ctx.restore();
      }
      function renderPolygonOnly() {
        poseCtx.clearRect(0, 0, poseCanvas.width, poseCanvas.height);
        drawPolygonOverlay(poseCtx);
      }
      // Even-odd ray casting point-in-polygon test.
      function pointInPolygon(pt, poly) {
        let inside = false;
        for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
          const xi = poly[i].x,
            yi = poly[i].y;
          const xj = poly[j].x,
            yj = poly[j].y;
          const intersect = yi > pt.y !== yj > pt.y && pt.x < ((xj - xi) * (pt.y - yi)) / (yj - yi || 1e-9) + xi;
          if (intersect) inside = !inside;
        }
        return inside;
      }
      // True if any sufficiently visible landmark of any detected person lies outside the closed zone.
      function anyLandmarkOutside(landmarks) {
        if (!polygonClosed || polygonPoints.length < 3) return false;
        const w = poseCanvas.width,
          h = poseCanvas.height;
        for (const lm of landmarks) {
          for (const p of lm) {
            // Points the model can barely see (hidden or cut off by the frame edge) are guesses: ignore them.
            if (typeof p.visibility === 'number' && p.visibility < 0.5) continue;
            const x = p.x * w;
            const y = p.y * h;
            if (!pointInPolygon({ x, y }, polygonPoints)) return true;
          }
        }
        return false;
      }

      /* ---------- Shared Alerts helpers ---------- */
      // End the open Fence alert (if any), storing the number of frames spent outside.
      function finalizeOpenFenceAlert(message = 'Ended') {
        if (!fenceAlertOn) {
          fenceAlertId = null;
          fenceAlertP = null;
          fenceStartMs = 0;
          fenceFrames = 0;
          return;
        }
        const frames = fenceFrames;
        fenceFrames = 0;
        const finish = (id) => {
          if (id != null) runAsync(finishAlert(id, { message, frames }));
        };
        if (fenceAlertId != null) finish(fenceAlertId);
        else if (fenceAlertP) fenceAlertP.then(finish); // still being created: close it once it exists
        fenceAlertId = null;
        fenceAlertP = null;
        fenceAlertOn = false;
        fenceStartMs = 0;
      }

      // Per-frame state machine: start an alert when outside, count frames while outside, end when back inside.
      function updateFenceAlert(isOutside) {
        // ON transition
        if (isOutside && !fenceAlertOn) {
          fenceAlertOn = true;
          fenceStartMs = Date.now();
          fenceFrames = 0;
          const p = (fenceAlertP = Promise.resolve(
            beginAlert({
              type: AlertTypes?.Fence ?? AlertTypes?.Motion ?? 'fence',
              message: 'Movement outside virtual fence',
            })
          ).catch(() => null));
          runAsync(
            p.then((id) => {
              if (fenceAlertP !== p) return; // already ended; finalizeOpenFenceAlert closes it
              fenceAlertId = id;
              fenceAlertP = null;
              showAlertBanner(fenceStartMs, 'Movement outside virtual fence');
              // 🔊 play the triple-pip (per-type toggle + cooldown enforced)
              alertSound.trigger(); // (or: alertSound.emit('fence'))
            })
          );
        }
        // accumulate while ON
        if (isOutside && fenceAlertOn) {
          fenceFrames++;
        }
        // OFF transition
        if (!isOutside && fenceAlertOn) {
          finalizeOpenFenceAlert('Returned to safe zone');
        }
      }

      /* ---------- MediaPipe on RECEIVER ---------- */
      let _poseTaskP = null;
      // Lazily create the PoseLandmarker once; concurrent callers share one promise.
      function ensurePoseTask() {
        if (poseTask) return Promise.resolve(poseTask);
        if (!_poseTaskP)
          _poseTaskP = _ensurePoseTaskImpl().finally(() => {
            _poseTaskP = null; // settled: a later recreate (closed task) must load again, not reuse this
          });
        return _poseTaskP;
      }
      async function _ensurePoseTaskImpl() {
        if (poseTask) return poseTask;
        const vision = await FilesetResolver.forVisionTasks(WASM_DIR);
        poseTask = await createVisionTask(
          PoseLandmarker,
          vision,
          {
            baseOptions: { modelAssetPath: POSE_MODEL_URL },
            runningMode: 'VIDEO',
            numPoses: 1,
          },
          { label: 'fence' }
        );
        return poseTask;
      }
      function videoHasFrame(v) {
        return v && v.readyState >= HAVE_CURRENT_DATA && v.videoWidth > 0 && v.videoHeight > 0;
      }
      function waitForVideoFrame(video) {
        if (videoHasFrame(video)) return Promise.resolve();
        return new Promise((resolve) => {
          const check = () => {
            if (videoHasFrame(video)) {
              cleanup();
              resolve();
            }
          };
          const cleanup = () => {
            video.removeEventListener('loadedmetadata', check);
            video.removeEventListener('playing', check);
            video.removeEventListener('resize', check);
          };
          video.addEventListener('loadedmetadata', check);
          video.addEventListener('playing', check);
          video.addEventListener('resize', check);
        });
      }
      function drawPoseLandmarks(landmarks) {
        if (!poseCanvas.width || !poseCanvas.height) return;
        poseCtx.save();
        poseCtx.clearRect(0, 0, poseCanvas.width, poseCanvas.height);

        const utils = new DrawingUtils(poseCtx);
        for (const lm of landmarks || []) {
          utils.drawLandmarks(lm, {
            radius: (data) => DrawingUtils.lerp((data.from && data.from.z) ?? 0, -0.15, 0.1, 5, 1),
          });
          utils.drawConnectors(lm, PoseLandmarker.POSE_CONNECTIONS);
        }
        drawPolygonOverlay(poseCtx);
        poseCtx.restore();

        const out = landmarks && landmarks.length ? anyLandmarkOutside(landmarks) : false;
        zoneAlert.style.display = out ? 'block' : 'none';
        frameFence(!!out);
      }
      // Per-frame result. Going outside alerts at once; the alert ends only after 2 s back inside (or without a
      // body), so one dropped or odd frame doesn't split one episode into several alerts. Explicit stops
      // (detection off, zone redrawn, Camera stopped) still end it immediately via updateFenceAlert(false).
      let fenceInsideSince = 0;
      function frameFence(outside) {
        lastFencePoseMs = Date.now();
        if (outside) {
          fenceInsideSince = 0;
          updateFenceAlert(true);
          return;
        }
        if (!fenceAlertOn) return;
        if (!fenceInsideSince) fenceInsideSince = Date.now();
        else if (Date.now() - fenceInsideSince >= 2000) {
          fenceInsideSince = 0;
          updateFenceAlert(false);
        }
      }
      // Camera does the analysis and only sends results while it sees a body: no result for 10 s ends the alert
      // (the baby left the picture), as on the Motion page.
      let lastFencePoseMs = 0;
      setInterval(() => {
        if (fenceAlertOn && poseWhere === 'sender' && lastFencePoseMs && Date.now() - lastFencePoseMs > 10000)
          finalizeOpenFenceAlert('No body seen for 10 s');
      }, 1000);
      let _loopGen = 0,
        _loopStarting = false;
      // Run pose detection on the Viewer for every video frame; _loopGen retires stale loops.
      async function startReceiverPoseLoop() {
        if (poseLoopRunning || _loopStarting) return;
        _loopStarting = true;
        const gen = ++_loopGen;
        try {
          await ensurePoseTask();
          await waitForVideoFrame(remoteVideo);
        } catch (e) {
          // The detection model failed to load (e.g. a flaky mobile network): say so and try again, instead of
          // leaving monitoring silently off.
          console.warn('[detect] model failed to load', e);
          try {
            showStatus('Detection model failed to load – retrying in 15 s');
          } catch {}
          setTimeout(() => {
            if (gen === _loopGen && poseEnabled && poseWhere === 'receiver') startReceiverPoseLoop();
          }, 15000);
          return;
        } finally {
          _loopStarting = false;
        }
        if (gen !== _loopGen) return; // stopped meanwhile

        poseLoopRunning = true;
        const useRVFC = 'requestVideoFrameCallback' in remoteVideo;

        const onFrame = () => {
          if (gen !== _loopGen) return; // an older loop: let it end
          if (!poseLoopRunning || !poseEnabled || poseWhere !== 'receiver') return;

          if (!videoHasFrame(remoteVideo)) {
            poseCtx.clearRect(0, 0, poseCanvas.width, poseCanvas.height);
            zoneAlert.style.display = 'none';
            frameFence(false);
            scheduleNext();
            return;
          }

          try {
            const ts = performance.now();
            const result = poseTask.detectForVideo(remoteVideo, ts);
            if (result?.landmarks?.length) {
              drawPoseLandmarks(result.landmarks);
            } else {
              poseCtx.clearRect(0, 0, poseCanvas.width, poseCanvas.height);
              drawPolygonOverlay(poseCtx);
              zoneAlert.style.display = 'none';
              frameFence(false);
            }
          } catch {
          } finally {
            scheduleNext();
          }
        };
        const scheduleNext = () => {
          if (useRVFC) remoteVideo.requestVideoFrameCallback(onFrame);
          else requestAnimationFrame(onFrame);
        };
        scheduleNext();
      }
      function stopReceiverPoseLoop() {
        poseLoopRunning = false;
        _loopGen++;
        poseCtx.clearRect(0, 0, poseCanvas.width, poseCanvas.height);
        zoneAlert.style.display = 'none';
        updateFenceAlert(false);
      }
      // Apply Camera pose-mode: run locally ("receiver"), consume Camera landmarks ("sender"), or off.
      function applyPoseMode() {
        setOverlayVisible(poseEnabled);
        if (!poseEnabled) {
          stopReceiverPoseLoop();
          return;
        }
        if (poseWhere === 'receiver') startReceiverPoseLoop();
        // Camera does the analysis: stop our own loop only if it is running. The Camera repeats this message
        // whenever another Viewer joins; that must not end an open alert (and then raise a duplicate).
        else if (poseLoopRunning || _loopStarting) stopReceiverPoseLoop();
      }

      /* ---------- Shared WebRTC core ---------- */
      const core = new ReceiverCore({
        wsEndpoint: WS_ENDPOINT,
        room,
        onStatus: showStatus,
        onStream: (stream) => {
          if (remoteVideo.srcObject !== stream) {
            remoteVideo.srcObject = stream;
            tryStartMuted();
            attachStreamEndHandlers(stream);
          }
        },
        onIceState: (state) => {
          // "disconnected" is often a brief blip the connection recovers from: keep an open alert then.
          if (state === 'failed' || state === 'closed') clearOverlayDrawing();
          else if (state === 'disconnected') clearOverlayDrawing(true);
        },
        onBye: () => {
          clearOverlayDrawing();
        },
        onCreatePC: (pc) => {
          // Receiver-initiated 'pose' data channel
          const ch = pc.createDataChannel('pose');
          ch.onopen = () => console.log('[DC][receiver] pose DC open]');
          ch.onclose = () => console.log('[DC][receiver] pose DC close]');
          ch.onerror = (e) => console.warn('[DC][receiver] pose DC error', e);
          ch.onmessage = (ev) => {
            try {
              const msg = JSON.parse(ev.data);
              if (msg.type === 'pose-mode') {
                poseEnabled = !!msg.enabled;
                poseWhere = msg.where || 'sender';
                applyPoseMode();
              } else if (msg.type === 'pose') {
                if (poseEnabled && poseWhere === 'sender') drawPoseLandmarks(msg.landmarks);
              }
            } catch {}
          };
          poseDC = ch;
        },
        onDataChannel: (e) => {
          console.log('[DC][receiver] inbound datachannel (leaving open):', e.channel?.label);
        },
      });

      core.start().catch(console.warn);
      window.addEventListener('beforeunload', () => {
        finalizeOpenFenceAlert('Page closing');
        core.close();
      });

      /* ---------- NEW: clear overlay on video element stop-like states ---------- */
      ['pause', 'ended', 'emptied'].forEach((ev) => {
        remoteVideo.addEventListener(ev, () => clearOverlayDrawing(), { passive: true });
      });
      ['stalled', 'suspend', 'waiting'].forEach((ev) => {
        remoteVideo.addEventListener(ev, () => clearOverlayDrawing(true), { passive: true });
      });

      /* ---------- Track/stream end handlers ---------- */
      function attachStreamEndHandlers(stream) {
        if (!stream) return;
        stream.getVideoTracks().forEach((t) => {
          t.addEventListener('ended', clearOverlayDrawing);
          t.addEventListener('mute', () => clearOverlayDrawing(true)); // short network stall: keep the alert
        });
        stream.addEventListener('removetrack', (e) => {
          if (e.track?.kind === 'video') clearOverlayDrawing();
        });
      }

      /* ---------- Polygon interactions ---------- */
      function resetInteractionState() {
        try {
          if (activePointerId != null) {
            poseCanvas.releasePointerCapture?.(activePointerId);
          }
        } catch {}
        activePointerId = null;
        isDragging = false;
        draggingPointIndex = -1;
        hoveredPointIndex = -1;
        lastTapPos = null;
        lastTapTime = 0;
      }
      // Drawing mode: tap adds a vertex, double-tap near the last one closes the polygon. Else drag a handle.
      function onPointerDown(e) {
        e.preventDefault();
        const pos = getCanvasCoordsFromClientXY(e.clientX, e.clientY);
        activePointerId = e.pointerId;
        poseCanvas.setPointerCapture?.(e.pointerId);

        if (drawingMode) {
          const now = Date.now();
          if (lastTapPos && now - lastTapTime < 350) {
            const dx = pos.x - lastTapPos.x;
            const dy = pos.y - lastTapPos.y;
            if (dx * dx + dy * dy < getHitRadiusCanvasPx() ** 2) {
              if (polygonPoints.length >= 3) {
                polygonClosed = true;
                drawingMode = false;
                drawZoneBtn.textContent = 'Draw zone';
                renderPolygonOnly();
                return;
              }
            }
          }
          polygonPoints.push(clampToCanvas(pos));
          lastTapTime = now;
          lastTapPos = pos;
          renderPolygonOnly();
        } else {
          const idx = findHandleIndexAt(pos);
          if (idx !== -1) {
            isDragging = true;
            draggingPointIndex = idx;
          }
        }
      }
      function onPointerMove(e) {
        if (activePointerId !== e.pointerId) return;
        const pos = getCanvasCoordsFromClientXY(e.clientX, e.clientY);

        if (isDragging && draggingPointIndex !== -1) {
          e.preventDefault();
          polygonPoints[draggingPointIndex] = clampToCanvas(pos);
          renderPolygonOnly();
        } else if (!drawingMode) {
          hoveredPointIndex = findHandleIndexAt(pos);
          renderPolygonOnly();
        }
      }
      function onPointerUpOrCancel(e) {
        if (activePointerId !== e.pointerId) return;
        isDragging = false;
        draggingPointIndex = -1;
        activePointerId = null;
        poseCanvas.releasePointerCapture?.(e.pointerId);
      }

      poseCanvas.addEventListener('pointerdown', onPointerDown, { passive: false });
      poseCanvas.addEventListener('pointermove', onPointerMove, { passive: false });
      poseCanvas.addEventListener('pointerup', onPointerUpOrCancel, { passive: false });
      poseCanvas.addEventListener('pointercancel', onPointerUpOrCancel, { passive: false });
      poseCanvas.addEventListener('contextmenu', (e) => e.preventDefault());

      // Buttons
      drawZoneBtn.addEventListener('click', () => {
        if (!drawingMode) {
          resetInteractionState();
          polygonPoints = [];
          polygonClosed = false;
          drawingMode = true;
          hoveredPointIndex = -1;
          draggingPointIndex = -1;
          isDragging = false;
          zoneAlert.style.display = 'none';
          drawZoneBtn.textContent = 'Finish drawing';
          setOverlayVisible(true);
          renderPolygonOnly();
          // stop any ongoing alert while the zone is being redrawn
          updateFenceAlert(false);
        } else {
          drawingMode = false;
          if (polygonPoints.length >= 3) polygonClosed = true;
          drawZoneBtn.textContent = 'Draw zone';
          renderPolygonOnly();
        }
      });
      clearZoneBtn.addEventListener('click', () => {
        resetInteractionState();
        setDefaultPolygon();
        zoneAlert.style.display = 'none';
        drawZoneBtn.textContent = 'Draw zone';
        renderPolygonOnly();
        updateFenceAlert(false);
      });

      // Make sure canvas is visible for interactions from the start
      setDefaultPolygon();
      setOverlayVisible(true);

      // Inject shared Alerts UI (drawer & banner like audio/prone)
      initAlertsUI({ drawerHostId: 'alertsModalHost' });
    </script>

    <script type="module">
      import { installMiniDashboard } from '/hungryface/webrtc/receiver/shared/mini-dash.js';
      installMiniDashboard({
        // Use your shared dashboard URL:
        src: 'https://hungryfaceai.github.io/hungryface/webrtc/receiver/shared/alerts/dashboard/',
        // The preference gate (already in your app):
        featureKey: 'naptio:miniDash:enabled',
      });
    </script>

    <!-- Keep screen awake while this monitoring page is open (no-op if unsupported) -->
    <script type="module">
      import { keepAwake } from '/hungryface/webrtc/shared/wake-lock.js';
      try {
        keepAwake({ log: (m) => console.log('[RECEIVER]', m) });
      } catch {}
    </script>
  </body>
</html>
