<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Baby Monitor – Receiver (Face Landmarks)</title>
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>

  <!-- Shared sidebar stylesheet -->
  <link rel="stylesheet" href="/hungryface/webrtc/receiver/shared/sidebar.css" />

  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0; height: 100%;
      background: #000; color: #fff;
      font-family: -apple-system, system-ui, Segoe UI, Roboto, sans-serif;
      overflow: hidden;
    }

    /* Fullscreen stage so video + canvas scale together */
    #stage {
      position: fixed; inset: 0;
      width: 100vw; height: 100vh;   /* fallback */
      width: 100dvw; height: 100dvh; /* dynamic viewport */
      width: 100svw; height: 100svh; /* iOS URL bar safe */
      z-index: 1; background: #000;
    }
    #stage > video {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: contain; background: #000;
      z-index: 0; pointer-events: none;
    }
    #stage > canvas {
      position: absolute;
      z-index: 2; background: transparent; display: none;
      pointer-events: none;
    }

    .btn {
      padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.6);
      background: transparent; color: #fff; font-size: 16px; font-weight: 600;
      cursor: pointer; box-shadow: none;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    }
    .btn:active { transform: scale(0.99); }
    .btn.small { padding: 8px 10px; font-size: 13px; border-radius: 10px; }

    #controls {
      position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
      display: flex; align-items: center; gap: 12px; z-index: 6;
      flex-wrap: wrap;
    }
    #enableAudioBtn, #disableAudioBtn { display: none; }

    /* Top-left utility row: Alerts + Settings */
    #utilityBar {
      position: fixed; left: 12px; top: 12px; z-index: 7; display: flex; gap: 10px; flex-wrap: wrap;
    }
    /* iOS-style red badge */
    #btnOpenAlerts { position: relative; }
    #alertsBadge {
      display:inline-flex; align-items:center; justify-content:center;
      min-width:18px; height:18px; padding:0 6px; border-radius:999px;
      background:#ef4444; color:#fff; font-size:12px; line-height:1; font-weight:800;
      margin-left:8px;
    }

    .overlay {
      position: fixed; inset: 0; display: flex;
      align-items: center; justify-content: center;
      pointer-events: none; z-index: 5;
    }
    .status {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: #ddd; font-size: 14px; padding: 10px 14px; border-radius: 12px;
      text-align: center; white-space: pre-line; max-width: 90vw;
    }
    .overlay.hidden { display: none; }

    /* Minimal modal (matches your audio page) */
    .modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);z-index:140;}
    .modal.show{display:flex;}
    .modal-card{width:min(96%,520px);max-height:90vh;overflow-y:auto;background:#0b0b0b;border:1px solid #242424;border-radius:14px;}
    .modal-head{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #1a1a1a;background:#0d0d0d;border-top-left-radius:14px;border-top-right-radius:14px;}
    .modal-actions{display:flex;gap:8px;align-items:center;}
    .modal-body{padding:12px;}
    .modal-head .close{appearance:none;border:none;background:transparent;color:#aaa;font-size:22px;cursor:pointer;padding:2px 6px;}

    /* Face alert banner (clone of audio banner, different text/color) */
    .face-alert-banner{
      position: fixed;
      top: 12px; left: 50%; transform: translateX(-50%);
      background: #b91c1c; color: #fff;
      padding: 10px 14px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.25);
      box-shadow: 0 10px 20px rgba(0,0,0,.35);
      z-index: 10000; font-size: 14px; text-align: center;
      max-width: min(92vw, 720px);
    }
    .face-alert-banner.hidden { display: none; }
    .banner-link {
      background: none; border: 0; color: #fff; padding: 0;
      font: inherit; cursor: pointer; text-decoration: underline;
    }
    .face-alert-actions { margin-top: 6px; display: inline-flex; gap: 8px; align-items: center; }
  </style>
</head>
<body>
  <!-- ⬇️ Inject shared sidebar markup and behavior -->
  <script type="module">
    (async () => {
      try {
        const res = await fetch('/hungryface/webrtc/receiver/shared/sidebar.html', { cache: 'no-cache' });
        const html = await res.text();
        const wrap = document.createElement('div');
        wrap.innerHTML = html.trim();
        document.body.prepend(...wrap.childNodes);

        await new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = '/hungryface/webrtc/receiver/shared/sidebar.js';
          s.onload = resolve;
          s.onerror = reject;
          document.body.appendChild(s);
        });
      } catch (err) {
        console.error('[Sidebar] failed to load shared assets:', err);
      }
    })();
  </script>

  <!-- 🔔 Alerts + ⚙️ Settings (top-left) -->
  <div id="utilityBar">
    <button id="btnOpenAlerts" class="btn small" type="button">Alerts <span id="alertsBadge">0</span></button>
    <button id="btnOpenSettings" class="btn small" type="button">Settings</button>
  </div>

  <div id="controls">
    <button id="enableAudioBtn" class="btn" type="button">Enable audio</button>
    <button id="disableAudioBtn" class="btn" type="button">Disable audio</button>
    <button id="fsBtn" class="btn" type="button">Fullscreen</button>
  </div>

  <div id="stage">
    <video id="remote" autoplay playsinline></video>
    <canvas id="faceCanvas"></canvas>
  </div>

  <div id="overlay" class="overlay">
    <div id="status" class="status">Idle</div>
  </div>

  <!-- Face “no face” Settings modal -->
  <div id="settingsModal" class="modal" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-head">
        <strong>Face detection – “No face” criteria</strong>
        <div class="modal-actions">
          <button id="btnSettingsClose" class="close" type="button" title="Close" aria-label="Close">×</button>
        </div>
      </div>
      <div class="modal-body">
        <div style="display:grid; gap:12px;">
          <label style="display:flex;gap:10px;align-items:center;">
            <input id="FACE_USE_TIME" type="checkbox" checked>
            <span>Use time-based rule:</span>
            <span>N ms without a face → consider “not detected”</span>
          </label>
          <label style="display:flex;gap:10px;align-items:center;margin-left:28px;">
            <span style="opacity:.75; min-width:120px;">N (milliseconds)</span>
            <input id="FACE_MISS_MS" type="number" min="50" step="50" value="300" style="width:120px; padding:8px 10px; border-radius:10px; border:1px solid #222; background:#0b0b0b; color:#ddd;">
          </label>

          <label style="display:flex;gap:10px;align-items:center;margin-top:10px;">
            <input id="FACE_USE_FRAMES" type="checkbox">
            <span>Use frame-based rule:</span>
            <span>P missed frames → consider “not detected”</span>
          </label>
          <label style="display:flex;gap:10px;align-items:center;margin-left:28px;">
            <span style="opacity:.75; min-width:120px;">P (frames)</span>
            <input id="FACE_MISS_FRAMES" type="number" min="1" step="1" value="5" style="width:120px; padding:8px 10px; border-radius:10px; border:1px solid #222; background:#0b0b0b; color:#ddd;">
          </label>

          <div class="muted" style="color:#aaa; font-size:12px; line-height:1.4; margin-top:6px;">
            Tip: when landmarks are streamed from the sender, “frames” are counted on a ~200&nbsp;ms heartbeat if no messages arrive.
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Hosts for injected UI -->
  <div id="faceBannerHost"></div>
  <div id="alertsModalHost"></div>

  <script type="module">
    import { DrawingUtils, FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0";
    import { ReceiverCore } from "/hungryface/webrtc/receiver/shared/receiver-core.js";

    /* ========= Reuse Audio’s alert DB + alerts drawer ========= */
    import { openAlertDB, saveAlertRecord } from "/hungryface/webrtc/receiver/audio/detect/alert-banner.js";
    import { setupAlertsDrawer, refreshAlertsBadge } from "/hungryface/webrtc/receiver/audio/detect/alerts-drawer.js";

    /* ---------- Constants ---------- */
    const WS_ENDPOINT = "wss://signaling-server-f5gu.onrender.com/ws";
    const room = new URLSearchParams(location.search).get("room") || "Baby";
    const STATUS_HIDE_AFTER_CONNECTED_MS = 10000;

    // MediaPipe assets
    const TASKS_URL = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0";
    const WASM_DIR = TASKS_URL + "/wasm";
    const FACE_MODEL_URL =
      "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task";

    const HAVE_CURRENT_DATA = 2;

    /* ---------- DOM ---------- */
    const stage = document.getElementById('stage');
    const remoteVideo = document.getElementById('remote');
    const faceCanvas = document.getElementById('faceCanvas');
    const faceCtx = faceCanvas.getContext('2d', { alpha: true });

    const fsBtn = document.getElementById('fsBtn');
    const enableAudioBtn = document.getElementById('enableAudioBtn');
    const disableAudioBtn = document.getElementById('disableAudioBtn');
    const overlay = document.getElementById('overlay');
    const statusEl = document.getElementById('status');

    /* ========= Alerts button + Settings modal ========= */
    const btnOpenAlerts = document.getElementById('btnOpenAlerts');
    const alertsBadge   = document.getElementById('alertsBadge');
    const settingsModal = document.getElementById('settingsModal');
    document.getElementById('btnOpenSettings').onclick = () => {
      settingsModal.classList.add('show'); settingsModal.setAttribute('aria-hidden','false');
    };
    document.getElementById('btnSettingsClose').onclick = () => {
      settingsModal.classList.remove('show'); settingsModal.setAttribute('aria-hidden','true');
    };
    settingsModal.addEventListener('click', (e) => {
      if (e.target === settingsModal) {
        settingsModal.classList.remove('show'); settingsModal.setAttribute('aria-hidden','true');
      }
    });

    // Drawer wiring (reuses audio code)
    setupAlertsDrawer();
    btnOpenAlerts?.addEventListener('click', () => {/* drawer opens itself on click via its own handler */});
    refreshAlertsBadge().catch(()=>{});

    /* ========= Face alert banner (face-missing) ========= */
    const FACE_DISMISS_SUPPRESS_MS = 60_000; // 1 minute
    let faceBanner, faceBannerTime, faceDismissBtn;
    let faceSuppressUntilMs = 0, faceKeepReminding = true;

    function fmtTimeHM(ms) {
      return new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    function setupFaceBanner() {
      if (faceBanner) return;
      const host = document.getElementById('faceBannerHost') || document.body;
      const wrap = document.createElement('div');
      wrap.innerHTML = `
        <div id="faceBanner" class="face-alert-banner hidden" role="alert" aria-live="assertive">
          <div>Alert — <strong>Face not detected</strong> since <span id="faceBannerTime">--:--</span>.</div>
          <div class="face-alert-actions">
            <button id="faceDismissBtn" class="banner-link" type="button">Dismiss</button>
          </div>
        </div>
      `.trim();
      const node = wrap.firstChild;
      host.appendChild(node);
      faceBanner = node;
      faceBannerTime = node.querySelector('#faceBannerTime');
      faceDismissBtn = node.querySelector('#faceDismissBtn');
      faceDismissBtn?.addEventListener('click', () => {
        faceKeepReminding = false;
        faceSuppressUntilMs = Date.now() + FACE_DISMISS_SUPPRESS_MS;
        hideFaceBanner();
      });
    }
    function showFaceBanner(whenMs) {
      setupFaceBanner();
      if (!faceKeepReminding && Date.now() < faceSuppressUntilMs) return;
      if (faceBannerTime) faceBannerTime.textContent = fmtTimeHM(whenMs);
      faceBanner?.classList.remove('hidden');
    }
    function hideFaceBanner() { faceBanner?.classList.add('hidden'); }

    /* ---------- Status overlay ---------- */
    let hideStatusTimer = null;
    function showStatus(msg) {
      statusEl.textContent = msg;
      overlay.classList.remove('hidden');
      console.log('[STATUS]', msg);
      if (msg === 'Connected') {
        if (hideStatusTimer) clearTimeout(hideStatusTimer);
        hideStatusTimer = setTimeout(() => overlay.classList.add('hidden'), STATUS_HIDE_AFTER_CONNECTED_MS);
      } else {
        if (hideStatusTimer) { clearTimeout(hideStatusTimer); hideStatusTimer = null; }
        overlay.classList.remove('hidden');
      }
    }

    /* ---------- Audio UI ---------- */
    function updateAudioButtons() {
      if (remoteVideo.muted) {
        enableAudioBtn.style.display = 'block';
        disableAudioBtn.style.display = 'none';
      } else {
        enableAudioBtn.style.display = 'none';
        disableAudioBtn.style.display = 'block';
      }
    }
    enableAudioBtn.style.display = 'block';
    async function tryStartMuted() {
      try {
        remoteVideo.muted = true;
        remoteVideo.volume = 1.0;
        await remoteVideo.play();
      } catch (e) { console.warn('autoplay (muted) blocked:', e); }
      updateAudioButtons();
    }
    enableAudioBtn.addEventListener('click', async (e) => {
      e?.stopPropagation?.(); e?.preventDefault?.();
      try { remoteVideo.muted = false; remoteVideo.volume = 1.0; await remoteVideo.play(); }
      catch (err) { console.warn('unmute play blocked:', err); }
      updateAudioButtons();
    });
    disableAudioBtn.addEventListener('click', (e) => {
      e?.stopPropagation?.(); e?.preventDefault?.();
      remoteVideo.muted = true;
      updateAudioButtons();
    });

    /* ---------- Fullscreen ---------- */
    fsBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      try {
        if (!document.fullscreenElement) {
          await (stage.requestFullscreen?.call(stage) || document.documentElement.requestFullscreen());
          fsBtn.textContent = 'Exit fullscreen';
        } else {
          await document.exitFullscreen();
          fsBtn.textContent = 'Fullscreen';
        }
      } catch (err) { console.warn('fullscreen error', err); }
      beginViewportSettle();
    });
    document.addEventListener('fullscreenchange', () => {
      fsBtn.textContent = document.fullscreenElement ? 'Exit fullscreen' : 'Fullscreen';
      beginViewportSetle();
    });

    remoteVideo.addEventListener('loadedmetadata', () => {
      console.log('[MEDIA] remote meta', remoteVideo.videoWidth, 'x', remoteVideo.videoHeight);
      beginViewportSettle();
    });
    remoteVideo.addEventListener('playing', () => {
      console.log('[MEDIA] remote playing (muted=', remoteVideo.muted, ')');
      updateAudioButtons();
      beginViewportSettle();
    });
    remoteVideo.addEventListener('resize', beginViewportSettle);

    /* ---------- Canvas alignment ---------- */
    function containRect(containerW, containerH, contentW, contentH) {
      const scale = Math.min(containerW / (contentW||1), containerH / (contentH||1));
      const w = Math.round(contentW * scale);
      const h = Math.round(contentH * scale);
      const x = Math.floor((containerW - w) / 2);
      const y = Math.floor((containerH - h) / 2);
      return { left:x, top:y, width:w, height:h };
    }
    function alignCanvasToVideo() {
      const stageBox = stage.getBoundingClientRect();
      const videoBox = remoteVideo.getBoundingClientRect();
      const containerW = Math.round(videoBox.width);
      const containerH = Math.round(videoBox.height);
      const vidW = remoteVideo.videoWidth || 1;
      const vidH = remoteVideo.videoHeight || 1;

      const fit = containRect(containerW, containerH, vidW, vidH);
      const leftCSS = Math.round((videoBox.left - stageBox.left) + fit.left);
      const topCSS = Math.round((videoBox.top - stageBox.top) + fit.top);

      faceCanvas.style.left = leftCSS + 'px';
      faceCanvas.style.top = topCSS + 'px';
      faceCanvas.style.width = fit.width + 'px';
      faceCanvas.style.height = fit.height + 'px';

      const dpr = window.devicePixelRatio || 1;
      const needW = Math.max(1, Math.round(fit.width * dpr));
      const needH = Math.max(1, Math.round(fit.height * dpr));
      if (faceCanvas.width !== needW || faceCanvas.height !== needH) {
        faceCanvas.width = needW;
        faceCanvas.height = needH;
      }
      faceCtx.setTransform(1,0,0,1,0,0);
    }
    let settleRAF = 0, settleUntil = 0;
    function beginViewportSettle(durationMs = 1200) {
      settleUntil = performance.now() + durationMs;
      if (settleRAF) return;
      const tick = () => {
        alignCanvasToVideo();
        if (performance.now() < settleUntil) {
          settleRAF = requestAnimationFrame(tick);
        } else {
          cancelAnimationFrame(settleRAF); settleRAF = 0;
          alignCanvasToVideo();
        }
      };
      tick();
    }
    const vpAlign = () => beginViewportSettle();
    ['resize','orientationchange','scroll'].forEach(ev =>
      window.addEventListener(ev, vpAlign, { passive: true })
    );
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', vpAlign, { passive: true });
      window.visualViewport.addEventListener('scroll',  vpAlign, { passive: true });
    }
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) beginViewportSettle();
    });

    /* ---------- Overlay helpers ---------- */
    function setOverlayVisible(v) {
      faceCanvas.style.display = v ? 'block' : 'none';
      if (v) beginViewportSettle();
      else faceCtx.clearRect(0,0, faceCanvas.width, faceCanvas.height);
    }
    function clearOverlayDrawing() {
      try {
        faceCtx.setTransform(1,0,0,1,0,0);
        faceCtx.clearRect(0, 0, faceCanvas.width, faceCanvas.height);
      } catch {}
    }

    /* ---------- MediaPipe Face Landmarker (Receiver) ---------- */
    let faceTask = null;
    let faceLoopRunning = false;
    let faceEnabled = true;         // can be toggled from sender
    let faceWhere = 'receiver';     // 'receiver' | 'sender'
    let faceDC = null;              // optional data channel for landmarks

    async function ensureFaceTask() {
      if (faceTask) return faceTask;
      const vision = await FilesetResolver.forVisionTasks(WASM_DIR);
      faceTask = await FaceLandmarker.createFromOptions(vision, {
        baseOptions: { modelAssetPath: FACE_MODEL_URL, delegate: "GPU" },
        runningMode: "VIDEO",
        numFaces: 1,
        outputFaceBlendshapes: false,
        outputFacialTransformationMatrixes: false
      });
      return faceTask;
    }

    function videoHasFrame(v) {
      return v &&
        v.readyState >= HAVE_CURRENT_DATA &&
        v.videoWidth  > 0 &&
        v.videoHeight > 0;
    }
    function waitForVideoFrame(video) {
      if (videoHasFrame(video)) return Promise.resolve();
      return new Promise((resolve) => {
        const check = () => { if (videoHasFrame(video)) { cleanup(); resolve(); } };
        const cleanup = () => {
          video.removeEventListener('loadedmetadata', check);
          video.removeEventListener('playing', check);
          video.removeEventListener('resize', check);
        };
        video.addEventListener('loadedmetadata', check);
        video.addEventListener('playing', check);
        video.addEventListener('resize', check);
      });
    }

    function drawFaceLandmarks(landmarksArray) {
      if (!faceCanvas.width || !faceCanvas.height) return;
      faceCtx.save();
      faceCtx.clearRect(0,0, faceCanvas.width, faceCanvas.height);
      const utils = new DrawingUtils(faceCtx);
      for (const lm of (landmarksArray || [])) {
        utils.drawConnectors(lm, FaceLandmarker.FACE_LANDMARKS_TESSELATION, { color: "#C0C0C070", lineWidth: 1 });
        utils.drawConnectors(lm, FaceLandmarker.FACE_LANDMARKS_RIGHT_EYE,   { color: "#00FF00", lineWidth: 1 });
        utils.drawConnectors(lm, FaceLandmarker.FACE_LANDMARKS_RIGHT_EYEBROW,{ color:"#00FF00", lineWidth: 1 });
        utils.drawConnectors(lm, FaceLandmarker.FACE_LANDMARKS_LEFT_EYE,    { color: "#00FF00", lineWidth: 1 });
        utils.drawConnectors(lm, FaceLandmarker.FACE_LANDMARKS_LEFT_EYEBROW,{ color:"#00FF00", lineWidth: 1 });
        utils.drawConnectors(lm, FaceLandmarker.FACE_LANDMARKS_FACE_OVAL,   { color: "#00FF00", lineWidth: 1 });
        utils.drawConnectors(lm, FaceLandmarker.FACE_LANDMARKS_LIPS,        { color: "#00FF00", lineWidth: 1 });
        utils.drawConnectors(lm, FaceLandmarker.FACE_LANDMARKS_RIGHT_IRIS,  { color: "#00FF00", lineWidth: 1 });
        utils.drawConnectors(lm, FaceLandmarker.FACE_LANDMARKS_LEFT_IRIS,   { color: "#00FF00", lineWidth: 1 });
      }
      faceCtx.restore();
    }

    /* ========= “No face” detection state ========= */
    const SKEY = (k) => `faceNoFace_${k}`;
    const elsSettings = {
      useTime: document.getElementById('FACE_USE_TIME'),
      missMs: document.getElementById('FACE_MISS_MS'),
      useFrames: document.getElementById('FACE_USE_FRAMES'),
      missFrames: document.getElementById('FACE_MISS_FRAMES'),
    };
    function loadNoFaceSettings() {
      elsSettings.useTime.checked   = (localStorage.getItem(SKEY('useTime')) ?? '1') !== '0';
      elsSettings.missMs.value      = String(Number(localStorage.getItem(SKEY('missMs')) ?? 300) || 300);
      elsSettings.useFrames.checked = (localStorage.getItem(SKEY('useFrames')) ?? '0') === '1';
      elsSettings.missFrames.value  = String(Math.max(1, Number(localStorage.getItem(SKEY('missFrames')) ?? 5) || 5));
    }
    function wireNoFaceSettings() {
      const save = () => {
        localStorage.setItem(SKEY('useTime'),   elsSettings.useTime.checked ? '1':'0');
        localStorage.setItem(SKEY('missMs'),    String(Math.max(50, Number(elsSettings.missMs.value)||300)));
        localStorage.setItem(SKEY('useFrames'), elsSettings.useFrames.checked ? '1':'0');
        localStorage.setItem(SKEY('missFrames'),String(Math.max(1, Number(elsSettings.missFrames.value)||5)));
      };
      Object.values(elsSettings).forEach(el => el.addEventListener('change', save));
      Object.values(elsSettings).forEach(el => el.addEventListener('blur', save));
    }

    const noface = {
      lastSeenFaceTs: 0,     // ms (performance.now-based for precision inside loop)
      missFrames: 0,
      missingOn: false,
      missingStartWallMs: 0, // Date.now (for persisted record)
      hbTimer: 0,            // heartbeat when in sender mode
      hbIntervalMs: 200
    };
    function nowPerf() { return performance.now(); }

    function maybeStartMissing(nowPerfMs) {
      if (noface.missingOn) return;
      noface.missingOn = true;
      noface.missingStartWallMs = Date.now();
      showFaceBanner(noface.missingStartWallMs);
      console.log('[FACE][alert] MISSING ON');
    }
    async function maybeStopMissing() {
      if (!noface.missingOn) return;
      const startAt = new Date(noface.missingStartWallMs || Date.now()).toISOString();
      const endAt   = new Date().toISOString();
      hideFaceBanner();
      noface.missingOn = false;
      noface.missingStartWallMs = 0;
      try {
        await saveAlertRecord({ type: 'face not detected', startAt, endAt, avgScore: 0 });
        document.dispatchEvent(new CustomEvent('alerts:changed', { detail: { action: 'add' } }));
        refreshAlertsBadge().catch(()=>{});
      } catch (e) { console.warn('saveAlertRecord failed', e); }
      console.log('[FACE][alert] MISSING OFF');
    }

    // Call this on each frame (receiver) OR heartbeat tick (sender) with whether a face is present
    function noteFaceObservation(hasFace) {
      const useTime   = elsSettings.useTime.checked;
      const missMs    = Math.max(50, Number(elsSettings.missMs.value) || 300);
      const useFrames = elsSettings.useFrames.checked;
      const pFrames   = Math.max(1, Number(elsSettings.missFrames.value) || 5);

      const t = nowPerf();

      if (hasFace) {
        noface.lastSeenFaceTs = t;
        noface.missFrames = 0;
        // recover if we were in "missing"
        if (noface.missingOn) maybeStopMissing();
        return;
      }

      // no face this tick
      // (only count a "missed frame" if this is a frame/heartbeat step)
      noface.missFrames++;

      const msSince = (noface.lastSeenFaceTs === 0) ? Infinity : (t - noface.lastSeenFaceTs);
      const timeRule   = useTime   && (msSince >= missMs);
      const framesRule = useFrames && (noface.missFrames >= pFrames);

      if ((timeRule || framesRule)) {
        maybeStartMissing(t);
      }
    }

    function startSenderHeartbeat() {
      if (noface.hbTimer) return;
      const tick = () => {
        // If we didn't receive a face message during this interval, count a miss
        noteFaceObservation(false);
        noface.hbTimer = setTimeout(tick, noface.hbIntervalMs);
      };
      noface.hbTimer = setTimeout(tick, noface.hbIntervalMs);
    }
    function stopSenderHeartbeat() {
      if (noface.hbTimer) { clearTimeout(noface.hbTimer); noface.hbTimer = 0; }
    }

    /* ========= Face inference loop (receiver) ========= */
    async function startReceiverFaceLoop() {
      if (faceLoopRunning) return;
      await ensureFaceTask();
      await waitForVideoFrame(remoteVideo);

      faceLoopRunning = true;
      console.log('[FACE][receiver] inference START (receiver)');

      const useRVFC = 'requestVideoFrameCallback' in remoteVideo;

      const onFrame = () => {
        if (!faceLoopRunning || !faceEnabled || faceWhere !== 'receiver') {
          console.log('[FACE][receiver] inference STOP (receiver)');
          return;
        }

        if (!videoHasFrame(remoteVideo)) {
          faceCtx.clearRect(0, 0, faceCanvas.width, faceCanvas.height);
          noteFaceObservation(false);
          scheduleNext();
          return;
        }

        try {
          const ts = performance.now();
          const result = faceTask.detectForVideo(remoteVideo, ts);
          const hasFace = !!(result?.faceLandmarks?.length);
          noteFaceObservation(hasFace);

          if (hasFace) {
            drawFaceLandmarks(result.faceLandmarks);
            if (faceDC?.readyState === 'open') {
              faceDC.send(JSON.stringify({ type:'face', landmarks: result.faceLandmarks, ts }));
            }
          } else {
            faceCtx.clearRect(0,0, faceCanvas.width, faceCanvas.height);
          }
        } catch (err) {
          console.warn('[FACE][receiver] detect error (retrying next frame)', err);
        } finally {
          scheduleNext();
        }
      };

      const scheduleNext = () => {
        if (useRVFC) remoteVideo.requestVideoFrameCallback(onFrame);
        else requestAnimationFrame(onFrame);
      };
      scheduleNext();
    }

    function stopReceiverFaceLoop() {
      faceLoopRunning = false;
      faceCtx.clearRect(0,0, faceCanvas.width, faceCanvas.height);
    }

    function applyFaceMode() {
      setOverlayVisible(faceEnabled);
      if (!faceEnabled) {
        stopReceiverFaceLoop();
        stopSenderHeartbeat();
        maybeStopMissing();
        return;
      }
      if (faceWhere === 'receiver') {
        stopSenderHeartbeat();
        startReceiverFaceLoop();
      } else {
        stopReceiverFaceLoop(); // sender mode: draw what we receive
        // Start a heartbeat to count “missed frames” & time when no DC messages arrive
        startSenderHeartbeat();
      }
    }

    /* ---------- Hook up ReceiverCore ---------- */
    const core = new ReceiverCore({
      wsEndpoint: WS_ENDPOINT,
      room,
      onStatus: showStatus,

      onStream: (stream, track) => {
        if (remoteVideo.srcObject !== stream) {
          remoteVideo.srcObject = stream;
          tryStartMuted();
          attachStreamEndHandlers(stream);
        }
        console.log('[TRACK][receiver]', track.kind);
        beginViewportSettle();
      },

      onIceState: (state) => {
        if (state === 'connected' || state === 'completed') {
          showStatus('Connected');
        } else if (state === 'failed') {
          clearOverlayDrawing();
          showStatus('ICE: failed – retrying…');
        } else if (state === 'disconnected') {
          clearOverlayDrawing();
          showStatus('ICE: disconnected');
        } else if (state === 'closed') {
          clearOverlayDrawing();
          showStatus('ICE: closed');
        } else {
          showStatus('ICE: ' + state);
        }
      },

      onCreatePC: (pc) => {
        // Use 'pose' DC (your sender already uses this for AI msgs)
        const ch = pc.createDataChannel('pose');
        ch.onopen  = () => console.log('[DC][receiver] pose DC open');
        ch.onclose = () => console.log('[DC][receiver] pose DC close');
        ch.onerror = (e) => console.warn('[DC][receiver] pose DC error', e);
        ch.onmessage = (ev) => {
          try {
            const msg = JSON.parse(ev.data);

            if (msg.type === 'ai-modes' && msg.face) {
              faceEnabled = !!msg.face.enabled;
              faceWhere   = msg.face.where || 'sender';
              applyFaceMode();
            } else if (msg.type === 'face-mode') {
              faceEnabled = !!msg.enabled;
              faceWhere   = msg.where || 'sender';
              applyFaceMode();
            } else if (msg.type === 'face') {
              // We saw a face this tick (sender provided landmarks)
              noteFaceObservation(true);
              if (faceEnabled && faceWhere === 'sender') drawFaceLandmarks(msg.landmarks);
            }
          } catch {}
        };
        // store DC so we can optionally send from receiver
        faceDC = ch;
      },
    });

    // Clear drawings on common video stoppage states
    ['pause','ended','emptied','stalled','suspend','waiting'].forEach((ev) => {
      remoteVideo.addEventListener(ev, () => { clearOverlayDrawing(); noteFaceObservation(false); }, { passive: true });
    });

    function attachStreamEndHandlers(stream) {
      if (!stream) return;
      stream.getVideoTracks().forEach((t) => {
        t.addEventListener('ended',  () => { clearOverlayDrawing(); noteFaceObservation(false); });
        t.addEventListener('mute',   () => { clearOverlayDrawing(); noteFaceObservation(false); });
      });
      stream.addEventListener('removetrack', (e) => {
        if (e.track?.kind === 'video') { clearOverlayDrawing(); noteFaceObservation(false); }
      });
    }

    window.addEventListener('beforeunload', () => {
      try { core?.stop?.(); } catch {}
      if (hideStatusTimer) clearTimeout(hideStatusTimer);
      stopReceiverFaceLoop();
      stopSenderHeartbeat();
      maybeStopMissing();
    });

    // Go!
    core.start();
    setOverlayVisible(true); // show canvas immediately for alignment

    // tiny typo guard used in logs
    function beginViewportSetle(){ beginViewportSettle(); }

    /* ========= Boot ========= */
    (function boot(){
      loadNoFaceSettings();
      wireNoFaceSettings();
      setupFaceBanner();
      refreshAlertsBadge();

      showStatus('Ready.');
      applyFaceMode(); // start appropriate loop/heartbeat
    })();
  </script>
</body>
</html>
