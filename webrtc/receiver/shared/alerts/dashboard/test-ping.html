<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ping Test</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; display:grid; place-items:center; min-height:100svh; margin:0; }
    .card { padding:20px; border-radius:12px; border:1px solid #ccc; max-width:460px; text-align:center; }
    button { padding:10px 14px; border-radius:10px; border:1px solid #888; background:#f5f5f5; cursor:pointer; }
    button:active { transform: scale(.98); }
    .row { display:flex; gap:10px; justify-content:center; align-items:center; margin-top:10px; flex-wrap:wrap; }
    input[type="range"] { width: 180px; }
    small { color:#666; display:block; margin-top:8px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Ping Test</h1>
    <p>Tap “Enable Sound” once (required on mobile), then hit “Ping”.</p>

    <div class="row">
      <button id="btnEnable">🔓 Enable Sound</button>
      <button id="btnPing">🔔 Ping</button>
    </div>

    <div class="row">
      <label>Volume <input id="vol" type="range" min="0" max="100" value="60"></label>
      <label>Freq <input id="freq" type="range" min="220" max="1760" value="880"></label>
    </div>

    <small id="status">AudioContext: not created</small>
  </div>

  <script>
    let audioCtx = null;
    let lastPingAt = 0;

    const $ = (id) => document.getElementById(id);
    const btnEnable = $('btnEnable');
    const btnPing   = $('btnPing');
    const vol       = $('vol');
    const freq      = $('freq');
    const statusEl  = $('status');

    function updateStatus() {
      const s = audioCtx
        ? `AudioContext: ${audioCtx.state}`
        : 'AudioContext: not created';
      statusEl.textContent = s;
    }

    async function unlockAudio() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') await audioCtx.resume();
      } catch (err) {
        console.warn('Failed to unlock/resume audio context:', err);
      }
      updateStatus();
    }

    function playPing() {
      // Create context lazily if the user has already interacted
      if (!audioCtx && (navigator.userActivation?.hasBeenActive || document.hasFocus())) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (!audioCtx || audioCtx.state !== 'running') {
        updateStatus();
        return; // still locked or not enabled
      }

      // Rate-limit (avoid machine-gun pings)
      const nowMs = performance.now();
      if (nowMs - lastPingAt < 200) return;
      lastPingAt = nowMs;

      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();

      o.type = 'sine';
      o.frequency.value = Number(freq.value || 880);

      // Volume in [0, 1]
      const gainTarget = 0.001 + (Number(vol.value || 60) / 100) * 0.12;

      g.gain.value = 0.0001; // start very low to avoid click
      o.connect(g).connect(audioCtx.destination);

      const t0 = audioCtx.currentTime;
      o.start(t0);

      // Short envelope for a crisp ping (~140ms)
      try {
        g.gain.exponentialRampToValueAtTime(gainTarget, t0 + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001,     t0 + 0.14);
      } catch {
        // Safari sometimes dislikes exponential from 0; fall back to linear
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.linearRampToValueAtTime(gainTarget, t0 + 0.02);
        g.gain.linearRampToValueAtTime(0.0001, t0 + 0.14);
      }
      o.stop(t0 + 0.16);
    }

    // Wire up UI
    btnEnable.addEventListener('click', unlockAudio);
    btnPing.addEventListener('click', playPing);

    // Also try to unlock on first pointer interaction (helps on iOS)
    window.addEventListener('pointerdown', unlockAudio, { once: true, passive: true });

    updateStatus();
  </script>
</body>
</html>
