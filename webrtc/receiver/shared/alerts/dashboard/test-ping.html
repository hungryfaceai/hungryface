<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Naptio Alert Tone – Test Page</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root { color-scheme: dark; }
  html, body { margin:0; padding:0; background:#000; color:#fff; font-family:system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  .wrap { max-width:720px; margin:32px auto; padding:16px; }
  h1 { margin:0 0 8px; font-size:1.25rem; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:12px 0; }
  button, input[type="checkbox"] { cursor:pointer; }
  button { background:#1b1b1b; color:#fff; border:1px solid #333; padding:10px 14px; border-radius:10px; }
  button:hover { background:#232323; }
  .muted { opacity:.6 }
  .meta { font-size:.9rem; opacity:.8; }
  #log { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background:#0b0b0b; border:1px solid #141414; border-radius:10px; padding:10px; height:160px; overflow:auto; }
  .pill { display:inline-block; padding:.2rem .5rem; border:1px solid #444; border-radius:999px; font-size:.8rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Naptio Alert Tone – Test</h1>
  <p class="meta">Three-pip chirp (1.7→2.6&nbsp;kHz) with 250&nbsp;ms rate-limit. Use buttons below to trigger.</p>

  <div class="row">
    <button id="btnPlay">Play Alert</button>
    <button id="btnBurst">Burst x10 (100&nbsp;ms)</button>
    <label class="row"><input id="chkEnabled" type="checkbox" checked> <span>soundsEnabled</span></label>
    <span class="pill">AudioContext: <span id="ctxState">—</span></span>
    <span class="pill">lastPingAt: <span id="lastPingAt">—</span></span>
  </div>

  <div id="log" aria-live="polite"></div>
</div>

<script>
  // ---- Test harness state ----
  let soundsEnabled = true;
  let audioCtx = null;
  let lastPingAt = -Infinity;

  const $ = (sel) => document.querySelector(sel);
  const logEl = $("#log");
  const ctxStateEl = $("#ctxState");
  const lastPingEl = $("#lastPingAt");

  function log(msg) {
    const t = new Date().toLocaleTimeString();
    logEl.insertAdjacentHTML("afterbegin", `[${t}] ${msg}<br/>`);
  }
  function tickUI() {
    ctxStateEl.textContent = audioCtx ? audioCtx.state : "none";
    lastPingEl.textContent = Number.isFinite(lastPingAt) ? `${Math.round(lastPingAt)} ms` : "—";
  }

  // ---- Your alert function (unchanged) ----
  async function playAlert() {
    if (!soundsEnabled) { log("blocked: soundsEnabled=false"); return; }
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') { try { await audioCtx.resume(); } catch(e) {} }
    if (audioCtx.state !== 'running') { log("blocked: AudioContext not running"); tickUI(); return; }

    const now = performance.now();
    if (now - lastPingAt < 250) { log(`rate-limited (${Math.round(now - lastPingAt)} ms since last)`); return; }
    lastPingAt = now;

    const t0 = audioCtx.currentTime;
    const pip = (start, dur = 0.12) => {
      // Chirp 1.7 kHz -> 2.6 kHz
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(1700, start);
      o.frequency.exponentialRampToValueAtTime(2600, start + dur);

      // Envelope: very fast attack, quick decay
      g.gain.setValueAtTime(0.0001, start);
      g.gain.exponentialRampToValueAtTime(0.09, start + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, start + dur);

      o.connect(g).connect(audioCtx.destination);
      o.start(start);
      o.stop(start + dur + 0.02);
    };

    // 3 pips: t0, t0+0.18s, t0+0.36s
    pip(t0);
    pip(t0 + 0.18);
    pip(t0 + 0.36);

    log("played: 3-pip chirp");
    tickUI();
  }

  // ---- UI wiring ----
  $("#btnPlay").addEventListener("click", async () => {
    // First interaction often needed to unlock audio on iOS
    await playAlert();
  });

  $("#btnBurst").addEventListener("click", async () => {
    // Fire 10 attempts 100ms apart to demonstrate the 250ms rate-limit
    for (let i = 0; i < 10; i++) {
      setTimeout(playAlert, i * 100);
    }
  });

  $("#chkEnabled").addEventListener("change", (e) => {
    soundsEnabled = e.target.checked;
    $("#btnPlay").classList.toggle("muted", !soundsEnabled);
    $("#btnBurst").classList.toggle("muted", !soundsEnabled);
    log(`soundsEnabled=${soundsEnabled}`);
  });

  // Keep context state label fresh
  setInterval(() => {
    if (audioCtx) ctxStateEl.textContent = audioCtx.state;
  }, 300);

  tickUI();
</script>
</body>
</html>
