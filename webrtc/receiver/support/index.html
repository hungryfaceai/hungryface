<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Email Naptio Support</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin:0; height:100%; background:#000; color:#eee; font-family:-apple-system, system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
    .wrap { min-height:100dvh; display:grid; place-items:center; padding:24px; }
    .card { width:min(720px, 92vw); background:#111; border:1px solid #222; border-radius:16px; padding:18px; box-shadow:0 10px 30px rgba(0,0,0,.35); }
    h1 { font-size:clamp(18px,3vw,22px); margin:4px 0 12px; }
    p.sub { color:#a8a8a8; margin:0 0 12px; }
    .row { display:grid; gap:8px; margin:14px 0; }
    label { font-size:13px; color:#bdbdbd; }
    input[type="text"], textarea { width:100%; box-sizing:border-box; background:#161616; color:#eee; border:1px solid #2a2a2a; border-radius:12px; padding:11px 12px; font-size:15px; outline:none; }
    input[type="text"]:focus, textarea:focus { border-color:#3a3a3a; box-shadow:0 0 0 2px rgba(255,255,255,.05) inset; }
    textarea { min-height:140px; resize:vertical; }
    .drop { border:1.5px dashed #2d2d2d; background:#121212; border-radius:12px; padding:14px; text-align:center; transition:background .15s, border-color .15s; }
    .drop.over { background:#151515; border-color:#444; }
    .actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; }
    .btn { appearance:none; border:1px solid #2a2a2a; background:#1a1a1a; color:#eee; padding:12px 16px; border-radius:999px; font-weight:600; cursor:pointer; }
    .btn.primary { background:#2b7cff; border-color:transparent; color:#fff; box-shadow:0 6px 16px rgba(0,0,0,.25); }
    .btn:disabled { opacity:.6; cursor:not-allowed; }
    .spacer { flex:1 1 auto; }
    .small { font-size:13px; color:#bbb; margin-top:10px; }
    .error { color:#ff8a80; font-size:13px; display:none; margin-top:8px; }
    .error.show { display:block; }
    .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
    .chip { display:inline-flex; align-items:center; gap:8px; background:#1a1a1a; border:1px solid #2a2a2a; border-radius:999px; padding:6px 10px; font-size:13px; }
    .chip button { border:none; background:none; color:#bbb; font-size:16px; cursor:pointer; }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card" role="form" aria-labelledby="title">
      <h1 id="title">Email Naptio Support</h1>
      <p class="sub">We’ll route your message to the right person.</p>

      <div class="row">
        <label for="subject">Subject</label>
        <input id="subject" type="text" placeholder="Brief summary (e.g., Pairing issue)" />
      </div>

      <div class="row">
        <label for="message">Message</label>
        <textarea id="message" placeholder="Tell us what’s happening…" required></textarea>
      </div>

      <div class="row" id="attachRow">
        <label for="files">Attachments (optional)</label>
        <div id="drop" class="drop" tabindex="0">
          <p>Drag & drop files here, or <button type="button" class="btn">browse</button></p>
          <input id="files" type="file" multiple hidden />
          <div class="chips" id="chips"></div>
        </div>
      </div>

      <p class="error" id="err"></p>

      <div class="actions">
        <button class="btn primary" id="sendShare">Send via Mail app</button>
        <button class="btn" id="sendMailto">Open email composer</button>
        <span class="spacer"></span>
        <button class="btn" id="copyAddr" title="Copy address">support@naptio.com</button>
      </div>
      <p class="small">If your email app opens, review the draft and press Send.</p>
    </section>
  </main>

  <script>
  (function(){
    const TO = 'support@naptio.com';
    const subjectEl = document.getElementById('subject');
    const messageEl = document.getElementById('message');
    const errEl     = document.getElementById('err');

    // Attachments (only used when the platform supports share-with-files)
    const drop = document.getElementById('drop');
    const filesInput = document.getElementById('files');
    const chips = document.getElementById('chips');
    const browseBtn = drop.querySelector('button');

    let canShareFiles = false;
    try {
      const test = new File([new Blob(['x'], {type:'text/plain'})], 'x.txt', {type:'text/plain'});
      canShareFiles = !!(navigator.canShare && navigator.canShare({ files: [test] }));
    } catch { canShareFiles = false; }

    if (!canShareFiles) {
      // hide the whole attachments row if we can't hand off files
      document.getElementById('attachRow').style.display = 'none';
    }

    browseBtn.addEventListener('click', () => filesInput.click());
    filesInput.addEventListener('change', () => { renderChips(); });
    ['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, (e)=>{ e.preventDefault(); drop.classList.add('over'); }));
    ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, (e)=>{ e.preventDefault(); drop.classList.remove('over'); }));
    drop.addEventListener('drop', (e) => {
      const files = [...(e.dataTransfer?.files || [])];
      if (!files.length) return;
      const current = [...filesInput.files];
      const dt = new DataTransfer();
      [...current, ...files].slice(0, 5).forEach(f => dt.items.add(f)); // simple cap of 5 files
      filesInput.files = dt.files;
      renderChips();
    });

    function renderChips(){
      chips.innerHTML = '';
      [...filesInput.files].forEach((f, i) => {
        const chip = document.createElement('span'); chip.className='chip';
        chip.innerHTML = `<span>${f.name} • ${fmtBytes(f.size)}</span>`;
        const x = document.createElement('button'); x.type='button'; x.setAttribute('aria-label','Remove'); x.textContent='×';
        x.onclick = () => {
          const arr = [...filesInput.files]; arr.splice(i,1);
          const dt = new DataTransfer(); arr.forEach(ff => dt.items.add(ff));
          filesInput.files = dt.files; renderChips();
        };
        chip.appendChild(x);
        chips.appendChild(chip);
      });
    }

    const sendShareBtn  = document.getElementById('sendShare');
    const sendMailtoBtn = document.getElementById('sendMailto');
    const copyAddrBtn   = document.getElementById('copyAddr');

    messageEl.addEventListener('input', validate);
    validate();

    sendShareBtn.addEventListener('click', async () => {
      if (!validate()) return;
      // Prefer native share flow (attachments only when supported)
      try {
        const data = { title: composeSubject(), text: composeBody() };
        if (canShareFiles && filesInput.files.length) data.files = [...filesInput.files];
        if (navigator.share) await navigator.share(data);
        else openMailto(); // fallback if share API missing
      } catch {
        // user canceled or share failed; fallback to mailto
        openMailto();
      }
    });

    sendMailtoBtn.addEventListener('click', () => { if (validate()) openMailto(); });

    copyAddrBtn.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(TO); copyAddrBtn.textContent = 'Copied!'; setTimeout(()=>copyAddrBtn.textContent = TO, 1200); } catch {}
    });

    function openMailto(){
      // Note: mailto: doesn’t support attaching files
      const url = `mailto:${encodeURIComponent(TO)}?subject=${encodeURIComponent(composeSubject())}&body=${encodeURIComponent(composeBody())}`;
      window.location.href = url;
    }

    function composeSubject(){ return subjectEl.value.trim() || 'Support request'; }
    function composeBody(){ return messageEl.value.trim(); }

    function validate(){
      errEl.classList.remove('show'); errEl.textContent = '';
      const ok = messageEl.value.trim().length > 0;
      sendShareBtn.disabled = !ok;
      sendMailtoBtn.disabled = !ok;
      return ok;
    }

    function fmtBytes(n){ if (n<1024) return n+' B'; const u=['KB','MB','GB']; let i=-1; do{ n/=1024; i++; } while(n>=1024&&i<u.length-1); return n.toFixed(1)+' '+u[i]; }
  })();
  </script>
</body>
</html>
