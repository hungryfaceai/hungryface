<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Baby Monitor – Cry Detector</title>
  <link rel="icon" href="data:," />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>

  <!-- Shared sidebar stylesheet (same as pose receiver) -->
  <link rel="stylesheet" href="/hungryface/webrtc/receiver/shared/sidebar.css" />

  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0; height: 100%;
      background: #000; color: #fff;
      font-family: -apple-system, system-ui, Segoe UI, Roboto, sans-serif;
      overflow: hidden;
    }

    /* Fullscreen wrapper (matches pose receiver) */
    #stage {
      position: fixed; inset: 0;
      width: 100vw; height: 100vh;   /* fallback */
      width: 100dvw; height: 100dvh; /* dynamic viewport */
      width: 100svw; height: 100svh; /* small viewport (iOS URL bar safe) */
      z-index: 1; background: #000;
      display: grid; place-items: center;
      padding: 16px; box-sizing: border-box;
    }

    /* Hidden video just to host the remote stream’s audio track */
    #remote {
      position: absolute; width: 1px; height: 1px; left: -99999px; top: -99999px;
    }

    .panel {
      width: min(100%, 980px);
      background: #0b0b0b;
      border: 1px solid #141414;
      border-radius: 14px;
      padding: 16px;
      box-sizing: border-box;
      z-index: 2;
    }

    .panel header h1 { margin: 0 0 2px 0; font-size: clamp(18px, 3vw, 22px); }
    .panel header .sub { margin: 0 0 12px 0; color: #bbb; font-size: 14px; }

    .status { color: #ddd; font-size: 14px; padding: 4px 0; white-space: pre-line; }

    details.advanced {
      border: 1px solid #222; border-radius: 12px; padding: 8px 12px; margin-top: 10px;
    }
    details.advanced summary { cursor: pointer; font-weight: 600; }

    .grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; margin-top: 10px; }
    .grid-adv { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; margin-top: 10px; }
    @media (max-width: 720px) {
      .grid, .grid-adv { grid-template-columns: repeat(2, minmax(0,1fr)); }
    }
    @media (max-width: 500px) {
      .grid, .grid-adv { grid-template-columns: 1fr; }
    }

    label { display: grid; gap: 6px; font-size: 14px; color: #ddd; }
    label > span { color: #bbb; }
    input[type="number"], input[type="url"], textarea {
      width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #222;
      background:#0b0b0b; color:#ddd; font-size: 14px; box-sizing: border-box;
    }
    textarea { min-height: 56px; font-family: inherit; resize: vertical; }

    .muted { color: #aaa; }
    .small { font-size: 12px; }

    /* Plots */
    section.plot { margin-top: 14px; }
    canvas { display: block; width: 100%; height: 160px; background: #0a0a0a; border-radius: 10px; }
    .legend { margin-top: 6px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 13px; color:#ccc; }
    .key { display:inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
    .key.raw     { background: #60a5fa; }   /* blue */
    .key.sm      { background: #ef4444; }   /* red */
    .key.thr-on  { background: #f97316; }   /* orange */
    .key.thr-off { background: #fb923c; }   /* light orange */

    .toggles { margin-top: 8px; display: flex; gap: 12px; align-items: center; font-size: 13px; color:#ddd; }
    .peak { margin-top: 6px; font-size: 13px; color:#ddd; }

    /* Overlay status (like pose page) */
    .overlay {
      position: fixed; inset: 0; display: flex;
      align-items: center; justify-content: center;
      pointer-events: none; z-index: 5;
    }
    .overlay.hidden { display: none; }
    .overlay .status {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      color: #ddd; font-size: 14px; padding: 10px 14px; border-radius: 12px;
      text-align: center; white-space: pre-line; max-width: 90vw;
    }

    /* Background turns red while alert is active */
    body.alert #stage { background: #1a0000; }

    /* Fixed control bar — exactly like pose */
    #controls {
      position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
      display: flex; align-items: center; gap: 12px; z-index: 6;
    }
    .btn {
      padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.6);
      background: transparent; color: #fff; font-size: 16px; font-weight: 600;
      cursor: pointer; box-shadow: none; text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    }
    .btn:active { transform: scale(0.99); }
    #enableAudioBtn, #disableAudioBtn { display: none; }
  </style>
</head>
<body>
  <!-- Inject the shared sidebar markup + behavior (same snippet as pose page) -->
  <script type="module">
    (async () => {

  </script>

  <!-- Bottom controls (exactly like pose) -->
  <div id="controls">
    <button id="enableAudioBtn" class="btn" type="button">Enable audio</button>

    <button id="fsBtn" class="btn" type="button">Fullscreen</button>

  <div id="stage">
    <video id="remote" autoplay playsinline></video>

    <div class="panel">
      <header>

      <details class="advanced">

        <label class="wide" style="display:block; margin-top:10px;">

        </label>
        <p class="muted small">Separate multiple classes with semicolons (;) or new lines.</p>

        <div class="grid-adv">
          <label>
            <span>ON extra (adds to THRESH)</span>

      </details>

      <!-- Cry score chart -->
      <section class="plot">
        <canvas id="chart" height="160"></canvas>
        <div class="legend">
          <span class="key raw"></span> score
          <span class="key sm"></span> smoothed
          <span class="key thr-on"></span> thresh (ON)
          <span class="key thr-off"></span> thresh (OFF)
        </div>
      </section>

      <!-- Power spectrum chart -->
      <section class="plot">
        <canvas id="chartSpectrum" height="160"></canvas>
        <div class="legend">
          <span class="key raw"></span> spectrum (raw)
          <span class="key sm"></span> spectrum (smoothed)
        </div>
        <div class="toggles">
          <label><input type="checkbox" id="showRawSpec" checked> Show raw spectrum</label>
          <label><input type="checkbox" id="showSmSpec" checked> Show smoothed spectrum</label>
        </div>
        <div id="peakReadout" class="peak">Peak: —</div>
      </section>
    </div>
  </div>

  <!-- Overlay status (same feel as pose page) -->
  <div id="overlay" class="overlay"><div id="overlayStatus" class="status">Idle</div></div>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

  <!-- App (ReceiverCore + MediaPipe Tasks Audio) -->
  <script type="module">
    import { ReceiverCore } from "/hungryface/webrtc/receiver/shared/receiver-core.js";

    // MediaPipe Tasks Audio
    const AUDIO_PKG_URL = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-audio@0.10.0";
    const AudioMod = await import(AUDIO_PKG_URL).catch(e => { console.error('[CRY] MP audio import error', e); return null; });
    const AudioClassifier = AudioMod?.AudioClassifier;
    const FilesetResolver = AudioMod?.FilesetResolver;

    /* ---------- Constants ---------- */
    const WS_ENDPOINT = "wss://signaling-server-f5gu.onrender.com/ws";
    const room = new URLSearchParams(location.search).get("room") || "Baby";
    const STATUS_HIDE_AFTER_CONNECTED_MS = 10000;

    /* ---------- DOM ---------- */
    const stage = document.getElementById('stage');
    const remoteVideo = document.getElementById('remote');
    const enableAudioBtn = document.getElementById('enableAudioBtn');
    const disableAudioBtn = document.getElementById('disableAudioBtn');
    const enableMicBtn = document.getElementById('enableMicBtn'); // NEW
    const fsBtn = document.getElementById('fsBtn');

    const els = {
      status:   document.getElementById('status'),
      overlay:  document.getElementById('overlay'),
      overlayStatus: document.getElementById('overlayStatus'),
      whereLbl: document.getElementById('whereLbl'),
      chartCanvas: document.getElementById('chart'),
      chartSpectrumCanvas: document.getElementById('chartSpectrum'),
      showRawSpec: document.getElementById('showRawSpec'),
      showSmSpec:  document.getElementById('showSmSpec'),
      peakReadout: document.getElementById('peakReadout'),
      inputs: {
        SR_TARGET:      document.getElementById('SR_TARGET'),
        FRAME_LEN_S:    document.getElementById('FRAME_LEN_S'),
        HOP_S:          document.getElementById('HOP_S'),
        SMOOTH_WIN:     document.getElementById('SMOOTH_WIN'),
        THRESH:         document.getElementById('THRESH'),
        PLOT_WINDOW_S:  document.getElementById('PLOT_WINDOW_S'),
        INCLUDE_CLASSES:document.getElementById('INCLUDE_CLASSES'),
        ALERT_ON_EXTRA: document.getElementById('ALERT_ON_EXTRA'),
        ALERT_OFF_DELTA:document.getElementById('ALERT_OFF_DELTA'),
        ALERT_HOLD_MS:  document.getElementById('ALERT_HOLD_MS'),
      }
    };

    function setStatus(msg) {
      els.status.textContent = msg;
      els.overlayStatus.textContent = msg;
      console.log('[CRY][status]', msg);
    }
    function showOverlay(show) { els.overlay.classList.toggle('hidden', !show); }
    function setWhereLabel(where) {
      const label = where === 'receiver' ? 'RECEIVER' : (where === 'sender' ? 'SENDER' : '—');
      els.whereLbl.textContent = label;
      console.log('[CRY] where =', label);
    }

    /* ---------- Audio mode state (mirrors pose logic) ---------- */
    let audioDC = null;
    let audioEnabled = false;
    let audioWhere = 'sender';          // 'sender' | 'receiver'

    /* ---------- App state ---------- */
    const state = {
      running: true,                    // auto-on (no Start/Stop UI)
      usingMic: false,
      audioCtx: null,
      streamLocalMic: null,
      streamRemote: null,
      sourceNode: null,
      sinkNode: null,
      processor: null,
      analyser: null,
      ring16k: new Float32Array(0),
      lastPos: 0,
      timesSec: [],
      timesMs: [],
      cryRaw: [],
      crySm: [],
      chart: null,
      spectrumChart: null,
      specFreqs: [],
      specRawDb: [],
      specSmDb: [],
      specStartIdx: 0,
      specEndIdx: 0,
      specBinCountAll: 0,
      specLastUpdate: 0,
      peakFreq: null,
      peakDb: null,
      alertOn: false,
      alertUntilMs: 0,
      audioTask: null,
      audioTaskPromise: null,
      spectrumRaf: 0,
    };

    // Guard to avoid redundant re-initialization in applyAudioMode
    let _activeAudio = { enabled: null, where: null };

    /* ---------- Small helpers ---------- */
    const RAW_COLOR = '#60a5fa';
    const SMOOTH_COLOR = '#ef4444';
    const THRESH_ON_COLOR = '#f97316';
    const THRESH_OFF_COLOR = '#fb923c';

    function splitClasses(text){ return String(text||'').split(/[;\n\r]+/).map(s=>s.trim()).filter(Boolean); }
    function getParams() {
      return {
        SR_TARGET: parseInt(els.inputs.SR_TARGET?.value, 10) || 16000,
        FRAME_LEN_S: parseFloat(els.inputs.FRAME_LEN_S?.value) || 0.96,
        HOP_S: parseFloat(els.inputs.HOP_S?.value) || 0.48,
        SMOOTH_WIN: Math.max(1, parseInt(els.inputs.SMOOTH_WIN?.value, 10) || 5),
        THRESH: parseFloat(els.inputs.THRESH?.value) || 0.15,
        PLOT_WINDOW_S: Math.max(5, parseFloat(els.inputs.PLOT_WINDOW_S?.value) || 60),
        INCLUDE_CLASSES: splitClasses(els.inputs.INCLUDE_CLASSES?.value || "Baby cry, infant cry"),
        //INCLUDE_CLASSES: ['Conversation'], //debug bm 28 aug 2025 - https://chatgpt.com/c/68b06d4c-a170-8324-b1bd-cf61dc1aca63
        ALERT_ON_EXTRA: parseFloat(els.inputs.ALERT_ON_EXTRA?.value ?? '0') || 0,
        ALERT_OFF_DELTA: Math.max(0, parseFloat(els.inputs.ALERT_OFF_DELTA?.value ?? '0.1') || 0.1),
        ALERT_HOLD_MS: Math.max(0, parseInt(els.inputs.ALERT_HOLD_MS?.value, 10) || 3000),
      };
    }

    //helper functions “score-with-details”
    function categoryLabel(c) {
      return (c.displayName || c.categoryName || String(c.index) || '').trim();
    }
    function getCryScoreWithDetails(categories, includeList) {
      const needles = (includeList || []).map(s => s.trim().toLowerCase()).filter(Boolean);
      let sum = 0;
      const matched = [];
      for (const c of (categories || [])) {
        const name = categoryLabel(c);
        const score = c?.score ?? 0;
        const L = name.toLowerCase();
        if (needles.some(n => L.includes(n))) {
          sum += score;
          matched.push({ name, score });
        }
      }
      matched.sort((a,b) => (b.score||0) - (a.score||0));
      return { score: sum, matched };
    }
    function computeAndLogScore(categories, includeList, srcLabel = 'DC') {
      const { score, matched } = getCryScoreWithDetails(categories, includeList);
      console.log(
        `[CRY][score][${srcLabel}] include=`,
        includeList,
        '| matched=',
        matched.length
          ? matched.map(m => `${m.name}:${m.score.toFixed(3)}`).join(', ')
          : '(none)',
        '| sum=',
        score.toFixed(3)
      );
      return score;
    }

    function concatFloat32(a,b){const out=new Float32Array(a.length+b.length);out.set(a,0);out.set(b,a.length);return out;}
    function resampleLinear(x, fromSr, toSr){
      if (fromSr === toSr) return x;
      const ratio = toSr / fromSr;
      const n = Math.max(1, Math.round(x.length * ratio));
      const out = new Float32Array(n);
      const dx = (x.length - 1) / (n - 1);
      for (let i = 0; i < n; i++) {
        const pos = i * dx, i0 = Math.floor(pos), i1 = Math.min(i0+1, x.length-1), frac = pos - i0;
        out[i] = x[i0]*(1-frac) + x[i1]*frac;
      }
      return out;
    }
    function movingAvgTail(arr, k){ if(!arr.length) return 0; const s=Math.max(0,arr.length-k); let sum=0; for(let i=s;i<arr.length;i++) sum+=arr[i]; return sum/(arr.length-s); }
    function formatClock(ms){ return new Date(ms).toLocaleTimeString(undefined,{hour12:false}); }

    /* ---------- Charts ---------- */
    function setupChart(){
      if (state.chart) state.chart.destroy();
      console.log('[CRY][chart] init');
      const ctx = els.chartCanvas.getContext('2d');
      state.chart = new Chart(ctx, {
        type: 'line',
        data: { labels: [], datasets: [
          { label: 'cry_score (raw)', data: [], borderColor: RAW_COLOR, borderWidth: 2, pointRadius: 0, tension: 0.15 },
          { label: 'cry_score (smoothed)', data: [], borderColor: SMOOTH_COLOR, borderWidth: 2, pointRadius: 0, tension: 0.15 },
          { label: 'threshold (ON)', data: [], borderColor: THRESH_ON_COLOR, borderWidth: 1, pointRadius: 0, borderDash: [6,4] },
          { label: 'threshold (OFF)', data: [], borderColor: THRESH_OFF_COLOR, borderWidth: 1, pointRadius: 0, borderDash: [2,2] }
        ] },
        options: {
          animation: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { title: { display: true, text: 'Time' } },
            y: { title: { display: true, text: 'Score' }, suggestedMin: 0, suggestedMax: 1.0 }
          },
          elements: { line: { fill: false } }
        }
      });
    }

    const spectrumOverlay = {
      id: 'spectrumOverlay',
      afterDatasetsDraw(chart) {
        const { ctx, chartArea, scales } = chart;
        if (!chart.$peakFreq) return;
        const x1 = scales.x.getPixelForValue(300);
        const x2 = scales.x.getPixelForValue(3000);
        ctx.save();
        ctx.fillStyle = 'rgba(239, 68, 68, 0.08)';
        const left = Math.min(x1, x2);
        const width = Math.abs(x2 - x1);
        ctx.fillRect(left, chartArea.top, width, chartArea.bottom - chartArea.top);

        const xp = scales.x.getPixelForValue(chart.$peakFreq);
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 1;
        ctx.setLineDash([4,2]);
        ctx.beginPath();
        ctx.moveTo(xp, chartArea.top);
        ctx.lineTo(xp, chartArea.bottom);
        ctx.stroke();
        ctx.restore();
      }
    };

    function setupSpectrumChart(freqs){
      if (state.spectrumChart) state.spectrumChart.destroy();
      console.log('[CRY][spectrum] init axis with', freqs?.length, 'bins');
      const ctx = els.chartSpectrumCanvas.getContext('2d');
      state.spectrumChart = new Chart(ctx, {
        type: 'line',
        data: { datasets: [
          { label: 'spectrum (raw)', data: [], borderColor: RAW_COLOR, borderWidth: 2, pointRadius: 0, tension: 0 },
          { label: 'spectrum (smoothed)', data: [], borderColor: SMOOTH_COLOR, borderWidth: 2, pointRadius: 0, tension: 0 }
        ] },
        options: {
          animation: false,
          plugins: { legend: { display: false } },
          parsing: false,
          scales: {
            x: {
              type: 'logarithmic',
              min: 20,
              max: Math.max(200, Math.round((freqs?.[freqs.length-1]||8000))),
              title: { display: true, text: 'Frequency (Hz, log)' },
              ticks: {
                callback: (val) => {
                  const nice = [20,50,100,200,500,1000,2000,5000,8000];
                  const v = Math.round(val);
                  if (nice.includes(v)) return v >= 1000 ? (v/1000)+'k' : v;
                  return '';
                }
              }
            },
            y: { min: -100, max: 0, title: { display: true, text: 'Power (dBFS)' } }
          },
          elements: { line: { fill: false } }
        },
        plugins: [spectrumOverlay]
      });
    }

    function updateSpectrumChartVisibility() {
      if (!state.spectrumChart) return;
      const showRaw = !!els.showRawSpec?.checked;
      const showSm  = !!els.showSmSpec?.checked;
      state.spectrumChart.data.datasets[0].hidden = !showRaw;
      state.spectrumChart.data.datasets[1].hidden = !showSm;
      state.spectrumChart.update();
      console.log('[CRY][spectrum] vis raw=', showRaw, 'sm=', showSm);
    }

    function updateSpectrumChart() {
      if (!state.spectrumChart) return;
      const raw = [], sm = [];
      for (let i = state.specStartIdx; i <= state.specEndIdx; i++) {
        const f = state.specFreqs[i];
        raw.push({ x: f, y: state.specRawDb[i] });
        sm.push({ x: f, y: state.specSmDb[i] });
      }
      state.spectrumChart.data.datasets[0].data = raw;
      state.spectrumChart.data.datasets[1].data = sm;

      // Peak from smoothed data
      let maxDb = -Infinity, maxIdx = -1;
      for (let i = state.specStartIdx; i <= state.specEndIdx; i++) {
        const v = state.specSmDb[i];
        if (v > maxDb) { maxDb = v; maxIdx = i; }
      }
      if (maxIdx >= 0) {
        state.peakFreq = state.specFreqs[maxIdx];
        state.peakDb = maxDb;
        state.spectrumChart.$peakFreq = state.peakFreq;
        const f = state.peakFreq >= 1000 ? (state.peakFreq/1000).toFixed(2)+' kHz' : Math.round(state.peakFreq)+' Hz';
        els.peakReadout.textContent = `Peak: ${Math.round(state.peakDb)} dB @ ${f}`;
      } else {
        state.spectrumChart.$peakFreq = null;
        els.peakReadout.textContent = 'Peak: —';
      }
      state.spectrumChart.update();
    }

    function updateChartWindow(params) {
      if (!state.chart) return;               // guard against early calls https://chatgpt.com/c/68af22f5-a430-8330-95d4-bb5559f2768b
      const { PLOT_WINDOW_S } = params;
      const tMs = state.timesMs, r = state.cryRaw, s = state.crySm;

      let cut = 0;
      if (tMs.length) {
        const last = tMs[tMs.length - 1];
        const startMs = last - (PLOT_WINDOW_S * 1000);
        const idx = tMs.findIndex(v => v >= startMs);
        cut = idx >= 0 ? idx : 0;
      }
      const labels = tMs.slice(cut).map(formatClock);
      const raw = r.slice(cut);
      const sm  = s.slice(cut);

      const onVal  = Math.max(0, (params.THRESH||0) + (params.ALERT_ON_EXTRA||0));
      const offVal = Math.max(0, onVal - (params.ALERT_OFF_DELTA||0));
      const thrOn  = new Array(labels.length).fill(onVal);
      const thrOff = new Array(labels.length).fill(offVal);

      state.chart.data.labels = labels;
      state.chart.data.datasets[0].data = raw;
      state.chart.data.datasets[1].data = sm;
      state.chart.data.datasets[2].data = thrOn;
      state.chart.data.datasets[3].data = thrOff;

      if (raw.length || sm.length) {
        const all = raw.concat(sm);
        const ymin = Math.min(...all, onVal, offVal);
        const ymax = Math.max(...all, onVal, offVal);
        const pad = 0.05;
        state.chart.options.scales.y.min = Math.min(0, ymin - pad);
        state.chart.options.scales.y.max = Math.min(1.5, ymax + pad);
      }

    /* ---------- MP Audio task (resilient load with retry + buffer fallback) ---------- */
    async function ensureAudioTask() {
      if (!AudioClassifier || !FilesetResolver) {
        console.warn('[CRY][mp] MediaPipe tasks audio not available');
        return null;
      }
      if (state.audioTask) return state.audioTask;
      if (state.audioTaskPromise) return state.audioTaskPromise;

      const WASM_DIR  = AUDIO_PKG_URL + "/wasm";
      const MODEL_URL = "https://storage.googleapis.com/mediapipe-models/audio_classifier/yamnet/float32/1/yamnet.tflite";

      const createWithPath = async (resolver) => AudioClassifier.createFromOptions(resolver, {
        baseOptions: { modelAssetPath: MODEL_URL },
        runningMode: "AUDIO_CLIPS",
        classifierOptions: {
        scoreThreshold: 0.0,  // be permissive
        maxResults: 20        // return a bunch so we can see what's there
      }
      });

      /*const createWithBuffer = async (resolver) => {
        console.warn('[CRY][mp] path load failed; fetching model (no-store)…');
        const bust = MODEL_URL + (MODEL_URL.includes('?') ? '&' : '?') + 'cb=' + Date.now();
        const res = await fetch(bust, { cache: 'no-store' });
        if (!res.ok) throw new Error(`yamnet fetch ${res.status}`);
        const buf = await res.arrayBuffer();
        return AudioClassifier.createFromOptions(resolver, {
          baseOptions: { modelAssetBuffer: buf },
          runningMode: "AUDIO_CLIPS"
        });
      };*/
      //https://chatgpt.com/c/68b04e15-85d8-8329-9e6d-f967fd8ed6ed
      const createWithBuffer = async (resolver) => {
        const bust = MODEL_URL + (MODEL_URL.includes('?') ? '&' : '?') + 'cb=' + Date.now();
        const res = await fetch(bust, { cache: 'no-store' });
        if (!res.ok) throw new Error(`yamnet fetch ${res.status}`);
        const buf = new Uint8Array(await res.arrayBuffer()); // <-- important
        console.log('[CRY][mp] yamnet bytes =', buf.byteLength);
        return AudioClassifier.createFromOptions(resolver, {
          baseOptions: { modelAssetBuffer: buf },
          runningMode: "AUDIO_CLIPS",
          classifierOptions: {
            scoreThreshold: 0.0,
            maxResults: 20
          }          
        });
      };
      

      state.audioTaskPromise = (async () => {
        let lastErr = null;
        for (let attempt = 1; attempt <= 3; attempt++) {
          try {
            setStatus('Loading audio model…');
            console.log(`[CRY][mp] resolver attempt ${attempt}`);
            const resolver = await FilesetResolver.forAudioTasks(WASM_DIR);
            try {
              console.log(`[CRY][mp] create (path) attempt ${attempt}`);
              state.audioTask = await createWithPath(resolver);
              console.log('[CRY][mp] audio task ready (path)');
              setStatus('Ready');
              return state.audioTask;
            } catch (e1) {
              lastErr = e1;
              console.warn('[CRY][mp] create (path) failed:', e1?.message || e1);
              state.audioTask = await createWithBuffer(resolver);
              console.log('[CRY][mp] audio task ready (buffer)');
              setStatus('Ready');
              return state.audioTask;
            }
          } catch (e) {
            lastErr = e;
            console.warn('[CRY][mp] resolver/model attempt failed:', e?.message || e);
            await new Promise(r => setTimeout(r, attempt * 600)); // backoff
          }
        }
        setStatus('Audio model load failed');
        state.audioTaskPromise = null;
        throw lastErr || new Error('audio task init failed');
      })();

      return state.audioTaskPromise;
    }

    /* ---------- Alert logic ---------- */
    function shouldAlert(smoothed, nowMs, params) {
      const onThresh  = (params.THRESH||0) + (params.ALERT_ON_EXTRA||0);
      const offThresh = Math.max(0, onThresh - (params.ALERT_OFF_DELTA||0));
      if (state.alertOn) {
        if (nowMs < state.alertUntilMs) return true;
        return smoothed >= offThresh;
      } else {
        if (smoothed >= onThresh) {
          state.alertUntilMs = nowMs + (params.ALERT_HOLD_MS||0);
          return true;
        }
        return false;
      }
    }
    function setAlert(on){ document.body.classList.toggle('alert', !!on); }

    /* ---------- Class score utils ---------- */
    function classMatch(name, needles) {
      const L = (name || '').trim().toLowerCase();
      return needles.some(n => L.includes(n));
    }
    function getCryScoreFromCategories(categories, includeList) {
      const needles = includeList.map(s=>s.trim().toLowerCase()).filter(Boolean);
      let sum = 0;
      for (const c of (categories || [])) {
        const disp = c.displayName ?? c.categoryName ?? '';
        if (classMatch(disp, needles)) sum += (c.score || 0);
      }
      return sum; // multi-label sum
    }

    /* ---------- Push a score into series ---------- */
    function pushScore(score) {
      const params = getParams();
      const hopMs = Math.round(params.HOP_S * 1000);
      state.cryRaw.push(score);
      state.crySm.push(movingAvgTail(state.cryRaw, params.SMOOTH_WIN));
      state.timesSec.push(state.timesSec.length * params.HOP_S);
      const nextMs = state.timesMs.length ? (state.timesMs[state.timesMs.length - 1] + hopMs) : Date.now();
      state.timesMs.push(nextMs);

      updateChartWindow(params);

      const smoothed = state.crySm[state.crySm.length - 1];
      const nowMs = Date.now();
      const alert = shouldAlert(smoothed, nowMs, params);
      state.alertOn = alert; setAlert(alert);

      if (state.timesSec.length % 100 === 0) {
        console.log('[CRY][series] n=', state.timesSec.length, 'last raw=', score.toFixed(3), 'sm=', smoothed.toFixed(3));
      }

      // Bound memory
      if (state.timesSec.length % 400 === 0) {
        const keepFrom = Math.max(0, state.timesSec.length - Math.ceil(params.PLOT_WINDOW_S / params.HOP_S) - 10);
        if (keepFrom > 0) {
          state.timesSec = state.timesSec.slice(keepFrom);
          state.timesMs  = state.timesMs.slice(keepFrom);
          state.cryRaw   = state.cryRaw.slice(keepFrom);
          state.crySm    = state.crySm.slice(keepFrom);
        }
      }
    }

    /* ---------- Receiver-mode (mic) ---------- */
    function makeScriptProcessor(ctx, onAudio) {
      const sp = ctx.createScriptProcessor(4096, 1, 1);
      sp.onaudioprocess = (e) => onAudio(new Float32Array(e.inputBuffer.getChannelData(0)), ctx.sampleRate);
      return sp;
    }

    async function startReceiverMicGraph() {
      console.log('[CRY][mic] starting mic graph…');
      const ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: "interactive" });
      state.audioCtx = ctx;
      await ctx.resume();

      const stream = await navigator.mediaDevices.getUserMedia({
        audio: { channelCount: 1, noiseSuppression: false, echoCancellation: false, autoGainControl: false },
        video: false
      });
      state.streamLocalMic = stream;

      const src = ctx.createMediaStreamSource(stream);
      const analyser = ctx.createAnalyser();
      analyser.fftSize = 2048;
      analyser.smoothingTimeConstant = 0.0;
      state.analyser = analyser;
      src.connect(analyser);

      const sink = ctx.createGain(); sink.gain.value = 0; sink.connect(ctx.destination);
      let processor;
      try {
        const workletURL = URL.createObjectURL(new Blob([`
          class MicProcessor extends AudioWorkletProcessor {
            process(inputs) {
              const input = inputs[0];
              if (input && input[0]) this.port.postMessage(input[0].slice(0));
              return true;
            }
          }
          registerProcessor('mic-processor', MicProcessor);
        `], { type: 'application/javascript' }));
        await ctx.audioWorklet.addModule(workletURL);
        processor = new AudioWorkletNode(ctx, 'mic-processor', { numberOfInputs: 1, numberOfOutputs: 1, channelCount: 1 });
        processor.port.onmessage = (ev) => onAudioChunkReceiver(ev.data, ctx.sampleRate);
        src.connect(processor).connect(sink);
        console.log('[CRY][mic] using AudioWorklet @', ctx.sampleRate, 'Hz');
      } catch {
        processor = makeScriptProcessor(ctx, onAudioChunkReceiver);
        src.connect(processor).connect(sink);
        console.log('[CRY][mic] using ScriptProcessor @', ctx.sampleRate, 'Hz');
      }
      state.sourceNode = src;
      state.sinkNode = sink;
      state.processor = processor;

      prepareSpectrumArrays(ctx);
      startSpectrumLoop();
      state.usingMic = true;
    }

    function stopReceiverMicGraph() {
      if (!state.usingMic) return;
      console.log('[CRY][mic] stopping mic graph');
      try { state.processor?.disconnect(); } catch {}
      try { state.sourceNode?.disconnect(); } catch {}
      try { state.sinkNode?.disconnect(); } catch {}
      try { state.streamLocalMic?.getTracks().forEach(t => t.stop()); } catch {}
      try { state.audioCtx && state.audioCtx.state !== 'closed' && state.audioCtx.close(); } catch {}
      state.processor = null; state.sourceNode = null; state.sinkNode = null;
      state.streamLocalMic = null; state.audioCtx = null;
      state.usingMic = false;
    }

    // --- ADD: normalize MediaPipe result into a categories array ---
    function extractCategories(res) {
      if (!res) return [];
      // 0.10.0 demo shape: array of results
      if (Array.isArray(res)) {
        // either .classifications[0].categories OR .classificationResult.classifications[0].categories
        return (
          res[0]?.classifications?.[0]?.categories ??
          res[0]?.classificationResult?.classifications?.[0]?.categories ??
          []
        );
      }
      // fallback: some older/newer builds return an object
      return (
        res.classifications?.[0]?.categories ??
        res.classificationResult?.classifications?.[0]?.categories ??
        []
      );
    }

    async function onAudioChunkReceiver(chunkFloat32, deviceSr) {
      if (!state.running || !state.usingMic) return;
      const task = await ensureAudioTask().catch(e => { console.warn('[CRY][mp] task unavailable on chunk', e); return null; });
      if (!task) return;
      const params = getParams();

      // 🔎 DEBUG: mic RMS every ~20 frames so we know we have signal //https://chatgpt.com/c/68b06d4c-a170-8324-b1bd-cf61dc1aca63
      window._dbgMicCount = (window._dbgMicCount || 0) + 1;
      if ((window._dbgMicCount % 20) === 0) {
        const rms = Math.sqrt(chunkFloat32.reduce((s,x)=>s + x*x, 0) / Math.max(1, chunkFloat32.length));
        console.log('[CRY][mic] rms(device) =', rms.toFixed(4));
      }
      
      const x16 = resampleLinear(chunkFloat32, deviceSr, params.SR_TARGET);
      for (let i=0;i<x16.length;i++) x16[i] = Math.max(-1, Math.min(1, x16[i]));
      state.ring16k = concatFloat32(state.ring16k, x16);

      const frameHop = Math.round(params.HOP_S * params.SR_TARGET);
      const frameLen = Math.round(params.FRAME_LEN_S * params.SR_TARGET);

      while (state.ring16k.length - state.lastPos >= frameHop) {
        const end = state.lastPos + frameHop;
        const start = Math.max(0, end - frameLen);
        let w = state.ring16k.slice(start, end);
        if (w.length < frameLen) {
          const pad = new Float32Array(frameLen);
          pad.set(w, frameLen - w.length);
          w = pad;
        }

        //const result = await task.classify({ audioClip: w, sampleRateHz: params.SR_TARGET });
        //const result = await task.classify(w, params.SR_TARGET); //https://chatgpt.com/c/68b06d4c-a170-8324-b1bd-cf61dc1aca63
        //const categories = result?.classifications?.[0]?.categories ?? [];

        const res = await task.classify(w, params.SR_TARGET);
        const categories = extractCategories(res);
        
        // (optional) first-result dump so you can confirm the shape once
        if (!window._dbgFirstMicResult) {
          window._dbgFirstMicResult = true;
          console.log('[CRY][mic] FIRST result =', res);
        }

        // 🔎 DEBUG: show include list + top classes we got back //https://chatgpt.com/c/68b06d4c-a170-8324-b1bd-cf61dc1aca63
        if ((window._dbgCatEvery = (window._dbgCatEvery || 0) + 1) % 10 === 0) {
          const inc = params.INCLUDE_CLASSES;
          const top = categories.slice(0,5).map(c => `${c.displayName ?? c.categoryName ?? c.index}:${(c.score ?? 0).toFixed(3)}`);
          console.log('[CRY][DEBUG] INCLUDE parsed:', inc);
          console.log('[CRY][mic] categories length =', categories.length, 'top =', top.join(', '));
        }
        // Log the first raw result so we can see the structure //https://chatgpt.com/c/68b06d4c-a170-8324-b1bd-cf61dc1aca63
        if (!window._dbgFirstMicResult) {
          window._dbgFirstMicResult = true;
          console.log('[CRY][mic] FIRST result =', result);
        }
        
        // If still empty, say so loudly (every ~10 windows to avoid spam)
        window._dbgEmptyCount = (window._dbgEmptyCount || 0) + 1;
        if (!categories.length && (window._dbgEmptyCount % 10 === 0)) {
          console.warn('[CRY][mic] categories EMPTY (len=0). result.classifications =', result?.classifications);
        }

        const score = getCryScoreFromCategories(categories, params.INCLUDE_CLASSES);
        pushScore(score);

        state.lastPos += frameHop;
        if (state.lastPos > frameLen * 4) {
          const cut = state.lastPos - frameLen;
          state.ring16k = state.ring16k.slice(cut);
          state.lastPos -= cut;
        }
      }
    }

    /* ---------- Sender-mode spectrum from remote stream ---------- */
    function startRemoteSpectrumGraphIfPossible() {
      if (!state.streamRemote) { console.log('[CRY][remote] no stream yet'); return; }
      if (state.analyser && !state.usingMic) { // already running on remote
        console.log('[CRY][remote] spectrum already running');
        return;
      }

      // Ensure any previous remote graph is stopped before starting
      stopRemoteSpectrumGraph();

      console.log('[CRY][remote] starting spectrum from remote stream…');
      const ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: "interactive" });
      state.audioCtx = ctx;
      ctx.resume?.().catch(()=>{}); //https://chatgpt.com/c/68b04e15-85d8-8329-9e6d-f967fd8ed6ed
      const src = ctx.createMediaStreamSource(state.streamRemote);
      const analyser = ctx.createAnalyser();
      analyser.fftSize = 2048;
      analyser.smoothingTimeConstant = 0.0;
      const sink = ctx.createGain(); sink.gain.value = 0; sink.connect(ctx.destination);

      src.connect(analyser);
      src.connect(sink);

      state.sourceNode = src;
      state.analyser = analyser;
      state.sinkNode = sink;

    function stopRemoteSpectrumGraph() {
      if (!state.analyser || state.usingMic) return;
      console.log('[CRY][remote] stopping remote spectrum graph');
      try { state.sourceNode?.disconnect(); } catch {}
      try { state.sinkNode?.disconnect(); } catch {}
      try { state.audioCtx && state.audioCtx.state !== 'closed' && state.audioCtx.close(); } catch {}
      state.sourceNode = null; state.sinkNode = null; state.audioCtx = null;
      state.analyser = null;
    }

    /* ---------- Spectrum arrays + loop ---------- */
    function prepareSpectrumArrays(ctx) {
      const analyser = state.analyser;
      const binCount = analyser.frequencyBinCount;
      state.specBinCountAll = binCount;

      state.specFreqs = new Array(binCount);
      for (let i = 0; i < binCount; i++) state.specFreqs[i] = i * ctx.sampleRate / analyser.fftSize;

      const nyquist = ctx.sampleRate / 2;
      const fMax = Math.min(8000, nyquist);

      state.specStartIdx = 0; while (state.specStartIdx < binCount && state.specFreqs[state.specStartIdx] < 20) state.specStartIdx++;
      state.specEndIdx   = binCount - 1; while (state.specEndIdx > 0 && state.specFreqs[state.specEndIdx] > fMax) state.specEndIdx--;

      state.specRawDb = new Array(binCount).fill(-100);
      state.specSmDb  = new Array(binCount).fill(-100);

      setupSpectrumChart(state.specFreqs.slice(state.specStartIdx, state.specEndIdx + 1));
      updateSpectrumChartVisibility();

      console.log('[CRY][spectrum] prepared @ fs=', ctx.sampleRate, 'Hz, bins=', binCount, 'range=', state.specStartIdx, '-', state.specEndIdx);
    }

    function startSpectrumLoop() {
      cancelAnimationFrame(state.spectrumRaf);
      if (!state.analyser) return;
      const analyser = state.analyser;
      const binCount = analyser.frequencyBinCount;
      state.specLastUpdate = 0;
      console.log('[CRY][spectrum] loop start');

      function spectrumTick(ts) {
        if (!state.running || !state.analyser) return;
        if (ts - state.specLastUpdate > 100) {
          const buf = new Float32Array(binCount);
          state.analyser.getFloatFrequencyData(buf);
          for (let i = state.specStartIdx; i <= state.specEndIdx; i++) {
            const db = Math.max(-100, Math.min(0, buf[i]));
            state.specRawDb[i] = db;
            state.specSmDb[i] = 0.8 * state.specSmDb[i] + 0.2 * db;
          }
          updateSpectrumChart();
          state.specLastUpdate = ts;
        }
        state.spectrumRaf = requestAnimationFrame(spectrumTick);
      }
      state.spectrumRaf = requestAnimationFrame(spectrumTick);
    }

    function stopSpectrumLoop() {
      if (state.spectrumRaf) console.log('[CRY][spectrum] loop stop');
      cancelAnimationFrame(state.spectrumRaf);
      state.spectrumRaf = 0;
    }

              const params = getParams();
              const categories = msg.categories || [];

              // log the raw textarea and the parsed list (useful if you suspect parsing issues)
              console.log('[CRY][DEBUG] INCLUDE raw:', els.inputs.INCLUDE_CLASSES?.value);
              console.log('[CRY][DEBUG] INCLUDE parsed:', params.INCLUDE_CLASSES);
              const score = getCryScoreFromCategories(categories, params.INCLUDE_CLASSES);
              pushScore(score);
              if ((state.timesSec.length % 20) === 0) {
                console.log('[CRY][dc] categories n=', categories.length, 'score=', score.toFixed(3));
              }
            }
          }
        };
        audioDC = ch;
      },
      onDataChannel: (e) => { console.log('[CRY][pc] inbound DC:', e.channel?.label); }
    });

    core.start().catch(err => console.warn('[CRY] core start error', err));

    /* ---------- Wire UI & initial boot ---------- */
    document.addEventListener('DOMContentLoaded', () => {
      //console.log('[CRY] DOM ready'); //https://chatgpt.com/c/68af22f5-a430-8330-95d4-bb5559f2768b
      //setupChart(); // show axes immediately //https://chatgpt.com/c/68af22f5-a430-8330-95d4-bb5559f2768b
      //setStatus('Waiting for mode from sender…'); //https://chatgpt.com/c/68af22f5-a430-8330-95d4-bb5559f2768b
      //setWhereLabel(audioWhere); //https://chatgpt.com/c/68af22f5-a430-8330-95d4-bb5559f2768b
      console.log('[CRY] DOM ready');

      // toggles / inputs
      Object.values(els.inputs).forEach(inp => {
        inp?.addEventListener('change', () => {
          console.log('[CRY][ui] params changed → update chart window');
          updateChartWindow(getParams());
        });
      });
      els.showRawSpec?.addEventListener('change', updateSpectrumChartVisibility);
      els.showSmSpec?.addEventListener('change', updateSpectrumChartVisibility);

      updateMicButton(); // NEW: initialize mic button visibility
    });

    window.addEventListener('beforeunload', () => {
      try { core.close(); } catch {}
      stopSpectrumLoop();
      stopReceiverMicGraph();
      stopRemoteSpectrumGraph();
      console.log('[CRY] unload cleanup done');
    });
  </script>
</body>
</html>
