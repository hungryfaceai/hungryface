<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Baby Monitor – Cry Detector (Fused)</title>
  <link rel="icon" href="data:," />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>

  <!-- Shared sidebar stylesheet -->
  <link rel="stylesheet" href="/hungryface/webrtc/receiver/shared/sidebar.css" />

  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0; height: 100%;
      background: #000; color: #fff;
      font-family: -apple-system, system-ui, Segoe UI, Roboto, sans-serif;
      overflow: hidden;
    }

    #stage {
      position: fixed; inset: 0;
      width: 100vw; height: 100vh;
      width: 100dvw; height: 100dvh;
      width: 100svw; height: 100svh;
      z-index: 1; background: #000;
      display: grid; place-items: center;
      padding: 16px; box-sizing: border-box;
    }

    #remote { position: absolute; width: 1px; height: 1px; left: -99999px; top: -99999px; }

    .panel {
      width: min(100%, 1000px);
      background: #0b0b0b;
      border: 1px solid #141414;
      border-radius: 14px;
      padding: 16px;
      box-sizing: border-box;
      z-index: 2;
    }

    header h1 { margin: 0 0 10px 0; font-size: clamp(18px, 3vw, 22px); display:flex; align-items:center; gap:10px; }
    header .muted { color:#aaa; font-size:12px; }

    .row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }

    /* Input-level meter + dB label */
    .signal { margin: 8px 0 12px 0; }
    .signal-row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; }
    .db { font-size: 12px; color: #cfcfcf; min-width: 56px; text-align: right; opacity: 0.9; }
    .meter { width: 100%; height: 10px; border-radius: 8px; background: #0a0a0a; border: 1px solid #222; overflow: hidden; }
    .meter .fill { height: 100%; width: 0%; background: linear-gradient(to right, rgba(96,165,250,0.95), rgba(239,68,68,0.95)); transition: width 80ms linear; }
    #specMini { display:block; width:100%; height:42px; background:#0a0a0a; border:1px solid #222; border-radius:8px; margin-top:8px; }

    /* Control bar */
    #controls { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; z-index: 6; }
    .btn { padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.6); background: transparent; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
    .btn:active { transform: scale(0.99); }

    /* Advanced */
    details.advanced { border: 1px solid #222; border-radius: 12px; padding: 8px 12px; margin-top: 10px; }
    details.advanced summary { cursor: pointer; font-weight: 700; }
    .grid { display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap:10px; margin-top:10px; }
    @media (max-width: 720px){ .grid { grid-template-columns: repeat(2, minmax(0,1fr)); } }
    @media (max-width: 520px){ .grid { grid-template-columns: 1fr; } }
    label { display:grid; gap:6px; font-size:14px; color:#ddd; }
    input[type="number"], input[type="text"], select, textarea {
      width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #222; background:#0b0b0b; color:#ddd; font-size:14px; box-sizing:border-box;
    }
    textarea { min-height: 56px; font-family: inherit; resize: vertical; }

    /* Fused score chart */
    section.plot { margin-top: 14px; }
    .chart-wrap { position:relative; height:320px; }
    canvas#chart { position:absolute; inset:0; width:100% !important; height:100% !important; display:block; background:#0a0a0a; border-radius:10px; }

    /* Alert background pulse */
    body.alert #stage { background: #1a0000; transition: background 120ms linear; }
  </style>
</head>
<body>
  <!-- Shared sidebar injection -->
  <script type="module">
    (async () => {
      try {
        const res = await fetch('/hungryface/webrtc/receiver/shared/sidebar.html', { cache: 'no-cache' });
        const html = await res.text();
        const wrap = document.createElement('div');
        wrap.innerHTML = html.trim();
        document.body.prepend(...wrap.childNodes);
        await new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = '/hungryface/webrtc/receiver/shared/sidebar.js';
          s.onload = resolve; s.onerror = reject; document.body.appendChild(s);
        });
      } catch (err) { console.error('[FUSED][sidebar] failed:', err); }
    })();
  </script>

  <!-- Controls -->
  <div id="controls">
    <button id="enableAudioBtn" class="btn" type="button">Enable audio</button>
    <button id="disableAudioBtn" class="btn" type="button" style="display:none">Disable audio</button>
    <button id="fsBtn" class="btn" type="button">Fullscreen</button>
  </div>

  <div id="stage">
    <video id="remote" autoplay playsinline></video>

    <div class="panel">
      <header>
        <h1>
          Audio detection (Fused score)
          <small class="muted" id="status" style="font-weight:600; margin-left:auto;">Booting…</small>
        </h1>

        <!-- Meter + spectrum -->
        <div class="signal">
          <div class="signal-row">
            <div class="meter" aria-label="Input level"><div id="rmsFill" class="fill"></div></div>
            <div id="dbLabel" class="db">–∞ dB</div>
          </div>
          <canvas id="specMini" height="42"></canvas>
        </div>

        <!-- Model picker (shared with training page) -->
        <div class="row" style="gap:8px 10px; margin-top:6px;">
          <label style="display:flex; align-items:center; gap:8px;">
            <span>Model</span>
            <select id="MODEL_SELECT" style="width:220px;"></select>
          </label>
          <span class="muted">Weights & thresholds load from this model’s saved calibration.</span>
        </div>
      </header>

      <!-- Detection settings -->
      <details class="advanced" open>
        <summary>Detection settings</summary>
        <div class="grid">
          <label><span>Per-class EMA τ (s)</span><input id="CLASS_EMA_TAU_S" type="number" min="0.1" step="0.1" value="0.8"></label>
          <label><span>Fused score EMA τ (s)</span><input id="FUSED_EMA_TAU_S" type="number" min="0.1" step="0.1" value="0.8"></label>
          <label><span>Min ON hold (ms)</span><input id="ALERT_HOLD_MS" type="number" min="0" step="100" value="3000"></label>

          <label><span>OFF delta (below ON)</span><input id="ALERT_OFF_DELTA" type="number" min="0" step="0.01" value="0.10"></label>
          <label><span>Chart window (s)</span><input id="CHART_WINDOW_S" type="number" min="5" step="5" value="60"></label>
          <label><span>Max results (MP)</span><input id="MAX_RESULTS" type="number" min="5" step="1" value="25"></label>

          <label style="grid-column: 1 / -1;"><span>Ignore classes (inference)</span><input id="IGNORE_CLASSES" type="text" placeholder="Silence, Inside, Outside, Vehicle, Noise" value="Silence, Inside, Outside, Vehicle, Noise"></label>
          <label style="grid-column: 1 / -1;"><span>Penalty map</span><input id="PENALTY_MAP" type="text" placeholder="Silence:-0.01, White noise:-0.01" value="Silence:-0.01, White noise:-0.01"></label>

          <!-- Audio/classification engine params (for receiver-side classification) -->
          <label><span>SR_TARGET (Hz)</span><input id="SR_TARGET" type="number" min="8000" step="1000" value="16000" /></label>
          <label><span>FRAME_LEN_S</span><input id="FRAME_LEN_S" type="number" min="0.1" step="0.01" value="0.96" /></label>
          <label><span>HOP_S</span><input id="HOP_S" type="number" min="0.01" step="0.01" value="0.48" /></label>
        </div>
        <p class="muted" style="margin-top:6px;">Mode is controlled by the sender via data channel: either raw audio (classified locally) or precomputed MediaPipe categories.</p>
      </details>

      <!-- Fused score chart -->
      <section class="plot">
        <div class="chart-wrap">
          <canvas id="chart"></canvas>
        </div>
      </section>
    </div>
  </div>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

  <!-- App -->
  <script type="module">
    import { ReceiverCore } from "/hungryface/webrtc/receiver/shared/receiver-core.js";

    /* ---------- MediaPipe Tasks Audio (for receiver-side classification) ---------- */
    const AUDIO_PKG_URL = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-audio@0.10.0";
    const AudioMod = await import(AUDIO_PKG_URL).catch(e => { console.error('[FUSED] MP audio import error', e); return null; });
    const AudioClassifier = AudioMod?.AudioClassifier;
    const FilesetResolver = AudioMod?.FilesetResolver;

    /* ---------- Signaling ---------- */
    const WS_ENDPOINT = "wss://signaling-server-f5gu.onrender.com/ws";
    const room = new URLSearchParams(location.search).get("room") || "Baby";

    /* ---------- DOM ---------- */
    const stage = document.getElementById('stage');
    const remoteVideo = document.getElementById('remote');
    const enableAudioBtn = document.getElementById('enableAudioBtn');
    const disableAudioBtn = document.getElementById('disableAudioBtn');
    const fsBtn = document.getElementById('fsBtn');
    const els = {
      rmsFill: document.getElementById('rmsFill'),
      dbLabel: document.getElementById('dbLabel'),
      specMini: document.getElementById('specMini'),
      chart: document.getElementById('chart'),
      // settings
      MODEL_SELECT: document.getElementById('MODEL_SELECT'),
      CLASS_EMA_TAU_S: document.getElementById('CLASS_EMA_TAU_S'),
      FUSED_EMA_TAU_S: document.getElementById('FUSED_EMA_TAU_S'),
      ALERT_HOLD_MS: document.getElementById('ALERT_HOLD_MS'),
      ALERT_OFF_DELTA: document.getElementById('ALERT_OFF_DELTA'),
      CHART_WINDOW_S: document.getElementById('CHART_WINDOW_S'),
      MAX_RESULTS: document.getElementById('MAX_RESULTS'),
      IGNORE_CLASSES: document.getElementById('IGNORE_CLASSES'),
      PENALTY_MAP: document.getElementById('PENALTY_MAP'),
      SR_TARGET: document.getElementById('SR_TARGET'),
      FRAME_LEN_S: document.getElementById('FRAME_LEN_S'),
      HOP_S: document.getElementById('HOP_S'),
      status: document.getElementById('status'),
    };

    /* ---------- State ---------- */
    let audioDC = null;
    let audioEnabled = false;      // from sender
    let audioWhere = 'sender';     // 'sender' | 'receiver'
    let _activeAudio = { enabled: null, where: null };

    const state = {
      // audio graph (meter/spectrum)
      audioCtx: null,
      streamRemote: null,
      sourceNode: null,
      sinkNode: null,
      processor: null,
      tdAnalyser: null,
      specAnalyser: null,
      visualRaf: 0,

      // MP task & receiver-side ring buffer
      audioTask: null,
      audioTaskPromise: null,
      ring16k: new Float32Array(0),
      lastPos: 0,

      // fused pipeline
      perClassEma: new Map(),
      fusedEma: 0,
      thrOn: 0.35,
      thrOff: 0.25,
      alertOn: false,
      alertUntil: 0,

      // chart
      hopSec: 0.48,
      chart: null,
      chartCap: 0,
      labels: [],
      fusedRaw: [],
      fusedSm: [],
    };

    /* ---------- Model persistence (shared with training page) ---------- */
    const ACTIVE_MODEL_NAME_KEY = 'cryActiveModelName';
    function getModelName(){ return els.MODEL_SELECT?.value || localStorage.getItem(ACTIVE_MODEL_NAME_KEY) || 'default'; }
    function setModelName(name){ localStorage.setItem(ACTIVE_MODEL_NAME_KEY, name); if (els.MODEL_SELECT) els.MODEL_SELECT.value = name; }
    function MODEL_KEY(){ return `cryModelV1_${getModelName()}`; }
    function CALIB_KEY(){ return `cryCalibV1_${getModelName()}`; }
    function IGNORE_KEY(){ return `cryIgnore_${getModelName()}`; }
    function PENALTY_KEY(){ return `cryPenalty_${getModelName()}`; }

    function listModelNames(){
      const names=[]; for (let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if (k?.startsWith('cryModelV1_')) names.push(k.replace('cryModelV1_','')); }
      if (!names.includes('default')) names.push('default'); names.sort((a,b)=>a.localeCompare(b)); return names;
    }
    const NEW_MODEL_VALUE='__NEW__';
    function refreshModelSelect(activeName){
      const sel=els.MODEL_SELECT; if(!sel) return;
      const names=listModelNames(); sel.innerHTML='';
      for (const n of names){ const o=document.createElement('option'); o.value=n; o.textContent=n; sel.appendChild(o); }
      const optNew=document.createElement('option'); optNew.value=NEW_MODEL_VALUE; optNew.textContent='New…'; sel.appendChild(optNew);
      sel.value = names.includes(activeName) ? activeName : (localStorage.getItem(ACTIVE_MODEL_NAME_KEY)||'default');
    }

    function loadModel(){
      const raw = localStorage.getItem(MODEL_KEY());
      if (raw) { try { return JSON.parse(raw); } catch {} }
      return { version:1, name:getModelName(), K:6, kPrior:50, halfLifeSec:3600, classes:{}, weights:{ "Baby cry, infant cry": 1 } };
    }

    /* ---------- Ignore / penalty ---------- */
    function getIgnoreTokens(){
      const s = (els.IGNORE_CLASSES?.value ?? localStorage.getItem(IGNORE_KEY()) ?? '').trim();
      return s ? s.split(',').map(t=>t.trim().toLowerCase()).filter(Boolean) : [];
    }
    function shouldIgnore(name){ if(!name) return false; const n=name.toLowerCase(); return getIgnoreTokens().some(tok=>n.includes(tok)); }
    function getPenaltyMap(){
      const s = (els.PENALTY_MAP?.value ?? localStorage.getItem(PENALTY_KEY()) ?? '').trim();
      const map={}; if(!s) return map;
      s.split(',').forEach(pair=>{ const [k,v]=pair.split(':'); if(!k) return; const w=Math.max(-1,Math.min(0,parseFloat(v))); map[k.trim().toLowerCase()] = Number.isFinite(w) ? w : -0.3; });
      return map;
    }

    /* ---------- Status ---------- */
    function setStatus(s){ els.status.textContent = s; }

    /* ---------- Metering ---------- */
    const DB_FLOOR = -75, DB_CEIL = 0;
    function setSignalRMS(rmsLinear) {
      const db = 20 * Math.log10(Math.max(1e-8, rmsLinear));
      state._dbEma = 0.2 * db + 0.8 * (state._dbEma ?? -120);
      const dbClamped = Math.max(DB_FLOOR, Math.min(DB_CEIL, state._dbEma));
      const pct = Math.round(((dbClamped - DB_FLOOR) / (DB_CEIL - DB_FLOOR)) * 100);
      els.rmsFill.style.width = pct + '%';
      const shown = Math.round(dbClamped);
      els.dbLabel.textContent = (shown <= DB_FLOOR + 1) ? '–∞ dB' : `${shown} dB`;
    }

    /* ---------- Tiny spectrum ---------- */
    function sizeCanvasToDisplay(canvas) {
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      const w = canvas.clientWidth, h = canvas.clientHeight;
      if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
        canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
      }
      return dpr;
    }
    function startVisualLoop(){
      cancelAnimationFrame(state.visualRaf);
      const td = state.tdAnalyser, an = state.specAnalyser;
      if (!td || !an) return;
      const tdBuf = new Float32Array(td.fftSize);
      const specBuf = new Uint8Array(an.frequencyBinCount);
      const ctx2d = els.specMini.getContext('2d');
      function tick(){
        if (!state.tdAnalyser || !state.specAnalyser) return;
        td.getFloatTimeDomainData(tdBuf);
        let s=0; for(let i=0;i<tdBuf.length;i++){ const v=tdBuf[i]; s+=v*v; }
        setSignalRMS(Math.sqrt(s/Math.max(1,tdBuf.length)));

        const dpr = sizeCanvasToDisplay(els.specMini);
        const W = els.specMini.width, H = els.specMini.height;
        ctx2d.clearRect(0,0,W,H);
        an.getByteFrequencyData(specBuf);
        const bars = Math.min(W, 120), step = Math.max(1, Math.floor(specBuf.length / bars)), barW = Math.max(1, Math.floor(W / bars));
        for (let b=0;b<bars;b++){
          let sum=0,n=0; const start=b*step, end=Math.min(specBuf.length,start+step);
          for(let i=start;i<end;i++){ sum+=specBuf[i]; n++; }
          const mag = (n?sum/n:0)/255, h=Math.max(1, Math.round(mag*(H-4))), x=b*barW, y=H-h;
          ctx2d.fillStyle='rgba(96,165,250,0.9)'; ctx2d.fillRect(x,y,barW-1,h);
        }
        state.visualRaf = requestAnimationFrame(tick);
      }
      state.visualRaf = requestAnimationFrame(tick);
    }
    function stopVisualLoop(){ cancelAnimationFrame(state.visualRaf); state.visualRaf=0; }

    /* ---------- Chart (fused score over time) ---------- */
    function hhmmss(tMs){ return new Date(tMs).toLocaleTimeString([], { hour12:false, hour:'2-digit', minute:'2-digit', second:'2-digit' }); }
    function computeChartCap(){ return Math.max(10, Math.round((Number(els.CHART_WINDOW_S.value)||60) / Math.max(0.01, state.hopSec))); }
    function initChartBuffers(){
      state.chartCap = computeChartCap();
      state.labels   = new Array(state.chartCap).fill('');
      state.fusedRaw = new Array(state.chartCap).fill(null);
      state.fusedSm  = new Array(state.chartCap).fill(null);
    }
    function setupChart(){
      state.chart?.destroy?.();
      const ctx = els.chart.getContext('2d');
      initChartBuffers();
      state.chart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: state.labels,
          datasets: [
            { label:'fused(raw)', data: state.fusedRaw, type:'bar', borderWidth:0, pointRadius:0, barPercentage:1.0, categoryPercentage:1.0, backgroundColor:'rgba(96,165,250,0.55)' },
            { label:'fused(EMA)', data: state.fusedSm, type:'line', borderWidth:2, pointRadius:0, tension:0.15, borderColor:'rgba(239,68,68,0.95)', spanGaps:true },
            { label:'thr ON',  data:new Array(state.chartCap).fill(state.thrOn),  type:'line', borderWidth:1, pointRadius:0, borderDash:[6,4], borderColor:'rgba(153,27,27,1)',  spanGaps:true },
            { label:'thr OFF', data:new Array(state.chartCap).fill(state.thrOff), type:'line', borderWidth:1, pointRadius:0, borderDash:[2,2], borderColor:'rgba(34,197,94,1)', spanGaps:true }
          ]
        },
        options: {
          responsive:true, maintainAspectRatio:false, animation:false, plugins:{ legend:{ display:false } },
          scales:{ x:{ title:{display:true,text:'time (local)'} }, y:{ title:{display:true,text:'score'}, min:0, max:1.2 } }
        }
      });
    }
    function pushChart(nowMs, raw, sm){
      const capNow = computeChartCap();
      if (capNow !== state.chartCap) setupChart();
      state.fusedRaw.shift(); state.fusedRaw.push(raw);
      state.fusedSm.shift();  state.fusedSm.push(sm);
      const dt = state.hopSec * 1000;
      for (let i=0;i<state.chartCap;i++){ const t=nowMs - (state.chartCap - 1 - i)*dt; state.labels[i]=hhmmss(t); }
      state.chart.data.labels = state.labels.slice();
      state.chart.data.datasets[0].data = state.fusedRaw.slice();
      state.chart.data.datasets[1].data = state.fusedSm.slice();
      state.chart.data.datasets[2].data = new Array(state.chartCap).fill(state.thrOn);
      state.chart.data.datasets[3].data = new Array(state.chartCap).fill(state.thrOff);
      const nums = [...state.fusedRaw, ...state.fusedSm].filter(v=>typeof v==='number'&&isFinite(v));
      const ymax = nums.length ? Math.max(...nums, state.thrOn, state.thrOff) + 0.05 : 1.0;
      state.chart.options.scales.y.max = Math.max(0.6, Math.min(1.5, ymax));
      state.chart.update();
    }

    /* ---------- Fusion pipeline ---------- */
    function clamp01(x){ return Math.max(0, Math.min(1, x)); }
    function emaStep(prev, x, a){ return prev + a * (x - prev); }
    function alphaForTau(dt, tau){ return 1 - Math.exp(-dt / Math.max(1e-3, tau)); }

    function ensurePerClassEma(weights){ for (const n of Object.keys(weights||{})) if (!state.perClassEma.has(n)) state.perClassEma.set(n, 0); }

    function fusedScoreFromCategories(categories, weights, dt){
      const aClass = alphaForTau(dt, Number(els.CLASS_EMA_TAU_S.value) || 0.8);
      for (const c of (categories||[])){
        const name = c.categoryName || c.displayName || c.category || '';
        if (!name) continue;
        const prev = state.perClassEma.get(name) || 0;
        state.perClassEma.set(name, emaStep(prev, (c.score||0), aClass));
      }
      ensurePerClassEma(weights);

      let fused = 0;
      for (const [name, w] of Object.entries(weights||{})) { fused += (w||0) * (state.perClassEma.get(name)||0); }

      // penalties (e.g., Silence:-0.01)
      const pmap = getPenaltyMap();
      if (Object.keys(pmap).length) {
        for (const [tok, pen] of Object.entries(pmap)) {
          const token = String(tok||'').toLowerCase(); if (!token) continue;
          for (const [nm, ema] of state.perClassEma.entries()) {
            if (nm.toLowerCase().includes(token)) fused += (pen||0) * (ema||0);
          }
        }
      }

      fused = clamp01(fused);
      const aFused = alphaForTau(dt, Number(els.FUSED_EMA_TAU_S.value) || 0.8);
      state.fusedEma = emaStep(state.fusedEma, fused, aFused);
      return { raw: fused, sm: state.fusedEma };
    }

    function applyHysteresis(sm, nowMs){
      const hold = Number(els.ALERT_HOLD_MS.value) || 0;
      if (state.alertOn) { if (nowMs < state.alertUntil) return true; return sm >= state.thrOff; }
      else { if (sm >= state.thrOn) { state.alertUntil = nowMs + hold; return true; } return false; }
    }
    function setAlert(on){ document.body.classList.toggle('alert', !!on); }

    function loadCalibrationIntoState(){
      const calib = JSON.parse(localStorage.getItem(CALIB_KEY()) || 'null');
      if (calib) { state.thrOn = calib.thr_on; state.thrOff = calib.thr_off; }
      else { const off = Number(els.ALERT_OFF_DELTA.value)||0.1; state.thrOn = 0.35; state.thrOff = Math.max(0, state.thrOn - off); }
    }

    /* ---------- Receiver-side classification glue ---------- */
    async function ensureAudioTask() {
      if (!AudioClassifier || !FilesetResolver) return null;
      if (state.audioTask) return state.audioTask;
      if (state.audioTaskPromise) return state.audioTaskPromise;
      const WASM_DIR  = AUDIO_PKG_URL + "/wasm";
      const MODEL_URL = "https://storage.googleapis.com/mediapipe-models/audio_classifier/yamnet/float32/1/yamnet.tflite";
      const createWithPath = async (resolver) => AudioClassifier.createFromOptions(resolver, {
        baseOptions: { modelAssetPath: MODEL_URL },
        runningMode: "AUDIO_CLIPS",
        classifierOptions: { scoreThreshold: 0.0, maxResults: Math.max(5, Number(els.MAX_RESULTS.value)||25) }
      });
      const createWithBuffer = async (resolver) => {
        const bust = MODEL_URL + (MODEL_URL.includes('?') ? '&' : '?') + 'cb=' + Date.now();
        const res = await fetch(bust, { cache: 'no-store' });
        if (!res.ok) throw new Error(`yamnet fetch ${res.status}`);
        const buf = new Uint8Array(await res.arrayBuffer());
        return AudioClassifier.createFromOptions(resolver, {
          baseOptions: { modelAssetBuffer: buf },
          runningMode: "AUDIO_CLIPS",
          classifierOptions: { scoreThreshold: 0.0, maxResults: Math.max(5, Number(els.MAX_RESULTS.value)||25) }
        });
      };
      state.audioTaskPromise = (async () => {
        let lastErr = null;
        for (let attempt=1; attempt<=3; attempt++){
          try {
            const resolver = await FilesetResolver.forAudioTasks(WASM_DIR);
            try { state.audioTask = await createWithPath(resolver); return state.audioTask; }
            catch (e1) { lastErr = e1; state.audioTask = await createWithBuffer(resolver); return state.audioTask; }
          } catch (e) { lastErr = e; await new Promise(r=>setTimeout(r, attempt*600)); }
        }
        state.audioTaskPromise=null; throw lastErr || new Error('audio task init failed');
      })();
      return state.audioTaskPromise;
    }

    function concatFloat32(a,b){ const out=new Float32Array(a.length+b.length); out.set(a,0); out.set(b,a.length); return out; }
    function resampleLinear(x, fromSr, toSr){
      if (fromSr === toSr) return x;
      const ratio = toSr / fromSr, n = Math.max(1, Math.round(x.length * ratio)), out = new Float32Array(n);
      const dx = (x.length - 1) / (n - 1);
      for (let i=0;i<n;i++){ const pos=i*dx, i0=Math.floor(pos), i1=Math.min(i0+1,x.length-1), t=pos-i0; out[i]=x[i0]*(1-t)+x[i1]*t; }
      return out;
    }
    function extractCategories(res) {
      if (!res) return [];
      const r = Array.isArray(res) ? res[0] : res;
      const cats = r?.classifications?.[0]?.categories ?? r?.classificationResult?.classifications?.[0]?.categories ?? [];
      return (cats||[]).map(c => ({ score: c.score ?? 0, categoryName: (c.displayName || c.categoryName || '').trim() }));
    }

    async function onAudioChunkReceiver(chunkFloat32, deviceSr) {
      // meter from chunk (works even if analysers not ready)
      let s=0; for(let i=0;i<chunkFloat32.length;i++){ const v=chunkFloat32[i]; s+=v*v; }
      setSignalRMS(Math.sqrt(s/Math.max(1,chunkFloat32.length)));

      const params = { SR_TARGET: Number(els.SR_TARGET.value)||16000, FRAME_LEN_S: Number(els.FRAME_LEN_S.value)||0.96, HOP_S: Number(els.HOP_S.value)||0.48 };
      state.hopSec = params.HOP_S;

      const task = await ensureAudioTask().catch(()=>null); if(!task) return;

      const x16 = resampleLinear(chunkFloat32, deviceSr, params.SR_TARGET);
      for (let i=0;i<x16.length;i++) x16[i] = Math.max(-1, Math.min(1, x16[i]));
      state.ring16k = concatFloat32(state.ring16k, x16);

      const frameHop = Math.round(params.HOP_S * params.SR_TARGET);
      const frameLen = Math.round(params.FRAME_LEN_S * params.SR_TARGET);

      while (state.ring16k.length - state.lastPos >= frameHop) {
        const end = state.lastPos + frameHop;
        const start = Math.max(0, end - frameLen);
        let w = state.ring16k.slice(start, end);
        if (w.length < frameLen) { const pad=new Float32Array(frameLen); pad.set(w, frameLen - w.length); w = pad; }

        let result = null;
        try { result = await task.classify(w, params.SR_TARGET); } catch(e1){ try { result = await task.classify({ audioClip:w, sampleRateHz: params.SR_TARGET }); } catch {} }
        const categories = extractCategories(result);

        // fused scoring
        const weights = loadModel().weights || {"Baby cry, infant cry":1};
        const { raw, sm } = fusedScoreFromCategories(categories, weights, params.HOP_S);

        loadCalibrationIntoState();
        pushChart(Date.now(), raw, sm);

        const on = applyHysteresis(sm, performance.now());
        if (on && !state.alertOn) console.log('[FUSED] ALERT ON');
        if (!on && state.alertOn) console.log('[FUSED] ALERT OFF');
        state.alertOn = on; setAlert(on);

        state.lastPos += frameHop;
        if (state.lastPos > frameLen * 4) {
          const cut = state.lastPos - frameLen;
          state.ring16k = state.ring16k.slice(cut);
          state.lastPos -= cut;
        }
      }
    }

    /* ---------- Remote stream tap (meter + spectrum + optional classify) ---------- */
    function startRemoteStreamGraph(doClassify) {
      if (!state.streamRemote) { console.log('[FUSED][remote] no stream yet'); return; }
      stopRemoteStreamGraph();

      const ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: "interactive" });
      state.audioCtx = ctx; ctx.resume?.().catch(()=>{});

      const src = ctx.createMediaStreamSource(state.streamRemote);

      const td = ctx.createAnalyser(); td.fftSize = 1024;      // level
      const an = ctx.createAnalyser(); an.fftSize = 1024; an.smoothingTimeConstant = 0.8; // spectrum
      const sink = ctx.createGain(); sink.gain.value = 0; sink.connect(ctx.destination);

      src.connect(td); src.connect(an); src.connect(sink);
      state.sourceNode=src; state.tdAnalyser=td; state.specAnalyser=an; state.sinkNode=sink;

      if (doClassify) {
        (async () => {
          let proc;
          try {
            const workletURL = URL.createObjectURL(new Blob([`
              class TapProcessor extends AudioWorkletProcessor {
                process(inputs) { const i=inputs[0]; if(i&&i[0]) this.port.postMessage(i[0].slice(0)); return true; }
              }
              registerProcessor('tap-processor', TapProcessor);
            `], { type: 'application/javascript' }));
            await ctx.audioWorklet.addModule(workletURL);
            URL.revokeObjectURL(workletURL);
            proc = new AudioWorkletNode(ctx, 'tap-processor', { numberOfInputs:1, numberOfOutputs:1, channelCount:1 });
            proc.port.onmessage = (ev) => onAudioChunkReceiver(ev.data, ctx.sampleRate);
          } catch {
            const sp = ctx.createScriptProcessor(4096,1,1);
            sp.onaudioprocess = (e) => onAudioChunkReceiver(new Float32Array(e.inputBuffer.getChannelData(0)), ctx.sampleRate);
            proc = sp;
          }
          src.connect(proc).connect(sink);
          state.processor = proc;
        })();
      } else {
        state.processor = null;
      }

      startVisualLoop();
    }
    function stopRemoteStreamGraph() {
      stopVisualLoop();
      try { state.processor?.disconnect(); } catch {}
      try { state.sourceNode?.disconnect(); } catch {}
      try { state.sinkNode?.disconnect(); } catch {}
      try { state.audioCtx && state.audioCtx.state !== 'closed' && state.audioCtx.close(); } catch {}
      state.processor=null; state.sourceNode=null; state.sinkNode=null; state.tdAnalyser=null; state.specAnalyser=null; state.audioCtx=null;
    }

    /* ---------- Audio mode switching ---------- */
    async function applyAudioMode() {
      if (_activeAudio.enabled === audioEnabled && _activeAudio.where === audioWhere) return;
      _activeAudio = { enabled: audioEnabled, where: audioWhere };
      if (!audioEnabled) {
        stopRemoteStreamGraph();
        els.rmsFill.style.width = '0%'; els.dbLabel.textContent = '–∞ dB';
        setStatus('Audio disabled');
        return;
      }
      if (state.streamRemote) {
        const classifyLocally = (audioWhere === 'receiver');
        setStatus(classifyLocally ? 'Receiver mode: classifying locally' : 'Sender mode: using sender categories');
        startRemoteStreamGraph(classifyLocally);
      } else {
        stopRemoteStreamGraph();
      }
    }

    /* ---------- Enable/Disable audio buttons ---------- */
    function updateAudioButtons() {
      const showEnable = remoteVideo.muted;
      enableAudioBtn.style.display = showEnable ? 'block' : 'none';
      disableAudioBtn.style.display = showEnable ? 'none' : 'block';
    }
    async function tryStartMuted() {
      try { remoteVideo.muted = true; remoteVideo.volume = 1.0; await remoteVideo.play(); }
      catch (e) { console.warn('[FUSED] autoplay (muted) blocked:', e); }
      updateAudioButtons();
    }
    enableAudioBtn.addEventListener('click', async (e) => {
      e?.stopPropagation?.(); e?.preventDefault?.();
      try { remoteVideo.muted = false; remoteVideo.volume = 1.0; await remoteVideo.play(); }
      catch (err) { console.warn('[FUSED] unmute play blocked:', err); }
      updateAudioButtons();
    });
    disableAudioBtn.addEventListener('click', (e) => { e?.stopPropagation?.(); e?.preventDefault?.(); remoteVideo.muted = true; updateAudioButtons(); });

    /* ---------- Fullscreen ---------- */
    fsBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      try {
        if (!document.fullscreenElement) {
          await (stage.requestFullscreen?.call(stage) || document.documentElement.requestFullscreen());
          fsBtn.textContent = 'Exit fullscreen';
        } else {
          await document.exitFullscreen();
          fsBtn.textContent = 'Fullscreen';
        }
      } catch (err) { console.warn('[FUSED] fullscreen error', err); }
    });
    document.addEventListener('fullscreenchange', () => { fsBtn.textContent = document.fullscreenElement ? 'Exit fullscreen' : 'Fullscreen'; });

    /* ---------- Settings wiring ---------- */
    function persistIgPen(){
      localStorage.setItem(IGNORE_KEY(), els.IGNORE_CLASSES.value);
      localStorage.setItem(PENALTY_KEY(), els.PENALTY_MAP.value);
    }
    ['IGNORE_CLASSES','PENALTY_MAP'].forEach(id=>{
      const el = els[id]; if (!el) return;
      el.addEventListener('change', persistIgPen);
      el.addEventListener('blur', persistIgPen);
    });
    els.HOP_S.addEventListener('change', () => { state.hopSec = Number(els.HOP_S.value)||0.48; setupChart(); });
    els.CHART_WINDOW_S.addEventListener('change', () => { setupChart(); });

    els.MODEL_SELECT.addEventListener('change', () => {
      const v = els.MODEL_SELECT.value;
      if (v === NEW_MODEL_VALUE) {
        const name = (prompt('New model name:', '').trim() || '').replace(/[^\w \-().,]/g,'').trim();
        if (!name) { refreshModelSelect(getModelName()); return; }
        const exists = listModelNames().includes(name); setModelName(name);
        if (!exists) { localStorage.setItem(MODEL_KEY(), JSON.stringify(loadModel())); }
        refreshModelSelect(name);
      } else { setModelName(v); }
      loadCalibrationIntoState();
      setupChart(); // refresh thresholds lines
      setStatus(`Model → “${getModelName()}”`);
    });

    /* ---------- WebRTC core ---------- */
    const core = new ReceiverCore({
      wsEndpoint: WS_ENDPOINT,
      room,
      onStatus: (msg) => { setStatus(msg); },
      onStream: (stream) => {
        console.log('[FUSED][pc] onStream, tracks=', stream.getTracks().map(t=>t.kind));
        if (remoteVideo.srcObject !== stream) {
          remoteVideo.srcObject = stream;
          state.streamRemote = stream;
          tryStartMuted();
          if (audioEnabled) startRemoteStreamGraph(audioWhere === 'receiver');
        }
      },
      onIceState: (s) => { console.log('[FUSED][pc] ICE:', s); },
      onBye: () => { console.log('[FUSED][pc] bye'); },
      onCreatePC: (pc) => {
        const ch = pc.createDataChannel('pose'); // reuse
        ch.onopen  = () => { console.log('[FUSED][dc] open'); state.audioCtx?.resume?.().catch(()=>{}); try { ch.send(JSON.stringify({ type: 'need-modes' })); } catch {} };
        ch.onclose = () => { console.log('[FUSED][dc] close'); };
        ch.onerror = (e) => { console.warn('[FUSED][dc] error', e); };
        ch.onmessage = (ev) => {
          let msg; try { msg = JSON.parse(ev.data); } catch { return; }
          if (!msg || !msg.type) return;

          if (msg.type === 'audio-mode') {
            audioEnabled = !!msg.enabled; audioWhere = msg.where || 'sender'; applyAudioMode();
          } else if (msg.type === 'ai-modes' && msg.audio) {
            audioEnabled = !!msg.audio.enabled; audioWhere = msg.audio.where || 'sender'; applyAudioMode();
          } else if (msg.type === 'audio') {
            // categories from sender → fused scoring here
            const cats = (msg.categories||[]).map(c => ({
              score: c.score ?? 0,
              categoryName: (c.displayName || c.categoryName || c.name || '').trim()
            })).filter(c => c.categoryName && !shouldIgnore(c.categoryName));

            if (!audioEnabled || audioWhere !== 'sender') { audioEnabled = true; audioWhere='sender'; applyAudioMode(); }
            // Use local hop for dt
            const HOP_S = Number(els.HOP_S.value)||0.48; state.hopSec = HOP_S;

            const weights = loadModel().weights || {"Baby cry, infant cry":1};
            const { raw, sm } = fusedScoreFromCategories(cats, weights, HOP_S);

            loadCalibrationIntoState();
            pushChart(Date.now(), raw, sm);

            const on = applyHysteresis(sm, performance.now());
            if (on && !state.alertOn) console.log('[FUSED] ALERT ON');
            if (!on && state.alertOn) console.log('[FUSED] ALERT OFF');
            state.alertOn = on; setAlert(on);
          }
        };
        audioDC = ch;
      },
      onDataChannel: (e) => { console.log('[FUSED][pc] inbound DC:', e.channel?.label); }
    });

    core.start().catch(err => console.warn('[FUSED] core start error', err));

    window.addEventListener('beforeunload', () => {
      try { core.close(); } catch {}
      stopRemoteStreamGraph();
    });

    /* ---------- Boot ---------- */
    (function boot(){
      const active = localStorage.getItem(ACTIVE_MODEL_NAME_KEY) || 'default';
      refreshModelSelect(active);
      setModelName(active);

      // load persisted ignore/penalty
      const ignoreSaved = localStorage.getItem(IGNORE_KEY()); if (ignoreSaved) els.IGNORE_CLASSES.value = ignoreSaved;
      const penaltySaved = localStorage.getItem(PENALTY_KEY()); if (penaltySaved) els.PENALTY_MAP.value = penaltySaved;

      loadCalibrationIntoState();
      state.hopSec = Number(els.HOP_S.value)||0.48;
      setupChart();

      setStatus('Ready. Awaiting stream…');
    })();
  </script>
</body>
</html>
