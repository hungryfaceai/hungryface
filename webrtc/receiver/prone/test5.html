    /* ---------- Prone detection state ---------- */
    let lastTs = 0;

    // Visual EMAs
    let pitchEma = NaN;   // EMA of pitch-down (°)
    let riskEma  = 0;     // EMA of fused visual risk (0..1)

    // Hysteresis paths
    let alert = false;              // global (pose OR occlusion)
    let poseRiskEma = 0, poseAlert = false, poseAboveT = 0, poseBelowT = 0;
    let occEma = 0,      occAlert  = false, occAboveT  = 0, occBelowT  = 0;

    /* 🔔 Alerts: lifecycle bookkeeping for persisted alerts */
    let activeAlertId = null;     // IndexedDB id
    let activeCause = null;       // 'Pose' | 'Occlusion'
    let activeAccum = 0;          // sum of samples of the triggering channel
    let activeN = 0;              // sample count
    let prevGlobalAlert = false;  // for edge detection
    let lastPoseInst = 0;         // latest instantaneous pose risk (0..1)
    let lastOccInst = 0;          // latest instantaneous occlusion risk (0..1)

    function alertCauseMessage(cause) {
      return cause === 'Pose'
        ? 'Prone suspected (Pose)'
        : 'Occlusion detected (face hidden)';
    }

    async function handleAlertTransitions({ poseOn, occOn, pPoseInst, pOccInst, fusedInst }) {
      lastPoseInst = pPoseInst;
      lastOccInst  = pOccInst;
      const globalOn = !!(poseOn || occOn);

      // Rising edge: start a new alert
      if (globalOn && !prevGlobalAlert) {
        activeCause = (pOccInst >= pPoseInst) ? 'Occlusion' : 'Pose';
        activeAccum = 0; activeN = 0;

        const msg = alertCauseMessage(activeCause);
        try {
          activeAlertId = await beginAlert({ type: AlertTypes.Prone, message: msg });
        } catch (e) {
          console.warn('[ALERTS] beginAlert failed', e);
          activeAlertId = null;
        }
        showAlertBanner(Date.now()); // respects snooze
      }

      // While active: accumulate avg on the triggering channel
      if (globalOn) {
        activeAccum += (activeCause === 'Pose' ? pPoseInst : pOccInst);
        activeN++;
      }

      // Falling edge: finish the alert
      if (!globalOn && prevGlobalAlert) {
        const avg = activeN ? (activeAccum / activeN) : (activeCause === 'Pose' ? lastPoseInst : lastOccInst);
        try {
          if (activeAlertId != null) {
            await finishAlert(activeAlertId, { avgScore: avg, message: 'Recovered from prone/occlusion' });
          }
        } catch (e) {
          console.warn('[ALERTS] finishAlert failed', e);
        } finally {
          activeAlertId = null;
          activeCause = null;
          activeAccum = 0; activeN = 0;
        }
      }

      prevGlobalAlert = globalOn;
    }

    /* ---------- Helpers, drawing, and the rest of your logic ---------- */
    // ... keep your existing helper functions (EMA, clamp, draw, HUD, etc.) ...

    /* ---------- Inference loop (receiver) ---------- */
    async function startReceiverFaceLoop() {
      // ... unchanged setup code ...
      const onFrame = () => {
        // ... unchanged guards ...
        const ts = performance.now();
        const dt = lastTs ? (ts - lastTs)/1000 : 0.016;
        lastTs = ts;

        try {
          const result = faceTask.detectForVideo(remoteVideo, ts);
          const present = !!(result?.faceLandmarks?.length);
          updateCalButtonState(present);

          // ... compute yawDeg, pitchDeg, rollDeg, relPitchDeg, rotMat, calibration sampling ...

          if (S.enabled) {
            const faceRisk = present ? 0 : 1; // 0 visible, 1 missing

            // Pose path
            const pitchDownNow = Number.isFinite(relPitchDeg) ? Math.max(0, -relPitchDeg) : NaN;
            let r2 = 0;
            if (Number.isFinite(pitchDownNow)) {
              const over = pitchDownNow - S.thetaOn;
              r2 = clamp((over + 10) / 30, 0, 1);
            }
            const rPoseInst = POSE_RANGE * r2;               // 0..0.8
            poseRiskEma = emaUpdate(poseRiskEma, rPoseInst, S.emaTau, dt);
            pitchEma    = emaUpdate(pitchEma,  pitchDownNow, S.emaTau, dt);

            // Pose hysteresis + dwell
            if (!poseAlert) {
              if (poseRiskEma > S.poseThrOn) { poseAboveT += dt; poseBelowT = 0; }
              else { poseAboveT = Math.max(0, poseAboveT - dt*0.5); }
              if (poseAboveT >= S.poseDwellOn) { poseAlert = true; poseAboveT = 0; poseBelowT = 0; }
            } else {
              if (poseRiskEma < S.poseThrOff) { poseBelowT += dt; poseAboveT = 0; }
              else { poseBelowT = Math.max(0, poseBelowT - dt*0.5); }
              if (poseBelowT >= S.poseDwellOff) { poseAlert = false; poseAboveT = 0; poseBelowT = 0; }
            }

            // Occlusion path (EMA of presence)
            occEma = emaUpdate(occEma, faceRisk, S.emaTau, dt);
            if (!occAlert) {
              if (occEma > S.occThrOn) { occAboveT += dt; occBelowT = 0; }
              else { occAboveT = Math.max(0, occAboveT - dt*0.5); }
              if (occAboveT >= S.occDwellOn) { occAlert = true; occAboveT = 0; occBelowT = 0; }
            } else {
              if (occEma < S.occThrOff) { occBelowT += dt; occAboveT = 0; }
              else { occBelowT = Math.max(0, occBelowT - dt*0.5); }
              if (occBelowT >= S.occDwellOff) { occAlert = false; occAboveT = 0; occBelowT = 0; }
            }

            // Global alert (OR)
            const newAlert = poseAlert || occAlert;
            if (newAlert !== alert) {
              alert = newAlert;
              showStatus(alert ? 'PRONE suspected' : 'Recovered from prone');
            }

            // Fused risk for visuals (0..1)
            const pOccInst  = faceRisk;                               // 0..1
            const pPoseInst = clamp(rPoseInst / POSE_RANGE, 0, 1);    // 0..1
            const fusedInst = Math.max(pOccInst, pPoseInst);          // 0..1
            riskEma = emaUpdate(riskEma, fusedInst, S.emaTau, dt);

            /* 🔔 Alerts: persist + banner; pass boolean states with instantaneous risks */
            handleAlertTransitions({
              poseOn: poseAlert,
              occOn:  occAlert,
              pPoseInst,
              pOccInst,
              fusedInst
            });

          } else {
            // Disabled: reset states
            poseAlert = occAlert = alert = false;
            poseAboveT = poseBelowT = 0;
            occAboveT  = occBelowT  = 0;
          }

          // Draw + HUD
          drawFaceAndHUD(result, {
            showLM: S.showLM,
            showOrient: S.showOrient,
            yawDeg, pitchDeg, rollDeg, relPitchDeg,
            risk: riskEma||0, alert,
            rotMat
          });
          updatePill(riskEma||0, alert);
          updateHud(Number.isFinite(pitchEma)?pitchEma:NaN, riskEma||0, yawDeg, pitchDeg, rollDeg, relPitchDeg);

        } catch (err) {
          console.warn('[FACE][receiver] detect error (retrying next frame)', err);
        } finally {
          scheduleNext();
        }
      };
      // ... rest of loop scaffolding unchanged ...
    }

    /* ---------- DataChannel (sender-driven inference) ---------- */

    // --------------------------------------------------------------------------------
