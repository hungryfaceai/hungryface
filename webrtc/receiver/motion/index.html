<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Baby Monitor – Receiver</title>
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>

  <!-- ⬇️ Add shared sidebar stylesheet -->
  <link rel="stylesheet" href="/hungryface/webrtc/receiver/shared/sidebar.css" />

  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0; height: 100%;
      background: #000; color: #fff;
      font-family: -apple-system, system-ui, Segoe UI, Roboto, sans-serif;
      overflow: hidden;
    }
    /* Fullscreen wrapper so video+canvas scale together */
    #stage {
      position: fixed; inset: 0;
      width: 100vw; height: 100vh;   /* fallback */
      width: 100dvw; height: 100dvh; /* dynamic viewport */
      width: 100svw; height: 100svh; /* small viewport (iOS URL bar safe) */
      z-index: 1; background: #000;
    }
    #stage > video {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: contain; background: #000;
    }
    #stage > canvas {
      position: absolute;
      z-index: 2; pointer-events: none; background: transparent; display: none;
    }

    .btn {
      padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.6);
      background: transparent; color: #fff; font-size: 16px; font-weight: 600;
      cursor: pointer; box-shadow: none;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    }
    .btn:active { transform: scale(0.99); }

    #controls {
      position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
      display: flex; align-items: center; gap: 12px; z-index: 6;
    }
    #enableAudioBtn, #disableAudioBtn { display: none; }

    .overlay {
      position: fixed; inset: 0; display: flex;
      align-items: center; justify-content: center;
      pointer-events: none; z-index: 5;
    }
    .status {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: #ddd; font-size: 14px; padding: 10px 14px; border-radius: 12px;
      text-align: center; white-space: pre-line; max-width: 90vw;
    }
    .overlay.hidden { display: none; }

    /* Movement panel */
    #movePanel {
      position: fixed; right: 16px; bottom: 80px; z-index: 7;
      width: min(380px, 92vw);
      background: rgba(20,20,20,0.9);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      backdrop-filter: blur(6px);
      padding: 12px 12px 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
    #movePanel.hidden { display: none; }
    #movePanel header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; margin-bottom: 6px;
    }
    #movePanel h3 {
      margin: 0; font-size: 14px; font-weight: 700; color: #eee;
    }
    #movePanel .close {
      appearance: none; border: none; background: transparent; color: #aaa;
      font-size: 20px; line-height: 1; cursor: pointer; padding: 2px 6px;
    }
    #movePanel .row {
      display: grid; grid-template-columns: auto 1fr auto; align-items: center;
      gap: 10px; margin: 8px 0;
    }
    #movePanel label { font-size: 12px; color: #ccc; white-space: nowrap; }
    #movePanel input[type="range"] { width: 100%; }
    #movePanel output {
      font-variant-numeric: tabular-nums; font-size: 12px; color: #ddd;
      min-width: 64px; text-align: right;
    }
    #movePanel .muted { color: #aaa; font-size: 12px; }
    #movePanel .stateRow {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 8px; margin-bottom: 4px;
      border: 1px dashed rgba(255,255,255,0.15); border-radius: 10px;
    }
    #movePanel .pill {
      padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600;
      border: 1px solid rgba(255,255,255,0.2);
    }
    #movePanel .pill.moving  { background: #4a2a00; color: #ffcc80; border-color: #ffa64d; }
    #movePanel .pill.still   { background: #111;   color: #ddd;     border-color: rgba(255,255,255,0.25); }
    #movePanel .groupTitle { margin: 10px 0 2px; font-size: 12px; color: #bbb; font-weight: 700; }
    #movePanel .row3 { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; }
    #movePanel .actions {
      display: flex; gap: 8px; justify-content: space-between; margin-top: 6px; align-items: center;
    }
    #movePanel .small {
      padding: 8px 10px; font-size: 13px; border-radius: 10px;
    }
    #movePanel .checkRow {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; margin-top: 4px;
    }
    #movePanel .checkRow label { display: flex; align-items: center; gap: 8px; }

    /* Calibration bits */
    #calProgRow { display: none; }
    #calStatus.ok { color: #b7f0b7; }
    #calStatus.warn { color: #ffd27a; }
    #calStatus.err { color: #ff9b9b; }
    progress { width: 100%; height: 6px; border-radius: 999px; overflow: hidden; }
  </style>
</head>
<body>
  <!-- ⬇️ Inject shared sidebar markup and behavior (kept separate from your code) -->
  <script type="module">
    (async () => {
      try {
        const res = await fetch('/hungryface/webrtc/receiver/shared/sidebar.html', { cache: 'no-cache' });
        const html = await res.text();
        const wrap = document.createElement('div');
        wrap.innerHTML = html.trim();
        document.body.prepend(...wrap.childNodes);

        await new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = '/hungryface/webrtc/receiver/shared/sidebar.js';
          s.onload = resolve;
          s.onerror = reject;
          document.body.appendChild(s);
        });
      } catch (err) {
        console.error('[Sidebar] failed to load shared assets:', err);
      }
    })();
  </script>

  <div id="controls">
    <button id="enableAudioBtn" class="btn" type="button">Enable audio</button>
    <button id="disableAudioBtn" class="btn" type="button">Disable audio</button>
    <button id="fsBtn" class="btn" type="button">Fullscreen</button>
    <button id="moveBtn" class="btn" type="button">Movement settings</button>
  </div>

  <!-- Movement control panel -->
  <section id="movePanel" class="hidden" aria-label="Movement settings">
    <header>
      <h3>Movement detection</h3>
      <button id="moveClose" class="close" title="Close">×</button>
    </header>

    <div class="stateRow">
      <div class="muted">State: <span id="moveStateTxt" class="pill still">STILL</span></div>
      <div class="muted">
        Scores: EMA <strong id="emaScoreTxt">0.000</strong> · INT <strong id="intScoreTxt">0.000</strong> · DRIFT <strong id="driftScoreTxt">0.000</strong>
      </div>
    </div>

    <!-- Confidence gates -->
    <div class="groupTitle">Confidence gates</div>
    <div class="row">
      <label for="visMin">Visibility min</label>
      <input id="visMin" type="range" min="0.00" max="0.99" step="0.01">
      <output id="visOut">0.50</output>
    </div>
    <div class="row">
      <label for="presMin">Presence min (opt)</label>
      <input id="presMin" type="range" min="0.00" max="0.99" step="0.01">
      <output id="presOut">0.00</output>
    </div>

    <!-- EMA -->
    <div class="groupTitle">Short-term (EMA)</div>
    <div class="row">
      <label for="ema">EMA α</label>
      <input id="ema" type="range" min="0.01" max="0.90" step="0.01">
      <output id="emaOut">0.20</output>
    </div>
    <div class="row">
      <label for="onTh">EMA ON</label>
      <input id="onTh" type="range" min="0.005" max="1.000" step="0.005">
      <output id="onOut">0.060</output>
    </div>
    <div class="row">
      <label for="offTh">EMA OFF</label>
      <input id="offTh" type="range" min="0.005" max="0.300" step="0.005">
      <output id="offOut">0.030</output>
    </div>

    <!-- Integrator -->
    <div class="groupTitle">Long-term (Integrator)</div>
    <div class="row">
      <label for="tau">INT τ (s)</label>
      <input id="tau" type="range" min="0.5" max="8.0" step="0.1">
      <output id="tauOut">3.0 s</output>
    </div>
    <div class="row">
      <label for="intOn">INT ON</label>
      <input id="intOn" type="range" min="0.005" max="1.000" step="0.005">
      <output id="intOnOut">0.035</output>
    </div>
    <div class="row">
      <label for="intOff">INT OFF</label>
      <input id="intOff" type="range" min="0.005" max="0.100" step="0.005">
      <output id="intOffOut">0.020</output>
    </div>

    <!-- Baseline drift -->
    <div class="groupTitle">Baseline drift</div>
    <div class="row">
      <label for="driftTau">Baseline τ (s)</label>
      <input id="driftTau" type="range" min="0.5" max="8.0" step="0.1">
      <output id="driftTauOut">2.5 s</output>
    </div>
    <div class="row">
      <label for="driftOn">DRIFT ON</label>
      <input id="driftOn" type="range" min="0.010" max="1.000" step="0.005">
      <output id="driftOnOut">0.080</output>
    </div>
    <div class="row">
      <label for="driftOff">DRIFT OFF</label>
      <input id="driftOff" type="range" min="0.005" max="0.150" step="0.005">
      <output id="driftOffOut">0.050</output>
    </div>
    <div class="checkRow">
      <label>
        <input id="driftTorsoRel" type="checkbox">
        Torso-relative baseline (reduces camera shake)
      </label>
      <button id="driftReset" class="btn small" type="button">Reset baseline</button>
    </div>

    <!-- Auto-calibration -->
    <div class="groupTitle">Calibration</div>
    <div class="row">
      <label>Auto-calibrate</label>
      <button id="calStart" class="btn small" type="button">Auto-calibrate (15s)</button>
      <output id="calStatus" class="muted">Idle</output>
    </div>
    <div class="row" id="calProgRow">
      <label>Progress</label>
      <progress id="calProg" max="1" value="0"></progress>
      <output id="calTime">15s</output>
    </div>

    <div class="actions">
      <button id="moveReset" class="btn small" type="button">Reset all defaults</button>
      <button id="moveHide"  class="btn small" type="button">Hide</button>
    </div>
  </section>

  <div id="stage">
    <video id="remote" autoplay playsinline></video>
    <canvas id="poseCanvas"></canvas>
  </div>

  <div id="overlay" class="overlay">
    <div id="status" class="status">Idle</div>
  </div>

  <script type="module">
    import { DrawingUtils, PoseLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0";
    import { ReceiverCore } from "/hungryface/webrtc/receiver/shared/receiver-core.js";

    /* ---------- Constants ---------- */
    const WS_ENDPOINT = "wss://signaling-server-f5gu.onrender.com/ws";
    const room = new URLSearchParams(location.search).get("room") || "Baby";
    const STATUS_HIDE_AFTER_CONNECTED_MS = 10000;

    // Movement detection config (defaults + persistence)
    const MOVE_DEFAULTS = {
      // Confidence gates
      VIS_MIN: 0.50,
      PRES_MIN: 0.00,

      // Short-term (EMA)
      EMA_ALPHA: 0.20,
      ON:  0.06,
      OFF: 0.03,
      OFF_HOLD_MS: 700,

      // Normalization
      MIN_SCALE: 0.02,

      // Long-term (Integrator)
      INT_TAU: 3.0,   // seconds, decay time-constant
      INT_ON:  0.035,
      INT_OFF: 0.020,

      // Baseline drift
      DRIFT_TAU: 2.5,      // seconds, baseline adapt speed (only when STILL)
      DRIFT_ON:  0.080,
      DRIFT_OFF: 0.050,
      DRIFT_TORSO_REL: true
    };
    const LS_KEY = 'naptio-move-config-v4';
    const MOVE = { ...MOVE_DEFAULTS, ...loadMoveConfig() };

    // Mediapipe assets
    const TASKS_URL = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0";
    const WASM_DIR = TASKS_URL + "/wasm";
    const POSE_MODEL_URL =
      "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";

    const HAVE_CURRENT_DATA = 2;

    /* ---------- DOM ---------- */
    const stage = document.getElementById('stage');
    const remoteVideo = document.getElementById('remote');
    const poseCanvas = document.getElementById('poseCanvas');
    const poseCtx = poseCanvas.getContext('2d', { alpha: true });

    const fsBtn = document.getElementById('fsBtn');
    const enableAudioBtn = document.getElementById('enableAudioBtn');
    const disableAudioBtn = document.getElementById('disableAudioBtn');
    const overlay = document.getElementById('overlay');
    const statusEl = document.getElementById('status');

    // Movement UI refs
    const moveBtn    = document.getElementById('moveBtn');
    const movePanel  = document.getElementById('movePanel');
    const moveClose  = document.getElementById('moveClose');
    const moveHide   = document.getElementById('moveHide');
    const moveReset  = document.getElementById('moveReset');

    const moveStateTxt  = document.getElementById('moveStateTxt');
    const emaScoreTxt   = document.getElementById('emaScoreTxt');
    const intScoreTxt   = document.getElementById('intScoreTxt');
    const driftScoreTxt = document.getElementById('driftScoreTxt');

    const visMin = document.getElementById('visMin'); const visOut = document.getElementById('visOut');
    const presMin = document.getElementById('presMin'); const presOut = document.getElementById('presOut');

    const ema   = document.getElementById('ema');   const emaOut = document.getElementById('emaOut');
    const onTh  = document.getElementById('onTh');  const onOut  = document.getElementById('onOut');
    const offTh = document.getElementById('offTh'); const offOut = document.getElementById('offOut');

    const tau     = document.getElementById('tau');     const tauOut     = document.getElementById('tauOut');
    const intOn   = document.getElementById('intOn');   const intOnOut   = document.getElementById('intOnOut');
    const intOff  = document.getElementById('intOff');  const intOffOut  = document.getElementById('intOffOut');

    const driftTau    = document.getElementById('driftTau');   const driftTauOut = document.getElementById('driftTauOut');
    const driftOn     = document.getElementById('driftOn');    const driftOnOut  = document.getElementById('driftOnOut');
    const driftOff    = document.getElementById('driftOff');   const driftOffOut = document.getElementById('driftOffOut');
    const driftTorsoRel = document.getElementById('driftTorsoRel');
    const driftReset  = document.getElementById('driftReset');

    // Calibration UI
    const calStartBtn = document.getElementById('calStart');
    const calStatus   = document.getElementById('calStatus');
    const calProgRow  = document.getElementById('calProgRow');
    const calProg     = document.getElementById('calProg');
    const calTime     = document.getElementById('calTime');

    /* ---------- State ---------- */
    let hideStatusTimer = null;

    // Pose state
    let poseDC = null;
    let poseEnabled = false;
    let poseWhere = 'sender'; // 'sender' | 'receiver'
    let poseTask = null;
    let poseLoopRunning = false;

    // Movement state
    let prevLm = null;           // previous 33 landmarks
    let baseLm = null;           // baseline landmarks (slowly adapted when STILL)
    let moveEma = 0;             // short-term EMA score
    let intScore = 0;            // long-term leaky integrator
    let driftScore = 0;          // baseline drift score
    let moving = false;
    let movingSince = 0;
    let lastAboveOnTs = 0;       // last time EMA raw >= ON (for EMA hold)
    let lastIntHitTs = 0;        // last time integrator ≥ INT_ON
    let lastDriftHitTs = 0;      // last time drift ≥ DRIFT_ON
    let lastTs = 0;              // ms (local perf clock)

    // Calibration state
    const CAL_DURATION_MS = 15000;
    let calActive = false, calStart = 0;
    let calSamples = [];         // raw per-frame scores
    let lastGoodLm = null;       // last good frame to seed baseline

    /* ---------- Status overlay ---------- */
    function showStatus(msg) {
      statusEl.textContent = msg;
      overlay.classList.remove('hidden');
      if (msg === 'Connected') {
        if (hideStatusTimer) clearTimeout(hideStatusTimer);
        hideStatusTimer = setTimeout(() => overlay.classList.add('hidden'), STATUS_HIDE_AFTER_CONNECTED_MS);
      } else {
        if (hideStatusTimer) { clearTimeout(hideStatusTimer); hideStatusTimer = null; }
      }
    }

    /* ---------- Audio UI ---------- */
    function updateAudioButtons() {
      if (remoteVideo.muted) {
        enableAudioBtn.style.display = 'block';
        disableAudioBtn.style.display = 'none';
      } else {
        enableAudioBtn.style.display = 'none';
        disableAudioBtn.style.display = 'block';
      }
    }
    enableAudioBtn.style.display = 'block';
    async function tryStartMuted() {
      try { remoteVideo.muted = true; remoteVideo.volume = 1.0; await remoteVideo.play(); }
      catch (e) { console.warn('autoplay (muted) blocked:', e); }
      updateAudioButtons();
    }
    enableAudioBtn.addEventListener('click', async (e) => {
      e?.stopPropagation?.(); e?.preventDefault?.();
      try { remoteVideo.muted = false; remoteVideo.volume = 1.0; await remoteVideo.play(); }
      catch (err) { console.warn('unmute play blocked:', err); }
      updateAudioButtons();
    });
    disableAudioBtn.addEventListener('click', (e) => {
      e?.stopPropagation?.(); e?.preventDefault?.();
      remoteVideo.muted = true;
      updateAudioButtons();
    });

    /* ---------- Fullscreen ---------- */
    const beginViewportSettle = (durationMs = 1200) => {
      let settleRAF = 0, settleUntil = performance.now() + durationMs;
      const tick = () => {
        alignCanvasToVideo();
        if (performance.now() < settleUntil) {
          settleRAF = requestAnimationFrame(tick);
        } else {
          cancelAnimationFrame(settleRAF); settleRAF = 0;
          alignCanvasToVideo();
        }
      };
      tick();
    };
    fsBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      try {
        if (!document.fullscreenElement) {
          await (stage.requestFullscreen?.call(stage) || document.documentElement.requestFullscreen());
          fsBtn.textContent = 'Exit fullscreen';
        } else {
          await document.exitFullscreen();
          fsBtn.textContent = 'Fullscreen';
        }
      } catch (err) { console.warn('fullscreen error', err); }
      beginViewportSettle();
    });
    document.addEventListener('fullscreenchange', () => {
      fsBtn.textContent = document.fullscreenElement ? 'Exit fullscreen' : 'Fullscreen';
      beginViewportSettle();
    });

    remoteVideo.addEventListener('loadedmetadata', () => { beginViewportSettle(); });
    remoteVideo.addEventListener('playing', () => { updateAudioButtons(); beginViewportSettle(); });
    remoteVideo.addEventListener('resize', beginViewportSettle);

    /* ---------- Canvas alignment ---------- */
    function containRect(containerW, containerH, contentW, contentH) {
      const scale = Math.min(containerW / (contentW||1), containerH / (contentH||1));
      const w = Math.round(contentW * scale);
      const h = Math.round(contentH * scale);
      return { width:w, height:h, left: Math.floor((containerW - w) / 2), top: Math.floor((containerH - h) / 2) };
    }
    function alignCanvasToVideo() {
      const stageBox = stage.getBoundingClientRect();
      const videoBox = remoteVideo.getBoundingClientRect();
      const containerW = Math.round(videoBox.width);
      const containerH = Math.round(videoBox.height);
      const vidW = remoteVideo.videoWidth || 1;
      const vidH = remoteVideo.videoHeight || 1;
      const fit = containRect(containerW, containerH, vidW, vidH);
      const leftCSS = Math.round((videoBox.left - stageBox.left) + fit.left);
      const topCSS = Math.round((videoBox.top - stageBox.top) + fit.top);
      poseCanvas.style.left = leftCSS + 'px';
      poseCanvas.style.top = topCSS + 'px';
      poseCanvas.style.width = fit.width + 'px';
      poseCanvas.style.height = fit.height + 'px';
      const dpr = window.devicePixelRatio || 1;
      const needW = Math.max(1, Math.round(fit.width * dpr));
      const needH = Math.max(1, Math.round(fit.height * dpr));
      if (poseCanvas.width !== needW || poseCanvas.height !== needH) {
        poseCanvas.width = needW; poseCanvas.height = needH;
      }
      poseCtx.setTransform(1,0,0,1,0,0);
    }
    ['resize','orientationchange','scroll'].forEach(ev =>
      window.addEventListener(ev, () => beginViewportSettle(), { passive: true })
    );
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', () => beginViewportSettle(), { passive: true });
      window.visualViewport.addEventListener('scroll',  () => beginViewportSettle(), { passive: true });
    }
    document.addEventListener('visibilitychange', () => { if (!document.hidden) beginViewportSettle(); });

    /* ---------- Overlay helpers ---------- */
    function setOverlayVisible(v) {
      poseCanvas.style.display = v ? 'block' : 'none';
      if (v) beginViewportSettle();
      else poseCtx.clearRect(0,0, poseCanvas.width, poseCanvas.height);
    }
    function drawPoseLandmarks(landmarks) {
      if (!landmarks?.length || !poseCanvas.width || !poseCanvas.height) return;
      const utils = new DrawingUtils(poseCtx);
      for (const lm of landmarks) {
        utils.drawLandmarks(lm, {
          radius: (data) => DrawingUtils.lerp((data.from && data.from.z) ?? 0, -0.15, 0.1, 5, 1)
        });
        utils.drawConnectors(lm, PoseLandmarker.POSE_CONNECTIONS);
      }
    }

    /* ---------- Movement math helpers ---------- */
    const L = { L_SHOULDER: 11, R_SHOULDER: 12, L_HIP: 23, R_HIP: 24 };
    const lmOk = (p) =>
      p &&
      (p.visibility == null || p.visibility >= MOVE.VIS_MIN) &&
      (p.presence   == null || p.presence   >= MOVE.PRES_MIN);

    const dist2 = (a, b) => Math.hypot((a.x - b.x), (a.y - b.y));

    function torsoCenter(lm) {
      const ls = lm[L.L_SHOULDER], rs = lm[L.R_SHOULDER], lh = lm[L.L_HIP], rh = lm[L.R_HIP];
      const c = { x:0, y:0, n:0 };
      if (lmOk(ls) && lmOk(rs)) { c.x += (ls.x+rs.x)/2; c.y += (ls.y+rs.y)/2; c.n++; }
      if (lmOk(lh) && lmOk(rh)) { c.x += (lh.x+rh.x)/2; c.y += (lh.y+rh.y)/2; c.n++; }
      if (c.n) return { x: c.x/c.n, y: c.y/c.n };
      // fallback: centroid of all kept
      let n=0, sx=0, sy=0;
      for (const p of lm) if (lmOk(p)) { sx+=p.x; sy+=p.y; n++; }
      return n ? { x:sx/n, y:sy/n } : { x:0.5, y:0.5 };
    }

    function scaleFromTorso(lm) {
      const ls = lm[L.L_SHOULDER], rs = lm[L.R_SHOULDER];
      const lh = lm[L.L_HIP],      rh = lm[L.R_HIP];
      let s = 0;
      if (lmOk(ls) && lmOk(rs)) s = Math.max(s, dist2(ls, rs));
      if (lmOk(lh) && lmOk(rh)) s = Math.max(s, dist2(lh, rh));
      if (!s) {
        let minx=1, miny=1, maxx=0, maxy=0, any=false;
        for (const p of lm) if (lmOk(p)) { any=true; minx=Math.min(minx,p.x); miny=Math.min(miny,p.y); maxx=Math.max(maxx,p.x); maxy=Math.max(maxy,p.y); }
        if (any) s = Math.hypot(maxx-minx, maxy-miny);
      }
      return Math.max(s, MOVE.MIN_SCALE);
    }

    function rawMovementScore(lm, prev) {
      if (!lm || !prev || lm.length !== prev.length) return 0;
      const n = lm.length; const scale = scaleFromTorso(lm);
      let sum = 0, cnt = 0;
      for (let i=0; i<n; i++) { const a = lm[i], b = prev[i]; if (!lmOk(a) || !lmOk(b)) continue; sum += dist2(a, b); cnt++; }
      return cnt ? (sum / cnt) / scale : 0;
    }

    function computeDriftScore(lm, base, torsoRel=true) {
      if (!lm || !base || lm.length !== base.length) return 0;
      const n = lm.length; const scale = scaleFromTorso(lm);
      let sum = 0, cnt = 0;

      let cNow = {x:0,y:0}, cBase = {x:0,y:0};
      if (torsoRel) { cNow = torsoCenter(lm); cBase = torsoCenter(base); }

      for (let i=0; i<n; i++) {
        const a = lm[i], b = base[i];
        if (!lmOk(a) || !lmOk(b)) continue;
        const ax = a.x - (torsoRel ? cNow.x : 0), ay = a.y - (torsoRel ? cNow.y : 0);
        const bx = b.x - (torsoRel ? cBase.x : 0), by = b.y - (torsoRel ? cBase.y : 0);
        sum += Math.hypot(ax - bx, ay - by);
        cnt++;
      }
      return cnt ? (sum / cnt) / scale : 0;
    }

    function cloneLm(lm) {
      return lm?.map(p => p ? { x:p.x, y:p.y, z:p.z, visibility:p.visibility, presence:p.presence } : null) || null;
    }
    function blendLm(dst, src, a) {
      // dst := lerp(dst, src, a) for ok points; create if absent
      if (!src) return dst;
      if (!dst || dst.length !== src.length) dst = cloneLm(src);
      for (let i=0; i<src.length; i++) {
        const s = src[i]; if (!lmOk(s)) continue;
        if (!dst[i] || !lmOk(dst[i])) { dst[i] = { x:s.x, y:s.y, z:s.z, visibility:s.visibility, presence:s.presence }; continue; }
        const d = dst[i];
        d.x += a*(s.x - d.x); d.y += a*(s.y - d.y);
        if (s.z != null && d.z != null) d.z += a*(s.z - d.z);
        d.visibility = s.visibility ?? d.visibility;
        d.presence   = s.presence   ?? d.presence;
      }
      return dst;
    }

    /* ---------- Main per-frame update ---------- */
    function drawMovementBadge(movingState, emaVal, intVal, driftVal) {
      const ctx = poseCtx;
      const dpr = window.devicePixelRatio || 1;
      const pad = Math.round(8*dpr), x = pad, y = pad;
      const txt = `EMA ${emaVal.toFixed(3)}  ·  INT ${intVal.toFixed(3)}  ·  DRIFT ${driftVal.toFixed(3)}   ${movingState ? '• MOVING' : '• STILL'}`;

      ctx.save();
      ctx.font = `${Math.round(14*dpr)}px -apple-system,system-ui,Segoe UI,Roboto,sans-serif`;
      const textW = ctx.measureText(txt).width;
      const boxW = Math.round(textW + pad*2), boxH = Math.round(26*dpr);

      ctx.globalAlpha = 0.7; ctx.fillStyle = movingState ? '#4a2a00' : '#111'; ctx.fillRect(x,y,boxW,boxH);
      ctx.globalAlpha = 0.9; ctx.strokeStyle = movingState ? '#ffa64d' : 'rgba(255,255,255,0.25)'; ctx.lineWidth = Math.max(1, Math.round(1*dpr)); ctx.strokeRect(x+0.5,y+0.5,boxW-1,boxH-1);
      ctx.globalAlpha = 1; ctx.fillStyle = movingState ? '#ffcc80' : '#ddd'; ctx.fillText(txt, x+pad, y+boxH - Math.round(8*dpr));
      ctx.restore();
    }

    function reflectPanel() {
      emaScoreTxt.textContent   = moveEma.toFixed(3);
      intScoreTxt.textContent   = intScore.toFixed(3);
      driftScoreTxt.textContent = driftScore.toFixed(3);
      moveStateTxt.textContent  = moving ? 'MOVING' : 'STILL';
      moveStateTxt.classList.toggle('moving', moving);
      moveStateTxt.classList.toggle('still', !moving);
    }

    function updateMovementFromLandmarks(lm, canSend=true) {
      const now = performance.now();
      if (!lastTs) lastTs = now;
      const dt = Math.max(1/120, Math.min(0.2, (now - lastTs) / 1000)); // clamp 8.3ms..200ms
      lastTs = now;

      // --- Short-term: EMA of per-frame normalized displacement ---
      const raw = rawMovementScore(lm, prevLm);
      prevLm = lm;
      moveEma = moveEma + MOVE.EMA_ALPHA * (raw - moveEma);
      if (raw >= MOVE.ON) lastAboveOnTs = now;
      const shortTrigger = (moveEma >= MOVE.ON);
      const shortHoldOk  = (moveEma > MOVE.OFF) || ((now - lastAboveOnTs) < MOVE.OFF_HOLD_MS);

      // --- Long-term: Leaky integrator (FPS-independent) ---
      const decay = Math.exp(-dt / MOVE.INT_TAU);
      intScore = intScore * decay + raw * dt;
      const longTrigger = (intScore >= MOVE.INT_ON);
      if (longTrigger) lastIntHitTs = now;
      const longHoldOk  = (intScore > MOVE.INT_OFF) || ((now - lastIntHitTs) < MOVE.OFF_HOLD_MS);

      // --- Baseline drift vs slowly-adapting baseline (only adapts when STILL) ---
      if (!baseLm) baseLm = cloneLm(lm);
      driftScore = computeDriftScore(lm, baseLm, MOVE.DRIFT_TORSO_REL);

      const driftTrigger = (driftScore >= MOVE.DRIFT_ON);
      if (driftTrigger) lastDriftHitTs = now;
      const driftHoldOk  = (driftScore > MOVE.DRIFT_OFF) || ((now - lastDriftHitTs) < MOVE.OFF_HOLD_MS);

      // Combine: either path can enter; any hold can keep it
      const wantMoving = moving ? (shortHoldOk || longHoldOk || driftHoldOk)
                                : (shortTrigger || longTrigger || driftTrigger);

      if (wantMoving !== moving) {
        moving = wantMoving;
        if (moving) movingSince = now;
      }

      // Baseline adaptation: ONLY when STILL to avoid chasing motion
      if (!moving && baseLm) {
        const a = 1 - Math.exp(-dt / MOVE.DRIFT_TAU); // time-constant-based blend
        baseLm = blendLm(baseLm, lm, a);
      }

      /* ---- Calibration sampling/progress ---- */
      if (calActive) {
        calSamples.push(raw);
        lastGoodLm = cloneLm(lm);
        const t = now - calStart;
        calProg.value = Math.min(1, t / CAL_DURATION_MS);
        calTime.textContent = Math.max(0, Math.ceil((CAL_DURATION_MS - t)/1000)) + 's';
        if (t >= CAL_DURATION_MS) finishCalibration();
      }

      // draw + panel
      poseCtx.save();
      drawMovementBadge(moving, moveEma, intScore, driftScore);
      poseCtx.restore();
      reflectPanel();

      // optionally send movement packet to sender when we own inference
      if (canSend && poseWhere === 'receiver' && poseDC?.readyState === 'open') {
        poseDC.send(JSON.stringify({
          type: 'movement',
          where: 'receiver',
          moving,
          scoreEma: moveEma,
          scoreInt: intScore,
          scoreDrift: driftScore,
          ts: now
        }));
      }
    }

    /* ---------- Calibration helpers ---------- */
    function quantile(arr, q) {
      if (!arr.length) return 0;
      const a = arr.slice().sort((x,y)=>x-y);
      const pos = (a.length - 1) * q;
      const i = Math.floor(pos), j = Math.ceil(pos);
      if (i === j) return a[i];
      const w = pos - i;
      return a[i]*(1-w) + a[j]*w;
    }

    function startCalibration() {
      if (calActive) return;
      calActive = true; calStart = performance.now();
      calSamples = []; lastGoodLm = null;
      calStatus.className = 'muted'; calStatus.textContent = 'Calibrating — keep still';
      calProgRow.style.display = 'grid';
      calProg.value = 0; calTime.textContent = Math.round(CAL_DURATION_MS/1000) + 's';
    }

    // === NO UPPER CAPS on ON thresholds (floors only) ===
    function finishCalibration() {
      calActive = false;
      calProgRow.style.display = 'none';

      // Stats from raw per-frame motion
      const m   = quantile(calSamples, 0.5);
      const p95 = quantile(calSamples, 0.95);
      const floor = (v, min) => Math.max(min, v);

      // EMA thresholds
      const onBase = Math.max(3.5*m, 1.2*p95, 0.01);
      MOVE.ON  = floor(onBase, 0.01);
      MOVE.OFF = Math.min(MOVE.ON, Math.max(0.005, MOVE.ON*0.65));

      // Integrator thresholds (time-aware; scales with τ)
      const intOn = MOVE.INT_TAU * m * 2.5;
      MOVE.INT_ON  = floor(intOn, 0.005);
      MOVE.INT_OFF = Math.min(MOVE.INT_ON, Math.max(0.005, MOVE.INT_ON*0.6));

      // Drift thresholds (posture change vs baseline)
      const driftOn = Math.max(5.0*m, 1.5*MOVE.ON, 0.02);
      MOVE.DRIFT_ON  = floor(driftOn, 0.02);
      MOVE.DRIFT_OFF = Math.min(MOVE.DRIFT_ON, Math.max(0.005, MOVE.DRIFT_ON*0.65));

      // Seed baseline from last good frame; clear dynamics so we’re stable
      if (lastGoodLm) baseLm = cloneLm(lastGoodLm);
      moveEma = 0; intScore = 0; driftScore = 0; lastTs = 0;

      // Persist + reflect UI and make sure sliders can show new values
      saveMoveConfig();
      ensureSliderRange(onTh,     MOVE.ON);
      ensureSliderRange(intOn,    MOVE.INT_ON);
      ensureSliderRange(driftOn,  MOVE.DRIFT_ON);
      initMovePanel();

      // Result summary
      const summary = `OK · median=${m.toFixed(4)}, p95=${p95.toFixed(4)} → EMA ON=${MOVE.ON.toFixed(3)}, INT ON=${MOVE.INT_ON.toFixed(3)}, DRIFT ON=${MOVE.DRIFT_ON.toFixed(3)}`;
      calStatus.className = 'ok';
      calStatus.textContent = summary;
      setTimeout(()=>{ calStatus.className = 'muted'; }, 6000);
    }

    /* ---------- Clear / stream end helpers ---------- */
    function clearOverlayDrawing() {
      try { poseCtx.setTransform(1,0,0,1,0,0); poseCtx.clearRect(0, 0, poseCanvas.width, poseCanvas.height); } catch {}
    }
    function attachStreamEndHandlers(stream) {
      if (!stream) return;
      stream.getVideoTracks().forEach((t) => {
        t.addEventListener('ended',  clearOverlayDrawing);
        t.addEventListener('mute',   clearOverlayDrawing);
      });
      stream.addEventListener('removetrack', (e) => { if (e.track?.kind === 'video') clearOverlayDrawing(); });
    }

    /* ---------- MediaPipe on RECEIVER ---------- */
    let useRVFC = false;
    async function ensurePoseTask() {
      if (poseTask) return poseTask;
      const vision = await FilesetResolver.forVisionTasks(WASM_DIR);
      poseTask = await PoseLandmarker.createFromOptions(vision, {
        baseOptions: { modelAssetPath: POSE_MODEL_URL, delegate: "GPU" },
        runningMode: "VIDEO",
        numPoses: 1
      });
      return poseTask;
    }
    function videoHasFrame(v) { return v && v.readyState >= HAVE_CURRENT_DATA && v.videoWidth > 0 && v.videoHeight > 0; }
    function waitForVideoFrame(video) {
      if (videoHasFrame(video)) return Promise.resolve();
      return new Promise((resolve) => {
        const check = () => { if (videoHasFrame(video)) { cleanup(); resolve(); } };
        const cleanup = () => { video.removeEventListener('loadedmetadata', check); video.removeEventListener('playing', check); video.removeEventListener('resize', check); };
        video.addEventListener('loadedmetadata', check);
        video.addEventListener('playing', check);
        video.addEventListener('resize', check);
      });
    }
    async function startReceiverPoseLoop() {
      if (poseLoopRunning) return;
      await ensurePoseTask(); await waitForVideoFrame(remoteVideo);
      useRVFC = 'requestVideoFrameCallback' in remoteVideo;
      poseLoopRunning = true;

      const onFrame = () => {
        if (!poseLoopRunning || !poseEnabled || poseWhere !== 'receiver') return;
        if (!videoHasFrame(remoteVideo)) { poseCtx.clearRect(0,0, poseCanvas.width, poseCanvas.height); scheduleNext(); return; }
        try {
          const ts = performance.now();
          const result = poseTask.detectForVideo(remoteVideo, ts);
          if (result?.landmarks?.length) {
            const lm = result.landmarks[0];
            poseCtx.clearRect(0,0, poseCanvas.width, poseCanvas.height);
            drawPoseLandmarks([lm]);
            updateMovementFromLandmarks(lm, /*canSend=*/true);
            if (poseDC?.readyState === 'open') {
              poseDC.send(JSON.stringify({ type:'pose', landmarks:[lm], ts }));
            }
          } else {
            prevLm = null;
            poseCtx.clearRect(0,0, poseCanvas.width, poseCanvas.height);
          }
        } catch (err) {}
        finally { scheduleNext(); }
      };
      const scheduleNext = () => { if (useRVFC) remoteVideo.requestVideoFrameCallback(onFrame); else requestAnimationFrame(onFrame); };
      scheduleNext();
    }
    function stopReceiverPoseLoop() {
      poseLoopRunning = false;
      prevLm = null;
      moveEma = 0; intScore = 0; driftScore = 0; lastTs = 0;
      // keep baseline; user can reset
      poseCtx.clearRect(0,0, poseCanvas.width, poseCanvas.height);
      reflectPanel();
    }
    function applyPoseMode() {
      setOverlayVisible(poseEnabled);
      if (!poseEnabled) { stopReceiverPoseLoop(); return; }
      if (poseWhere === 'receiver') startReceiverPoseLoop();
      else stopReceiverPoseLoop(); // sender mode: draw only what we receive
    }

    /* ---------- Shared WebRTC core (signaling + PC) ---------- */
    const core = new ReceiverCore({
      wsEndpoint: WS_ENDPOINT,
      room,

      onStatus: showStatus,

      onStream: (stream) => {
        if (remoteVideo.srcObject !== stream) {
          remoteVideo.srcObject = stream;
          tryStartMuted();
          attachStreamEndHandlers(stream);
        }
      },

      onIceState: (state) => {
        if (state === 'failed' || state === 'disconnected' || state === 'closed') {
          clearOverlayDrawing();
        }
      },

      onBye: () => {
        clearOverlayDrawing();
      },

      onCreatePC: (pc) => {
        // Pose DC (receiver initiates; bidirectional)
        const ch = pc.createDataChannel('pose');
        ch.onopen = () => {};
        ch.onclose = () => {};
        ch.onerror = () => {};
        ch.onmessage = (ev) => {
          try {
            const msg = JSON.parse(ev.data);
            if (msg.type === 'pose-mode') {
              poseEnabled = !!msg.enabled;
              poseWhere   = msg.where || 'sender';
              applyPoseMode();
            } else if (msg.type === 'pose') {
              if (poseEnabled && poseWhere === 'sender' && msg.landmarks?.length) {
                const lm = msg.landmarks[0];
                poseCtx.clearRect(0,0, poseCanvas.width, poseCanvas.height);
                drawPoseLandmarks([lm]);
                updateMovementFromLandmarks(lm, /*canSend=*/false);
              }
            }
          } catch {}
        };
        poseDC = ch;
      },

      onDataChannel: () => {}
    });

    core.start().catch(()=>{});

    /* ---------- Panel logic ---------- */
    function loadMoveConfig() {
      try {
        const raw = localStorage.getItem(LS_KEY);
        if (!raw) return {};
        const obj = JSON.parse(raw);
        const cfg = {};
        for (const k of Object.keys(MOVE_DEFAULTS)) {
          if (typeof obj[k] === typeof MOVE_DEFAULTS[k]) cfg[k] = obj[k];
        }
        return cfg;
      } catch { return {}; }
    }
    function saveMoveConfig() { try { localStorage.setItem(LS_KEY, JSON.stringify(MOVE)); } catch {} }
    const clampUi = (v,min,max)=>Math.max(min,Math.min(max,v));
    const fmt = (n,d=3)=>Number(n).toFixed(d);

    // Let sliders grow if calibration/user sets bigger values
    function ensureSliderRange(inputEl, val, pad=1.5) {
      const curMax = Number(inputEl.max) || 0.3;
      const wantMax = Math.max(curMax, val * pad);
      inputEl.max = wantMax.toFixed(3);
    }

    function initMovePanel() {
      visMin.value = MOVE.VIS_MIN; visOut.textContent = fmt(MOVE.VIS_MIN,2);
      presMin.value = MOVE.PRES_MIN; presOut.textContent = fmt(MOVE.PRES_MIN,2);

      ema.value = MOVE.EMA_ALPHA; emaOut.textContent = fmt(MOVE.EMA_ALPHA,2);

      onTh.value = MOVE.ON; onOut.textContent = fmt(MOVE.ON);
      ensureSliderRange(onTh, MOVE.ON);

      offTh.value = MOVE.OFF; offOut.textContent = fmt(MOVE.OFF);

      tau.value = MOVE.INT_TAU; tauOut.textContent = fmt(MOVE.INT_TAU,1)+' s';

      intOn.value = MOVE.INT_ON; intOnOut.textContent = fmt(MOVE.INT_ON);
      ensureSliderRange(intOn, MOVE.INT_ON);

      intOff.value = MOVE.INT_OFF; intOffOut.textContent = fmt(MOVE.INT_OFF);

      driftTau.value = MOVE.DRIFT_TAU; driftTauOut.textContent = fmt(MOVE.DRIFT_TAU,1)+' s';

      driftOn.value = MOVE.DRIFT_ON; driftOnOut.textContent = fmt(MOVE.DRIFT_ON);
      ensureSliderRange(driftOn, MOVE.DRIFT_ON);

      driftOff.value = MOVE.DRIFT_OFF; driftOffOut.textContent = fmt(MOVE.DRIFT_OFF);
      driftTorsoRel.checked = !!MOVE.DRIFT_TORSO_REL;

      reflectPanel();
    }

    function openMovePanel(){ movePanel.classList.remove('hidden'); }
    function closeMovePanel(){ movePanel.classList.add('hidden'); }
    moveBtn.addEventListener('click', openMovePanel);
    moveHide.addEventListener('click', closeMovePanel);
    moveClose.addEventListener('click', closeMovePanel);
    window.addEventListener('keydown', (e) => { if (e.key.toLowerCase() === 'm') movePanel.classList.toggle('hidden'); });

    // sliders
    visMin.addEventListener('input', ()=>{ MOVE.VIS_MIN = clampUi(parseFloat(visMin.value),0,0.99); visOut.textContent = fmt(MOVE.VIS_MIN,2); saveMoveConfig(); });
    presMin.addEventListener('input', ()=>{ MOVE.PRES_MIN = clampUi(parseFloat(presMin.value),0,0.99); presOut.textContent = fmt(MOVE.PRES_MIN,2); saveMoveConfig(); });

    ema.addEventListener('input', ()=>{ MOVE.EMA_ALPHA = clampUi(parseFloat(ema.value),0.01,0.90); emaOut.textContent = fmt(MOVE.EMA_ALPHA,2); saveMoveConfig(); });

    // ON sliders: floors only, and grow headroom dynamically
    onTh.addEventListener('input', ()=>{
      MOVE.ON = Math.max(0.005, parseFloat(onTh.value) || 0);
      if (MOVE.OFF > MOVE.ON){ MOVE.OFF = MOVE.ON; offTh.value = MOVE.OFF; offOut.textContent = fmt(MOVE.OFF); }
      onOut.textContent = fmt(MOVE.ON);
      ensureSliderRange(onTh, MOVE.ON);
      saveMoveConfig();
    });

    intOn.addEventListener('input', ()=>{
      MOVE.INT_ON = Math.max(0.005, parseFloat(intOn.value) || 0);
      if (MOVE.INT_OFF > MOVE.INT_ON){ MOVE.INT_OFF = MOVE.INT_ON; intOff.value = MOVE.INT_OFF; intOffOut.textContent = fmt(MOVE.INT_OFF); }
      intOnOut.textContent = fmt(MOVE.INT_ON);
      ensureSliderRange(intOn, MOVE.INT_ON);
      saveMoveConfig();
    });

    driftOn.addEventListener('input', ()=>{
      MOVE.DRIFT_ON = Math.max(0.005, parseFloat(driftOn.value) || 0);
      if (MOVE.DRIFT_OFF > MOVE.DRIFT_ON){ MOVE.DRIFT_OFF = MOVE.DRIFT_ON; driftOff.value = MOVE.DRIFT_OFF; driftOffOut.textContent = fmt(MOVE.DRIFT_OFF); }
      driftOnOut.textContent = fmt(MOVE.DRIFT_ON);
      ensureSliderRange(driftOn, MOVE.DRIFT_ON);
      saveMoveConfig();
    });

    // OFF sliders keep their upper bound tied to ON
    offTh.addEventListener('input', ()=>{ MOVE.OFF = clampUi(parseFloat(offTh.value),0.005,Math.max(0.005,MOVE.ON)); if (MOVE.OFF > MOVE.ON){ MOVE.OFF = MOVE.ON; offTh.value = MOVE.OFF; } offOut.textContent = fmt(MOVE.OFF); saveMoveConfig(); });
    tau.addEventListener('input', ()=>{ MOVE.INT_TAU = clampUi(parseFloat(tau.value),0.5,8.0); tauOut.textContent = fmt(MOVE.INT_TAU,1)+' s'; saveMoveConfig(); });
    intOff.addEventListener('input', ()=>{ MOVE.INT_OFF = clampUi(parseFloat(intOff.value),0.005,Math.max(0.005,MOVE.INT_ON)); if (MOVE.INT_OFF > MOVE.INT_ON){ MOVE.INT_OFF = MOVE.INT_ON; intOff.value = MOVE.INT_OFF; } intOffOut.textContent = fmt(MOVE.INT_OFF); saveMoveConfig(); });

    driftTau.addEventListener('input', ()=>{ MOVE.DRIFT_TAU = clampUi(parseFloat(driftTau.value),0.5,8.0); driftTauOut.textContent = fmt(MOVE.DRIFT_TAU,1)+' s'; saveMoveConfig(); });
    driftOff.addEventListener('input', ()=>{ MOVE.DRIFT_OFF = clampUi(parseFloat(driftOff.value),0.005,Math.max(0.005,MOVE.DRIFT_ON)); if (MOVE.DRIFT_OFF > MOVE.DRIFT_ON){ MOVE.DRIFT_OFF = MOVE.DRIFT_ON; driftOff.value = MOVE.DRIFT_OFF; } driftOffOut.textContent = fmt(MOVE.DRIFT_OFF); saveMoveConfig(); });
    driftTorsoRel.addEventListener('change', ()=>{ MOVE.DRIFT_TORSO_REL = !!driftTorsoRel.checked; saveMoveConfig(); });

    driftReset.addEventListener('click', ()=>{ baseLm = null; calStatus.className='muted'; calStatus.textContent='Baseline reset'; });

    moveReset.addEventListener('click', () => {
      Object.assign(MOVE, MOVE_DEFAULTS);
      initMovePanel(); saveMoveConfig();
      baseLm = null; moveEma = 0; intScore = 0; driftScore = 0; lastTs = 0;
      calStatus.className='muted'; calStatus.textContent='Defaults restored';
    });

    // Calibration button
    calStartBtn.addEventListener('click', () => {
      openMovePanel();
      startCalibration();
    });

    initMovePanel();

    /* ---------- Clear overlay on video stop-like states ---------- */
    ['pause','ended','emptied','stalled','suspend','waiting'].forEach((ev) => {
      remoteVideo.addEventListener(ev, clearOverlayDrawing, { passive: true });
    });

    window.addEventListener('beforeunload', () => {
      try { core.close(); } catch {}
      if (hideStatusTimer) clearTimeout(hideStatusTimer);
      stopReceiverPoseLoop();
    });

    // tiny typo guard used in logs (legacy)
    function beginViewportSetle(){ beginViewportSettle(); }
  </script>
</body>
</html>
