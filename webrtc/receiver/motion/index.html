<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Baby Monitor – Receiver</title>
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>

  <!-- ⬇️ Add shared sidebar stylesheet -->
  <link rel="stylesheet" href="/hungryface/webrtc/receiver/shared/sidebar.css" />

  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0; height: 100%;
      background: #000; color: #fff;
      font-family: -apple-system, system-ui, Segoe UI, Roboto, sans-serif;
      overflow: hidden;
    }
    /* Fullscreen wrapper so video+canvas scale together */
    #stage {
      position: fixed; inset: 0;
      width: 100vw; height: 100vh;   /* fallback */
      width: 100dvw; height: 100dvh; /* dynamic viewport */
      width: 100svw; height: 100svh; /* small viewport (iOS URL bar safe) */
      z-index: 1; background: #000;
    }
    #stage > video {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: contain; background: #000;
    }
    #stage > canvas {
      position: absolute;
      z-index: 2; pointer-events: none; background: transparent; display: none;
    }

    .btn {
      padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.6);
      background: transparent; color: #fff; font-size: 16px; font-weight: 600;
      cursor: pointer; box-shadow: none;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    }
    .btn:active { transform: scale(0.99); }

    #controls {
      position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
      display: flex; align-items: center; gap: 12px; z-index: 6;
    }
    #enableAudioBtn, #disableAudioBtn { display: none; }

    .overlay {
      position: fixed; inset: 0; display: flex;
      align-items: center; justify-content: center;
      pointer-events: none; z-index: 5;
    }
    .status {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: #ddd; font-size: 14px; padding: 10px 14px; border-radius: 12px;
      text-align: center; white-space: pre-line; max-width: 90vw;
    }
    .overlay.hidden { display: none; }

    /* Movement panel */
    #movePanel {
      position: fixed; right: 16px; bottom: 80px; z-index: 7;
      width: min(360px, 92vw);
      background: rgba(20,20,20,0.9);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      backdrop-filter: blur(6px);
      padding: 12px 12px 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
    #movePanel.hidden { display: none; }
    #movePanel header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; margin-bottom: 6px;
    }
    #movePanel h3 {
      margin: 0; font-size: 14px; font-weight: 700; color: #eee;
    }
    #movePanel .close {
      appearance: none; border: none; background: transparent; color: #aaa;
      font-size: 20px; line-height: 1; cursor: pointer; padding: 2px 6px;
    }
    #movePanel .row {
      display: grid; grid-template-columns: auto 1fr auto; align-items: center;
      gap: 10px; margin: 8px 0;
    }
    #movePanel label { font-size: 12px; color: #ccc; white-space: nowrap; }
    #movePanel input[type="range"] { width: 100%; }
    #movePanel output {
      font-variant-numeric: tabular-nums; font-size: 12px; color: #ddd;
      min-width: 64px; text-align: right;
    }
    #movePanel .muted { color: #aaa; font-size: 12px; }
    #movePanel .stateRow {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 8px; margin-bottom: 4px;
      border: 1px dashed rgba(255,255,255,0.15); border-radius: 10px;
    }
    #movePanel .pill {
      padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600;
      border: 1px solid rgba(255,255,255,0.2);
    }
    #movePanel .pill.moving  { background: #4a2a00; color: #ffcc80; border-color: #ffa64d; }
    #movePanel .pill.still   { background: #111;   color: #ddd;     border-color: rgba(255,255,255,0.25); }
    #movePanel .actions {
      display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px;
    }
    #movePanel .small {
      padding: 8px 10px; font-size: 13px; border-radius: 10px;
    }
  </style>
</head>
<body>
  <!-- ⬇️ Inject shared sidebar markup and behavior (kept separate from your code) -->
  <script type="module">
    (async () => {
      try {
        // Load & insert the sidebar HTML (hamburger + nav + invite modal)
        const res = await fetch('/hungryface/webrtc/receiver/shared/sidebar.html', { cache: 'no-cache' });
        const html = await res.text();
        const wrap = document.createElement('div');
        wrap.innerHTML = html.trim();
        document.body.prepend(...wrap.childNodes);

        // Load the sidebar behavior once markup exists
        await new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = '/hungryface/webrtc/receiver/shared/sidebar.js';
          s.onload = resolve;
          s.onerror = reject;
          document.body.appendChild(s);
        });
      } catch (err) {
        console.error('[Sidebar] failed to load shared assets:', err);
      }
    })();
  </script>

  <div id="controls">
    <button id="enableAudioBtn" class="btn" type="button">Enable audio</button>
    <button id="disableAudioBtn" class="btn" type="button">Disable audio</button>
    <button id="fsBtn" class="btn" type="button">Fullscreen</button>
    <button id="moveBtn" class="btn" type="button">Movement settings</button>
  </div>

  <!-- Movement control panel -->
  <section id="movePanel" class="hidden" aria-label="Movement settings">
    <header>
      <h3>Movement detection</h3>
      <button id="moveClose" class="close" title="Close">×</button>
    </header>

    <div class="stateRow">
      <div class="muted">State: <span id="moveStateTxt" class="pill still">STILL</span></div>
      <div class="muted">Score (EMA): <strong id="moveScoreTxt">0.000</strong></div>
    </div>

    <div class="row">
      <label for="ema">EMA α</label>
      <input id="ema" type="range" min="0.01" max="0.90" step="0.01">
      <output id="emaOut">0.20</output>
    </div>

    <div class="row">
      <label for="onTh">ON threshold</label>
      <input id="onTh" type="range" min="0.005" max="0.300" step="0.005">
      <output id="onOut">0.060</output>
    </div>

    <div class="row">
      <label for="offTh">OFF threshold</label>
      <input id="offTh" type="range" min="0.005" max="0.300" step="0.005">
      <output id="offOut">0.030</output>
    </div>

    <div class="row">
      <label for="hold">OFF hold (ms)</label>
      <input id="hold" type="range" min="0" max="3000" step="50">
      <output id="holdOut">700 ms</output>
    </div>

    <div class="row">
      <label for="minScale">Min scale</label>
      <input id="minScale" type="range" min="0.000" max="0.200" step="0.005">
      <output id="scaleOut">0.020</output>
    </div>

    <div class="actions">
      <button id="moveReset" class="btn small" type="button">Reset defaults</button>
      <button id="moveHide"  class="btn small" type="button">Hide</button>
    </div>
  </section>

  <div id="stage">
    <video id="remote" autoplay playsinline></video>
    <canvas id="poseCanvas"></canvas>
  </div>

  <div id="overlay" class="overlay">
    <div id="status" class="status">Idle</div>
  </div>

  <script type="module">
    import { DrawingUtils, PoseLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0";
    import { ReceiverCore } from "/hungryface/webrtc/receiver/shared/receiver-core.js";

    /* ---------- Constants ---------- */
    const WS_ENDPOINT = "wss://signaling-server-f5gu.onrender.com/ws";
    const room = new URLSearchParams(location.search).get("room") || "Baby";
    const STATUS_HIDE_AFTER_CONNECTED_MS = 10000;

    // Movement detection config (defaults)
    const MOVE_DEFAULTS = {
      EMA_ALPHA: 0.2,          // smoothing factor for score
      ON:  0.06,               // score threshold to enter MOVING
      OFF: 0.03,               // score threshold to leave MOVING
      OFF_HOLD_MS: 700,        // min time to remain MOVING after score dips
      MIN_SCALE: 0.02          // lower bound on shoulder/hip width (normalized)
    };
    const LS_KEY = 'naptio-move-config-v1';

    // Active config (mutates when user drags sliders)
    const MOVE = { ...MOVE_DEFAULTS, ...loadMoveConfig() };

    // Mediapipe assets (same version as import)
    const TASKS_URL = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0";
    const WASM_DIR = TASKS_URL + "/wasm";
    const POSE_MODEL_URL =
      "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";

    // Video readyState helpers
    const HAVE_CURRENT_DATA = 2;

    /* ---------- DOM ---------- */
    const stage = document.getElementById('stage');
    const remoteVideo = document.getElementById('remote');
    const poseCanvas = document.getElementById('poseCanvas');
    const poseCtx = poseCanvas.getContext('2d', { alpha: true });

    const fsBtn = document.getElementById('fsBtn');
    const enableAudioBtn = document.getElementById('enableAudioBtn');
    const disableAudioBtn = document.getElementById('disableAudioBtn');
    const overlay = document.getElementById('overlay');
    const statusEl = document.getElementById('status');

    // Movement UI refs
    const moveBtn    = document.getElementById('moveBtn');
    const movePanel  = document.getElementById('movePanel');
    const moveClose  = document.getElementById('moveClose');
    const moveHide   = document.getElementById('moveHide');
    const moveReset  = document.getElementById('moveReset');
    const moveStateTxt = document.getElementById('moveStateTxt');
    const moveScoreTxt = document.getElementById('moveScoreTxt');
    const ema   = document.getElementById('ema');
    const emaOut= document.getElementById('emaOut');
    const onTh  = document.getElementById('onTh');
    const onOut = document.getElementById('onOut');
    const offTh = document.getElementById('offTh');
    const offOut= document.getElementById('offOut');
    const hold  = document.getElementById('hold');
    const holdOut = document.getElementById('holdOut');
    const minScale = document.getElementById('minScale');
    const scaleOut = document.getElementById('scaleOut');

    /* ---------- State ---------- */
    let hideStatusTimer = null;

    // Pose state
    let poseDC = null;
    let poseEnabled = false;
    let poseWhere = 'sender'; // 'sender' | 'receiver'
    let poseTask = null;
    let poseLoopRunning = false;

    // Movement state
    let prevLm = null;              // previous 33 landmarks
    let moveEma = 0;                // smoothed score
    let moving = false;             // state
    let movingSince = 0;            // ts when entered MOVING
    let lastAboveOnTs = 0;          // last time raw score >= ON
    let lastStateChangeTs = 0;      // ts of last state toggle

    /* ---------- Status overlay ---------- */
    function showStatus(msg) {
      statusEl.textContent = msg;
      overlay.classList.remove('hidden');
      console.log('[STATUS]', msg);
      if (msg === 'Connected') {
        if (hideStatusTimer) clearTimeout(hideStatusTimer);
        hideStatusTimer = setTimeout(() => overlay.classList.add('hidden'), STATUS_HIDE_AFTER_CONNECTED_MS);
      } else {
        if (hideStatusTimer) { clearTimeout(hideStatusTimer); hideStatusTimer = null; }
        overlay.classList.remove('hidden');
      }
    }

    /* ---------- Audio UI ---------- */
    function updateAudioButtons() {
      if (remoteVideo.muted) {
        enableAudioBtn.style.display = 'block';
        disableAudioBtn.style.display = 'none';
      } else {
        enableAudioBtn.style.display = 'none';
        disableAudioBtn.style.display = 'block';
      }
    }
    enableAudioBtn.style.display = 'block';

    async function tryStartMuted() {
      try {
        remoteVideo.muted = true;
        remoteVideo.volume = 1.0;
        await remoteVideo.play();
      } catch (e) { console.warn('autoplay (muted) blocked:', e); }
      updateAudioButtons();
    }
    enableAudioBtn.addEventListener('click', async (e) => {
      e?.stopPropagation?.(); e?.preventDefault?.();
      try { remoteVideo.muted = false; remoteVideo.volume = 1.0; await remoteVideo.play(); }
      catch (err) { console.warn('unmute play blocked:', err); }
      updateAudioButtons();
    });
    disableAudioBtn.addEventListener('click', (e) => {
      e?.stopPropagation?.(); e?.preventDefault?.();
      remoteVideo.muted = true;
      updateAudioButtons();
    });

    /* ---------- Fullscreen ---------- */
    fsBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      try {
        if (!document.fullscreenElement) {
          await (stage.requestFullscreen?.call(stage) || document.documentElement.requestFullscreen());
          fsBtn.textContent = 'Exit fullscreen';
        } else {
          await document.exitFullscreen();
          fsBtn.textContent = 'Fullscreen';
        }
      } catch (err) { console.warn('fullscreen error', err); }
      beginViewportSettle();
    });
    document.addEventListener('fullscreenchange', () => {
      fsBtn.textContent = document.fullscreenElement ? 'Exit fullscreen' : 'Fullscreen';
      beginViewportSetle();
    });

    remoteVideo.addEventListener('loadedmetadata', () => {
      console.log('[MEDIA] remote meta', remoteVideo.videoWidth, 'x', remoteVideo.videoHeight);
      beginViewportSettle();
    });
    remoteVideo.addEventListener('playing', () => {
      console.log('[MEDIA] remote playing (muted=', remoteVideo.muted, ')');
      updateAudioButtons();
      beginViewportSettle();
    });
    // Handle rotation / track size changes from sender
    remoteVideo.addEventListener('resize', beginViewportSettle);

    /* ---------- Canvas alignment ---------- */
    function containRect(containerW, containerH, contentW, contentH) {
      const scale = Math.min(containerW / (contentW||1), containerH / (contentH||1));
      const w = Math.round(contentW * scale);
      const h = Math.round(contentH * scale);
      const x = Math.floor((containerH - h) / 2); // not used, but left for clarity
      return { width:w, height:h, left: Math.floor((containerW - w) / 2), top: Math.floor((containerH - h) / 2) };
    }

    function alignCanvasToVideo() {
      const stageBox = stage.getBoundingClientRect();
      const videoBox = remoteVideo.getBoundingClientRect();
      const containerW = Math.round(videoBox.width);
      const containerH = Math.round(videoBox.height);
      const vidW = remoteVideo.videoWidth || 1;
      const vidH = remoteVideo.videoHeight || 1;

      const fit = containRect(containerW, containerH, vidW, vidH);
      const leftCSS = Math.round((videoBox.left - stageBox.left) + fit.left);
      const topCSS = Math.round((videoBox.top - stageBox.top) + fit.top);

      poseCanvas.style.left = leftCSS + 'px';
      poseCanvas.style.top = topCSS + 'px';
      poseCanvas.style.width = fit.width + 'px';
      poseCanvas.style.height = fit.height + 'px';

      const dpr = window.devicePixelRatio || 1;
      const needW = Math.max(1, Math.round(fit.width * dpr));
      const needH = Math.max(1, Math.round(fit.height * dpr));
      if (poseCanvas.width !== needW || poseCanvas.height !== needH) {
        poseCanvas.width = needW;
        poseCanvas.height = needH;
      }
      poseCtx.setTransform(1,0,0,1,0,0);
    }

    let settleRAF = 0, settleUntil = 0;
    function beginViewportSettle(durationMs = 1200) {
      settleUntil = performance.now() + durationMs;
      if (settleRAF) return;
      const tick = () => {
        alignCanvasToVideo();
        if (performance.now() < settleUntil) {
          settleRAF = requestAnimationFrame(tick);
        } else {
          cancelAnimationFrame(settleRAF); settleRAF = 0;
          alignCanvasToVideo();
        }
      };
      tick();
    }
    const vpAlign = () => beginViewportSettle();
    ['resize','orientationchange','scroll'].forEach(ev =>
      window.addEventListener(ev, vpAlign, { passive: true })
    );
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', vpAlign, { passive: true });
      window.visualViewport.addEventListener('scroll',  vpAlign, { passive: true });
    }
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) beginViewportSettle();
    });

    /* ---------- Overlay helpers ---------- */
    function setOverlayVisible(v) {
      poseCanvas.style.display = v ? 'block' : 'none';
      if (v) beginViewportSettle();
      else poseCtx.clearRect(0,0, poseCanvas.width, poseCanvas.height);
    }

    function drawPoseLandmarks(landmarks) {
      if (!landmarks?.length || !poseCanvas.width || !poseCanvas.height) return;
      const utils = new DrawingUtils(poseCtx);
      for (const lm of landmarks) {
        utils.drawLandmarks(lm, {
          radius: (data) => DrawingUtils.lerp((data.from && data.from.z) ?? 0, -0.15, 0.1, 5, 1)
        });
        utils.drawConnectors(lm, PoseLandmarker.POSE_CONNECTIONS);
      }
    }

    /* ---------- Movement detection ---------- */
    const L = { L_SHOULDER: 11, R_SHOULDER: 12, L_HIP: 23, R_HIP: 24 };

    function dist2(a, b) {
      const dx = (a.x - b.x), dy = (a.y - b.y);
      return Math.hypot(dx, dy);
    }

    function scaleFromTorso(lm) {
      const ls = lm[L.L_SHOULDER], rs = lm[L.R_SHOULDER];
      const lh = lm[L.L_HIP],      rh = lm[L.R_HIP];
      let s = 0;
      if (ls && rs) s = Math.max(s, dist2(ls, rs));
      if (lh && rh) s = Math.max(s, dist2(lh, rh));
      if (!s) {
        // fallback: bbox diagonal
        let minx=1, miny=1, maxx=0, maxy=0;
        for (const p of lm) { if (!p) continue; minx=Math.min(minx,p.x); miny=Math.min(miny,p.y); maxx=Math.max(maxx,p.x); maxy=Math.max(maxy,p.y); }
        s = Math.hypot(maxx-minx, maxy-miny);
      }
      return Math.max(s, MOVE.MIN_SCALE);
    }

    function rawMovementScore(lm, prev) {
      if (!lm || !prev || lm.length !== prev.length) return 0;
      const n = lm.length;
      const scale = scaleFromTorso(lm);
      let sum = 0, cnt = 0;
      for (let i=0; i<n; i++) {
        const a = lm[i], b = prev[i];
        if (!a || !b) continue;
        sum += dist2(a, b);
        cnt++;
      }
      if (!cnt) return 0;
      return (sum / cnt) / scale; // average normalized displacement
    }

    function drawMovementBadge(movingState, raw, emaVal) {
      const ctx = poseCtx;
      const dpr = window.devicePixelRatio || 1;
      const pad = Math.round(8 * dpr);
      const x = pad, y = pad;

      const txt = `Movement: ${emaVal.toFixed(3)} ${movingState ? '• MOVING' : '• STILL'}`;
      ctx.save();
      ctx.font = `${Math.round(14*dpr)}px -apple-system,system-ui,Segoe UI,Roboto,sans-serif`;
      const textW = ctx.measureText(txt).width;
      const boxW = Math.round(textW + pad*2);
      const boxH = Math.round(26 * dpr);

      ctx.globalAlpha = 0.7;
      ctx.fillStyle = movingState ? '#4a2a00' : '#111';
      ctx.fillRect(x, y, boxW, boxH);

      ctx.globalAlpha = 0.9;
      ctx.strokeStyle = movingState ? '#ffa64d' : 'rgba(255,255,255,0.25)';
      ctx.lineWidth = Math.max(1, Math.round(1*dpr));
      ctx.strokeRect(x+0.5, y+0.5, boxW-1, boxH-1);

      ctx.globalAlpha = 1;
      ctx.fillStyle = movingState ? '#ffcc80' : '#ddd';
      ctx.fillText(txt, x + pad, y + boxH - Math.round(8*dpr));
      ctx.restore();
    }

    function updateMovementFromLandmarks(lm, ts, canSend=true) {
      const raw = rawMovementScore(lm, prevLm);
      prevLm = lm;

      // EMA
      moveEma = moveEma + MOVE.EMA_ALPHA * (raw - moveEma);
      const nowMoving =
        moving
          ? (moveEma > MOVE.OFF || (ts - lastAboveOnTs) < MOVE.OFF_HOLD_MS)
          : (moveEma >= MOVE.ON);

      if (raw >= MOVE.ON) lastAboveOnTs = ts;

      if (nowMoving !== moving) {
        moving = nowMoving;
        lastStateChangeTs = ts;
        if (moving) movingSince = ts;
        console.log('[MOVE] state:', moving ? 'MOVING' : 'STILL', 'score=', moveEma.toFixed(3));
      }

      // draw badge (after pose drawing)
      drawMovementBadge(moving, raw, moveEma);

      // update panel mirrors
      reflectMovementInPanel();

      // optionally send to sender if we did the inference locally (receiver mode)
      if (canSend && poseWhere === 'receiver' && poseDC?.readyState === 'open') {
        poseDC.send(JSON.stringify({
          type: 'movement',
          where: 'receiver',
          moving, scoreRaw: raw, scoreEma: moveEma, ts
        }));
      }
    }

    /* ---------- Central canvas clear helper ---------- */
    function clearOverlayDrawing() {
      try {
        poseCtx.setTransform(1,0,0,1,0,0);
        poseCtx.clearRect(0, 0, poseCanvas.width, poseCanvas.height);
      } catch {}
    }

    /* ---------- attach track/stream end handlers ---------- */
    function attachStreamEndHandlers(stream) {
      if (!stream) return;
      // Clear if any video track ends/mutes or is removed
      stream.getVideoTracks().forEach((t) => {
        t.addEventListener('ended',  clearOverlayDrawing);
        t.addEventListener('mute',   clearOverlayDrawing);
      });
      stream.addEventListener('removetrack', (e) => {
        if (e.track?.kind === 'video') clearOverlayDrawing();
      });
    }

    /* ---------- MediaPipe on RECEIVER ---------- */
    async function ensurePoseTask() {
      if (poseTask) return poseTask;
      const vision = await FilesetResolver.forVisionTasks(WASM_DIR);
      poseTask = await PoseLandmarker.createFromOptions(vision, {
        baseOptions: { modelAssetPath: POSE_MODEL_URL, delegate: "GPU" },
        runningMode: "VIDEO",
        numPoses: 1
      });
      return poseTask;
    }

    function videoHasFrame(v) {
      return v &&
        v.readyState >= HAVE_CURRENT_DATA &&
        v.videoWidth  > 0 &&
        v.videoHeight > 0;
    }

    function waitForVideoFrame(video) {
      if (videoHasFrame(video)) return Promise.resolve();
      return new Promise((resolve) => {
        const check = () => { if (videoHasFrame(video)) { cleanup(); resolve(); } };
        const cleanup = () => {
          video.removeEventListener('loadedmetadata', check);
          video.removeEventListener('playing', check);
          video.removeEventListener('resize', check);
        };
        video.addEventListener('loadedmetadata', check);
        video.addEventListener('playing', check);
        video.addEventListener('resize', check);
      });
    }

    async function startReceiverPoseLoop() {
      if (poseLoopRunning) return;
      await ensurePoseTask();
      await waitForVideoFrame(remoteVideo);

      poseLoopRunning = true;
      console.log('[POSE][receiver] inference START (receiver)');

      const useRVFC = 'requestVideoFrameCallback' in remoteVideo;

      const onFrame = () => {
        if (!poseLoopRunning || !poseEnabled || poseWhere !== 'receiver') {
          console.log('[POSE][receiver] inference STOP (receiver)');
          return;
        }

        if (!videoHasFrame(remoteVideo)) {
          poseCtx.clearRect(0, 0, poseCanvas.width, poseCanvas.height);
          scheduleNext();
          return;
        }

        try {
          const ts = performance.now();
          const result = poseTask.detectForVideo(remoteVideo, ts);
          if (result?.landmarks?.length) {
            const lm = result.landmarks[0];
            poseCtx.save();
            poseCtx.clearRect(0,0, poseCanvas.width, poseCanvas.height);
            drawPoseLandmarks([lm]);

            // movement
            updateMovementFromLandmarks(lm, ts, /*canSend=*/true);

            // send landmarks back to sender when running on receiver (existing behavior)
            if (poseDC?.readyState === 'open') {
              poseDC.send(JSON.stringify({ type:'pose', landmarks: [lm], ts }));
            }
            poseCtx.restore();
          } else {
            prevLm = null;
            poseCtx.clearRect(0,0, poseCanvas.width, poseCanvas.height);
          }
        } catch (err) {
          console.warn('[POSE][receiver] detect error (retrying next frame)', err);
        } finally {
          scheduleNext();
        }
      };

      const scheduleNext = () => {
        if (useRVFC) remoteVideo.requestVideoFrameCallback(onFrame);
        else requestAnimationFrame(onFrame);
      };

      scheduleNext();
    }

    function stopReceiverPoseLoop() {
      poseLoopRunning = false;
      prevLm = null;
      moveEma = 0;
      moving = false;
      poseCtx.clearRect(0,0, poseCanvas.width, poseCanvas.height);
      reflectMovementInPanel();
    }

    function applyPoseMode() {
      setOverlayVisible(poseEnabled);
      if (!poseEnabled) { stopReceiverPoseLoop(); return; }
      if (poseWhere === 'receiver') startReceiverPoseLoop();
      else stopReceiverPoseLoop(); // sender mode: draw/process only what we receive
    }

    /* ---------- Shared WebRTC core (signaling + PC) ---------- */
    const core = new ReceiverCore({
      wsEndpoint: WS_ENDPOINT,
      room,

      onStatus: showStatus,

      onStream: (stream) => {
        if (remoteVideo.srcObject !== stream) {
          remoteVideo.srcObject = stream;
          tryStartMuted();
          attachStreamEndHandlers(stream);
        }
      },

      onIceState: (state) => {
        if (state === 'failed' || state === 'disconnected' || state === 'closed') {
          clearOverlayDrawing();
        }
      },

      onBye: () => {
        clearOverlayDrawing();
      },

      onCreatePC: (pc) => {
        // Pose DC (receiver initiates; bidirectional)
        const ch = pc.createDataChannel('pose');
        ch.onopen = () => { console.log('[DC][receiver] pose DC open'); };
        ch.onclose = () => { console.log('[DC][receiver] pose DC close'); };
        ch.onerror = (e) => { console.warn('[DC][receiver] pose DC error', e); };
        ch.onmessage = (ev) => {
          try {
            const msg = JSON.parse(ev.data);
            if (msg.type === 'pose-mode') {
              poseEnabled = !!msg.enabled;
              poseWhere   = msg.where || 'sender';
              console.log('[POSE][receiver] mode:', { poseEnabled, poseWhere });
              applyPoseMode();
            } else if (msg.type === 'pose') {
              // When inference is on SENDER, we receive landmarks here. Draw + compute movement locally.
              if (poseEnabled && poseWhere === 'sender' && msg.landmarks?.length) {
                const lm = msg.landmarks[0];
                poseCtx.save();
                poseCtx.clearRect(0,0, poseCanvas.width, poseCanvas.height);
                drawPoseLandmarks([lm]);
                updateMovementFromLandmarks(lm, msg.ts ?? performance.now(), /*canSend=*/false);
                poseCtx.restore();
              }
            }
          } catch {}
        };
        poseDC = ch;
      },

      onDataChannel: (e) => {
        // Leave inbound DCs open; log for debugging
        console.log('[DC][receiver] inbound datachannel (leaving open):', e.channel?.label);
      }
    });

    core.start().catch(console.warn);

    /* ---------- Movement panel logic ---------- */

    function loadMoveConfig() {
      try {
        const raw = localStorage.getItem(LS_KEY);
        if (!raw) return {};
        const obj = JSON.parse(raw);
        // only keep known keys
        const cfg = {};
        for (const k of Object.keys(MOVE_DEFAULTS)) {
          if (typeof obj[k] === typeof MOVE_DEFAULTS[k]) cfg[k] = obj[k];
        }
        return cfg;
      } catch { return {}; }
    }
    function saveMoveConfig() {
      try {
        localStorage.setItem(LS_KEY, JSON.stringify(MOVE));
      } catch {}
    }
    function clamp(val, min, max) { return Math.max(min, Math.min(max, val)); }
    function fmt(num, digits=3) { return Number(num).toFixed(digits); }

    function initMovePanel() {
      // seed slider positions from MOVE
      ema.value      = MOVE.EMA_ALPHA;
      onTh.value     = MOVE.ON;
      offTh.value    = MOVE.OFF;
      hold.value     = MOVE.OFF_HOLD_MS;
      minScale.value = MOVE.MIN_SCALE;

      // seed outputs
      emaOut.textContent   = fmt(ema.value, 2);
      onOut.textContent    = fmt(onTh.value);
      offOut.textContent   = fmt(offTh.value);
      holdOut.textContent  = Math.round(hold.value) + ' ms';
      scaleOut.textContent = fmt(minScale.value, 3);

      reflectMovementInPanel();
    }

    function reflectMovementInPanel() {
      moveScoreTxt.textContent = fmt(moveEma);
      moveStateTxt.textContent = moving ? 'MOVING' : 'STILL';
      moveStateTxt.classList.toggle('moving', moving);
      moveStateTxt.classList.toggle('still', !moving);
    }

    function openMovePanel() { movePanel.classList.remove('hidden'); }
    function closeMovePanel() { movePanel.classList.add('hidden'); }

    moveBtn.addEventListener('click', () => openMovePanel());
    moveHide.addEventListener('click', () => closeMovePanel());
    moveClose.addEventListener('click', () => closeMovePanel());
    window.addEventListener('keydown', (e) => {
      if (e.key.toLowerCase() === 'm') {
        if (movePanel.classList.contains('hidden')) openMovePanel();
        else closeMovePanel();
      }
    });

    // Slider change handlers
    ema.addEventListener('input', () => {
      MOVE.EMA_ALPHA = clamp(parseFloat(ema.value), 0.01, 0.90);
      emaOut.textContent = fmt(MOVE.EMA_ALPHA, 2);
      saveMoveConfig();
    });

    onTh.addEventListener('input', () => {
      MOVE.ON = clamp(parseFloat(onTh.value), 0.005, 0.300);
      // keep OFF <= ON (with a small gap)
      if (MOVE.OFF > MOVE.ON) {
        MOVE.OFF = Math.max(0.005, MOVE.ON - 0.005);
        offTh.value = MOVE.OFF;
        offOut.textContent = fmt(MOVE.OFF);
      }
      onOut.textContent = fmt(MOVE.ON);
      saveMoveConfig();
    });

    offTh.addEventListener('input', () => {
      MOVE.OFF = clamp(parseFloat(offTh.value), 0.005, 0.300);
      // keep OFF <= ON
      if (MOVE.OFF > MOVE.ON) {
        MOVE.OFF = MOVE.ON;
        offTh.value = MOVE.OFF;
      }
      offOut.textContent = fmt(MOVE.OFF);
      saveMoveConfig();
    });

    hold.addEventListener('input', () => {
      MOVE.OFF_HOLD_MS = clamp(parseInt(hold.value, 10) || 0, 0, 3000);
      holdOut.textContent = Math.round(MOVE.OFF_HOLD_MS) + ' ms';
      saveMoveConfig();
    });

    minScale.addEventListener('input', () => {
      MOVE.MIN_SCALE = clamp(parseFloat(minScale.value), 0.000, 0.200);
      scaleOut.textContent = fmt(MOVE.MIN_SCALE, 3);
      saveMoveConfig();
    });

    moveReset.addEventListener('click', () => {
      Object.assign(MOVE, MOVE_DEFAULTS);
      initMovePanel();
      saveMoveConfig();
    });

    // Initialize panel now that DOM references exist
    initMovePanel();

    /* ---------- NEW: clear overlay on video element stop-like states ---------- */
    ['pause','ended','emptied','stalled','suspend','waiting'].forEach((ev) => {
      remoteVideo.addEventListener(ev, clearOverlayDrawing, { passive: true });
    });

    window.addEventListener('beforeunload', () => {
      try { core.close(); } catch {}
      if (hideStatusTimer) clearTimeout(hideStatusTimer);
      stopReceiverPoseLoop();
    });

    // Go! (ReceiverCore started above)

    // tiny typo guard used in logs
    function beginViewportSetle(){ beginViewportSettle(); }
  </script>
</body>
</html>
