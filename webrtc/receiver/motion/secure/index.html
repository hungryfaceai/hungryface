        setMaxWithHeadroom(intOnEl, Math.min(2.0, MOVE.INT_TAU * 0.8), MOVE.INT_ON);
        intOff.max = intOnEl.max;

        if (parseFloat(onTh.value) > parseFloat(onTh.max)) onTh.value = onTh.max;
        MOVE.ON = parseFloat(onTh.value) || MOVE.ON;
        if (onOut) onOut.textContent = fmt(MOVE.ON);

        if (parseFloat(driftOnEl.value) > parseFloat(driftOnEl.max)) driftOnEl.value = driftOnEl.max;
        MOVE.DRIFT_ON = parseFloat(driftOnEl.value) || MOVE.DRIFT_ON;
        if (driftOnOut) driftOnOut.textContent = fmt(MOVE.DRIFT_ON);

        if (parseFloat(intOnEl.value) > parseFloat(intOnEl.max)) intOnEl.value = intOnEl.max;
        MOVE.INT_ON = parseFloat(intOnEl.value) || MOVE.INT_ON;
        if (intOnOut) intOnOut.textContent = fmt(MOVE.INT_ON);

        if (offLink.ema || MOVE.OFF > MOVE.ON) MOVE.OFF = Math.min(MOVE.OFF, MOVE.ON);
        if (offLink.int || MOVE.INT_OFF > MOVE.INT_ON) MOVE.INT_OFF = Math.min(MOVE.INT_OFF, MOVE.INT_ON);
        if (offLink.drift || MOVE.DRIFT_OFF > MOVE.DRIFT_ON) MOVE.DRIFT_OFF = Math.min(MOVE.DRIFT_OFF, MOVE.DRIFT_ON);

        offTh.value = Math.min(parseFloat(offTh.max), MOVE.OFF);
        if (offOut) offOut.textContent = fmt(MOVE.OFF);
        intOff.value = Math.min(parseFloat(intOff.max), MOVE.INT_OFF);
        if (intOffOut) intOffOut.textContent = fmt(MOVE.INT_OFF);
        driftOff.value = Math.min(parseFloat(driftOff.max), MOVE.DRIFT_OFF);
        if (driftOffOut) driftOffOut.textContent = fmt(MOVE.DRIFT_OFF);
      }

      // Bind the settings panel controls to MOVE (initial values, input handlers, persistence).
      function initMovePanel() {
        if (!movePanel) return;

        if (visMin && visOut) {
          visMin.value = MOVE.VIS_MIN;
          visOut.textContent = fmt(MOVE.VIS_MIN, 2);
        }
        if (presMin && presOut) {
          presMin.value = MOVE.PRES_MIN;
          presOut.textContent = fmt(MOVE.PRES_MIN, 2);
        }

        if (useEma) useEma.checked = !!MOVE.USE_EMA;
        if (ema && emaOut) {
          ema.value = MOVE.EMA_ALPHA;
          emaOut.textContent = fmt(MOVE.EMA_ALPHA, 2);
        }
        if (onTh && onOut) {
          onTh.value = MOVE.ON;
          onOut.textContent = fmt(MOVE.ON);
        }
        if (offTh && offOut) {
          offTh.value = Math.min(MOVE.OFF, MOVE.ON);
          offOut.textContent = fmt((MOVE.OFF = Math.min(MOVE.OFF, MOVE.ON)));
        }

        if (useInt) useInt.checked = !!MOVE.USE_INT;
        if (tau && tauOut) {
          tau.value = MOVE.INT_TAU;
          tauOut.textContent = fmt(MOVE.INT_TAU, 1) + ' s';
        }
        if (intOnEl && intOnOut) {
          intOnEl.value = MOVE.INT_ON;
          intOnOut.textContent = fmt(MOVE.INT_ON);
        }
        if (intOff && intOffOut) {
          intOff.value = Math.min(MOVE.INT_OFF, MOVE.INT_ON);
          intOffOut.textContent = fmt((MOVE.INT_OFF = Math.min(MOVE.INT_OFF, MOVE.INT_ON)));
        }

        if (useDrift) useDrift.checked = !!MOVE.USE_DRIFT;
        if (driftTau && driftTauOut) {
          driftTau.value = MOVE.DRIFT_TAU;
          driftTauOut.textContent = fmt(MOVE.DRIFT_TAU, 1) + ' s';
        }
        if (driftOnEl && driftOnOut) {
          driftOnEl.value = MOVE.DRIFT_ON;
          driftOnOut.textContent = fmt(MOVE.DRIFT_ON);
        }
        if (driftOff && driftOffOut) {
          driftOff.value = Math.min(MOVE.DRIFT_OFF, MOVE.DRIFT_ON);
          driftOffOut.textContent = fmt((MOVE.DRIFT_OFF = Math.min(MOVE.DRIFT_OFF, MOVE.DRIFT_ON)));
        }
        if (driftTorsoRel) driftTorsoRel.checked = !!MOVE.DRIFT_TORSO_REL;

        if (showBaseline) showBaseline.checked = !!MOVE.SHOW_BASELINE;

        if (calSecs && calSecsOut) {
          calSecs.value = clampUi(MOVE.CAL_SECS, 5, 60);
          calSecsOut.textContent = `${calSecs.value} s`;
          MOVE.CAL_SECS = parseInt(calSecs.value, 10);
        }
        if (calLive) calLive.checked = !!MOVE.CAL_LIVE;

        applyOnCaps();
        reflectPanel();
        updateStateRowVisibility();

        requestAnimationFrame(matchButtonSizes);
      }

      // Show the settings panel and equalise button widths after layout.
      function openMovePanel() {
        if (!movePanel) return;
        movePanel.classList.remove('hidden');
        requestAnimationFrame(() => requestAnimationFrame(matchButtonSizes));
      }
      // Hide the settings panel.
      const closeMovePanel = () => {
        if (movePanel) movePanel.classList.add('hidden');
      };

      // Toggle button.
      on(moveBtn, 'click', (e) => {
        e?.stopPropagation?.();
        if (!movePanel) return;
        movePanel.classList.toggle('hidden');
        if (!movePanel.classList.contains('hidden')) requestAnimationFrame(matchButtonSizes);
      });
      on(moveClose, 'click', (e) => {
        e?.stopPropagation?.();
        closeMovePanel();
      });

      // Close panel when clicking anywhere outside (main page)
      document.addEventListener('click', (e) => {
        if (!movePanel || movePanel.classList.contains('hidden')) return;
        if (movePanel.contains(e.target)) return;
        closeMovePanel();
      });

      // Slider and checkbox handlers: each updates MOVE, its readout and saves immediately.
      on(visMin, 'input', () => {
        MOVE.VIS_MIN = clampUi(parseFloat(visMin.value), 0, 0.99);
        if (visOut) visOut.textContent = fmt(MOVE.VIS_MIN, 2);
        saveMoveConfig();
      });
      on(presMin, 'input', () => {
        MOVE.PRES_MIN = clampUi(parseFloat(presMin.value), 0, 0.99);
        if (presOut) presOut.textContent = fmt(MOVE.PRES_MIN, 2);
        saveMoveConfig();
      });

      on(useEma, 'change', () => {
        MOVE.USE_EMA = !!useEma.checked;
        saveMoveConfig();
      });
      on(useInt, 'change', () => {
        MOVE.USE_INT = !!useInt.checked;
        saveMoveConfig();
      });
      on(useDrift, 'change', () => {
        MOVE.USE_DRIFT = !!useDrift.checked;
        saveMoveConfig();
      });

      on(showBaseline, 'change', () => {
        MOVE.SHOW_BASELINE = !!showBaseline.checked;
        saveMoveConfig();
      });

      // ON/OFF sliders keep OFF at or below ON; moving OFF manually unlinks it from ON.
      on(ema, 'input', () => {
        MOVE.EMA_ALPHA = clampUi(parseFloat(ema.value), 0.01, 0.9);
        if (emaOut) emaOut.textContent = fmt(MOVE.EMA_ALPHA, 2);
        saveMoveConfig();
      });
      on(onTh, 'input', () => {
        MOVE.ON = Math.max(0.005, parseFloat(onTh.value) || 0);
        if (offLink.ema || MOVE.OFF > MOVE.ON) {
          MOVE.OFF = MOVE.ON;
          if (offTh && offOut) {
            offTh.value = MOVE.OFF;
            offOut.textContent = fmt(MOVE.OFF);
          }
        }
        if (onOut) onOut.textContent = fmt(MOVE.ON);
        applyOnCaps();
        saveMoveConfig();
      });
      on(offTh, 'input', () => {
        offLink.ema = false;
        MOVE.OFF = Math.max(0.005, Math.min(parseFloat(offTh.value) || 0, MOVE.ON, parseFloat(offTh.max)));
        offTh.value = MOVE.OFF;
        if (offOut) offOut.textContent = fmt(MOVE.OFF);
        saveMoveConfig();
      });

      on(tau, 'input', () => {
        MOVE.INT_TAU = clampUi(parseFloat(tau.value), 0.5, 8.0);
        if (tauOut) tauOut.textContent = fmt(MOVE.INT_TAU, 1) + ' s';
        applyOnCaps();
        saveMoveConfig();
      });
      on(intOnEl, 'input', () => {
        MOVE.INT_ON = Math.max(0.005, parseFloat(intOnEl.value) || 0);
        if (offLink.int || MOVE.INT_OFF > MOVE.INT_ON) {
          MOVE.INT_OFF = MOVE.INT_ON;
          if (intOff && intOffOut) {
            intOff.value = MOVE.INT_OFF;
            intOffOut.textContent = fmt(MOVE.INT_OFF);
          }
        }
        if (intOnOut) intOnOut.textContent = fmt(MOVE.INT_ON);
        applyOnCaps();
        saveMoveConfig();
      });
      on(intOff, 'input', () => {
        offLink.int = false;
        MOVE.INT_OFF = Math.max(0.005, Math.min(parseFloat(intOff.value) || 0, MOVE.INT_ON, parseFloat(intOff.max)));
        intOff.value = MOVE.INT_OFF;
        if (intOffOut) intOffOut.textContent = fmt(MOVE.INT_OFF);
        saveMoveConfig();
      });

      on(driftTau, 'input', () => {
        MOVE.DRIFT_TAU = clampUi(parseFloat(driftTau.value), 0.5, 8.0);
        if (driftTauOut) driftTauOut.textContent = fmt(MOVE.DRIFT_TAU, 1) + ' s';
        saveMoveConfig();
      });
      on(driftOnEl, 'input', () => {
        MOVE.DRIFT_ON = Math.max(0.005, parseFloat(driftOnEl.value) || 0);
        if (offLink.drift || MOVE.DRIFT_OFF > MOVE.DRIFT_ON) {
          MOVE.DRIFT_OFF = MOVE.DRIFT_ON;
          if (driftOff && driftOffOut) {
            driftOff.value = MOVE.DRIFT_OFF;
            driftOffOut.textContent = fmt(MOVE.DRIFT_OFF);
          }
        }
        if (driftOnOut) driftOnOut.textContent = fmt(MOVE.DRIFT_ON);
        applyOnCaps();
        saveMoveConfig();
      });
      on(driftOff, 'input', () => {
        offLink.drift = false;
        MOVE.DRIFT_OFF = Math.max(
          0.005,
          Math.min(parseFloat(driftOff.value) || 0, MOVE.DRIFT_ON, parseFloat(driftOff.max))
        );
        driftOff.value = MOVE.DRIFT_OFF;
        if (driftOffOut) driftOffOut.textContent = fmt(MOVE.DRIFT_OFF);
        saveMoveConfig();
      });
      on(driftTorsoRel, 'change', () => {
        MOVE.DRIFT_TORSO_REL = !!driftTorsoRel.checked;
        saveMoveConfig();
      });

      // Forget the baseline pose; it is re-learned from the next frame.
      on(driftReset, 'click', () => {
        baseLm = null;
        if (calStatus) {
          calStatus.className = 'muted';
          calStatus.textContent = 'Baseline reset';
        }
      });

      // Calibration length slider; extends a running calibration.
      on(calSecs, 'input', () => {
        MOVE.CAL_SECS = Math.max(5, Math.min(60, parseInt(calSecs.value, 10) || 15));
        if (calSecsOut) calSecsOut.textContent = `${MOVE.CAL_SECS} s`;
        saveMoveConfig();
        if (calActive) calEndMs = calStartMs + MOVE.CAL_SECS * 1000;
        matchButtonSizes();
      });
      on(calLive, 'change', () => {
        MOVE.CAL_LIVE = !!calLive.checked;
        saveMoveConfig();
      });

      // Settings Start button: opens the panel and starts calibration if pose data is live.
      // Settings Start
      on(calStartBtn, 'click', (e) => {
        e?.stopPropagation?.();
        openMovePanel();
        if (!hasLivePose() || calActive) {
          updateCalibrationAvailability();
          return;
        }
        startCalibration();
      });

      // Main-page Calibration button
      on(calQuickBtn, 'click', (e) => {
        e?.stopPropagation?.();
        if (calActive || !hasLivePose()) {
          updateCalibrationAvailability();
          return;
        }
        calQuickBtnActive = true;
        updateCalQuickUI(true, MOVE.CAL_SECS);
        openMovePanel();
        startCalibration();
      });

      // Restore factory settings, clear saved config and restart detection state.
      function resetToDefaults() {
        Object.keys(MOVE).forEach((k) => delete MOVE[k]);
        Object.assign(MOVE, MOVE_DEFAULTS);
        MOVE.OFF = Math.min(MOVE.OFF, MOVE.ON);
        MOVE.INT_OFF = Math.min(MOVE.INT_OFF, MOVE.INT_ON);
        MOVE.DRIFT_OFF = Math.min(MOVE.DRIFT_OFF, MOVE.DRIFT_ON);
        try {
          localStorage.removeItem(LS_KEY);
        } catch {}
        baseLm = null;
        prevLm = null;
        moveEma = 0;
        intScore = 0;
        driftScore = 0;
        lastTs = 0;
        offLink = { ema: false, int: false, drift: false };
        if (calActive) {
          calActive = false;
          if (calProgRow) calProgRow.style.display = 'none';
        }
        updateCalQuickUI(false);
        initMovePanel();
        applyOnCaps();
        reflectPanel();
        saveMoveConfig();
        matchButtonSizes();
        if (calStatus) {
          calStatus.className = 'muted';
          calStatus.textContent = 'Defaults restored';
        }
        if (calStats) {
          calStats.style.display = 'none';
        }
      }
      // Reset button.
      on(moveReset, 'click', (e) => {
        e?.stopPropagation?.();
        resetToDefaults();
      });

      // Initial panel state, plus resize handling and cleanup hooks below.
      initMovePanel();
      updateCalibrationAvailability();
      window.addEventListener('load', matchButtonSizes);

      // Re-run sizing on resize (only when the panel is visible)
      window.addEventListener('resize', () => {
        if (!movePanel?.classList.contains('hidden')) matchButtonSizes();
      });

      // Playback stopping means no fresh pose data: clear the overlay and calibration availability.
      ['pause', 'ended', 'emptied', 'stalled', 'suspend', 'waiting'].forEach((ev) => {
        on(remoteVideo, ev, () => {
          clearOverlayDrawing();
          lastPoseTs = 0;
          updateCalibrationAvailability();
        });
      });

      // Record the end of any open alert and release resources when the page closes.
      window.addEventListener('beforeunload', () => {
        endMotionEpisode('Page closed'); // tab closing during an alert: record its end now
        try {
          core.close();
        } catch {}
        if (hideStatusTimer) clearTimeout(hideStatusTimer);
        stopReceiverPoseLoop();
      });

      // Misspelled alias of beginViewportSettle, apparently kept for older call sites.
      function beginViewportSetle() {
        beginViewportSettle();
      }

      /* ---------- Help drawer wiring (runs after injection) ---------- */
      function wireHelpOnce() {
        const sheet = document.getElementById('helpSheet');
        const backdrop = document.getElementById('helpBackdrop');
        const closeBtn = document.getElementById('helpClose');
        const bodyEl = document.getElementById('helpBody');
        const helpBtn = document.getElementById('helpBtn');

        if (!sheet || sheet.dataset.wired === '1') return;
        sheet.dataset.wired = '1';

        // Open and close the help drawer (Escape also closes).
        const openHelp = () => {
          sheet.classList.add('show');
          backdrop?.classList.add('show');
          document.body.classList.add('help-open');
        };
        const closeHelp = () => {
          sheet.classList.remove('show');
          backdrop?.classList.remove('show');
          document.body.classList.remove('help-open');
        };

        // Button wiring.
        helpBtn?.addEventListener('click', (e) => {
          e.stopPropagation();
          openHelp();
        });
        closeBtn?.addEventListener('click', (e) => {
          e.stopPropagation();
          closeHelp();
        });
        backdrop?.addEventListener('click', closeHelp);
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') closeHelp();
        });

        // Robust close handler for the “×” even if re-rendered
        document.addEventListener(
          'click',
          (e) => {
            const btn = e.target && e.target.closest('#helpClose');
            if (!btn) return;
            e.preventDefault();
            e.stopPropagation();
            closeHelp();
          },
          true
        );

        // Keep the settings panel open when interacting with the help drawer (outside-click would close it).
        // Keep settings panel open when interacting with the help drawer
        document.addEventListener(
          'click',
          (e) => {
            if (document.body.classList.contains('help-open')) {
              const liveSheet = document.getElementById('helpSheet');
              if (liveSheet?.contains(e.target)) e.stopPropagation();
            }
          },
          true
        );

        // Smooth scroll for TOC links
        bodyEl?.addEventListener('click', (e) => {
          const a = e.target.closest('a[href^="#"]');
          if (!a) return;
          const id = a.getAttribute('href');
          const el = bodyEl.querySelector(id);
          if (el) {
            e.preventDefault();
            el.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        });
      }

      // Run when the HTML is injected; also try immediately in case it’s already present
      document.addEventListener('help:ready', wireHelpOnce);
      if (document.getElementById('helpSheet')) wireHelpOnce();
    </script>

    <script type="module">
      import { installMiniDashboard } from '/hungryface/webrtc/receiver/shared/mini-dash.js';
      installMiniDashboard({
        // Use your shared dashboard URL:
        src: 'https://hungryfaceai.github.io/hungryface/webrtc/receiver/shared/alerts/dashboard/',
        // The preference gate (already in your app):
        featureKey: 'naptio:miniDash:enabled',
      });
    </script>

    <!-- Alerts UI hosts -->
    <div id="alertBannerHost"></div>
    <div id="alertsModalHost"></div>
    <!-- Keep screen awake while this monitoring page is open (no-op if unsupported) -->
    <script type="module">
      import { keepAwake } from '/hungryface/webrtc/shared/wake-lock.js';
      try {
        keepAwake({ log: (m) => console.log('[RECEIVER]', m) });
      } catch {}
    </script>
  </body>
</html>
