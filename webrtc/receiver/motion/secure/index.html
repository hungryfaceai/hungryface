<!doctype html>
<!--
  Naptio Viewer: Movement detection (webrtc/receiver/motion/secure/index.html).
  Shows the Camera phone live video and flags body movement. Pose landmarks come either from the Camera (sent over the
  "pose" data channel) or are computed here with MediaPipe PoseLandmarker; this page scores them and raises alerts.
  Main pieces: video stage + pose canvas overlay, settings/calibration panel (#movePanel), Help side-sheet,
  shared Alerts UI (banner + history drawer), optional alert sound and mini dashboard.
  Dependencies: shared/receiver-core.js (WebRTC + signalling), psk/bootstrap.js (room key and scoped room),
  shared/alerts/* (IndexedDB alert store), shared/vision-task.js, motion/help-sheet.js.
  localStorage: naptio-move-config-v6 (thresholds), naptio:miniDash:enabled (mini dashboard preference).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Motion</title>
    <link rel="icon" href="/hungryface/pwa/icons/favicon-196.png" sizes="196x196" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />

    <link rel="stylesheet" href="/hungryface/webrtc/receiver/shared/sidebar.css" />

    <link rel="stylesheet" href="/hungryface/shared/tokens.css" />
    <style>
      /* Motion page styles: video stage, pose canvas overlay, controls bar and the movement settings panel. */
      /* --- Theme and page base --- */
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--nt-bg, #000);
        color: var(--nt-text, #fff);
        font-family:
          -apple-system,
          system-ui,
          Segoe UI,
          Roboto,
          sans-serif;
        overflow: hidden;
      }
      /* --- Video stage and pose canvas overlay --- */
      #stage {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        width: 100svw;
        height: 100svh;
        width: 100dvw;
        height: 100dvh;
        z-index: 1;
        background: var(--nt-bg, #000);
      }
      #stage > video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: var(--nt-bg, #000);
      }
      #stage > canvas {
        position: absolute;
        z-index: 2;
        pointer-events: none;
        background: transparent;
        display: none;
      }

      /* --- Buttons and spinner --- */
      .btn {
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.6);
        background: transparent;
        color: var(--nt-text, #fff);
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: none;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      }
      .btn:active {
        transform: scale(0.99);
      }
      .btn[disabled] {
        opacity: 0.6;
        cursor: default;
      }

      .spinner {
        display: inline-block;
        width: 12px;
        height: 12px;
        border: 2px solid rgba(255, 255, 255, 0.35);
        border-top-color: #fff;
        border-radius: 50%;
        margin-right: 8px;
        animation: spin 1s linear infinite;
        vertical-align: -1px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* --- Bottom controls bar --- */
      #controls {
        position: fixed;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 12px;
        z-index: 6;
        flex-wrap: wrap;
        justify-content: center;
      }
      #enableAudioBtn,
      #disableAudioBtn {
        display: none;
      }

      /* --- Connection status overlay --- */
      .overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        z-index: 5;
      }
      .status {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: var(--nt-text-2, #ddd);
        font-size: 14px;
        padding: 10px 14px;
        border-radius: 12px;
        text-align: center;
        white-space: pre-line;
        max-width: 90vw;
      }
      .overlay.hidden {
        display: none;
      }

      /* Movement panel */
      #movePanel {
        position: fixed;
        right: 16px;

        /* NEW: pin to both top & bottom so header can’t go off-screen */
        top: 12px; /* was not set */
        bottom: 80px; /* unchanged gap above bottom controls */

        z-index: 7;
        width: min(380px, 92vw);
        box-sizing: border-box; /* padding inside the width: exactly 380 px, never wider than the screen */

        /* NEW: let top/bottom define the height; avoid vh on iOS */
        max-height: none;

        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
        touch-action: pan-y;

        background: rgba(20, 20, 20, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 14px;
        backdrop-filter: blur(6px);
        padding: 12px 12px 10px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      }

      /* SAFE-AREA support for iPhone/iPad (overrides the values above when available) */
      @supports (padding: env(safe-area-inset-top)) {
        #movePanel {
          right: calc(16px + env(safe-area-inset-right));
          top: calc(12px + env(safe-area-inset-top));
          bottom: calc(80px + env(safe-area-inset-bottom));
          /* keep the same visual width while respecting left/right notches */
          width: min(380px, calc(100svw - (32px + env(safe-area-inset-left) + env(safe-area-inset-right))));
        }
      }

      /* --- Movement panel contents: header, rows, sliders --- */
      #movePanel.hidden {
        display: none;
      }
      #movePanel header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 6px;
      }
      #movePanel h3 {
        margin: 0;
        font-size: 14px;
        font-weight: 700;
        color: #eee;
      }
      #movePanel .close {
        appearance: none;
        border: none;
        background: transparent;
        color: var(--nt-text-muted, #aaa);
        font-size: 20px;
        line-height: 1;
        cursor: pointer;
        padding: 2px 6px;
      }
      #movePanel .row {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 10px;
        margin: 8px 0;
      }
      #movePanel label {
        font-size: 12px;
        color: #ccc;
        white-space: nowrap;
      }
      #movePanel input[type='range'] {
        width: 100%;
      }
      #movePanel output {
        font-variant-numeric: tabular-nums;
        font-size: 12px;
        color: var(--nt-text-2, #ddd);
        min-width: 64px;
        text-align: right;
      }
      #movePanel .muted {
        color: var(--nt-text-muted, #aaa);
        font-size: 12px;
      }
      /* --- Movement panel state pills and groups --- */
      #movePanel .stateRow {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 8px;
        margin-bottom: 4px;
        border: 1px dashed rgba(255, 255, 255, 0.15);
        border-radius: 10px;
      }
      #movePanel .pill {
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      #movePanel .pill.moving {
        background: #4a2a00;
        color: #ffcc80;
        border-color: #ffa64d;
      }
      #movePanel .pill.still {
        background: var(--nt-surface, #111);
        color: var(--nt-text-2, #ddd);
        border-color: rgba(255, 255, 255, 0.25);
      }
      #movePanel .groupTitle {
        margin: 10px 0 2px;
        font-size: 12px;
        color: #bbb;
        font-weight: 700;
      }
      #movePanel .row3 {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 10px;
      }

      /* Center controls rows with buttons */
      #calActions,
      /* --- Panel action buttons --- */
      #bottomActions {
        display: flex;
        gap: 8px;
        justify-content: center;
        margin-top: 6px;
        align-items: center;
      }
      .small {
        padding: 8px 10px;
        font-size: 13px;
        border-radius: 10px;
      }

      /* Calibration bits */
      /* --- Calibration progress and status colours --- */
      #calProgRow {
        display: none;
      }
      #calStatus.ok {
        color: #b7f0b7;
      }
      #calStatus.warn {
        color: #ffd27a;
      }
      #calStatus.err {
        color: #ff9b9b;
      }
      #calStatus.running {
        color: #ff4d4f;
        font-weight: 700;
      } /* RED while calibrating */
      progress {
        width: 100%;
        height: 6px;
        border-radius: 999px;
        overflow: hidden;
      }

      /* === Help drawer === */
      .help-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 15;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
      }
      .help-backdrop.show {
        opacity: 1;
        pointer-events: auto;
      }
      /* --- Help sheet --- */
      .help-sheet {
        position: fixed;
        right: 0;
        top: 0;
        height: 100svh;
        width: min(92vw, 420px);
        background: #121212;
        color: #f3f3f3;
        border-left: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: -12px 0 32px rgba(0, 0, 0, 0.6);
        z-index: 20;
        transform: translateX(100%);
        transition: transform 0.24s cubic-bezier(0.2, 0.8, 0.2, 1);
        display: flex;
        flex-direction: column;
      }
      .help-sheet.show {
        transform: translateX(0);
      }
      .help-header {
        position: sticky;
        top: 0;
        z-index: 1;
        background: rgba(18, 18, 18, 0.96);
        backdrop-filter: blur(6px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .help-header h3 {
        margin: 0;
        font-size: 16px;
        font-weight: 700;
        color: var(--nt-text, #fff);
      }
      .help-header .close {
        appearance: none;
        border: none;
        background: transparent;
        color: var(--nt-text-muted, #aaa);
        font-size: 22px;
        cursor: pointer;
        padding: 2px 6px;
      }
      .help-body {
        padding: 10px 12px 16px;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      /* --- Help table of contents and sections --- */
      .help-toc {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 8px 0 12px;
        padding-bottom: 8px;
        border-bottom: 1px dashed rgba(255, 255, 255, 0.15);
      }
      .help-toc a {
        font-size: 12px;
        color: var(--nt-text-2, #ddd);
        text-decoration: none;
        border: 1px solid rgba(255, 255, 255, 0.18);
        padding: 6px 8px;
        border-radius: 999px;
      }
      .help-toc a:active {
        transform: scale(0.98);
      }
      .help-section {
        margin: 14px 0;
      }
      .help-section h4 {
        margin: 0 0 6px;
        font-size: 14px;
        color: var(--nt-text, #fff);
      }
      .help-section p,
      .help-section li,
      .help-section td,
      .help-section th {
        font-size: 13px;
        color: var(--nt-text-2, #ddd);
        line-height: 1.45;
      }
      .help-kv {
        width: 100%;
        border-collapse: collapse;
        margin-top: 6px;
      }
      .help-kv th,
      .help-kv td {
        border: 1px solid rgba(255, 255, 255, 0.12);
        padding: 8px;
        vertical-align: top;
      }
      .help-kv th {
        background: rgba(255, 255, 255, 0.06);
        font-weight: 700;
        color: #eee;
        white-space: nowrap;
      }
      .help-kv td {
        color: var(--nt-text-2, #ddd);
      }
      /* --- Help callouts, learn-more and code blocks --- */
      .help-callout {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 10px;
        padding: 10px;
      }
      details.learn-more {
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 10px;
        padding: 10px;
        background: rgba(255, 255, 255, 0.04);
      }
      details.learn-more > summary {
        cursor: pointer;
        list-style: none;
        font-weight: 700;
        color: var(--nt-text, #fff);
      }
      details.learn-more > summary::-webkit-details-marker {
        display: none;
      }
      details.learn-more[open] {
        background: rgba(255, 255, 255, 0.06);
      }
      .codeblock {
        background: #0e0e0e;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        padding: 10px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: #d7eaff;
        font-size: 12px;
        overflow-x: auto;
      }

      /* header actions container in settings */
      #movePanel header {
        gap: 8px;
      }
      #movePanel header .headerActions {
        display: flex;
        gap: 8px;
        align-items: center;
      }
    </style>
    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="e5feef4a-8ebd-4094-b6ff-36bdc4512e2e"
      data-exclude-search="true"
      data-exclude-hash="true"
      data-domains="hungryfaceai.github.io"
    ></script>
  </head>
  <body>
    <!-- shared sidebar -->
    <script type="module" src="/hungryface/webrtc/receiver/shared/sidebar-loader.js"></script>

    <!-- NEW: inject the Help side-sheet HTML -->
    <script type="module" src="/hungryface/webrtc/receiver/motion/help-sheet.js"></script>
    <div id="controls">
      <button id="enableAudioBtn" class="btn" type="button">Enable audio</button>
      <button id="disableAudioBtn" class="btn" type="button">Disable audio</button>
      <button id="fsBtn" class="btn" type="button">Fullscreen</button>
      <button id="calQuickBtn" class="btn" type="button">Calibration</button>
      <button id="moveBtn" class="btn" type="button">Settings</button>
    </div>

    <section id="movePanel" class="hidden" aria-label="Movement detection settings">
      <header>
        <h3>Movement detection settings</h3>
        <div class="headerActions">
          <button id="helpBtn" class="btn small" type="button" title="Open Help">Help</button>
          <button id="moveClose" class="close" title="Close">×</button>
        </div>
      </header>

      <div class="stateRow" id="stateRow">
        <div class="muted"><span id="moveStateTxt" class="pill still">STILL</span></div>
        <div class="muted">
          Scores: EMA <strong id="emaScoreTxt">0.000</strong> · INT <strong id="intScoreTxt">0.000</strong> · DRIFT
          <strong id="driftScoreTxt">0.000</strong>
        </div>
      </div>

      <!-- Calibration at the top -->
      <div class="groupTitle">Calibration</div>
      <div class="row">
        <label for="calSecs">Duration</label>
        <input id="calSecs" type="range" min="5" max="60" step="1" />
        <output id="calSecsOut">15 s</output>
      </div>
      <div class="checkRow">
        <label><input id="calLive" type="checkbox" /> Apply thresholds while running</label>
      </div>
      <div class="row">
        <label>Auto-calibrate</label>
        <button id="calStart" class="btn small" type="button">Start</button>
        <output id="calStatus" class="muted">Idle</output>
      </div>
      <div class="row" id="calProgRow">
        <label>Progress</label>
        <progress id="calProg" max="1" value="0"></progress>
        <output id="calTime">15s</output>
      </div>
      <div id="calStats" style="display: none">
        <div class="row"><label>Median</label><span></span><output id="calMedian">—</output></div>
        <div class="row"><label>95th pct</label><span></span><output id="calP95">—</output></div>
        <div class="row"><label>Samples</label><span></span><output id="calN">0</output></div>
      </div>

      <!-- Confidence gates -->
      <div class="groupTitle">Confidence gates</div>
      <div class="row">
        <label for="visMin">Visibility min</label>
        <input id="visMin" type="range" min="0.00" max="0.99" step="0.01" />
        <output id="visOut">0.80</output>
      </div>
      <div class="row">
        <label for="presMin">Presence min</label>
        <input id="presMin" type="range" min="0.00" max="0.99" step="0.01" />
        <output id="presOut">0.90</output>
      </div>

      <!-- EMA -->
      <div class="groupTitle">Short-term (EMA)</div>
      <div class="checkRow">
        <label><input id="useEma" type="checkbox" /> Enable EMA detector</label>
      </div>
      <div class="row">
        <label for="ema">EMA α</label><input id="ema" type="range" min="0.01" max="0.90" step="0.01" /><output
          id="emaOut"
          >0.20</output
        >
      </div>
      <div class="row">
        <label for="onTh">EMA ON</label><input id="onTh" type="range" min="0.005" max="0.500" step="0.005" /><output
          id="onOut"
          >0.060</output
        >
      </div>
      <div class="row">
        <label for="offTh">EMA OFF</label><input id="offTh" type="range" min="0.005" max="0.500" step="0.005" /><output
          id="offOut"
          >0.030</output
        >
      </div>

      <!-- Integrator -->
      <div class="groupTitle">Long-term (Integrator)</div>
      <div class="checkRow">
        <label><input id="useInt" type="checkbox" /> Enable Integrator</label>
      </div>
      <div class="row">
        <label for="tau">INT τ (s)</label><input id="tau" type="range" min="0.5" max="8.0" step="0.1" /><output
          id="tauOut"
          >3.0 s</output
        >
      </div>
      <div class="row">
        <label for="intOn">INT ON</label><input id="intOn" type="range" min="0.005" max="2.000" step="0.005" /><output
          id="intOnOut"
          >0.035</output
        >
      </div>
      <div class="row">
        <label for="intOff">INT OFF</label
        ><input id="intOff" type="range" min="0.005" max="2.000" step="0.005" /><output id="intOffOut">0.020</output>
      </div>

      <!-- Baseline drift -->
      <div class="groupTitle">Baseline drift</div>
      <div class="checkRow">
        <label><input id="useDrift" type="checkbox" /> Enable Drift detector</label>
      </div>
      <div class="checkRow">
        <label><input id="driftTorsoRel" type="checkbox" /> Torso-relative baseline (reduces camera shake)</label>
      </div>
      <!-- Baseline overlay toggle -->
      <div class="checkRow">
        <label><input id="showBaseline" type="checkbox" /> Show baseline overlay (ghost + vectors)</label>
      </div>
      <div class="row">
        <label for="driftTau">Baseline τ (s)</label
        ><input id="driftTau" type="range" min="0.5" max="8.0" step="0.1" /><output id="driftTauOut">2.5 s</output>
      </div>
      <div class="row">
        <label for="driftOn">DRIFT ON</label
        ><input id="driftOn" type="range" min="0.010" max="1.000" step="0.005" /><output id="driftOnOut">0.080</output>
      </div>
      <div class="row">
        <label for="driftOff">DRIFT OFF</label
        ><input id="driftOff" type="range" min="0.005" max="1.000" step="0.005" /><output id="driftOffOut"
          >0.050</output
        >
      </div>

      <!-- Centered baseline/reset buttons; widths matched to Start -->
      <div id="calActions">
        <button id="driftReset" class="btn small" type="button">Reset baseline</button>
      </div>

      <div id="bottomActions">
        <button
          id="moveReset"
          class="btn small"
          type="button"
          title="Restore all movement settings to factory defaults and clear calibration"
        >
          Reset all defaults
        </button>
      </div>
    </section>

    <!-- Help side sheet HTML removed; now injected by help-sheet.js -->

    <div id="stage">
      <video id="remote" autoplay playsinline></video>
      <canvas id="poseCanvas"></canvas>
    </div>

    <div id="overlay" class="overlay"><div id="status" class="status">Idle</div></div>

    <!-- ⬇️ PSK bootstrap (viewer); resolves room using the same logic as Settings and installs shim -->
    <script type="module">
      import { bootstrapSecureReceiver } from '/hungryface/webrtc/shared/psk/bootstrap.js';
      await bootstrapSecureReceiver({ label: 'receiver-motion' });
    </script>

    <script type="module">
      // Motion viewer logic. Pose landmarks -> movement scores (EMA, integrator, drift) -> hysteresis -> Motion alerts.
      // Also: calibration of thresholds, settings panel persistence and Help sheet wiring.
      import {
        DrawingUtils,
        PoseLandmarker,
        FilesetResolver,
      } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0';
      import { ReceiverCore } from '/hungryface/webrtc/receiver/shared/receiver-core.js';
      import {
        initAlertsUI,
        beginAlert,
        finishAlert,
        AlertTypes,
        showAlertBanner,
      } from '/hungryface/webrtc/receiver/shared/alerts/index.js';
      import { installAlertSound } from '/hungryface/webrtc/receiver/shared/alerts/notify-sound.js';

      // Wrapper for listeners: tolerates a missing element so optional controls never throw.
      /* --------- tiny safe addEventListener helper --------- */
      const on = (el, ev, fn, opts) => {
        if (el && el.addEventListener) el.addEventListener(ev, fn, opts);
      };

      /* ---------- Constants ---------- */
      import { WS_ENDPOINT } from '/hungryface/webrtc/shared/config.js';
      import { createVisionTask } from '/hungryface/webrtc/shared/vision-task.js';
      const uiRoom = window.__uiRoom || window.__pskRoom || 'Baby';
      const room = window.__scopedRoom || uiRoom;
      // How long the "Connected" status stays visible, in ms.
      const STATUS_HIDE_AFTER_CONNECTED_MS = 10000;

      // live-pose gating
      const LIVE_POSE_TIMEOUT_MS = 2000; // consider "live" if a landmark arrived in the last 2s
      // Time of the last landmark frame (performance.now() ms); 0 = never.
      let lastPoseTs = 0;

      // Detection settings. Scores are normalised by torso size, so thresholds are unitless.
      // VIS_MIN/PRES_MIN: minimum landmark visibility/presence to be used.
      // EMA_*: per-frame movement, exponentially smoothed; INT_*: leaky integrator (time constant INT_TAU, s);
      // DRIFT_*: distance from a slowly adapting baseline pose. *_ON/*_OFF form hysteresis (OFF_HOLD_MS holds it on).
      const MOVE_DEFAULTS = {
        VIS_MIN: 0.8,
        PRES_MIN: 0.9,
        EMA_ALPHA: 0.2,
        ON: 0.06,
        OFF: 0.03,
        OFF_HOLD_MS: 700,
        MIN_SCALE: 0.02,
        INT_TAU: 3.0,
        INT_ON: 0.035,
        INT_OFF: 0.02,
        DRIFT_TAU: 2.5,
        DRIFT_ON: 0.08,
        DRIFT_OFF: 0.05,
        DRIFT_TORSO_REL: true,
        USE_EMA: true,
        USE_INT: true,
        USE_DRIFT: true,
        CAL_SECS: 15,
        CAL_LIVE: true,
        SHOW_BASELINE: false,
      };
      // Bump the suffix when MOVE_DEFAULTS changes meaning, so stale saved settings are ignored.
      const LS_KEY = 'naptio-move-config-v6';
      const MOVE = { ...MOVE_DEFAULTS, ...loadMoveConfig() };

      // MediaPipe assets: WASM runtime and the lite pose model (float16).
      const TASKS_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0';
      const WASM_DIR = TASKS_URL + '/wasm';
      const POSE_MODEL_URL =
        'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task';
      // HTMLMediaElement.HAVE_CURRENT_DATA: a frame is available to read.
      const HAVE_CURRENT_DATA = 2;
      // Sound for Motion alerts (per-type toggle + cooldown; independent of dashboard gate)
      const alertSound = installAlertSound({
        type: 'motion',
        // debug: true, // optional while testing
      });

      // Cached DOM references: video stage, status overlay, buttons, settings panel inputs and readouts.
      /* ---------- DOM ---------- */
      // Video stage, pose overlay canvas and top-level controls.
      const stage = document.getElementById('stage');
      const remoteVideo = document.getElementById('remote');
      const poseCanvas = document.getElementById('poseCanvas');
      const poseCtx = poseCanvas.getContext('2d', { alpha: true });

      const fsBtn = document.getElementById('fsBtn');
      const enableAudioBtn = document.getElementById('enableAudioBtn');
      const disableAudioBtn = document.getElementById('disableAudioBtn');
      const overlay = document.getElementById('overlay');
      const statusEl = document.getElementById('status');

      const calQuickBtn = document.getElementById('calQuickBtn');
      let calQuickBtnActive = false;

      // Settings panel and its live score readouts.
      const moveBtn = document.getElementById('moveBtn');
      const movePanel = document.getElementById('movePanel');
      const moveClose = document.getElementById('moveClose');
      const moveReset = document.getElementById('moveReset');

      const stateRow = document.getElementById('stateRow');
      const moveStateTxt = document.getElementById('moveStateTxt');
      const emaScoreTxt = document.getElementById('emaScoreTxt');
      const intScoreTxt = document.getElementById('intScoreTxt');
      const driftScoreTxt = document.getElementById('driftScoreTxt');

      // Detector sliders and their numeric outputs: visibility, EMA, integrator and drift groups.
      const visMin = document.getElementById('visMin');
      const visOut = document.getElementById('visOut');
      const presMin = document.getElementById('presMin');
      const presOut = document.getElementById('presOut');

      const ema = document.getElementById('ema');
      const emaOut = document.getElementById('emaOut');
      const onTh = document.getElementById('onTh');
      const onOut = document.getElementById('onOut');
      const offTh = document.getElementById('offTh');
      const offOut = document.getElementById('offOut');

      const tau = document.getElementById('tau');
      const tauOut = document.getElementById('tauOut');
      const intOnEl = document.getElementById('intOn');
      const intOnOut = document.getElementById('intOnOut');
      const intOff = document.getElementById('intOff');
      const intOffOut = document.getElementById('intOffOut');

      const driftTau = document.getElementById('driftTau');
      const driftTauOut = document.getElementById('driftTauOut');
      const driftOnEl = document.getElementById('driftOn');
      const driftOnOut = document.getElementById('driftOnOut');
      const driftOff = document.getElementById('driftOff');
      const driftOffOut = document.getElementById('driftOffOut');
      const driftTorsoRel = document.getElementById('driftTorsoRel');
      const driftReset = document.getElementById('driftReset');

      // Detector enable checkboxes, baseline debug toggle and calibration controls.
      const useEma = document.getElementById('useEma');
      const useInt = document.getElementById('useInt');
      const useDrift = document.getElementById('useDrift');

      const showBaseline = document.getElementById('showBaseline');

      const calSecs = document.getElementById('calSecs');
      const calSecsOut = document.getElementById('calSecsOut');
      const calLive = document.getElementById('calLive');
      const calStartBtn = document.getElementById('calStart');
      const calStatus = document.getElementById('calStatus');
      const calProgRow = document.getElementById('calProgRow');
      const calProg = document.getElementById('calProg');
      const calTime = document.getElementById('calTime');
      const calStats = document.getElementById('calStats');
      const calMedian = document.getElementById('calMedian');
      const calP95 = document.getElementById('calP95');
      const calN = document.getElementById('calN');

      /* ---------- State ---------- */
      // Pose data channel and where detection runs: 'sender' (Camera sends landmarks) or 'receiver' (this Viewer).
      let hideStatusTimer = null;

      let poseDC = null;
      let poseEnabled = false;
      let poseWhere = 'sender';
      let poseTask = null;
      let poseLoopRunning = false;

      // Detection state: previous landmarks, baseline pose, the three scores, and the moving flag with hold timestamps.
      let prevLm = null;
      let baseLm = null;
      let moveEma = 0;
      let intScore = 0;
      let driftScore = 0;
      let moving = false;
      let movingSince = 0;
      let lastAboveOnTs = 0;
      let lastIntHitTs = 0;
      let lastDriftHitTs = 0;
      let lastTs = 0;

      // Calibration state: active flag, start/end times (ms) and collected raw scores.
      let calActive = false,
        calStartMs = 0,
        calEndMs = 0;
      let calSamples = [];
      let lastGoodLm = null;
      let lastCalUIRedraw = 0;
      // Minimum interval (ms) between live updates of the calibration statistics.
      const CAL_RECAL_MS = 250;

      // Whether each OFF threshold follows its ON threshold (set during calibration, cleared when the user edits OFF).
      let offLink = { ema: false, int: false, drift: false };
      // ===== Alerts episode state (Motion) =====
      // Alert episode state: id of the open Motion alert, the pending creation promise, and a running score sum.
      let _motionAlertId = null;
      let _motionAlertP = null; // pending beginAlert()
      let _motionSum = 0,
        _motionCount = 0;
      // Runs a promise to completion and swallows errors so alert storage failures never break detection.
      const runAsync = (p) => Promise.resolve(p).catch(() => {});

      /* ---------- Utils for live pose gating ---------- */
      // True while landmarks keep arriving; calibration and the state row need a body in view.
      const hasLivePose = () => performance.now() - lastPoseTs < LIVE_POSE_TIMEOUT_MS;

      // Show the state row only while pose data is flowing.
      function updateStateRowVisibility() {
        if (!stateRow) return;
        stateRow.style.display = hasLivePose() ? '' : 'none';
      }

      // Enable the calibration buttons only when live pose data is flowing and no calibration is running.
      function updateCalibrationAvailability() {
        const live = hasLivePose();
        if (calQuickBtn) calQuickBtn.disabled = !live || !!calActive;
        if (calStartBtn) calStartBtn.disabled = !live || !!calActive;
        updateStateRowVisibility();
      }
      // End an open movement episode (connection lost, Camera stopped, or no body seen for a while),
      // so the alert never stays open with no end time.
      function endMotionEpisode(reason = 'Movement ended') {
        if (!moving) return;
        moving = false;
        const avg = _motionCount > 0 ? _motionSum / _motionCount : intScore;
        const finish = (id) => {
          if (id != null) runAsync(finishAlert(id, { avgScore: Number((avg || 0).toFixed(4)), message: reason }));
        };
        if (_motionAlertId != null) {
          const id = _motionAlertId;
          _motionAlertId = null;
          finish(id);
        } else if (_motionAlertP) _motionAlertP.then(finish); // still being created: close it once it exists
        _motionAlertP = null;
        _motionSum = 0;
        _motionCount = 0;
      }
      // Calibration that can't finish (no body points any more) is cancelled rather than left stuck,
      // and never saved from too few measurements.
      function abortCalibration(msg) {
        if (!calActive) return;
        calActive = false;
        if (calProgRow) calProgRow.style.display = 'none';
        if (calStatus) {
          calStatus.className = 'muted';
          calStatus.textContent = msg;
        }
        updateCalQuickUI(false);
      }
      // Close an episode if no pose arrives for this long (ms).
      const NO_POSE_END_MS = 10000;
      // Housekeeping every 500 ms: refresh button state, end stale episodes, cancel stuck calibration.
      setInterval(() => {
        updateCalibrationAvailability();
        const quiet = performance.now() - lastPoseTs;
        if (moving && quiet > NO_POSE_END_MS) endMotionEpisode('Movement ended (no body seen)');
        if (calActive && quiet > LIVE_POSE_TIMEOUT_MS)
          abortCalibration('Calibration cancelled: body points stopped arriving. Try again.');
      }, 500);

      /* ---------- Status overlay ---------- */
      // Show a status message; after "Connected" it fades out following a short delay.
      function showStatus(msg) {
        if (statusEl && overlay) {
          statusEl.textContent = msg;
          overlay.classList.remove('hidden');
        }
        if (msg === 'Connected') {
          if (hideStatusTimer) clearTimeout(hideStatusTimer);
          hideStatusTimer = setTimeout(() => overlay?.classList.add('hidden'), STATUS_HIDE_AFTER_CONNECTED_MS);
        } else {
          if (hideStatusTimer) {
            clearTimeout(hideStatusTimer);
            hideStatusTimer = null;
          }
        }
      }

      /* ---------- Audio UI ---------- */
      // Show Enable audio while the video is muted, otherwise Disable audio.
      function updateAudioButtons() {
        if (!enableAudioBtn || !disableAudioBtn) return;
        if (remoteVideo?.muted) {
          enableAudioBtn.style.display = 'block';
          disableAudioBtn.style.display = 'none';
        } else {
          enableAudioBtn.style.display = 'none';
          disableAudioBtn.style.display = 'block';
        }
      }
      // Autoplay policies require muted start; the user unmutes with a tap.
      if (enableAudioBtn) enableAudioBtn.style.display = 'block';
      // Start playback muted (allowed without a gesture); unmuting needs the button click.
      async function tryStartMuted() {
        try {
          if (remoteVideo) {
            remoteVideo.muted = true;
            remoteVideo.volume = 1.0;
            await remoteVideo.play();
          }
        } catch (e) {
          console.warn('autoplay (muted) blocked:', e);
        }
        updateAudioButtons();
      }
      // Unmute inside the click handler so the browser accepts play() with sound.
      on(enableAudioBtn, 'click', async (e) => {
        e?.stopPropagation?.();
        e?.preventDefault?.();
        try {
          if (remoteVideo) {
            remoteVideo.muted = false;
            remoteVideo.volume = 1.0;
            await remoteVideo.play();
          }
        } catch (err) {
          console.warn('unmute play blocked:', err);
        }
        updateAudioButtons();
      });
      // Mute again.
      on(disableAudioBtn, 'click', (e) => {
        e?.stopPropagation?.();
        e?.preventDefault?.();
        if (remoteVideo) remoteVideo.muted = true;
        updateAudioButtons();
      });

      /* ---------- Fullscreen ---------- */
      // Re-aligns the canvas every frame for about durationMs, because layout (fullscreen, rotation) settles over time.
      const beginViewportSettle = (durationMs = 1200) => {
        let settleRAF = 0,
          settleUntil = performance.now() + durationMs;
        const tick = () => {
          alignCanvasToVideo();
          if (performance.now() < settleUntil) {
            settleRAF = requestAnimationFrame(tick);
          } else {
            cancelAnimationFrame(settleRAF);
            settleRAF = 0;
            alignCanvasToVideo();
          }
        };
        tick();
      };
      // Toggle fullscreen on the stage; the label also follows fullscreenchange for Esc / system exits.
      on(fsBtn, 'click', async (e) => {
        e?.stopPropagation?.();
        try {
          if (!document.fullscreenElement) {
            await (stage?.requestFullscreen?.call(stage) || document.documentElement.requestFullscreen());
            if (fsBtn) fsBtn.textContent = 'Exit fullscreen';
          } else {
            await document.exitFullscreen();
            if (fsBtn) fsBtn.textContent = 'Fullscreen';
          }
        } catch (err) {
          console.warn('fullscreen error', err);
        }
        beginViewportSettle();
      });
      document.addEventListener('fullscreenchange', () => {
        if (fsBtn) fsBtn.textContent = document.fullscreenElement ? 'Exit fullscreen' : 'Fullscreen';
        beginViewportSettle();
      });

      // Video size changes also need a new canvas alignment.
      on(remoteVideo, 'loadedmetadata', () => {
        beginViewportSettle();
      });
      on(remoteVideo, 'playing', () => {
        updateAudioButtons();
        beginViewportSettle();
      });
      on(remoteVideo, 'resize', beginViewportSettle);

      /* ---------- Canvas alignment ---------- */
      // Rectangle of the video content when letterboxed ("contain") inside its container.
      function containRect(containerW, containerH, contentW, contentH) {
        const scale = Math.min(containerW / (contentW || 1), containerH / (contentH || 1));
        const w = Math.round(contentW * scale);
        const h = Math.round(contentH * scale);
        return { width: w, height: h, left: Math.floor((containerW - w) / 2), top: Math.floor((containerH - h) / 2) };
      }
      // Size and position the pose canvas exactly over the displayed video (accounting for device pixel ratio).
      function alignCanvasToVideo() {
        if (!stage || !remoteVideo || !poseCanvas) return;
        const stageBox = stage.getBoundingClientRect();
        const videoBox = remoteVideo.getBoundingClientRect();
        const containerW = Math.round(videoBox.width);
        const containerH = Math.round(videoBox.height);
        const vidW = remoteVideo.videoWidth || 1;
        const vidH = remoteVideo.videoHeight || 1;
        const fit = containRect(containerW, containerH, vidW, vidH);
        const leftCSS = Math.round(videoBox.left - stageBox.left + fit.left);
        const topCSS = Math.round(videoBox.top - stageBox.top + fit.top);
        poseCanvas.style.left = leftCSS + 'px';
        poseCanvas.style.top = topCSS + 'px';
        poseCanvas.style.width = fit.width + 'px';
        poseCanvas.style.height = fit.height + 'px';
        const dpr = window.devicePixelRatio || 1;
        const needW = Math.max(1, Math.round(fit.width * dpr));
        const needH = Math.max(1, Math.round(fit.height * dpr));
        if (poseCanvas.width !== needW || poseCanvas.height !== needH) {
          poseCanvas.width = needW;
          poseCanvas.height = needH;
        }
        poseCtx.setTransform(1, 0, 0, 1, 0, 0);
      }
      // Re-align on viewport changes, including the visual viewport (mobile browser bars, pinch zoom).
      ['resize', 'orientationchange', 'scroll'].forEach((ev) =>
        window.addEventListener(ev, () => beginViewportSettle(), { passive: true })
      );
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', () => beginViewportSettle(), { passive: true });
        window.visualViewport.addEventListener('scroll', () => beginViewportSettle(), { passive: true });
      }
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) beginViewportSettle();
      });

      // Show or hide the pose overlay; hiding clears what was drawn.
      function setOverlayVisible(v) {
        if (!poseCanvas) return;
        poseCanvas.style.display = v ? 'block' : 'none';
        if (v) beginViewportSettle();
        else poseCtx.clearRect(0, 0, poseCanvas.width, poseCanvas.height);
      }

      /* ---------- Movement math helpers ---------- */
      // MediaPipe pose landmark indices used for the torso.
      const L = { L_SHOULDER: 11, R_SHOULDER: 12, L_HIP: 23, R_HIP: 24 };
      // A landmark counts only if its visibility / presence meet the user thresholds (missing values pass).
      const lmOk = (p) =>
        p &&
        (p.visibility == null || p.visibility >= MOVE.VIS_MIN) &&
        (p.presence == null || p.presence >= MOVE.PRES_MIN);

      // Euclidean distance between two normalised landmarks (despite the name, not squared).
      const dist2 = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

      // Torso centre (mean of shoulder and hip midpoints); falls back to all visible points, then image centre.
      // Prefer pairs of landmarks so one hidden side does not skew the centre.
      function torsoCenter(lm) {
        const ls = lm[L.L_SHOULDER],
          rs = lm[L.R_SHOULDER],
          lh = lm[L.L_HIP],
          rh = lm[L.R_HIP];
        const c = { x: 0, y: 0, n: 0 };
        if (lmOk(ls) && lmOk(rs)) {
          c.x += (ls.x + rs.x) / 2;
          c.y += (ls.y + rs.y) / 2;
          c.n++;
        }
        if (lmOk(lh) && lmOk(rh)) {
          c.x += (lh.x + rh.x) / 2;
          c.y += (lh.y + rh.y) / 2;
          c.n++;
        }
        if (c.n) return { x: c.x / c.n, y: c.y / c.n };
        let n = 0,
          sx = 0,
          sy = 0;
        for (const p of lm)
          if (lmOk(p)) {
            sx += p.x;
            sy += p.y;
            n++;
          }
        return n ? { x: sx / n, y: sy / n } : { x: 0.5, y: 0.5 };
      }

      // Body size for normalising scores: widest shoulder/hip span, else bbox diagonal, floored at MIN_SCALE.
      // Shoulder or hip width is stable under rotation; the bounding-box diagonal is the fallback.
      function scaleFromTorso(lm) {
        const ls = lm[L.L_SHOULDER],
          rs = lm[L.R_SHOULDER];
        const lh = lm[L.L_HIP],
          rh = lm[L.R_HIP];
        let s = 0;
        if (lmOk(ls) && lmOk(rs)) s = Math.max(s, dist2(ls, rs));
        if (lmOk(lh) && lmOk(rh)) s = Math.max(s, dist2(lh, rh));
        if (!s) {
          let minx = 1,
            miny = 1,
            maxx = 0,
            maxy = 0,
            any = false;
          for (const p of lm)
            if (lmOk(p)) {
              any = true;
              minx = Math.min(minx, p.x);
              miny = Math.min(miny, p.y);
              maxx = Math.max(maxx, p.x);
              maxy = Math.max(maxy, p.y);
            }
          if (any) s = Math.hypot(maxx - minx, maxy - miny);
        }
        return Math.max(s, MOVE.MIN_SCALE);
      }

      // Mean per-landmark displacement between consecutive frames, divided by body scale.
      // Per-frame movement is normalised by body size so distance to the camera does not matter.
      function rawMovementScore(lm, prev) {
        if (!lm || !prev || lm.length !== prev.length) return 0;
        const n = lm.length;
        const scale = scaleFromTorso(lm);
        let sum = 0,
          cnt = 0;
        for (let i = 0; i < n; i++) {
          const a = lm[i],
            b = prev[i];
          if (!lmOk(a) || !lmOk(b)) continue;
          sum += dist2(a, b);
          cnt++;
        }
        return cnt ? sum / cnt / scale : 0;
      }

      // Mean landmark distance from the baseline pose; torsoRel cancels whole-body translation (torso-centred).
      // Compare the pose with the slowly adapting baseline to catch slow, sustained position changes.
      function computeDriftScore(lm, base, torsoRel = true) {
        if (!lm || !base || lm.length !== base.length) return 0;
        const n = lm.length;
        const scale = scaleFromTorso(lm);
        let sum = 0,
          cnt = 0;

        let cNow = { x: 0, y: 0 },
          cBase = { x: 0, y: 0 };
        if (torsoRel) {
          cNow = torsoCenter(lm);
          cBase = torsoCenter(base);
        }

        for (let i = 0; i < n; i++) {
          const a = lm[i],
            b = base[i];
          if (!lmOk(a) || !lmOk(b)) continue;
          const ax = a.x - (torsoRel ? cNow.x : 0),
            ay = a.y - (torsoRel ? cNow.y : 0);
          const bx = b.x - (torsoRel ? cBase.x : 0),
            by = b.y - (torsoRel ? cBase.y : 0);
          sum += Math.hypot(ax - bx, ay - by);
          cnt++;
        }
        return cnt ? sum / cnt / scale : 0;
      }

      // Deep-copy a landmark array (only the fields we use).
      function cloneLm(lm) {
        return (
          lm?.map((p) => (p ? { x: p.x, y: p.y, z: p.z, visibility: p.visibility, presence: p.presence } : null)) ||
          null
        );
      }
      // Move the baseline dst toward src by factor a (exponential blend), landmark by landmark.
      function blendLm(dst, src, a) {
        if (!src) return dst;
        if (!dst || dst.length !== src.length) dst = cloneLm(src);
        for (let i = 0; i < src.length; i++) {
          const s = src[i];
          if (!lmOk(s)) continue;
          if (!dst[i] || !lmOk(dst[i])) {
            dst[i] = { x: s.x, y: s.y, z: s.z, visibility: s.visibility, presence: s.presence };
            continue;
          }
          const d = dst[i];
          d.x += a * (s.x - d.x);
          d.y += a * (s.y - d.y);
          if (s.z != null && d.z != null) d.z += a * (s.z - d.z);
          d.visibility = s.visibility ?? d.visibility;
          d.presence = s.presence ?? d.presence;
        }
        return dst;
      }

      /* ---------- Baseline overlay (ghost + vectors) ---------- */
      // Convert normalised landmark coordinates to canvas pixels.
      function lmToPx(p) {
        return { x: p.x * poseCanvas.width, y: p.y * poseCanvas.height };
      }
      // Baseline re-centred (and optionally rescaled) onto the current torso so it can be drawn as a ghost.
      function alignedBaseline(base, curr, torsoRel = true, scaleMatch = true) {
        if (!base || !curr || base.length !== curr.length) return null;
        if (!torsoRel)
          return (
            base.map((p) => p && { x: p.x, y: p.y, z: p.z, visibility: p.visibility, presence: p.presence }) || null
          );

        const cNow = torsoCenter(curr);
        const cBase = torsoCenter(base);
        const sNow = scaleFromTorso(curr);
        const sBase = Math.max(1e-6, scaleFromTorso(base));
        const r = scaleMatch ? sNow / sBase : 1.0;

        return base.map((p) => {
          if (!p) return null;
          const x = cNow.x + r * (p.x - cBase.x);
          const y = cNow.y + r * (p.y - cBase.y);
          return { x, y, z: p.z, visibility: p.visibility, presence: p.presence };
        });
      }

      // Debug overlay: draw the baseline pose and vectors from it to the current pose (SHOW_BASELINE).
      // Colour of each vector: grey below 90% of the DRIFT_ON threshold, amber from 90%, red at or above 100%.
      function drawBaselineGhostAndVectors(currLm) {
        if (!MOVE.SHOW_BASELINE || !baseLm || !currLm || currLm.length !== baseLm.length) return;

        const baseAligned = alignedBaseline(baseLm, currLm, MOVE.DRIFT_TORSO_REL, /*scaleMatch*/ false);
        if (!baseAligned) return;

        const ctx = poseCtx;
        const dpr = window.devicePixelRatio || 1;

        ctx.save();
        ctx.globalAlpha = 0.75;
        ctx.strokeStyle = 'rgba(80,200,255,0.95)';
        ctx.fillStyle = 'rgba(80,200,255,0.70)';
        ctx.lineWidth = Math.max(1, 1.5 * dpr);
        ctx.setLineDash([6 * dpr, 4 * dpr]);

        const utilsGhost = new DrawingUtils(ctx);
        utilsGhost.drawConnectors(baseAligned, PoseLandmarker.POSE_CONNECTIONS);

        ctx.setLineDash([]);
        // Joint dot radius in canvas pixels.
        const JOINT_R = 2 * dpr;
        for (let i = 0; i < baseAligned.length; i++) {
          const p = baseAligned[i];
          if (!lmOk(p)) continue;
          const P = lmToPx(p);
          ctx.beginPath();
          ctx.arc(P.x, P.y, JOINT_R, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        const scaleNow = scaleFromTorso(currLm);
        const onThresh = Math.max(1e-6, MOVE.DRIFT_ON);
        const minAlpha = 0.18;
        const maxAlpha = 1.0;

        for (let i = 0; i < currLm.length; i++) {
          const c = currLm[i],
            b = baseAligned[i];
          if (!lmOk(c) || !lmOk(b)) continue;

          const dx = c.x - b.x,
            dy = c.y - b.y;
          const dNorm = Math.hypot(dx, dy) / scaleNow;
          // Ratio of this landmark's drift to the DRIFT_ON threshold decides the colour and opacity.
          const ratio = dNorm / onThresh;
          const alpha = Math.max(minAlpha, Math.min(maxAlpha, ratio));

          let stroke = 'rgba(180,180,180,1)';
          if (ratio >= 0.9 && ratio < 1.0) stroke = 'rgba(255,193,7,1)';
          if (ratio >= 1.0) stroke = 'rgba(203,36,49,1)';

          const B = lmToPx(b),
            C = lmToPx(c);

          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.strokeStyle = stroke;
          ctx.lineWidth = Math.max(1, 1.5 * dpr);
          ctx.beginPath();
          ctx.moveTo(B.x, B.y);
          ctx.lineTo(C.x, C.y);
          ctx.stroke();
          ctx.restore();
        }
      }

      /* ---------- Badge drawing ---------- */
      // Draw the on-canvas badge with the movement state and the three live scores.
      function drawMovementBadge(movingState, emaVal, intVal, driftVal) {
        if (!poseCtx) return;
        const ctx = poseCtx;
        const dpr = window.devicePixelRatio || 1;

        const BG = movingState ? '#4a2a00' : '#111111';
        const BORDER = movingState ? '#ffa64d' : 'rgba(255,255,255,0.25)';
        const TXT_DIM = movingState ? '#ffcc80' : '#dddddd';

        const metrics = [
          { label: 'Short-term motion (EMA)', val: emaVal, on: MOVE.ON, enabled: !!MOVE.USE_EMA },
          { label: 'Sustained motion (Integrator)', val: intVal, on: MOVE.INT_ON, enabled: !!MOVE.USE_INT },
          { label: 'Baseline drift vs pose (DRIFT)', val: driftVal, on: MOVE.DRIFT_ON, enabled: !!MOVE.USE_DRIFT },
        ];

        const pad = Math.round(8 * dpr);
        const x = pad,
          y = pad;
        const INNER = Math.round(8 * dpr);
        const ROW_H = Math.round(20 * dpr);
        const BAR_W = Math.round(190 * dpr);
        const BAR_H = Math.round(8 * dpr);

        // Rounded rectangle path helper for the state pill.
        function roundRectPath(ctx, x, y, w, h, r) {
          const rr = Math.min(r, w / 2, h / 2);
          ctx.beginPath();
          ctx.moveTo(x + rr, y);
          ctx.arcTo(x + w, y, x + w, y + h, rr);
          ctx.arcTo(x + w, y + h, x, y + h, rr);
          ctx.arcTo(x, y + h, x, y, rr);
          ctx.arcTo(x, y, x + w, y, rr);
          ctx.closePath();
        }

        ctx.save();

        // All sizes are multiplied by the device pixel ratio so the badge looks the same on every screen.
        ctx.font = `${Math.round(12 * dpr)}px -apple-system,system-ui,Segoe UI,Roboto,sans-serif`;
        const stateTxt = movingState ? '• MOVING' : '• STILL';
        // Pill width is measured from the text so it fits any font.
        const pillPadX = Math.round(10 * dpr);
        const pillW = Math.round(ctx.measureText(stateTxt).width + pillPadX * 2);
        const pillH = Math.round(20 * dpr);

        ctx.font = `${Math.round(11 * dpr)}px -apple-system,system-ui,Segoe UI,Roboto,sans-serif`;
        const maxLabelW = Math.max(...metrics.map((m) => ctx.measureText(m.label).width));
        const LABEL_W = Math.round(maxLabelW + Math.round(6 * dpr));
        const PCT_W = Math.round(ctx.measureText('100%+').width + Math.round(12 * dpr));

        const HEADER_H = pillH + Math.round(10 * dpr);
        const boxW = Math.max(LABEL_W + INNER + BAR_W + INNER + PCT_W, pillW + INNER * 2);
        const boxH = HEADER_H + INNER + ROW_H * metrics.length + INNER;

        ctx.globalAlpha = 0.7;
        ctx.fillStyle = BG;
        ctx.fillRect(x, y, boxW, boxH);
        ctx.globalAlpha = 0.9;
        ctx.strokeStyle = BORDER;
        ctx.lineWidth = Math.max(1, Math.round(1 * dpr));
        ctx.strokeRect(x + 0.5, y + 0.5, boxW - 1, boxH - 1);

        const pillX = x + boxW - pillW - INNER;
        const pillY = y + Math.round((HEADER_H - pillH) / 2);
        const pillFill = movingState ? '#801721' : '#1a1a1a';
        const pillBorder = movingState ? '#3f0b10' : 'rgba(255,255,255,0.25)';
        const pillText = '#ffffff';

        roundRectPath(ctx, pillX, pillY, pillW, pillH, pillH / 2);
        ctx.fillStyle = pillFill;
        ctx.fill();
        ctx.strokeStyle = pillBorder;
        ctx.stroke();
        ctx.fillStyle = pillText;
        ctx.textBaseline = 'alphabetic';
        ctx.fillText(stateTxt, pillX + pillPadX, pillY + pillH - Math.round(6 * dpr));

        ctx.strokeStyle = 'rgba(255,255,255,0.15)';
        ctx.beginPath();
        ctx.moveTo(x + INNER, y + HEADER_H + 0.5);
        ctx.lineTo(x + boxW - INNER, y + HEADER_H + 0.5);
        ctx.stroke();

        const baseY = y + HEADER_H + INNER;

        for (let i = 0; i < metrics.length; i++) {
          const m = metrics[i];
          const rowY = baseY + i * ROW_H;
          // Each row: label, a bar filled to the share of its ON threshold, and a percentage (100%+ once triggered).

          ctx.globalAlpha = m.enabled ? 1.0 : 0.35;
          ctx.fillStyle = TXT_DIM;
          ctx.textBaseline = 'alphabetic';
          ctx.fillText(m.label, x + INNER, rowY + Math.round(9 * dpr));

          const barX = x + INNER + LABEL_W;
          const barY = rowY - Math.round(BAR_H / 2) + Math.round(9 * dpr);
          ctx.fillStyle = 'rgba(255,255,255,0.18)';
          ctx.fillRect(barX, barY, BAR_W, BAR_H);

          const onThres = Math.max(1e-6, m.on);
          const ratio = m.val / onThres;
          const fillW = Math.round(BAR_W * Math.max(0, Math.min(ratio, 1)));

          let fillCol = '#4caf50';
          if (ratio >= 0.9 && ratio < 1.0) fillCol = '#ffc107';
          if (ratio >= 1.0) fillCol = '#801721';

          ctx.globalAlpha = m.enabled ? 1.0 : 0.35;
          ctx.fillStyle = fillCol;
          ctx.fillRect(barX, barY, fillW, BAR_H);

          ctx.strokeStyle = 'rgba(255,255,255,0.9)';
          ctx.beginPath();
          ctx.moveTo(barX + BAR_W + 0.5, barY - Math.round(2 * dpr));
          ctx.lineTo(barX + BAR_W + 0.5, barY + BAR_H + Math.round(2 * dpr));
          ctx.stroke();

          const pct = Math.round(Math.max(0, ratio) * 100);
          const pctText = ratio >= 1 ? '100%+' : `${pct}%`;
          ctx.fillStyle = TXT_DIM;
          ctx.textBaseline = 'middle';
          ctx.fillText(pctText, barX + BAR_W + Math.round(8 * dpr), barY + Math.round(BAR_H / 2));

          ctx.globalAlpha = 1.0;
        }

        ctx.restore();
      }

      /* ---------- Panel state reflect ---------- */
      // Mirror the live scores into the settings panel readouts.
      function reflectPanel() {
        if (emaScoreTxt) emaScoreTxt.textContent = moveEma.toFixed(3);
        if (intScoreTxt) intScoreTxt.textContent = intScore.toFixed(3);
        if (driftScoreTxt) driftScoreTxt.textContent = driftScore.toFixed(3);
        if (moveStateTxt) {
          moveStateTxt.textContent = moving ? 'MOVING' : 'STILL';
          moveStateTxt.classList.toggle('moving', moving);
          moveStateTxt.classList.toggle('still', !moving);
        }
      }

      // Make Reset buttons match Start button width
      function matchButtonSizes() {
        if (!movePanel || movePanel.classList.contains('hidden') || !calStartBtn) return;
        const rect = calStartBtn.getBoundingClientRect();
        const w = Math.ceil(rect.width);
        if (!w || w < 10) return;
        [driftReset, moveReset].forEach((btn) => {
          if (!btn) return;
          btn.style.minWidth = w + 'px';
          btn.style.width = w + 'px';
        });
      }

      // Update the main-page quick-calibration button (label and countdown) while calibration runs.
      function updateCalQuickUI(active, secsLeft = null) {
        if (!calQuickBtn) return;
        if (!active) {
          calQuickBtn.disabled = !hasLivePose();
          calQuickBtn.innerHTML = 'Calibration';
          calQuickBtnActive = false;
          return;
        }
        calQuickBtn.disabled = true;
        const secsTxt = secsLeft == null ? '' : ` ${secsLeft}s`;
        calQuickBtn.innerHTML = `<span class="spinner" aria-hidden="true"></span>Calibrating…${secsTxt}`;
      }

      /* ---------- Main draw for live pose ---------- */
      // Draw skeleton and points with MediaPipe DrawingUtils on the overlay canvas.
      function drawPoseLandmarks(landmarks) {
        if (!landmarks?.length || !poseCanvas.width || !poseCanvas.height) return;
        const utils = new DrawingUtils(poseCtx);

        for (const lm of landmarks) {
          try {
            drawBaselineGhostAndVectors(lm);
          } catch (e) {
            console.warn('[baseline overlay]', e);
          }
          utils.drawLandmarks(lm, {
            radius: (data) => DrawingUtils.lerp((data.from && data.from.z) ?? 0, -0.15, 0.1, 5, 1),
          });
          utils.drawConnectors(lm, PoseLandmarker.POSE_CONNECTIONS);
        }
      }

      /* ---------- Movement update ---------- */
      /**
       * Process one pose frame: update the three scores, apply hysteresis, open/close Motion alert episodes, feed
       * calibration, redraw the badge and (when computed locally) report the state to the Camera over the data channel.
       * @param {Array} lm  landmarks of the first detected person
       * @param {boolean} canSend  false when the pose came from the Camera, so no result is echoed back
       */
      function updateMovementFromLandmarks(lm, canSend = true) {
        const now = performance.now();
        lastPoseTs = now;
        updateCalibrationAvailability();

        if (!lastTs) lastTs = now;
        // Frame interval in seconds, clamped so stalls or bursts cannot distort the filters.
        const dt = Math.max(1 / 120, Math.min(0.2, (now - lastTs) / 1000));
        lastTs = now;

        const raw = rawMovementScore(lm, prevLm);
        prevLm = lm;
        moveEma = moveEma + MOVE.EMA_ALPHA * (raw - moveEma);
        if (raw >= MOVE.ON) lastAboveOnTs = now;
        const shortTrigger = moveEma >= MOVE.ON;
        const shortHoldOk = moveEma > MOVE.OFF || now - lastAboveOnTs < MOVE.OFF_HOLD_MS;

        // Leaky integrator: older movement decays with time constant INT_TAU.
        // Exponential decay factor for this frame's dt.
        const decay = Math.exp(-dt / MOVE.INT_TAU);
        intScore = intScore * decay + raw * dt;
        const longTrigger = intScore >= MOVE.INT_ON;
        if (longTrigger) lastIntHitTs = now;
        const longHoldOk = intScore > MOVE.INT_OFF || now - lastIntHitTs < MOVE.OFF_HOLD_MS;

        if (!baseLm) baseLm = cloneLm(lm);
        driftScore = computeDriftScore(lm, baseLm, MOVE.DRIFT_TORSO_REL);
        const driftTrigger = driftScore >= MOVE.DRIFT_ON;
        if (driftTrigger) lastDriftHitTs = now;
        const driftHoldOk = driftScore > MOVE.DRIFT_OFF || now - lastDriftHitTs < MOVE.OFF_HOLD_MS;

        // Each enabled detector uses its ON threshold to start and its OFF threshold (+ hold) to stay on.
        // Hysteresis: once moving, a detector keeps the state until its OFF condition and hold time pass.
        let wantMoving = false;
        if (MOVE.USE_EMA) wantMoving ||= moving ? shortHoldOk : shortTrigger;
        if (MOVE.USE_INT) wantMoving ||= moving ? longHoldOk : longTrigger;
        if (MOVE.USE_DRIFT) wantMoving ||= moving ? driftHoldOk : driftTrigger;

        // ==== Alerts integration: begin/finish Motion episodes + accumulate avg ====
        if (wantMoving !== moving) {
          const prev = moving;
          moving = wantMoving;

          if (moving) {
            movingSince = now;
            _motionSum = 0;
            _motionCount = 0;

            // Start a Motion alert + show the red top banner (matches audio page)
            // beginAlert may fail or be slow; the promise is stored so an early end can still close the alert.
            const p = (_motionAlertP = Promise.resolve(
              beginAlert({
                type: AlertTypes?.Motion ?? 'motion',
                message: 'Movement detected',
              })
            ).catch(() => null));
            runAsync(
              p.then((id) => {
                if (_motionAlertP !== p) return; // episode already ended; endMotionEpisode closes it
                _motionAlertId = id;
                _motionAlertP = null;
                if (moving) showAlertBanner(Date.now(), 'Motion detected');
              })
            );
            // Per-type sound toggle and cooldown are handled inside alertSound.
            void alertSound.trigger();
          } else if (prev) {
            // Finish the Motion alert with an average score (use integrator as sustained proxy)
            moving = true;
            endMotionEpisode('Movement ended');
          }
        }

        // While moving, accumulate integrator score for an avg across the episode
        if (moving) {
          _motionSum += intScore;
          _motionCount++;
        }
        // ==== /Alerts integration ====

        // Only adapt the baseline while still, so slow posture changes are absorbed but real movement is not.
        if (!moving && baseLm) {
          const a = 1 - Math.exp(-dt / MOVE.DRIFT_TAU);
          baseLm = blendLm(baseLm, lm, a);
        }

        // While calibrating, store raw scores and update the progress bar and countdown.
        if (calActive) {
          calSamples.push(raw);
          lastGoodLm = cloneLm(lm);
          const durMs = Math.max(1000, Math.round(calEndMs - calStartMs));
          const t = now - calStartMs;
          if (calProg) calProg.value = Math.min(1, t / durMs);
          const secsLeft = Math.max(0, Math.ceil((calEndMs - now) / 1000));
          if (calTime) calTime.textContent = secsLeft + 's';
          if (calStatus) {
            calStatus.className = 'running';
            calStatus.textContent = `Calibrating… ${secsLeft}s`;
          }
          if (calQuickBtnActive) updateCalQuickUI(true, secsLeft);

          if (now - lastCalUIRedraw >= CAL_RECAL_MS) {
            lastCalUIRedraw = now;
            // Live preview of thresholds every CAL_RECAL_MS once at least 20 samples exist.
            const m = quantile(calSamples, 0.5);
            const p95 = quantile(calSamples, 0.95);
            const n = calSamples.length;

            if (calStats) calStats.style.display = 'block';
            if (calMedian) calMedian.textContent = m.toFixed(4);
            if (calP95) calP95.textContent = p95.toFixed(4);
            if (calN) calN.textContent = String(n);

            if (MOVE.CAL_LIVE && n >= 20) {
              applyThresholdsFromStats(m, p95, /*isFinal=*/ false);
            }
          }

          if (now >= calEndMs) finishCalibration();
        }

        // Draw the badge inside save/restore so a drawing error cannot leak canvas state.
        poseCtx.save();
        try {
          drawMovementBadge(moving, moveEma, intScore, driftScore);
        } catch (e) {
          console.error('[drawMovementBadge]', e);
        } finally {
          try {
            poseCtx.restore();
          } catch {}
        }
        reflectPanel();

        // Report the locally computed state to the Camera (data channel message type 'movement').
        if (canSend && poseWhere === 'receiver' && poseDC?.readyState === 'open') {
          poseDC.send(
            JSON.stringify({
              type: 'movement',
              where: 'receiver',
              moving,
              scoreEma: moveEma,
              scoreInt: intScore,
              scoreDrift: driftScore,
              ts: now,
            })
          );
        }
      }

      /* ---------- Calibration helpers ---------- */
      // Linear-interpolated quantile (q in 0..1) of a numeric array.
      function quantile(arr, q) {
        if (!arr.length) return 0;
        const a = arr.slice().sort((x, y) => x - y);
        const pos = (a.length - 1) * q;
        const i = Math.floor(pos),
          j = Math.ceil(pos);
        if (i === j) return a[i];
        const w = pos - i;
        return a[i] * (1 - w) + a[j] * w;
      }

      // Multipliers (3.5x median, 1.2x p95, ...) are empirical margins above the still-baby noise level.
      // Derive ON thresholds from calibration statistics of a still baby (m = median, p95 = 95th percentile of the raw
      // score). OFF thresholds follow ON when linked or when final; the sliders are updated to match.
      function applyThresholdsFromStats(m, p95, isFinal) {
        if (!onTh || !offTh || !intOnEl || !intOff || !driftOnEl || !driftOff) return;
        const emaOn = Math.max(3.5 * m, 1.2 * p95, 0.01);
        const intOn = MOVE.INT_TAU * m * 2.5;
        const driftOn = Math.max(5.0 * m, 1.5 * emaOn, 0.02);

        MOVE.ON = Math.max(0.005, emaOn);
        MOVE.INT_ON = Math.max(0.005, intOn);
        MOVE.DRIFT_ON = Math.max(0.005, driftOn);

        if (isFinal || offLink.ema) {
          MOVE.OFF = MOVE.ON;
        }
        if (isFinal || offLink.int) {
          MOVE.INT_OFF = MOVE.INT_ON;
        }
        if (isFinal || offLink.drift) {
          MOVE.DRIFT_OFF = MOVE.DRIFT_ON;
        }

        onTh.value = MOVE.ON;
        if (onOut) onOut.textContent = MOVE.ON.toFixed(3);
        intOnEl.value = MOVE.INT_ON;
        if (intOnOut) intOnOut.textContent = MOVE.INT_ON.toFixed(3);
        driftOnEl.value = MOVE.DRIFT_ON;
        if (driftOnOut) driftOnOut.textContent = MOVE.DRIFT_ON.toFixed(3);

        offTh.value = Math.min(MOVE.OFF, MOVE.ON);
        if (offOut) offOut.textContent = (MOVE.OFF = Math.min(MOVE.OFF, MOVE.ON)).toFixed(3);

        intOff.value = Math.min(MOVE.INT_OFF, MOVE.INT_ON);
        if (intOffOut) intOffOut.textContent = (MOVE.INT_OFF = Math.min(MOVE.INT_OFF, MOVE.INT_ON)).toFixed(3);

        driftOff.value = Math.min(MOVE.DRIFT_OFF, MOVE.DRIFT_ON);
        if (driftOffOut)
          driftOffOut.textContent = (MOVE.DRIFT_OFF = Math.min(MOVE.DRIFT_OFF, MOVE.DRIFT_ON)).toFixed(3);

        applyOnCaps();
      }

      // Calibration length is limited to 5..60 s.
      // Begin a timed calibration (CAL_SECS clamped to 5..60 s) collecting raw scores while the baby is still.
      function startCalibration() {
        if (calActive) return;
        calActive = true;
        updateCalibrationAvailability();

        calStartMs = performance.now();
        calEndMs = calStartMs + Math.max(5, Math.min(60, MOVE.CAL_SECS)) * 1000;
        calSamples = [];
        lastGoodLm = null;
        lastCalUIRedraw = 0;

        if (calStats) calStats.style.display = 'none';
        if (calStatus) {
          calStatus.className = 'running';
          calStatus.textContent = `Calibrating… ${Math.round((calEndMs - calStartMs) / 1000)}s`;
        }
        if (calProgRow) calProgRow.style.display = 'grid';
        if (calProg) calProg.value = 0;
        if (calTime) calTime.textContent = Math.round((calEndMs - calStartMs) / 1000) + 's';

        offLink = { ema: true, int: true, drift: true };
      }

      // End calibration: needs at least 20 samples, applies final thresholds, resets baseline and saves settings.
      function finishCalibration() {
        if (calSamples.length < 20) {
          abortCalibration('Calibration cancelled: not enough body points measured. Try again.');
          return;
        }
        calActive = false;
        updateCalibrationAvailability();
        if (calProgRow) calProgRow.style.display = 'none';

        const m = quantile(calSamples, 0.5);
        const p95 = quantile(calSamples, 0.95);
        const n = calSamples.length;

        applyThresholdsFromStats(m, p95, /*isFinal=*/ true);

        if (lastGoodLm) baseLm = cloneLm(lastGoodLm);
        moveEma = 0;
        intScore = 0;
        driftScore = 0;
        lastTs = 0;

        saveMoveConfig();
        initMovePanel();

        if (calMedian) calMedian.textContent = m.toFixed(4);
        if (calP95) calP95.textContent = p95.toFixed(4);
        if (calN) calN.textContent = String(n);
        if (calStats) calStats.style.display = 'block';

        if (calStatus) {
          calStatus.className = 'ok';
          calStatus.textContent = 'Calibrated';
        }
        setTimeout(() => {
          if (!calActive && calStatus) calStatus.textContent = '';
        }, 3000);

        if (calQuickBtnActive) {
          updateCalQuickUI(false);
          closeMovePanel();
        }
      }

      // Wipe the overlay canvas (used when the stream stops or the connection drops).
      function clearOverlayDrawing() {
        try {
          poseCtx.setTransform(1, 0, 0, 1, 0, 0);
          poseCtx.clearRect(0, 0, poseCanvas.width, poseCanvas.height);
        } catch {}
      }
      // Clear the overlay when the video track ends or mutes, or is removed from the stream.
      function attachStreamEndHandlers(stream) {
        if (!stream) return;
        stream.getVideoTracks().forEach((t) => {
          t.addEventListener('ended', clearOverlayDrawing);
          t.addEventListener('mute', clearOverlayDrawing);
        });
        stream.addEventListener('removetrack', (e) => {
          if (e.track?.kind === 'video') clearOverlayDrawing();
        });
      }

      /* ---------- MediaPipe on RECEIVER ---------- */
      // Pose detection on the Viewer: ensurePoseTask builds the model, startReceiverPoseLoop runs it per video frame.
      let useRVFC = false;
      let _poseTaskP = null;
      // Lazily create the PoseLandmarker once; concurrent callers share one promise, reset on failure to allow retry.
      function ensurePoseTask() {
        if (poseTask) return Promise.resolve(poseTask);
        if (!_poseTaskP)
          _poseTaskP = _ensurePoseTaskImpl().catch((e) => {
            _poseTaskP = null;
            throw e;
          });
        return _poseTaskP;
      }
      // Loads the WASM files and creates the PoseLandmarker in VIDEO mode (one person).
      async function _ensurePoseTaskImpl() {
        if (poseTask) return poseTask;
        const vision = await FilesetResolver.forVisionTasks(WASM_DIR);
        poseTask = await createVisionTask(
          PoseLandmarker,
          vision,
          {
            baseOptions: { modelAssetPath: POSE_MODEL_URL },
            runningMode: 'VIDEO',
            numPoses: 1,
          },
          { label: 'motion' }
        );
        return poseTask;
      }
      // True once the video has decoded dimensions and current data.
      const videoHasFrame = (v) => v && v.readyState >= HAVE_CURRENT_DATA && v.videoWidth > 0 && v.videoHeight > 0;
      // Resolve once the video has decoded at least one frame.
      function waitForVideoFrame(video) {
        if (videoHasFrame(video)) return Promise.resolve();
        return new Promise((resolve) => {
          const check = () => {
            if (videoHasFrame(video)) {
              cleanup();
              resolve();
            }
          };
          const cleanup = () => {
            video.removeEventListener('loadedmetadata', check);
            video.removeEventListener('playing', check);
            video.removeEventListener('resize', check);
          };
          video.addEventListener('loadedmetadata', check);
          video.addEventListener('playing', check);
          video.addEventListener('resize', check);
        });
      }
      // Loop generation counter and a guard against concurrent starts.
      let _loopGen = 0,
        _loopStarting = false;
      // Run pose detection on the Viewer for every video frame. The generation counter (_loopGen) retires stale loops.
      async function startReceiverPoseLoop() {
        if (poseLoopRunning || _loopStarting) return;
        _loopStarting = true;
        const gen = ++_loopGen;
        try {
          await ensurePoseTask();
          await waitForVideoFrame(remoteVideo);
        } finally {
          _loopStarting = false;
        }
        if (gen !== _loopGen) return; // stopped meanwhile

        // requestVideoFrameCallback fires per decoded frame; requestAnimationFrame is the fallback.
        useRVFC = 'requestVideoFrameCallback' in (remoteVideo || {});
        poseLoopRunning = true;

        // One detection step: runs the model, draws, updates movement and mirrors landmarks to the Camera.
        const onFrame = () => {
          if (gen !== _loopGen) return; // an older loop: let it end
          if (!poseLoopRunning || !poseEnabled || poseWhere !== 'receiver') return;
          if (!videoHasFrame(remoteVideo)) {
            poseCtx.clearRect(0, 0, poseCanvas.width, poseCanvas.height);
            updateCalibrationAvailability();
            scheduleNext();
            return;
          }
          try {
            const ts = performance.now();
            const result = poseTask.detectForVideo(remoteVideo, ts);
            if (result?.landmarks?.length) {
              const lm = result.landmarks[0];
              poseCtx.clearRect(0, 0, poseCanvas.width, poseCanvas.height);
              drawPoseLandmarks([lm]);
              updateMovementFromLandmarks(lm, /*canSend=*/ true);
              if (poseDC?.readyState === 'open') {
                poseDC.send(JSON.stringify({ type: 'pose', landmarks: [lm], ts }));
              }
            } else {
              prevLm = null;
              poseCtx.clearRect(0, 0, poseCanvas.width, poseCanvas.height);
              updateCalibrationAvailability();
            }
          } catch (err) {
          } finally {
            scheduleNext();
          }
        };
        // Queue the next frame callback.
        const scheduleNext = () => {
          if (useRVFC) remoteVideo.requestVideoFrameCallback(onFrame);
          else requestAnimationFrame(onFrame);
        };
        scheduleNext();
      }
      // Stop local detection, close any open episode and reset the filters.
      function stopReceiverPoseLoop() {
        poseLoopRunning = false;
        _loopGen++;
        endMotionEpisode('Movement detection stopped');
        prevLm = null;
        moveEma = 0;
        intScore = 0;
        driftScore = 0;
        lastTs = 0;
        poseCtx.clearRect(0, 0, poseCanvas.width, poseCanvas.height);
        reflectPanel();
        updateCalibrationAvailability();
      }
      // React to the Camera "pose-mode" message: run locally ("receiver"), consume Camera landmarks ("sender"), or off.
      function applyPoseMode() {
        setOverlayVisible(poseEnabled);
        if (!poseEnabled) {
          stopReceiverPoseLoop();
          return;
        }
        if (poseWhere === 'receiver') startReceiverPoseLoop();
        else stopReceiverPoseLoop();
      }

      /* ---------- Shared WebRTC core ---------- */
      // ReceiverCore handles signalling and the peer connection; the callbacks below wire it to this page.
      const core = new ReceiverCore({
        wsEndpoint: WS_ENDPOINT,
        room,
        onStatus: showStatus,
        // Attach the stream once; muted autoplay first.
        onStream: (stream) => {
          if (remoteVideo && remoteVideo.srcObject !== stream) {
            remoteVideo.srcObject = stream;
            tryStartMuted();
            attachStreamEndHandlers(stream);
          }
        },
        // Connection problems end the open episode and cancel calibration.
        onIceState: (state) => {
          if (state === 'failed' || state === 'disconnected' || state === 'closed') {
            clearOverlayDrawing();
            lastPoseTs = 0;
            updateCalibrationAvailability();
            endMotionEpisode('Connection lost');
            abortCalibration('Calibration cancelled: connection lost.');
          }
        },
        // The Camera sent "bye" (stopped).
        onBye: () => {
          clearOverlayDrawing();
          lastPoseTs = 0;
          updateCalibrationAvailability();
          endMotionEpisode('Camera stopped');
          abortCalibration('Calibration cancelled: Camera stopped.');
        },
        // The Viewer creates the "pose" data channel: carries pose-mode, pose landmarks and movement results.
        onCreatePC: (pc) => {
          const ch = pc.createDataChannel('pose');
          ch.onopen = () => {};
          ch.onclose = () => {};
          ch.onerror = () => {};
          // Messages: 'pose-mode' (enabled + where) switches detection; 'pose' carries Camera-computed landmarks.
          ch.onmessage = (ev) => {
            try {
              const msg = JSON.parse(ev.data);
              if (msg.type === 'pose-mode') {
                poseEnabled = !!msg.enabled;
                poseWhere = msg.where || 'sender';
                applyPoseMode();
              } else if (msg.type === 'pose') {
                if (poseEnabled && poseWhere === 'sender' && msg.landmarks?.length) {
                  const lm = msg.landmarks[0];
                  poseCtx.clearRect(0, 0, poseCanvas.width, poseCanvas.height);
                  updateMovementFromLandmarks(lm, /*canSend=*/ false);
                  drawPoseLandmarks([lm]);
                } else {
                  updateCalibrationAvailability();
                }
              }
            } catch {}
          };
          poseDC = ch;
        },
        onDataChannel: () => {},
      });

      core.start().catch(() => {});
      // ===== Alerts pill + history (shared) =====
      // Will add an "Alerts" button with a red-count badge into #controls,
      // and render the sortable/filterable history drawer into #alertsModalHost.
      initAlertsUI({ drawerHostId: 'alertsModalHost' });

      /* ---------- Panel logic ---------- */
      // Load saved settings, keeping only keys whose stored type matches the defaults.
      function loadMoveConfig() {
        try {
          const raw = localStorage.getItem(LS_KEY);
          if (!raw) return {};
          const obj = JSON.parse(raw);
          const cfg = {};
          for (const k of Object.keys(MOVE_DEFAULTS)) {
            if (typeof obj[k] === typeof MOVE_DEFAULTS[k]) cfg[k] = obj[k];
          }
          return cfg;
        } catch {
          return {};
        }
      }
      // Persist the settings in localStorage under LS_KEY.
      function saveMoveConfig() {
        try {
          localStorage.setItem(LS_KEY, JSON.stringify(MOVE));
        } catch {}
      }
      // Small helpers: clamp a value; fixed-decimal text.
      const clampUi = (v, min, max) => Math.max(min, Math.min(max, v));
      const fmt = (n, d = 3) => Number(n).toFixed(d);

      // Keep slider maxima and values consistent: OFF never above ON, and ON ranges widen to fit calibrated values.
      function applyOnCaps() {
        if (!onTh || !offTh || !driftOnEl || !driftOff || !intOnEl || !intOff) return;
        // Slider ranges never exceed MAX_SAFE; HEADROOM leaves room above the calibrated value.
        const HEADROOM = 1.2,
          MAX_SAFE = 10.0;

        // Raises a slider's max to 1.2x the calibrated value (capped at 10) so calibrated thresholds fit.
        const setMaxWithHeadroom = (inputEl, baseCap, calibratedVal) => {
          const need = Math.min(MAX_SAFE, Math.max(baseCap, calibratedVal * HEADROOM));
          inputEl.max = Number.isFinite(need)
            ? need.toFixed(3)
            : baseCap.toFixed
              ? baseCap.toFixed(3)
              : String(baseCap);
        };

        setMaxWithHeadroom(onTh, 0.5, MOVE.ON);
        offTh.max = onTh.max;
        setMaxWithHeadroom(driftOnEl, 1.0, MOVE.DRIFT_ON);
        driftOff.max = driftOnEl.max;
