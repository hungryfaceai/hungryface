<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Baby Monitor – Receiver</title>
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>

  <!-- ⬇️ Add shared sidebar stylesheet -->
  <link rel="stylesheet" href="/hungryface/webrtc/receiver/shared/sidebar.css" />

  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0; height: 100%;
      background: #000; color: #fff;
      font-family: -apple-system, system-ui, Segoe UI, Roboto, sans-serif;
      overflow: hidden;
    }
    /* Fullscreen wrapper so video scales */
    #stage {
      position: fixed; inset: 0;
      width: 100vw; height: 100vh;   /* fallback */
      width: 100dvw; height: 100dvh; /* dynamic viewport */
      width: 100svw; height: 100svh; /* small viewport (iOS URL bar safe) */
      z-index: 1; background: #000;
    }
    #stage > video {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: contain; background: #000;
    }

    .btn {
      padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.6);
      background: transparent; color: #fff; font-size: 16px; font-weight: 600;
      cursor: pointer; box-shadow: none;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    }
    .btn:active { transform: scale(0.99); }

    /* Talk button states */
    .btn.live {
      border-color: #ff5252;
      box-shadow: 0 0 0 2px rgba(255,82,82,0.2), 0 0 12px rgba(255,82,82,0.35);
    }
    .btn.ptt {
      border-color: #ffa252;
      box-shadow: 0 0 0 2px rgba(255,162,82,0.2), 0 0 12px rgba(255,162,82,0.35);
    }

    #controls {
      position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
      display: flex; align-items: center; gap: 12px; z-index: 6;
      flex-wrap: wrap; justify-content: center;
    }
    #enableAudioBtn, #disableAudioBtn { display: none; }

    .overlay {
      position: fixed; inset: 0; display: flex;
      align-items: center; justify-content: center;
      pointer-events: none; z-index: 5;
    }
    .status {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: #ddd; font-size: 14px; padding: 10px 14px; border-radius: 12px;
      text-align: center; white-space: pre-line; max-width: 90vw;
    }
    .overlay.hidden { display: none; }
  </style>
</head>
<body>
  <!-- ⬇️ Inject shared sidebar markup and behavior (kept separate from your code) -->
  <script type="module">
    (async () => {
      try {
        const res = await fetch('/hungryface/webrtc/receiver/shared/sidebar.html', { cache: 'no-cache' });
        const html = await res.text();
        const wrap = document.createElement('div');
        wrap.innerHTML = html.trim();
        document.body.prepend(...wrap.childNodes);

        await new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = '/hungryface/webrtc/receiver/shared/sidebar.js';
          s.onload = resolve;
          s.onerror = reject;
          document.body.appendChild(s);
        });
        console.log('[RX][Sidebar]', new Date().toISOString(), 'Shared sidebar loaded');
      } catch (err) {
        console.error('[RX][Sidebar]', new Date().toISOString(), 'Failed to load shared assets:', err);
      }
    })();
  </script>

  <div id="controls">
    <button id="enableAudioBtn" class="btn" type="button">Enable audio</button>
    <button id="disableAudioBtn" class="btn" type="button">Disable audio</button>
    <button id="fsBtn" class="btn" type="button">Fullscreen</button>
    <!-- ⬇️ Hybrid Talk button (short press = toggle, long press = hold) -->
    <button id="talkBtn" class="btn" type="button" aria-pressed="false" title="Short press = toggle • Long press = hold">Talk</button>
    <!-- ⬇️ Lullaby button -->
    <button id="lullabyBtn" class="btn" type="button" title="Play lullaby to baby (sender)">Lullaby</button>
  </div>

  <div id="stage">
    <video id="remote" autoplay playsinline></video>
  </div>

  <div id="overlay" class="overlay">
    <div id="status" class="status">Idle</div>
  </div>

  <script type="module">
    /* ---------- Logging helpers ---------- */
    const _ts = () => new Date().toISOString();
    const _info = (...args) => console.log('[RX]', _ts(), ...args);
    const _warn = (...args) => console.warn('[RX][WARN]', _ts(), ...args);
    const _err  = (...args) => console.error('[RX][ERR]', _ts(), ...args);
    const _evt  = (name, extra={}) => _info('EVT', name, extra);

    _info('Booting Receiver script. UA:', navigator.userAgent, 'Page:', location.href);

    /* ---------- NEW: SecureSignal + secure-webrtc (trusted only) ---------- */
    import { SecureSignal } from '/hungryface/webrtc/shared/secure-signal.js';
    import { connectToPeer } from '/hungryface/webrtc/shared/secure-webrtc.js';

    /* ---------- Constants ---------- */
    const SS_WS_ENDPOINT = "wss://signaling-server-f5gu.onrender.com/ws";
    const desiredRoom = (new URLSearchParams(location.search).get("room") || "Baby").trim();
    const STATUS_HIDE_AFTER_CONNECTED_MS = 10000;

    _info('Config:', { SS_WS_ENDPOINT, desiredRoom });

    /* ---------- DOM ---------- */
    const stage = document.getElementById('stage');
    const remoteVideo = document.getElementById('remote');

    const fsBtn = document.getElementById('fsBtn');
    const enableAudioBtn = document.getElementById('enableAudioBtn');
    const disableAudioBtn = document.getElementById('disableAudioBtn');
    const overlay = document.getElementById('overlay');
    const statusEl = document.getElementById('status');
    const talkBtn = document.getElementById('talkBtn');
    const lullabyBtn = document.getElementById('lullabyBtn');

    /* ---------- Status overlay ---------- */
    let hideStatusTimer = null;
    function showStatus(msg) {
      _info('Status:', msg);
      statusEl.textContent = msg;
      overlay.classList.remove('hidden');
      if (msg === 'Connected') {
        if (hideStatusTimer) clearTimeout(hideStatusTimer);
        hideStatusTimer = setTimeout(() => {
          _info('Status overlay auto-hide after', STATUS_HIDE_AFTER_CONNECTED_MS, 'ms');
          overlay.classList.add('hidden');
        }, STATUS_HIDE_AFTER_CONNECTED_MS);
      } else {
        if (hideStatusTimer) { clearTimeout(hideStatusTimer); hideStatusTimer = null; }
        overlay.classList.remove('hidden');
      }
    }

    /* ---------- Audio UI ---------- */
    function updateAudioButtons() {
      _info('updateAudioButtons()', { muted: remoteVideo.muted, volume: remoteVideo.volume });
      if (remoteVideo.muted) {
        enableAudioBtn.style.display = 'block';
        disableAudioBtn.style.display = 'none';
      } else {
        enableAudioBtn.style.display = 'none';
        disableAudioBtn.style.display = 'block';
      }
    }
    enableAudioBtn.style.display = 'block';
    _info('Initial audio state:', { muted: remoteVideo.muted, volume: remoteVideo.volume });

    async function tryStartMuted() {
      try {
        remoteVideo.muted = true;
        remoteVideo.volume = 1.0;
        await remoteVideo.play();
        _info('tryStartMuted(): video.play() OK while muted');
      } catch (e) {
        _warn('tryStartMuted(): video.play() failed (autoplay policy likely).', e && (e.name || e.message));
      }
      updateAudioButtons();
    }
    enableAudioBtn.addEventListener('click', async (e) => {
      e?.preventDefault?.();
      _evt('EnableAudioBtn.click');
      try {
        remoteVideo.muted = false; remoteVideo.volume = 1.0;
        await remoteVideo.play();
        _info('Audio enabled; video.play() resolved');
      } catch (e) {
        _warn('Audio enable: video.play() rejected', e && (e.name || e.message));
      }
      updateAudioButtons();
    });
    disableAudioBtn.addEventListener('click', (e) => {
      e?.preventDefault?.();
      _evt('DisableAudioBtn.click');
      remoteVideo.muted = true;
      updateAudioButtons();
    });

    /* ---------- Fullscreen ---------- */
    fsBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      _evt('FullscreenBtn.click', { inFS: !!document.fullscreenElement });
      try {
        if (!document.fullscreenElement) {
          await (stage.requestFullscreen?.call(stage) || document.documentElement.requestFullscreen());
          fsBtn.textContent = 'Exit fullscreen';
          _info('Entered fullscreen');
        } else {
          await document.exitFullscreen();
          fsBtn.textContent = 'Fullscreen';
          _info('Exited fullscreen');
        }
      } catch (e) {
        _warn('Fullscreen toggle failed', e && (e.name || e.message));
      }
      beginViewportSettle();
    });
    document.addEventListener('fullscreenchange', () => {
      _evt('fullscreenchange', { inFS: !!document.fullscreenElement });
      fsBtn.textContent = document.fullscreenElement ? 'Exit fullscreen' : 'Fullscreen';
      beginViewportSetle();
    });

    remoteVideo.addEventListener('loadedmetadata', () => {
      _evt('video.loadedmetadata', { width: remoteVideo.videoWidth, height: remoteVideo.videoHeight, readyState: remoteVideo.readyState });
      beginViewportSettle();
    });
    remoteVideo.addEventListener('playing', () => {
      _evt('video.playing', { t: remoteVideo.currentTime, readyState: remoteVideo.readyState });
      updateAudioButtons(); beginViewportSettle();
    });
    remoteVideo.addEventListener('resize', () => {
      _evt('video.resize', { width: remoteVideo.videoWidth, height: remoteVideo.videoHeight });
      beginViewportSettle();
    });
    remoteVideo.addEventListener('error', (e) => {
      _err('video.error', e?.message || e);
    });

    function beginViewportSettle(){ /* no-op for video-only */ }
    function beginViewportSetle(){ beginViewportSettle(); } // typo guard

    /* ---------- Talkback (receiver -> sender): short-press toggle + long-press hold ---------- */
    const LONG_PRESS_MS = 450;           // hold ≥ this → push-to-talk

    // sid -> { pc, dc, peerFp, room, selected, talkTx, talkSender, talkTrack, talkStream, stream }
    const sessions = new Map();

    function attachStream(stream) {
      if (remoteVideo.srcObject !== stream) {
        remoteVideo.srcObject = stream;
        const tracks = stream ? stream.getTracks().map(t => ({ kind: t.kind, id: t.id, enabled: t.enabled, readyState: t.readyState })) : [];
        _info('attachStream()', { hasStream: !!stream, tracks });
        tryStartMuted();
      } else {
        _info('attachStream(): stream already attached');
      }
    }

    function selectSession(sid) {
      _info('selectSession()', { sid, totalSessions: sessions.size });
      for (const [id, s] of sessions) s.selected = (id === sid);
      const s = sessions.get(sid);
      if (s?.stream) attachStream(s.stream);
      if (s) showStatus('Connected'); // UX
      updateTalkUI();
    }

    function currentSession() {
      for (const [id, s] of sessions) if (s.selected) return [id, s];
      return [null, null];
    }

    async function ensureTalkStreamOn(s) {
      if (s.talkStream && s.talkTrack) {
        _info('ensureTalkStreamOn(): reuse existing talk track', { enabled: s.talkTrack.enabled, id: s.talkTrack.id });
        return;
      }
      _info('ensureTalkStreamOn(): requesting getUserMedia({audio}) …');
      s.talkStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          channelCount: 1,
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true
        },
        video: false
      });
      s.talkTrack = s.talkStream.getAudioTracks()[0];
      try { s.talkTrack.contentHint = 'speech'; } catch {}
      s.talkTrack.enabled = false;
      _info('Talk track acquired', { id: s.talkTrack.id, settings: s.talkTrack.getSettings?.(), constraints: s.talkTrack.getConstraints?.() });

      const sender = s.talkTx?.sender || s.talkSender;
      if (sender && sender.track !== s.talkTrack) {
        _info('Replacing sender track with mic', { old: sender.track?.id, new: s.talkTrack.id });
        await sender.replaceTrack(s.talkTrack);
        s.talkSender = sender;
      } else {
        _info('No sender available yet for talk track');
      }
    }

    // UI state
    let latched = false;                 // toggle mode ON/OFF
    let pressed = false;                 // pointer is down
    let pttSession = false;              // currently in PTT hold
    let pressTimer = null;

    async function ensureLullabyStoppedIfNeeded() {
      if (sendingLullaby) {
        _info('ensureLullabyStoppedIfNeeded(): stopping lullaby before talkback');
        await stopLullaby();
      }
    }

    async function handlePressStart(e) {
      e.preventDefault();
      pressed = true;
      clearTimeout(pressTimer);
      _evt('Talk.pressStart');
      pressTimer = setTimeout(async () => {
        if (!pressed) return;
        await ensureLullabyStoppedIfNeeded();
        pttSession = true;
        const [, s] = currentSession(); if (!s) { _warn('Talk: no current session on long-press'); return; }
        try {
          await ensureTalkStreamOn(s);
          setTalking(true);
          _info('PTT started (hold)');
        } catch (err) {
          _err('PTT start failed', err);
        }
      }, LONG_PRESS_MS);
    }

    function handlePressEnd(e) {
      e.preventDefault();
      if (!pressed) return;
      pressed = false;
      _evt('Talk.pressEnd', { pttSession, latched });

      if (!pttSession) {
        clearTimeout(pressTimer);
        latched = !latched;
        if (latched) {
          (async () => {
            await ensureLullabyStoppedIfNeeded();
            const [, s] = currentSession(); if (!s) { _warn('Talk toggle: no current session'); return; }
            await ensureTalkStreamOn(s);
            setTalking(true);
            _info('Talk latched=ON');
          })().catch(err => _warn('Talk toggle ON failed', err));
        } else {
          setTalking(false);
          _info('Talk latched=OFF');
        }
        return;
      }

      setTalking(latched);
      pttSession = false;
      _info('PTT ended; latched now =', latched);
      updateTalkUI();  
    }

    ['pointerdown','touchstart','mousedown'].forEach(ev =>
      talkBtn.addEventListener(ev, handlePressStart, { passive: false })
    );
    ['pointerup','pointercancel','touchend','touchcancel','mouseup','mouseleave'].forEach(ev =>
      talkBtn.addEventListener(ev, handlePressEnd, { passive: false })
    );

    talkBtn.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'Enter') handlePressStart(e);
    });
    talkBtn.addEventListener('keyup', (e) => {
      if (e.code === 'Space' || e.code === 'Enter') handlePressEnd(e);
    });

    function setTalking(on) {
      const [, s] = currentSession();
      if (!s || !s.talkTrack) { _warn('setTalking(): no session or talkTrack'); return; }
      s.talkTrack.enabled = !!on;
      try { remoteVideo.volume = on ? 0.25 : 1.0; } catch {}
      _info('setTalking()', { on, trackId: s.talkTrack.id });
      updateTalkUI();
    }

    function updateTalkUI() {
      talkBtn.classList.toggle('ptt', pttSession);
      talkBtn.classList.toggle('live', (pttSession || latched));
      talkBtn.setAttribute('aria-pressed', (pttSession || latched) ? 'true' : 'false');

      if (pttSession) talkBtn.textContent = 'Talking… (hold)';
      else if (latched) talkBtn.textContent = 'Talking…';
      else talkBtn.textContent = 'Talk';
    }

    // --------- Lullaby playlist over the same sendonly transceiver (no mic mixing) ---------
    const LULLABY_DIR = '/hungryface/lullaby/';

    let lullabyEl = null;
    let lullabyCtx = null;
    let lullabyDest = null;
    let lullabyTrack = null;
    let musicNode = null;

    let sendingLullaby = false;
    let lullabyList = [];   // discovered absolute URLs
    let playlist = [];      // shuffled order
    let trackIdx = 0;

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    async function urlExists(url) {
      try {
        const h = await fetch(url, { method: 'HEAD', cache: 'no-cache' });
        if (h.ok) return true;
      } catch (e) { _warn('HEAD failed for', url, e?.message); }
      try {
        const g = await fetch(url, { method: 'GET', headers: { Range: 'bytes=0-0' }, cache: 'no-cache' });
        return g.ok;
      } catch (e) { _warn('GET range failed for', url, e?.message); return false; }
    }

    async function discoverLullabies() {
      if (lullabyList.length) return lullabyList;

      try {
        const res = await fetch(LULLABY_DIR + 'playlist.json', { cache: 'no-cache' });
        _info('playlist.json fetch', { ok: res.ok, status: res.status });
        if (res.ok) {
          const data = await res.json();
          const items = (Array.isArray(data) ? data : (Array.isArray(data.tracks) ? data.tracks : []))
            .map(x => ('' + x).trim())
            .filter(x => x.toLowerCase().endsWith('.mp3'))
            .map(x => x.startsWith('http') ? x : (LULLABY_DIR + x.replace(/^\/+/, '')));
          if (items.length) {
            lullabyList = items;
            _info('discovered lullabies via playlist.json:', lullabyList);
            return lullabyList;
          }
        }
      } catch (e) { _warn('playlist.json load failed', e?.message); }

      const found = [];
      for (let i = 1; i <= 30; i++) {
        const url = `${LULLABY_DIR}lullaby${i}.mp3`;
        if (await urlExists(url)) found.push(url);
      }
      lullabyList = found.length ? found : [`${LULLABY_DIR}lullaby1.mp3`];
      _info('discovered lullabies via probing:', lullabyList);
      return lullabyList;
    }

    function buildPlaylist() {
      playlist = shuffle(lullabyList);
      trackIdx = 0;
      _info('playlist shuffled:', playlist);
    }

    async function ensureLullabyGraph() {
      if (!lullabyCtx) {
        lullabyCtx = new (window.AudioContext || window.webkitAudioContext)();
        try { await lullabyCtx.resume(); } catch {}
        _info('AudioContext ready for lullaby', { state: lullabyCtx.state });
      }
      if (!lullabyDest) {
        lullabyDest = lullabyCtx.createMediaStreamDestination();
        _info('Created lullaby MediaStreamDestination');
      }

      if (!lullabyEl) {
        lullabyEl = new Audio();
        lullabyEl.crossOrigin = 'anonymous';
        lullabyEl.preload = 'auto';
        lullabyEl.loop = false;
        lullabyEl.addEventListener('ended', () => { _evt('lullaby.ended'); nextTrack(); });
        lullabyEl.addEventListener('error', (e) => _err('lullaby.audio.error', e?.message || e));
        _info('Audio element created for lullaby');
      }
      if (!musicNode) {
        musicNode = lullabyCtx.createMediaElementSource(lullabyEl);
        musicNode.connect(lullabyDest);
        _info('Connected Audio element → MediaStreamDestination');
      }

      lullabyTrack = lullabyDest.stream.getAudioTracks()[0];
      try { lullabyTrack.contentHint = 'music'; } catch {}
      _info('Lullaby track ready', { id: lullabyTrack?.id });
    }

    async function playTrackAt(i) {
      if (!playlist.length) return;
      trackIdx = ((i % playlist.length) + playlist.length) % playlist.length;
      const url = playlist[trackIdx];
      lullabyEl.src = url;
      lullabyEl.volume = 0.8;
      try { await lullabyEl.play(); _info('Playing lullaby', { url }); }
      catch (e) { _warn('lullaby play blocked', e && (e.name || e.message)); }
    }

    async function nextTrack() {
      if (!playlist.length) return;
      let next = trackIdx + 1;
      if (next >= playlist.length) {
        buildPlaylist();
        next = 0;
      }
      _info('Advancing to next lullaby track', { nextIndex: next });
      await playTrackAt(next);
    }

    async function startLullaby() {
      if (pttSession || latched) { latched = false; pttSession = false; setTalking(false); _info('Stopped talkback before starting lullaby'); }

      const [, s] = currentSession(); if (!s) { _warn('startLullaby(): no current session'); return; }
      if (!s.talkSender && s.talkTx?.sender) s.talkSender = s.talkTx.sender;

      await ensureLullabyGraph();
      await discoverLullabies();
      buildPlaylist();

      if (s.talkSender) {
        _info('Replacing talk sender track with lullaby', { lullabyTrackId: lullabyTrack?.id });
        await s.talkSender.replaceTrack(lullabyTrack);
      } else {
        _warn('No talk sender available to send lullaby');
      }
      await playTrackAt(0);

      sendingLullaby = true;
      lullabyBtn.textContent = 'Stop Lullaby';
      lullabyBtn.classList.add('live');
      try { remoteVideo.volume = 0.2; } catch {}
      updateTalkUI();
      _info('Lullabies → sender (shuffle loop active)');
    }

    async function stopLullaby() {
      if (!sendingLullaby) { _info('stopLullaby(): no-op, not sending'); return; }
      sendingLullaby = false;
    
      try { lullabyEl?.pause(); _info('Lullaby paused'); } catch (e) { _warn('Pause lullaby failed', e?.message); }
    
      const [, s] = currentSession(); if (!s) { _warn('stopLullaby(): no current session'); return; }
      if (s.talkSender) {
        if (s.talkTrack) {
          try { s.talkTrack.contentHint = 'speech'; } catch {}
          _info('Replacing lullaby with mic track', { micTrackId: s.talkTrack.id });
          await s.talkSender.replaceTrack(s.talkTrack);
        } else {
          _info('No mic track; replacing with null/silent track');
          try {
            await s.talkSender.replaceTrack(null);
          } catch (e) {
            _warn('replaceTrack(null) failed, trying silent track fallback', e?.message);
            try {
              const silentCtx = new (window.AudioContext || window.webkitAudioContext)();
              const silentTrack = silentCtx.createMediaStreamDestination().stream.getAudioTracks()[0];
              await s.talkSender.replaceTrack(silentTrack);
              _info('Silent track fallback attached');
            } catch (e2) { _err('Silent track fallback failed', e2?.message || e2); }
          }
        }
      } else {
        _warn('stopLullaby(): no talkSender present');
      }
    
      lullabyBtn.textContent = 'Lullaby';
      lullabyBtn.classList.remove('live');
      try { remoteVideo.volume = 1.0; } catch {}
      _info('Lullaby stopped');
    }

    lullabyBtn.addEventListener('click', async (e) => {
      e?.preventDefault?.();
      _evt('LullabyBtn.click', { sendingLullaby });
      if (sendingLullaby) {
        await stopLullaby();
      } else {
        if (pttSession || latched) { latched = false; pttSession = false; setTalking(false); _info('Disabled talkback before starting lullaby via click'); }
        await startLullaby();
      }
    });

    window.addEventListener('beforeunload', () => {
      _evt('beforeunload');
      try { setTalking(false); } catch (e) { _warn('setTalking(false) on unload failed', e?.message); }
      try { for (const [, s] of sessions) s.pc && s.pc.close(); } catch (e) { _warn('pc.close() on unload failed', e?.message); }
      try { for (const [, s] of sessions) s.talkStream && s.talkStream.getTracks().forEach(t => t.stop()); } catch (e) { _warn('stop talk tracks on unload failed', e?.message); }
      try { lullabyEl && lullabyEl.pause(); } catch (e) { _warn('pause lullaby on unload failed', e?.message); }
    });

    /* ---------- Start SecureSignal and accept only trusted sessions ---------- */
    _info('Creating SecureSignal', { endpoint: SS_WS_ENDPOINT });
    const ss = new SecureSignal({ url: SS_WS_ENDPOINT, onOpen: () => showStatus('Waiting for sender…') });
    try {
      await ss.init();
      _info('SecureSignal.init() resolved', { me: ss?.me, trustedCount: ss?.trusted?.length });
    } catch (e) {
      _err('SecureSignal.init() failed', e?.message || e);
    }

    // Optional SecureSignal lifecycle logs (if exposed)
    try {
      if (ss?.onClose) ss.onClose = (ev) => _warn('SecureSignal WS closed', ev);
      if (ss?.onError) ss.onError = (err) => _err('SecureSignal WS error', err);
    } catch {}

    ss.onSession = async ({ sid, peerFp, role }) => {
      _info('SecureSignal.onSession()', { sid, peerFp, role, trustedCount: ss?.trusted?.length });
      if (role !== 'responder') { _info('Ignoring session not from responder role'); return; }

      // defensive: only accept if peer is in trusted
      const isTrusted = !!ss.trusted.find(d => d.fp === peerFp);
      _info('Peer trust check', { peerFp, isTrusted });
      if (!isTrusted) { _warn('Rejecting untrusted peer', { peerFp }); return; }

      let pc, dc;
      let talkTx = null;   // <-- declare here so onBeforeAnswer can assign
      try {      
        ({ pc, dc } = await connectToPeer(ss, peerFp, {
          initiator: false,
          sid,
          rtcConfig: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] },
          label: 'pose',
          onTrack: (e) => {
            _evt('pc.onTrack', { sid, streams: e.streams?.length, trackKind: e.track?.kind, trackId: e.track?.id });
            const s = sessions.get(sid);
            if (!s) { _warn('onTrack: session not found', { sid }); return; }
            s.stream = e.streams?.[0];
    
            const anySelected = Array.from(sessions.values()).some(x => x.selected);
            if (!anySelected) {
              _info('Auto-selecting first session on first track', { sid });
              selectSession(sid);
            } else if (s.selected && s.stream) {
              attachStream(s.stream);
            }
          },
          onData: (msg, ch) => {
            _evt('dc.onMessage', { sid, label: ch?.label, length: (msg && (msg.byteLength || msg.length)) });
          },
          onBeforeAnswer: (pc) => {
            // create the uplink BEFORE answering so the m=audio is in the SDP
            try { talkTx = pc.addTransceiver('audio', { direction: 'sendonly' }); }
            catch (e) { _warn('onBeforeAnswer: addTransceiver failed', e?.message); }
          }
        }));
        try {
          // Tell the initiator we’re now listening for signaling messages
          ss.sendJSON(sid, { webrtc: 'ready' });
          _info('Sent webrtc:ready to initiator', { sid });
        } catch (e) {
          _warn('Failed to send webrtc:ready', e?.message || e);
        }
        
        _info('connectToPeer() resolved', { sid, pcExists: !!pc, dcLabel: dc?.label });
      } catch (e) {
        _err('connectToPeer() failed', e?.message || e);
        return;
      }

      // Add detailed PC/DC diagnostics
      try {
        pc.addEventListener('icecandidate', (ev) => _evt('pc.icecandidate', { candidate: !!ev.candidate, sid }));
        pc.addEventListener('icegatheringstatechange', () => _evt('pc.icegatheringstatechange', { state: pc.iceGatheringState, sid }));
        pc.addEventListener('connectionstatechange', () => _evt('pc.connectionstatechange', { state: pc.connectionState, sid }));
        pc.addEventListener('signalingstatechange', () => _evt('pc.signalingstatechange', { state: pc.signalingState, sid }));
        pc.addEventListener('iceconnectionstatechange', () => _evt('pc.iceconnectionstatechange', { state: pc.iceConnectionState, sid }));
        pc.addEventListener('track', (e) => _evt('pc.track', { kind: e.track?.kind, id: e.track?.id, streams: e.streams?.length, sid }));

        if (dc) {
          dc.addEventListener('open', () => _evt('dc.open', { label: dc.label, sid }));
          dc.addEventListener('close', () => _evt('dc.close', { label: dc.label, sid }));
          dc.addEventListener('error', (e) => _err('dc.error', e?.message || e));
          dc.addEventListener('message', (e) => _evt('dc.message', { label: dc.label, size: (e.data && (e.data.byteLength || e.data.length)) || 0, sid }));
        }
      } catch (e) { _warn('Attaching PC/DC listeners failed', e?.message); }

      sessions.set(sid, {
        pc, dc, peerFp, room: null, selected: false,
        talkTx, talkSender: talkTx?.sender || null,
        talkTrack: null, talkStream: null, stream: null
      });
      _info('Session stored', { sid, count: sessions.size });
      
      // Try to fetch the handler connectToPeer installed
      const prevHandler =
        (typeof ss.getEncryptedHandler === 'function' && ss.getEncryptedHandler(sid)) ||
        (ss._sidHandlers && typeof ss._sidHandlers.get === 'function' && ss._sidHandlers.get(sid)) ||
        null;
      
      // If we cannot chain, DO NOT overwrite the handler — you'd break WebRTC.
      if (!prevHandler) {
        _warn('No prev encrypted handler available; not installing page-level handler for sid', sid);
      } else {
        // Install a single chained handler
        ss.onEncrypted(sid, (msg) => {
          // Always forward first so secure-webrtc sees offers/answers/ice/ready
          try { prevHandler(msg); } catch (e) { _warn('prevHandler threw', e?.message || e); }
      
          // Then handle your non-WebRTC messages
          if (msg && msg.webrtc) return; // secure-webrtc already handled
      
          _evt('ss.onEncrypted', { sid, msgType: msg?.type, role: msg?.role, hasRoom: !!msg?.room });
      
          if (msg?.type === 'announce' && msg?.role === 'sender') {
            const s = sessions.get(sid);
            if (!s) { _warn('onEncrypted: session not found', { sid }); return; }
      
            s.room = (msg.room || '').trim();
            _info('Sender announced room', { sid, room: s.room, desiredRoom });
      
            const alreadySelected = Array.from(sessions.values()).some(x => x.selected);
            if (!alreadySelected && s.room === desiredRoom) {
              _info('Auto-selecting session for desired room', { sid, room: s.room });
              selectSession(sid);
            } else {
              _info('Not selecting session', { alreadySelected, match: s.room === desiredRoom });
            }
          }
        });
      }
    }; // ← close ss.onSession
  </script>
</body>
