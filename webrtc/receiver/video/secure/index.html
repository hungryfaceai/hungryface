<!doctype html>
<!--
  Viewer video page (webrtc/receiver/video/secure/): shows the Camera's live video and lets the parent
  listen, talk back (Talk button: short press toggles, long press holds) and play lullabies to the Camera.

  Pieces:
    - Module script 1: PSK check (else redirect to Pair Devices), room resolution and scoping, PSK
      WebSocket shim, then a ReceiverCore connection that feeds the <video>.
    - Mini dashboard (alerts overlay) and wake lock scripts at the bottom.
  Depends on: shared/psk/*.js, shared/config.js (WS_ENDPOINT), receiver/shared/receiver-core.js,
  sidebar-loader.js, mini-dash.js, shared/wake-lock.js. localStorage: psk:<room>, naptio:lastRoom,
  bm_receiver_room, naptio:miniDash:enabled. Lullaby tracks come from /hungryface/lullaby/.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Video</title>
    <link rel="icon" href="/hungryface/pwa/icons/favicon-196.png" sizes="196x196" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />

    <!-- ⬇️ Add shared sidebar stylesheet -->
    <link rel="stylesheet" href="/hungryface/webrtc/receiver/shared/sidebar.css" />

    <link rel="stylesheet" href="/hungryface/shared/tokens.css" />
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--nt-bg, #000);
        color: var(--nt-text, #fff);
        font-family:
          -apple-system,
          system-ui,
          Segoe UI,
          Roboto,
          sans-serif;
        overflow: hidden;
      }
      /* Fullscreen wrapper so video scales */
      #stage {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh; /* fallback */
        width: 100svw;
        height: 100svh; /* small viewport (iOS URL bar safe) */
        width: 100dvw;
        height: 100dvh; /* dynamic viewport */
        z-index: 1;
        background: var(--nt-bg, #000);
      }
      #stage > video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: var(--nt-bg, #000);
      }

      .btn {
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.6);
        background: transparent;
        color: var(--nt-text, #fff);
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: none;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      }
      .btn:active {
        transform: scale(0.99);
      }

      /* Talk button states */
      .btn.live {
        border-color: #ff5252;
        box-shadow:
          0 0 0 2px rgba(255, 82, 82, 0.2),
          0 0 12px rgba(255, 82, 82, 0.35);
      }
      .btn.ptt {
        border-color: #ffa252;
        box-shadow:
          0 0 0 2px rgba(255, 162, 82, 0.2),
          0 0 12px rgba(255, 162, 82, 0.35);
      }

      #controls {
        position: fixed;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 12px;
        z-index: 6;
        flex-wrap: wrap;
        justify-content: center;
      }
      #enableAudioBtn,
      #disableAudioBtn {
        display: none;
      }

      .overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        z-index: 5;
      }
      .status {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: var(--nt-text-2, #ddd);
        font-size: 14px;
        padding: 10px 14px;
        border-radius: 12px;
        text-align: center;
        white-space: pre-line;
        max-width: 90vw;
      }
      .overlay.hidden {
        display: none;
      }
    </style>
    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="e5feef4a-8ebd-4094-b6ff-36bdc4512e2e"
      data-exclude-search="true"
      data-exclude-hash="true"
      data-domains="hungryfaceai.github.io"
    ></script>
  </head>
  <body>
    <!-- ⬇️ Inject shared sidebar markup and behavior (kept separate from your code) -->
    <script type="module" src="/hungryface/webrtc/receiver/shared/sidebar-loader.js"></script>

    <div id="controls">
      <button id="enableAudioBtn" class="btn" type="button">Enable audio</button>
      <button id="disableAudioBtn" class="btn" type="button">Disable audio</button>
      <button id="fsBtn" class="btn" type="button">Fullscreen</button>
      <!-- ⬇️ Hybrid Talk button (short press = toggle, long press = hold) -->
      <button
        id="talkBtn"
        class="btn"
        type="button"
        aria-pressed="false"
        title="Short press = toggle • Long press = hold"
      >
        Talk
      </button>
      <!-- ⬇️ Lullaby button -->
      <button id="lullabyBtn" class="btn" type="button" title="Play lullaby to baby (sender)">Lullaby</button>
    </div>

    <div id="stage">
      <video id="remote" autoplay playsinline></video>
    </div>

    <div id="overlay" class="overlay">
      <div id="status" class="status">Idle</div>
    </div>

    <script type="module">
      // Viewer video page logic: room bootstrap, status overlay, audio, fullscreen, talkback, lullaby, ReceiverCore.
      import { installPskShim } from '/hungryface/webrtc/shared/psk/psk-ws-shim.js';
      import { requirePskOrRedirect, listValidPskRooms } from '/hungryface/webrtc/shared/psk/require-psk.js';
      import { ReceiverCore } from '/hungryface/webrtc/receiver/shared/receiver-core.js';
      import { installRoomScope } from '/hungryface/webrtc/shared/psk/room-scope.js';
      import { WS_ENDPOINT } from '/hungryface/webrtc/shared/config.js';

      /* ---------- Resolve room (aligned with Settings) ---------- */
      const qs = new URLSearchParams(location.search);
      const qsRoom = (qs.get('room') || '').trim();

      const env = await requirePskOrRedirect({
        intent: 'viewer',
        pairRoute: '/hungryface/webrtc/pairpsk/',
        preferRoom: qsRoom,
        fallbackRoom: 'Baby',
      });

      // Expose env (optional, for debugging/other pages)
      window.__pskEnv = env;

      if (env.redirected) {
        console.log('[PSK][viewer] no PSK found → redirecting to Pair Devices…');
      }

      // 🔹 Derive PSK-based namespace + window.__scopeRoom(uiName)
      await installRoomScope(env);

      // Don't start the receiver if we're going to the pairing page
      if (!env.redirected) {
        const rooms = listValidPskRooms();
        const lastRoom = (localStorage.getItem('naptio:lastRoom') || '').trim();
        const persisted = (localStorage.getItem('bm_receiver_room') || '').trim();
        const envRoom = (env.room || '').trim();

        const uniq = new Set(rooms);
        if (envRoom) uniq.add(envRoom);

        // Room priority: ?room= > last used > saved receiver room > env room > any paired room (as in Settings).
        const resolvedRoom = uniq.size
          ? (qsRoom && uniq.has(qsRoom) && qsRoom) ||
            (lastRoom && uniq.has(lastRoom) && lastRoom) ||
            (persisted && uniq.has(persisted) && persisted) ||
            envRoom ||
            Array.from(uniq)[0]
          : // defensive fallback – normally requirePskOrRedirect ensures we have a valid room
            envRoom || qsRoom || 'Baby';

        // 🔹 Persist the UI label (not the scoped ID)
        try {
          localStorage.setItem('bm_receiver_room', resolvedRoom);
        } catch {}
        try {
          localStorage.setItem('naptio:lastRoom', resolvedRoom);
        } catch {}

        // 🔹 Split "UI room label" vs "signaling room"
        const uiRoom = resolvedRoom; // e.g. "Baby"
        const scopedRoom =
          typeof window.__scopeRoom === 'function'
            ? window.__scopeRoom(uiRoom) // e.g. "a1b2c3d4e5f6a7b8:baby"
            : uiRoom;

        const room = scopedRoom; // ⬅️ signaling room used by ReceiverCore
        const STATUS_HIDE_AFTER_CONNECTED_MS = 10000;

        // 🔹 IMPORTANT: PSK shim stays keyed by the *UI label* (so getPsk('Baby') still works)
        const undo = installPskShim({ room: uiRoom });
        console.log('[PSK][viewer] using PSK for UI room:', uiRoom, 'scoped signaling room:', room);

        /* ---------- DOM ---------- */
        const stage = document.getElementById('stage');
        const remoteVideo = document.getElementById('remote');
        const fsBtn = document.getElementById('fsBtn');
        const enableAudioBtn = document.getElementById('enableAudioBtn');
        const disableAudioBtn = document.getElementById('disableAudioBtn');
        const overlay = document.getElementById('overlay');
        const statusEl = document.getElementById('status');
        const talkBtn = document.getElementById('talkBtn');
        const lullabyBtn = document.getElementById('lullabyBtn');

        /* ---------- Status overlay ---------- */
        const SIGNALING_CONNECTED_STATUS = 'Signaling: connected';
        let hideStatusTimer = null;
        // timers for the special "Signaling: connected" behaviour
        let signalingInitialTimer = null;
        let signalingFlashTimer = null;
        let signalingRepeatInterval = null;
        let signalingConnectedActive = false;

        // "Signaling: connected" is shown briefly, hidden after 10 s, then flashed for 2 s every minute as a heartbeat.
        function stopSignalingConnectedTimers() {
          signalingConnectedActive = false;
          if (signalingInitialTimer) {
            clearTimeout(signalingInitialTimer);
            signalingInitialTimer = null;
          }
          if (signalingFlashTimer) {
            clearTimeout(signalingFlashTimer);
            signalingFlashTimer = null;
          }
          if (signalingRepeatInterval) {
            clearInterval(signalingRepeatInterval);
            signalingRepeatInterval = null;
          }
        }

        function startSignalingConnectedTimers() {
          // reset any previous schedule
          stopSignalingConnectedTimers();
          signalingConnectedActive = true;
          // 1) show immediately
          statusEl.textContent = SIGNALING_CONNECTED_STATUS;
          overlay.classList.remove('hidden');
          // 2) hide after 10 seconds (initial display)
          signalingInitialTimer = setTimeout(() => {
            signalingInitialTimer = null;
            if (!signalingConnectedActive) return;
            // only hide if nothing else has replaced the status
            if (statusEl.textContent === SIGNALING_CONNECTED_STATUS) {
              overlay.classList.add('hidden');
            }
          }, STATUS_HIDE_AFTER_CONNECTED_MS);
          // 3) every minute, flash for 2 seconds
          signalingRepeatInterval = setInterval(() => {
            if (!signalingConnectedActive) return;
            // avoid clobbering other important messages
            if (
              !overlay.classList.contains('hidden') &&
              statusEl.textContent &&
              statusEl.textContent !== SIGNALING_CONNECTED_STATUS
            ) {
              return;
            }
            statusEl.textContent = SIGNALING_CONNECTED_STATUS;
            overlay.classList.remove('hidden');
            if (signalingFlashTimer) clearTimeout(signalingFlashTimer);
            signalingFlashTimer = setTimeout(() => {
              signalingFlashTimer = null;
              if (!signalingConnectedActive) return;
              if (statusEl.textContent === SIGNALING_CONNECTED_STATUS) {
                overlay.classList.add('hidden');
              }
            }, 2_000);
          }, 60_000);
        }

        // Update the status overlay; "Connected" auto-hides after 10 s, other messages stay visible.
        function showStatus(msg) {
          // Special behaviour only for the exact "Signaling: connected" string
          if (msg === SIGNALING_CONNECTED_STATUS) {
            startSignalingConnectedTimers();
            return;
          }
          // Any other status → cancel special schedule and behave normally
          stopSignalingConnectedTimers();
          statusEl.textContent = msg;
          if (msg === 'Connected') {
            overlay.classList.remove('hidden');
            if (hideStatusTimer) clearTimeout(hideStatusTimer);
            hideStatusTimer = setTimeout(() => {
              overlay.classList.add('hidden');
            }, 10_000);
          } else {
            if (hideStatusTimer) {
              clearTimeout(hideStatusTimer);
              hideStatusTimer = null;
            }
            overlay.classList.remove('hidden');
          }
        }

        /* ---------- Audio UI ---------- */
        // Show Enable or Disable audio depending on the muted state.
        function updateAudioButtons() {
          if (remoteVideo.muted) {
            enableAudioBtn.style.display = 'block';
            disableAudioBtn.style.display = 'none';
          } else {
            enableAudioBtn.style.display = 'none';
            disableAudioBtn.style.display = 'block';
          }
        }
        enableAudioBtn.style.display = 'block';

        // The user's sound choice survives reconnects: only the very first stream starts muted.
        let userWantsSound = false;
        // Start playback; muted on the first stream, with sound later if the user already asked for it.
        async function tryStartMuted() {
          try {
            remoteVideo.muted = !userWantsSound;
            remoteVideo.volume = 1.0;
            await remoteVideo.play();
          } catch {
            // Browser refused to play with sound (no recent tap): fall back to muted, keep the choice for later.
            try {
              remoteVideo.muted = true;
              await remoteVideo.play();
            } catch {}
          }
          updateAudioButtons();
        }
        enableAudioBtn.addEventListener('click', async (e) => {
          e?.preventDefault?.();
          userWantsSound = true;
          try {
            remoteVideo.muted = false;
            remoteVideo.volume = 1.0;
            await remoteVideo.play();
          } catch {}
          updateAudioButtons();
        });
        disableAudioBtn.addEventListener('click', (e) => {
          e?.preventDefault?.();
          userWantsSound = false;
          remoteVideo.muted = true;
          updateAudioButtons();
        });

        /* ---------- Fullscreen ---------- */
        fsBtn.addEventListener('click', async (e) => {
          e.stopPropagation();
          try {
            if (!document.fullscreenElement) {
              await (stage.requestFullscreen?.call(stage) || document.documentElement.requestFullscreen());
              fsBtn.textContent = 'Exit fullscreen';
            } else {
              await document.exitFullscreen();
              fsBtn.textContent = 'Fullscreen';
            }
          } catch {}
          beginViewportSettle();
        });
        document.addEventListener('fullscreenchange', () => {
          fsBtn.textContent = document.fullscreenElement ? 'Exit fullscreen' : 'Fullscreen';
          beginViewportSetle();
        });

        remoteVideo.addEventListener('loadedmetadata', beginViewportSettle);
        remoteVideo.addEventListener('playing', () => {
          updateAudioButtons();
          beginViewportSettle();
        });
        remoteVideo.addEventListener('resize', beginViewportSettle);

        // Kept as a hook for pages that re-layout after viewport changes; video-only does nothing.
        function beginViewportSettle() {
          /* no-op for video-only */
        }
        function beginViewportSetle() {
          beginViewportSettle();
        } // typo guard

        /* ---------- Talkback (receiver -> sender): short-press toggle + long-press hold ---------- */
        const LONG_PRESS_MS = 450; // hold ≥ this → push-to-talk
        let pcRef = null; // RTCPeerConnection from ReceiverCore
        let talkStream = null; // local mic stream
        let talkTrack = null; // audio track from talkStream
        let talkSender = null; // RTCRtpSender
        let talkTx = null; // ⬅️ preallocated sendonly transceiver

        // UI state
        let latched = false; // toggle mode ON/OFF
        let pressed = false; // pointer is down
        let pttSession = false; // currently in PTT hold
        let pressTimer = null;

        // Open the microphone once; the track starts disabled and is only enabled while talking.
        async function ensureTalkStream() {
          // A microphone that ended (iOS interruption, a phone call, permission revoked) is opened again.
          if (talkStream && talkTrack && talkTrack.readyState === 'live') return;
          if (talkTrack && talkTrack.readyState !== 'live') {
            talkStream = null;
            talkTrack = null;
          }
          talkStream = await navigator.mediaDevices.getUserMedia({
            audio: {
              channelCount: 1,
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true,
            },
            video: false,
          });
          talkTrack = talkStream.getAudioTracks()[0];

          const mic = talkTrack;
          console.log('[RX] mic track:', { id: mic.id, enabled: mic.enabled, readyState: mic.readyState });
          mic.addEventListener('mute', () => console.log('[RX] mic muted'));
          mic.addEventListener('unmute', () => console.log('[RX] mic unmuted'));
          mic.addEventListener('ended', () => console.log('[RX] mic ended'));

          try {
            talkTrack.contentHint = 'speech';
          } catch {}
          talkTrack.enabled = false; // we toggle this; attach once
        }

        // Bind the mic track to the preallocated sendonly sender (no renegotiation needed).
        function tryAttachOnce() {
          if (!talkTrack || !talkTx) return;
          const sender = talkTx.sender || talkSender;
          if (!sender) return;
          if (sender.track === talkTrack) return;
          sender
            .replaceTrack(talkTrack)
            .then(() => {
              talkSender = sender;
              console.log('[Receiver] talkback track bound to preallocated sender');
            })
            .catch((err) => console.warn('[Receiver] replaceTrack failed:', err));
        }

        async function prepareIfNeeded() {
          await ensureTalkStream();
          tryAttachOnce();
        }

        // Enable or disable the mic track and duck the incoming audio while talking.
        function setTalking(on) {
          if (!talkTrack) return;
          console.log('[RX] setTalking:', on ? 'ENABLED' : 'DISABLED');
          talkTrack.enabled = !!on;
          console.log('[RX] mic.enabled now =', talkTrack.enabled);
          try {
            remoteVideo.volume = on ? 0.25 : 1.0;
          } catch {}
          updateTalkUI();
        }

        // Reflect hold/toggle talking state on the Talk button.
        function updateTalkUI() {
          talkBtn.classList.toggle('ptt', pttSession);
          talkBtn.classList.toggle('live', pttSession || latched);
          talkBtn.setAttribute('aria-pressed', pttSession || latched ? 'true' : 'false');

          if (pttSession) {
            talkBtn.textContent = 'Talking… (hold)';
          } else if (latched) {
            talkBtn.textContent = 'Talking…';
          } else {
            talkBtn.textContent = 'Talk';
          }
        }

        // ---- Mutual exclusivity helpers (Talk vs Lullaby) ----
        async function ensureLullabyStoppedIfNeeded() {
          if (sendingLullaby) {
            await stopLullaby();
          }
        }

        // Press handling: a press shorter than LONG_PRESS_MS toggles latched talking; holding longer is push-to-talk.
        async function handlePressStart(e) {
          e.preventDefault();
          pressed = true;
          clearTimeout(pressTimer);
          pressTimer = setTimeout(async () => {
            if (!pressed) return;
            // Long press → PTT session
            await ensureLullabyStoppedIfNeeded(); // ⬅️ stop lullaby before talking
            pttSession = true;
            try {
              await prepareIfNeeded();
            } catch (err) {
              console.warn(err);
              pttSession = false;
              updateTalkUI();
              return;
            }
            // Released while the microphone was starting (e.g. during the permission prompt): stay off.
            if (!pressed || !pttSession) return;
            setTalking(true);
          }, LONG_PRESS_MS);
        }

        function handlePressEnd(e) {
          e.preventDefault();
          if (!pressed) return;
          pressed = false;

          // If timer hasn't fired → short press (toggle)
          if (!pttSession) {
            clearTimeout(pressTimer);
            latched = !latched;
            if (latched) {
              (async () => {
                await ensureLullabyStoppedIfNeeded(); // ⬅️ stop lullaby before talking
                await prepareIfNeeded();
                if (latched) setTalking(true); // turned off again while the microphone was starting
              })().catch((err) => {
                console.warn(err);
                latched = false;
                updateTalkUI();
              });
            } else {
              setTalking(false);
            }
            return;
          }

          // If we were in PTT session → end hold, restore to latched state
          setTalking(latched);
          pttSession = false;
          updateTalkUI();
        }

        // Pointer + touch handlers
        ['pointerdown', 'touchstart', 'mousedown'].forEach((ev) =>
          talkBtn.addEventListener(ev, handlePressStart, { passive: false })
        );
        ['pointerup', 'pointercancel', 'touchend', 'touchcancel', 'mouseup', 'mouseleave'].forEach((ev) =>
          talkBtn.addEventListener(ev, handlePressEnd, { passive: false })
        );

        // Keyboard accessibility: Space/Enter supports both toggle and hold
        talkBtn.addEventListener('keydown', (e) => {
          if (e.code === 'Space' || e.code === 'Enter') handlePressStart(e);
        });
        talkBtn.addEventListener('keyup', (e) => {
          if (e.code === 'Space' || e.code === 'Enter') handlePressEnd(e);
        });

        // --------- Lullaby playlist over the same sendonly transceiver (no mic mixing) ---------
        const LULLABY_DIR = '/hungryface/lullaby/';

        let lullabyEl = null;
        let lullabyCtx = null;
        let lullabyDest = null;
        let lullabyTrack = null;
        let musicNode = null;

        let sendingLullaby = false;
        let lullabyList = []; // discovered absolute URLs
        let playlist = []; // shuffled order
        let trackIdx = 0;

        // Fisher-Yates shuffle returning a copy.
        function shuffle(arr) {
          const a = arr.slice();
          for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
          }
          return a;
        }

        // Check a file exists: HEAD first, then a 1-byte ranged GET for servers that reject HEAD.
        async function urlExists(url) {
          try {
            const h = await fetch(url, { method: 'HEAD', cache: 'no-cache' });
            if (h.ok) return true;
          } catch {}
          try {
            const g = await fetch(url, { method: 'GET', headers: { Range: 'bytes=0-0' }, cache: 'no-cache' });
            return g.ok;
          } catch {
            return false;
          }
        }

        // Find lullaby URLs: playlist.json, else probe lullaby1..30.mp3, else assume lullaby1.mp3. Cached.
        async function discoverLullabies() {
          if (lullabyList.length) return lullabyList;

          // (A) Try JSON manifest: /hungryface/lullaby/playlist.json
          try {
            const res = await fetch(LULLABY_DIR + 'playlist.json', { cache: 'no-cache' });
            if (res.ok) {
              const data = await res.json();
              const items = (Array.isArray(data) ? data : Array.isArray(data.tracks) ? data.tracks : [])
                .map((x) => ('' + x).trim())
                .filter((x) => x.toLowerCase().endsWith('.mp3'))
                .map((x) => (x.startsWith('http') ? x : LULLABY_DIR + x.replace(/^\/+/, '')));
              if (items.length) {
                lullabyList = items;
                console.log('[RX] discovered lullabies via playlist.json:', lullabyList);
                return lullabyList;
              }
            }
          } catch {
            // ignore; fall through to probing
          }

          // (B) Fallback: numbered files lullaby1.mp3 … lullaby30.mp3
          const found = [];
          for (let i = 1; i <= 30; i++) {
            const url = `${LULLABY_DIR}lullaby${i}.mp3`;
            /* eslint-disable no-await-in-loop */
            if (await urlExists(url)) found.push(url);
          }
          if (found.length) {
            lullabyList = found;
          } else {
            // (C) last resort: assume at least lullaby1.mp3 exists
            lullabyList = [`${LULLABY_DIR}lullaby1.mp3`];
          }
          console.log('[RX] discovered lullabies via probing:', lullabyList);
          return lullabyList;
        }

        // Start a new shuffled cycle through the discovered tracks.
        function buildPlaylist() {
          playlist = shuffle(lullabyList);
          trackIdx = 0;
          console.log('[RX] reshuffled lullabies:', playlist);
        }

        // Build the audio graph (mp3 element -> MediaStreamDestination) whose track is sent to the Camera.
        async function ensureLullabyGraph() {
          if (!lullabyCtx) {
            lullabyCtx = new (window.AudioContext || window.webkitAudioContext)();
            try {
              await lullabyCtx.resume();
            } catch {}
          }
          if (!lullabyDest) lullabyDest = lullabyCtx.createMediaStreamDestination();

          if (!lullabyEl) {
            lullabyEl = new Audio();
            lullabyEl.crossOrigin = 'anonymous';
            lullabyEl.preload = 'auto';
            lullabyEl.loop = false; // loop handled by playlist order
            lullabyEl.addEventListener('ended', () => {
              nextTrack();
            });
          }
          if (!musicNode) {
            musicNode = lullabyCtx.createMediaElementSource(lullabyEl);
            musicNode.connect(lullabyDest);
          }

          lullabyTrack = lullabyDest.stream.getAudioTracks()[0];
          try {
            lullabyTrack.contentHint = 'music';
          } catch {}
        }

        // Play playlist entry i (wraps around).
        async function playTrackAt(i) {
          if (!playlist.length) return;
          trackIdx = ((i % playlist.length) + playlist.length) % playlist.length;
          const url = playlist[trackIdx];
          lullabyEl.src = url;
          lullabyEl.volume = 0.8;
          try {
            await lullabyEl.play();
          } catch (e) {
            console.warn('[RX] lullaby play blocked:', e);
          }
          console.log('[RX] playing lullaby:', url);
        }

        // Advance to the next track; reshuffle after the last one.
        async function nextTrack() {
          if (!playlist.length) return;
          let next = trackIdx + 1;
          if (next >= playlist.length) {
            buildPlaylist(); // reached end — shuffle fresh cycle
            next = 0;
          }
          await playTrackAt(next);
        }

        // Send the lullaby track to the Camera in place of the mic (talking is stopped first).
        async function startLullaby() {
          // ⬅️ If talking, stop it first (mutual exclusivity)
          if (pttSession || latched || talkTrack?.enabled) {
            latched = false;
            pttSession = false;
            setTalking(false);
          }

          if (!talkSender) {
            console.warn('[RX] no talkSender yet');
            return;
          }
          await ensureLullabyGraph();

          // Discover tracks (JSON first, else numbered), then shuffle
          await discoverLullabies();
          buildPlaylist();

          // Swap the sender’s track: mic → lullaby
          await talkSender.replaceTrack(lullabyTrack);

          // Start playback of the first track
          await playTrackAt(0);

          sendingLullaby = true;
          lullabyBtn.textContent = 'Stop Lullaby';
          lullabyBtn.classList.add('live'); // red frame like Talking
          try {
            remoteVideo.volume = 0.2;
          } catch {}
          updateTalkUI(); // reflect that we're not talking now
          console.log('[RX] lullabies → sender (shuffle loop active)');
        }

        // Stop music and put the mic track (or silence) back on the sender.
        async function stopLullaby() {
          if (!sendingLullaby) return;
          sendingLullaby = false;

          // Stop music
          try {
            lullabyEl?.pause();
          } catch {}

          // Swap back: if we ALREADY have a mic track (user has talked before), use it.
          // Otherwise do NOT ask for permission here — detach the track (or send silence).
          if (talkSender) {
            if (talkTrack) {
              try {
                talkTrack.contentHint = 'speech';
              } catch {}
              await talkSender.replaceTrack(talkTrack);
            } else {
              try {
                await talkSender.replaceTrack(null); // most browsers: OK
              } catch (e) {
                // Fallback for older Safari: send a silent track (no permission needed)
                try {
                  const silentCtx = new (window.AudioContext || window.webkitAudioContext)();
                  const silentTrack = silentCtx.createMediaStreamDestination().stream.getAudioTracks()[0];
                  await talkSender.replaceTrack(silentTrack);
                } catch {}
              }
            }
          }

          lullabyBtn.textContent = 'Lullaby';
          lullabyBtn.classList.remove('live');
          try {
            remoteVideo.volume = 1.0;
          } catch {}
          console.log('[RX] lullaby stopped → back to', talkTrack ? 'mic' : 'silence (no mic permission yet)');
        }

        let lullabyBusy = false; // starting/stopping takes a moment (fetching the playlist): ignore taps meanwhile
        lullabyBtn.addEventListener('click', async (e) => {
          e?.preventDefault?.();
          if (lullabyBusy) return;
          lullabyBusy = true;
          try {
            await toggleLullaby();
          } finally {
            lullabyBusy = false;
          }
        });
        async function toggleLullaby() {
          if (sendingLullaby) {
            await stopLullaby();
          } else {
            // ⬅️ Stop talking if active, then play lullaby
            if (pttSession || latched || talkTrack?.enabled) {
              latched = false;
              pttSession = false;
              setTalking(false);
            }
            if (!talkSender && talkTx?.sender) talkSender = talkTx.sender;
            await startLullaby();
          }
        }

        // Cleanup on unload
        window.addEventListener('beforeunload', () => {
          try {
            setTalking(false);
          } catch {}
          try {
            talkSender && pcRef && pcRef.removeTrack(talkSender);
          } catch {}
          try {
            talkStream && talkStream.getTracks().forEach((t) => t.stop());
          } catch {}
          try {
            lullabyEl && lullabyEl.pause();
          } catch {}
        });

        /* ---------- Shared core ---------- */
        // onCreatePC runs for every new RTCPeerConnection, so talk/lullaby tracks are re-attached after reconnects.
        const core = new ReceiverCore({
          wsEndpoint: WS_ENDPOINT,
          room,
          onStatus: showStatus,
          onStream: (stream) => {
            if (remoteVideo.srcObject !== stream) {
              remoteVideo.srcObject = stream;
              tryStartMuted();
            }
          },
          onCreatePC: (pc) => {
            // Save PC for talkback and attach if mic already prepared
            pcRef = pc;

            // ⬇️ Pre-allocate a sendonly audio transceiver so talkback doesn't need renegotiation
            try {
              talkTx = pc.addTransceiver('audio', { direction: 'sendonly' });
              talkSender = talkTx.sender;
            } catch (e) {
              console.warn('[Receiver] addTransceiver failed:', e);
            }

            // A lullaby was playing: the new connection must carry it too (not the mic / silence).
            if (sendingLullaby && lullabyTrack && talkSender) {
              talkSender
                .replaceTrack(lullabyTrack)
                .catch((err) => console.warn('[Receiver] lullaby re-attach failed:', err));
            } else {
              tryAttachOnce();
            }

            // keep SDP shape consistent with other pages: create a 'pose' DC but ignore messages here
            const ch = pc.createDataChannel('pose');
            ch.onopen = () => console.log('[DC][receiver] pose DC open (video-only)');
            ch.onclose = () => console.log('[DC][receiver] pose DC close (video-only)');
            ch.onmessage = () => {};
          },
          onDataChannel: (e) => {
            console.log('[DC][receiver] inbound datachannel (leaving open):', e.channel?.label);
          },
        });

        core.start().catch(console.warn);
        window.addEventListener('beforeunload', () => core.close());
      }
    </script>

    <script type="module">
      import { installMiniDashboard } from '/hungryface/webrtc/receiver/shared/mini-dash.js';
      installMiniDashboard({
        // Use your shared dashboard URL:
        src: 'https://hungryfaceai.github.io/hungryface/webrtc/receiver/shared/alerts/dashboard/',
        // The preference gate (already in your app):
        featureKey: 'naptio:miniDash:enabled',
      });
    </script>

    <!-- Keep screen awake while this monitoring page is open (no-op if unsupported) -->
    <script type="module">
      import { keepAwake } from '/hungryface/webrtc/shared/wake-lock.js';
      try {
        keepAwake({ log: (m) => console.log('[RECEIVER]', m) });
      } catch {}
    </script>
  </body>
