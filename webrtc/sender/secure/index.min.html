<!doctype html>
<!--
  Camera page (sender): runs on the phone that films the baby. It captures camera and microphone, streams them
  over WebRTC to every Viewer in the room, and can run on-device AI (pose, face, audio classification) and
  forward the results to Viewers over a "pose" data channel.

  Flow: pair devices (PSK) -> pick room -> Start streaming -> short preview window -> blackout (screen stays on).
  Pieces:
    - Style blocks: dark full-screen stage, control card, blackout/preview/streaming body states.
    - Script 1: PSK check (else redirect to Pair Devices), room namespace, PSK WebSocket shim installers.
    - Script 2: UI wiring, signalling WebSocket, one RTCPeerConnection per Viewer, AI loops, start/stop.
  Subscription: in the native iOS app, Start streaming requires an active "premium" entitlement (RevenueCat,
  see subscription.js). 
  Camera streaming is restricted to the installed iOS app or Android TWA; iOS subscription checks are optional.
  
  Depends on: shared/psk/*.js, shared/config.js, shared/wake-lock.js, shared/audio-resampler.js,
  shared/vision-task.js, subscription.js, MediaPipe tasks (loaded from jsDelivr / Google storage on demand).
  localStorage: psk:<room>, naptio:lastRoom, bm_sender_* (saved form values).
-->
