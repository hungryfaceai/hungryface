<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Naptio – Launcher</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <style>
    :root { color-scheme: dark; }
    html, body { margin:0; background:#0a0a0a; color:#e8e8e8; font-family:-apple-system, system-ui, Segoe UI, Roboto, sans-serif; }
    .wrap { max-width: 860px; margin: 24px auto; padding: 16px; }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p  { margin: 6px 0 14px; color:#b9c0c7; }
    .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 12px; }
    .card { border:1px solid #222; background:#111; border-radius:12px; padding:12px; display:flex; gap:10px; }
    .grow { flex:1; min-width:0; }
    .name { font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .sub  { color:#9aa; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .btnrow { display:flex; gap:8px; flex-wrap:wrap; }
    button, a.btn {
      display:inline-block; padding:10px 12px; border-radius:10px; border:1px solid #2a2a2a;
      background:#171717; color:#eee; font-weight:600; cursor:pointer; text-decoration:none;
    }
    .top { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
    .right { display:flex; gap:8px; }
    input[type="search"] {
      width: 240px; padding:8px 10px; border-radius: 10px; border:1px solid #222; background:#0b0b0b; color:#ddd;
    }
    .muted { color:#aab; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>Naptio – Launcher</h1>
        <p class="muted">Choose a trusted device and open the Sender or Receiver (video) with <code>?peer=</code> prefilled.<br/>Room is passed as metadata.</p>
      </div>
      <div class="right">
        <input id="q" type="search" placeholder="Filter by name/room…"/>
        <button id="refresh" type="button">Refresh</button>
      </div>
    </div>
    <div id="grid" class="grid"></div>
  </div>

  <script type="module">
    import { SecureSignal } from '/hungryface/webrtc/shared/secure-signal.js';
    import { annotateTrusted, formatFp, loadLastMeta } from '/hungryface/webrtc/shared/device-registry.js';

    // Config – adjust if your paths differ
    const WS_ENDPOINT = 'wss://signaling-server-f5gu.onrender.com/ws';
    const SENDER_URL  = '/hungryface/webrtc/sender/';                  // expects ?peer=
    const RECEIVER_VIDEO_URL = '/hungryface/webrtc/receiver/video/';   // expects ?peer=

    const grid = document.getElementById('grid');
    const qEl  = document.getElementById('q');
    const refreshBtn = document.getElementById('refresh');

    let ss = null, trusted = [];

    function openWithPeer(baseUrl, fp, room='') {
      const u = new URL(baseUrl, location.origin);
      u.searchParams.set('peer', fp);
      if (room) u.searchParams.set('room', room);
      location.href = u.toString();
    }

    function render() {
      const q = (qEl.value || '').toLowerCase().trim();
      const items = annotateTrusted(trusted)
        .filter(d => {
          if (!q) return true;
          const room = (d.meta?.room || '').toLowerCase();
          return (d.name || 'Device').toLowerCase().includes(q) || d.fp.toLowerCase().includes(q) || room.includes(q);
        })
        .sort((a,b) => Number(b.meta?.ts || 0) - Number(a.meta?.ts || 0));

      grid.innerHTML = items.map(d => {
        const room = d.meta?.room || '';
        const when = d.meta?.ts ? new Date(d.meta.ts).toLocaleString() : '';
        const sub = [room && `room: ${room}`, when && `seen: ${when}`].filter(Boolean).join(' • ');
        return `
          <div class="card">
            <div class="grow">
              <div class="name">${d.name || 'Device'}</div>
              <div class="sub">${formatFp(d.fp)}${sub ? ' — ' + sub : ''}</div>
              <div class="btnrow" style="margin-top:8px">
                <a class="btn" href="#" data-act="sender" data-fp="${d.fp}">Open Sender</a>
                <a class="btn" href="#" data-act="rxvideo" data-fp="${d.fp}">Open Receiver (video)</a>
              </div>
            </div>
          </div>
        `;
      }).join('') || `<div class="muted">No trusted devices yet. Pair devices first.</div>`;

      grid.querySelectorAll('a.btn').forEach(a => {
        a.addEventListener('click', (e) => {
          e.preventDefault();
          const fp = a.getAttribute('data-fp');
          const act = a.getAttribute('data-act');
          const meta = loadLastMeta(fp);
          const room = meta?.room || '';
          if (act === 'sender')   openWithPeer(SENDER_URL, fp, room);
          if (act === 'rxvideo')  openWithPeer(RECEIVER_VIDEO_URL, fp, room);
        });
      });
    }

    async function ensureSS() {
      if (ss) return ss;
      ss = new SecureSignal({
        url: WS_ENDPOINT,
        onTrustedList: (list) => { trusted = list; render(); }
      });
      await ss.init();
      trusted = ss.trusted || [];
      render();
      return ss;
    }

    qEl.addEventListener('input', render);
    refreshBtn.addEventListener('click', async () => { await ensureSS(); render(); });

    await ensureSS();
  </script>
</body>
</html>
