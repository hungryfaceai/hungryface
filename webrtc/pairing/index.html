<!doctype html>
<!-- webrtc/pairing/index.html: legacy redirect page; forwards to /hungryface/webrtc/pairpsk/ keeping query and hash. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Naptio</title>
    <link rel="icon" href="/hungryface/pwa/icons/favicon-196.png" sizes="196x196" />
    <!-- Pairing moved to /webrtc/pairpsk/. -->
    <script>
      // A link carrying a key goes to the install page (it asks before replacing a key and removes it from the
      // address bar); anything else opens Pair devices.
      location.replace(
        (/[#&]psk=/.test(location.hash)
          ? '/hungryface/webrtc/pairpsk/pair-install.html'
          : '/hungryface/webrtc/pairpsk/') +
          location.search +
          location.hash
      );
    </script>
    <meta http-equiv="refresh" content="0; url=/hungryface/webrtc/pairpsk/" />
  </head>
  <body>
    <p><a href="/hungryface/webrtc/pairpsk/">Continue to Naptio</a></p>
  </body>
</html>
