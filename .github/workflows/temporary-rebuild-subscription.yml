name: Temporary - rebuild RevenueCat subscription bundle
on:
  pull_request:
    branches: [main]
    paths:
      - "webrtc/sender/secure/subscription.js"
      - "webrtc/sender/secure/subscription/subscription.js"
      - "webrtc/sender/secure/tests/subscription-no-mocks.test.mjs"
      - ".github/workflows/temporary-rebuild-subscription.yml"
permissions:
  contents: write
jobs:
  rebuild-and-test:
    if: github.head_ref == 'cleanup/remove-subscription-mocks-20261124'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Test iOS RevenueCat behavior without mock branches
        run: node --test webrtc/sender/secure/tests/subscription-no-mocks.test.mjs
      - name: Generate production subscription bundle
        run: npm run build:subscription
      - name: Verify generated JavaScript and absence of subscription mock
        shell: bash
        run: |
          node --check webrtc/sender/secure/subscription.bundle.js
          ! grep -E 'submock|MOCK_KEY|MOCK_PRICE|Simulated Apple purchase sheet' webrtc/sender/secure/subscription.bundle.js
          ! grep -E 'submock|MOCK_KEY|MOCK_PRICE|Simulated Apple purchase sheet' webrtc/sender/secure/subscription.js
          git diff --check
      - name: Commit generated bundle to the pull-request branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webrtc/sender/secure/subscription.bundle.js
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild subscription bundle without browser mocks"
            git push origin "HEAD:${{ github.head_ref }}"
          else
            echo "The bundle is already current."
          fi
