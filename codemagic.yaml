workflows:
  naptio-ios:
    name: Naptio iOS (Capacitor wrapper)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic

    environment:
      xcode: latest
      node: latest

      ios_signing:
        distribution_type: app_store
        bundle_identifier: io.github.hungryfaceai.naptio

    scripts:
      - name: Install npm dependencies
        script: |
          npm install

      - name: Add iOS platform (Capacitor)
        script: |
          npx cap add ios

      - name: Sync web assets into iOS project
        script: |
          npx cap sync ios

#      - name: Install CocoaPods
#        script: |
#          cd ios/App
#          pod install

#      - name: Build ipa for distribution
#        script: |
#          cd ios/App
#          xcode-project build-ipa \
#            --workspace "App.xcworkspace" \
#            --scheme "App"

      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles --project ios/App/App.xcodeproj
      
      - name: Build ipa for distribution
        script: |
          cd ios/App
          xcode-project build-ipa \
            --project "App.xcodeproj" \
            --scheme "App"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration          # use the Developer Portal integration named above
        submit_to_testflight: true # send build to TestFlight beta review
        # For now we skip submit_to_app_store; you'll do that manually later
