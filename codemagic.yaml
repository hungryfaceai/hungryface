workflows:
  naptio-ios:
    name: Naptio iOS (Capacitor wrapper)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic

    environment:
      xcode: latest
      node: latest

      # When you later set up iOS signing in Codemagic UI, update this:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: io.github.hungryfaceai.naptio

    scripts:
      - name: Install npm dependencies
        script: |
          npm install

      - name: Add iOS platform (Capacitor)
        script: |
          npx cap add ios

      - name: Sync web assets into iOS project
        script: |
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Build ipa for distribution
        script: |
          cd ios/App
          xcode-project build-ipa \
            --workspace "App.xcworkspace" \
            --scheme "App"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
