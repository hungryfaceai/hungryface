workflows:
  naptio-ios:
    name: Naptio iOS (Capacitor wrapper)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic

    environment:
      xcode: latest
      node: latest

      # ✅ 1) Add IOS_VERSION (marketing version) here
      vars:
        IOS_VERSION: "1.0.2"

      ios_signing:
        distribution_type: app_store
        bundle_identifier: io.github.hungryfaceai.naptio

    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
          
      - name: Build RevenueCat subscription module
        script: |
          npm run build:subscription

      - name: Sync iOS (Capacitor + web assets)
        script: |
          npx cap sync ios

      - name: Verify RevenueCat integration
        script: |
          npm list @revenuecat/purchases-capacitor @revenuecat/purchases-capacitor-ui
          test -f webrtc/sender/secure/subscription.bundle.js
          grep -n "RevenueCat" ios/App/CapApp-SPM/Package.swift || true

      - name: Add iOS camera/microphone permissions (Info.plist)
        script: |
          PLIST="ios/App/App/Info.plist"

          # Camera
          /usr/libexec/PlistBuddy -c \
            "Add :NSCameraUsageDescription string 'Naptio uses the camera to stream video from your baby monitor.'" "$PLIST" || \
          /usr/libexec/PlistBuddy -c \
            "Set :NSCameraUsageDescription 'Naptio uses the camera to stream video from your baby monitor.'" "$PLIST"

          # Microphone
          /usr/libexec/PlistBuddy -c \
            "Add :NSMicrophoneUsageDescription string 'Naptio uses the microphone for audio in your baby monitor stream.'" "$PLIST" || \
          /usr/libexec/PlistBuddy -c \
            "Set :NSMicrophoneUsageDescription 'Naptio uses the microphone for audio in your baby monitor stream.'" "$PLIST"

      # ✅ 2) Bump marketing version (CFBundleShortVersionString)
      - name: Bump iOS marketing version (CFBundleShortVersionString)
        script: |
          PLIST="ios/App/App/Info.plist"
          echo "Setting CFBundleShortVersionString to $IOS_VERSION"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $IOS_VERSION" "$PLIST" || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $IOS_VERSION" "$PLIST"

      # ✅ 3) Make build number always unique (timestamp)
      - name: Bump iOS build number (CFBundleVersion)
        script: |
          PLIST="ios/App/App/Info.plist"
          NEW_BUILD_NUMBER="$(date +%Y%m%d%H%M)"
          echo "Setting CFBundleVersion to $NEW_BUILD_NUMBER"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEW_BUILD_NUMBER" "$PLIST" || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $NEW_BUILD_NUMBER" "$PLIST"

      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles --project ios/App/App.xcodeproj
      
      - name: Build ipa for distribution
        script: |
          cd ios/App
          xcode-project build-ipa \
            --project "App.xcodeproj" \
            --scheme "App"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration          # use the Developer Portal integration named above
        submit_to_testflight: true # send build to TestFlight beta review
        # For now we skip submit_to_app_store; you'll do that manually later
