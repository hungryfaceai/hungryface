<!-- /hungryface/assets/logo.svg -->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 24 24"
     fill="none"
     stroke="#0b0b0f"             <!-- set to #FFFFFF if you prefer white -->
     stroke-width="3.1"            <!-- was ~2; thicker for small sizes -->
     stroke-linecap="round"
     stroke-linejoin="round">
  <!-- Scale up around the center (12,12) so the glyph is larger inside the box -->
  <g transform="translate(12 12) scale(1.14) translate(-12 -12)">
    <!-- Calm signal waves -->
    <path d="M7 8.5a7 7 0 0 1 10 0" opacity=".6"/>
    <path d="M9 7a5 5 0 0 1 6 0"   opacity=".6"/>
    <!-- Baby head (stroked, not filled to keep original look) -->
    <circle cx="12" cy="11.5" r="2.6"/>
    <!-- Cradle curve -->
    <path d="M4 15c2.5 3 13.5 3 16 0"/>
  </g>
</svg>
