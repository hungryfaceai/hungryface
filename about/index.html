  <style>
    :root { color-scheme: dark; }
    html, body {
      margin:0; background:#000; color:#fff;
      font-family:-apple-system, system-ui, Segoe UI, Roboto, Helvetica, Arial,
        "Noto Sans", "Noto Sans Arabic", "Noto Sans Hebrew",
        "Noto Sans SC", "Noto Sans KR", "Noto Sans Devanagari", sans-serif;
    }
    /* Allow scroll under fixed sidebar */
    body { overflow-x:hidden; }

    /* Visually hidden for screen readers */
    .sr-only {
      position:absolute; width:1px; height:1px; padding:0; margin:-1px;
      overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
    }

    /* Layout wrapper */
    .wrap { min-height:100dvh; display:grid; place-items:start center; padding:16px; }

    /* Card panel style (matches other pages) */
    .panel {
      width:min(100%, 1000px);
      background:#0b0b0b;
      border:1px solid #141414;
      border-radius:14px;
      padding:16px;
      margin:16px auto 24px;
      box-shadow: 0 0 0 1px #0b0b0b inset;
    }

    /* Top bar: logo left, language on the right */
    .topbar {
      display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:8px;
    }
    .logo-link { display:inline-flex; align-items:center; gap:10px; text-decoration:none; color:#fff; opacity:.95; }
    .logo-link:hover { opacity:1; }
    .logo-svg { width:28px; height:28px; display:block; }
    .brand { font-weight:600; letter-spacing:.2px; font-size:14px; color:#eee; opacity:.9; }

    h1 { margin:.25rem 0 .5rem; font-size:22px; line-height:1.25; }
    h2 { margin:1.25rem 0 .5rem; font-size:18px; line-height:1.3; }
    p  { margin:.5rem 0; color:#ddd; }
    ul { margin:.5rem 0 .75rem 1.1rem; padding:0; }
    li { margin:.3rem 0; color:#ddd; }

    .muted { color:#aaa; }
    .fineprint { font-size:.92rem; color:#ccc; }

    /* Language selector */
    .lang {
      display:flex; align-items:center; gap:8px;
      background:#0d0d0d; border:1px solid #1a1a1a; border-radius:999px;
      padding:6px 10px;
    }
    .lang .flag { font-size:16px; line-height:1; }
    .lang label { font-size:.9rem; color:#aaa; }
    .lang select {
      appearance:none; -webkit-appearance:none; -moz-appearance:none;
      background:transparent; color:#fff; border:none; outline:none;
      padding:4px 18px 4px 6px; cursor:pointer; font-size:.95rem;
    }
    .lang select:focus { outline:2px solid #2a2a2a; border-radius:8px; }

    /* RTL support */
    .rtl .panel { direction:rtl; }
    .rtl ul { margin:.5rem 1.1rem .75rem 0; }

    /* Subtle separator */
    .hr { height:1px; background:#141414; margin:12px 0; border-radius:1px; }

    /* Links (if any) */
    a { color:#9ad; text-decoration:none; }
    a:hover, a:focus { text-decoration:underline; }

    /* Make headings slightly softer */
    .soft { color:#eee; }

    /* Responsive tweaks */
    @media (max-width:520px){
      .wrap { padding:12px; }
      .panel { padding:14px; }
      .brand { display:none; } /* keep the header compact on very small screens */
    }
  </style>
</head>

    const $ = (id) => document.getElementById(id);

    function applyLang(code) {
      const lang = I18N[code] || I18N.en;

      // Set document attributes for a11y and layout
      document.documentElement.lang = code;
      document.documentElement.dir  = lang.dir || "ltr";
      document.body.classList.toggle("rtl", (lang.dir || "ltr") === "rtl");

      // Headings & text
      $("t-title").textContent         = lang.title;
      $("t-how-title").textContent     = lang.howTitle;
      $("t-privacy-title").textContent = lang.privacyTitle;
      $("t-why-title").textContent     = lang.whyTitle;
      $("t-safety-title").textContent  = lang.safetyTitle;
      $("t-team-title").textContent    = lang.teamTitle;

      $("t-intro-1").textContent       = lang.intro1;
      $("t-intro-2").textContent       = lang.intro2 || "";

      $("t-how-body").textContent      = lang.howBody;
      $("t-safety-body").textContent   = lang.safetyBody;
      $("t-team-body").textContent     = lang.teamBody;

      // Lists
      $("t-privacy-list").innerHTML    = lang.privacyList.map(li => `<li>${li}</li>`).join("");
      $("t-why-list").innerHTML        = lang.whyList.map(li => `<li>${li}</li>`).join("");

      // UI bits
      $("flag").textContent = lang.flag;
      $("lang").value = code;

      // Persist
      try { localStorage.setItem("naptio:about:lang", code); } catch {}
    }

    // Init language from saved pref, browser, or default
    function detectInitialLang() {
      const saved = localStorage.getItem("naptio:about:lang");
      if (saved && I18N[saved]) return saved;

      const nav = (navigator.language || navigator.userLanguage || "en").toLowerCase();
      const map = {
        "en": "en", "en-gb":"en", "en-us":"en",
        "es":"es", "es-es":"es", "es-419":"es", "es-mx":"es",
        "fr":"fr", "fr-fr":"fr", "fr-ca":"fr",
        "ar":"ar", "ar-sa":"ar", "ar-ae":"ar",
        "ru":"ru", "ru-ru":"ru",
        "uk":"uk", "uk-ua":"uk",
        "he":"he", "iw":"he",
        "zh":"zh", "zh-cn":"zh", "zh-sg":"zh",
        "ko":"ko", "ko-kr":"ko",
        "hi":"hi", "hi-in":"hi"
      };
      return map[nav] || "en";
    }

    $("lang").addEventListener("change", (e) => applyLang(e.target.value));

    // Kick off
    applyLang(detectInitialLang());
  </script>
